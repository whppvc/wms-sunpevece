<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Estimasi Pengiriman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { 
            background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; 
            border: 1px solid #334155; padding: 0.75rem; text-transform: uppercase; font-size: 11px; font-weight: 900; 
            white-space: nowrap; position: sticky; top: 0; z-index: 20; background-clip: padding-box;
        }
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
    </style>
</head>
<body class="font-sans bg-slate-50 overflow-x-hidden text-slate-800 pb-28">

    <div class="w-full px-2 sm:px-4 pt-4 relative">
        
        <div class="flex border-b border-slate-200 mb-3 bg-white rounded-xl shadow-sm overflow-x-auto hide-scrollbar">
            <button onclick="switchTab('input')" id="tab-input" class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="file-plus-2" class="w-4 h-4"></i> INPUT ESTIMASI</button>
            <button onclick="switchTab('tabel')" id="tab-tabel" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="table" class="w-4 h-4"></i> TABEL ESTIMASI</button>
        </div>

        <div id="view-input" class="space-y-3">
            <div class="bg-white p-3 sm:p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-4">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Tgl Estimasi</label>
                        <input type="date" id="in-tanggal" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold text-xs outline-none focus:border-blue-600 bg-slate-50">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">PO Pengiriman</label>
                        <input type="text" id="in-po" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 uppercase" placeholder="Cth: GIAS PALU">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Nama Item</label>
                        <select id="in-nama-item" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 cursor-pointer">
                            <option value="">-- Memuat --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Panjang</label>
                        <select id="in-panjang" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 cursor-pointer">
                            <option value="">-- Memuat --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Grade</label>
                        <select id="in-grade" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 cursor-pointer">
                            <option value="">-- Memuat --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Note</label>
                        <input type="text" id="in-note" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold text-xs outline-none focus:border-blue-600 bg-slate-50" placeholder="Catatan tambahan...">
                    </div>
                </div>

                <div class="flex gap-2 overflow-x-auto pt-1 pb-2 px-1 hide-scrollbar whitespace-nowrap scroll-smooth select-none">
                    <button onclick="saringTabelStaging()" class="p-2.5 px-5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-lg shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-blue-800"><i data-lucide="filter" class="w-4 h-4"></i> Filter</button>
                    <button onclick="addEstimasiLokal()" class="p-2.5 px-5 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-lg shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-slate-950"><i data-lucide="plus-circle" class="w-4 h-4"></i> Add Data</button>
                </div>
                <div class="text-[9px] text-slate-400 text-center font-black uppercase tracking-wider mt-1 pointer-events-none flex items-center justify-center gap-1 animate-pulse">
                    <i data-lucide="arrow-left-right" class="w-3 h-3"></i> Geser menu tombol ke kanan-kiri
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
                <div class="table-container overflow-x-auto w-full max-h-[55vh] hide-scrollbar">
                    <table class="w-full border-collapse text-sm text-center whitespace-nowrap" id="table-staging">
                        <thead class="sticky top-0 z-10 shadow-sm bg-slate-800">
                            <tr>
                                <th class="hdr-std w-10"><input type="checkbox" onchange="toggleAllStaging(this.checked)" class="cursor-pointer w-4 h-4 rounded"></th>
                                <th class="hdr-std w-10"><i data-lucide="trash-2" class="w-4 h-4 mx-auto text-rose-400"></i></th>
                                <th class="hdr-std w-12">No</th>
                                <th class="hdr-std">Tgl Estimasi</th>
                                <th class="hdr-std border-r border-slate-500">PO Estimasi</th>
                                <th class="hdr-std text-blue-300">Nama Item</th>
                                <th class="hdr-std">Panjang</th>
                                <th class="hdr-std">Grade</th>
                                <th class="hdr-std text-left pl-4 border-l border-slate-500">Note</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-staging" class="text-slate-700">
                            <tr><td colspan="9" class="p-10 text-slate-400 font-bold"><i data-lucide="package-plus" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data ditambahkan ke tabel sementara.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="view-tabel" class="space-y-3 hidden">
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-2">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Saring Tanggal</label>
                        <select id="filter-db-tanggal" onchange="muatDataEstimasiDB()" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 cursor-pointer uppercase">
                            <option value="ALL">-- SEMUA TANGGAL --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Saring PO Estimasi</label>
                        <select id="filter-db-po" onchange="muatDataEstimasiDB()" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 cursor-pointer uppercase">
                            <option value="ALL">-- SEMUA PO --</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
                <div class="table-container overflow-x-auto w-full max-h-[60vh] hide-scrollbar">
                    <table class="w-full border-collapse text-sm text-center whitespace-nowrap" id="table-database">
                        <thead class="sticky top-0 z-10 shadow-sm bg-slate-800">
                            <tr>
                                <th class="hdr-std w-12">No</th>
                                <th class="hdr-std">Tgl Estimasi</th>
                                <th class="hdr-std border-r border-slate-500">PO Estimasi</th>
                                <th class="hdr-std text-blue-300">Nama Item</th>
                                <th class="hdr-std">Panjang</th>
                                <th class="hdr-std">Grade</th>
                                <th class="hdr-std text-left pl-4 border-l border-slate-500">Note</th>
                                <th class="hdr-std">PIC Input</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-database" class="text-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <div id="floating-bar" class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
        <div class="w-full px-2 sm:px-4 flex justify-center md:justify-end">
            <button id="btn-submit-db" onclick="simpanMassalKeDatabase()" class="w-full md:w-auto px-8 py-2.5 sm:py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-md flex items-center justify-center gap-2 text-sm tracking-wide cursor-pointer transition active:scale-95 uppercase border-b-2 border-emerald-800">
                <i data-lucide="save" class="w-5 h-5"></i> <span>SIMPAN ESTIMASI</span>
            </button>
        </div>
    </div>

    <script src="global.js"></script>
    <script src="estimasi_pengiriman_logic.js"></script>
</body>
</html>
