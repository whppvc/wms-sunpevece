    <script src="global.js"></script>
    <script>
        let modeKS = 'qr'; // Default diubah menjadi qr
        let stokQRRaw = []; 
        let dataKSQR = [];
        let dataKSArea = []; 
        let dataKSGlobal = [];
        let selectedForPO = []; 
        let sourcePOContext = ''; 
        let currentBreakdownData = [];
        let hiddenCols = [];
        let sortState = {}; // Menyimpan Urutan Sort

        // Definisi Kolom yang Diperbarui (Mencakup kolom di QR mode)
        const colDefinitions = [
            { id: 'col-cb', label: 'Checkbox', default: true }, 
            { id: 'col-open', label: 'Tombol Buka (Global)', default: true },
            { id: 'col-no', label: 'Nomor Urut', default: true }, 
            { id: 'col-area', label: 'Area', default: true },
            { id: 'col-tgl', label: 'Tgl Produksi', default: true },
            { id: 'col-mesin', label: 'Mesin', default: true },
            { id: 'col-shift', label: 'Shift', default: true },
            { id: 'col-jenis', label: 'Jenis Item', default: true }, 
            { id: 'col-nama', label: 'Nama Item', default: true },
            { id: 'col-pjg', label: 'Panjang', default: true }, 
            { id: 'col-grade', label: 'Grade', default: true },
            { id: 'col-dus', label: 'Dus', default: true }, 
            { id: 'col-shading', label: 'Shading', default: true },
            { id: 'col-po-bawaan', label: 'PO Bawaan', default: true },
            { id: 'col-po', label: 'PO Aktual', default: true }, 
            { id: 'col-ket', label: 'Keterangan', default: true },
            { id: 'col-qty', label: 'Total QTY (Dus)', default: true }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            initModernLayout({ id: 'kartu_stok', title: 'KARTU STOK', url: 'kartu_stok.html' });
            buatDropdownKolom();
            loadMasterPO();
            setTimeout(muatDataStok, 200);
        });

        // REVISI 2: FUNGSI SORT TABEL
        function sortTable(colIndex, headerEl) {
            const tbody = document.getElementById('tbody-ks');
            const rows = Array.from(tbody.querySelectorAll('tr.row-ks'));
            
            let isAsc = sortState[colIndex] !== 'asc';
            sortState[colIndex] = isAsc ? 'asc' : 'desc';
            
            rows.sort((a, b) => {
                let valA = a.cells[colIndex].innerText.trim();
                let valB = b.cells[colIndex].innerText.trim();
                
                let numA = parseFloat(valA);
                let numB = parseFloat(valB);
                
                if(!isNaN(numA) && !isNaN(numB)) {
                    return isAsc ? numA - numB : numB - numA;
                } else {
                    return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
            });
            
            rows.forEach(row => tbody.appendChild(row));
            
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.setAttribute('data-lucide', 'arrow-up-down'); 
                icon.classList.add('opacity-50');
            });
            
            const icon = headerEl.querySelector('.sort-icon');
            if(icon) {
                icon.setAttribute('data-lucide', isAsc ? 'arrow-up-a-z' : 'arrow-down-z-a');
                icon.classList.remove('opacity-50');
                lucide.createIcons();
            }
        }

        async function loadMasterPO() {
            try {
                const {data, error} = await db.from('master_2').select('po');
                if (data) {
                    let poSet = new Set(); data.forEach(d => { if(d.po) poSet.add(d.po); });
                    const sel = document.getElementById('input-new-po');
                    let html = '<option value="">-- PILIH PO --</option>';
                    Array.from(poSet).sort().forEach(po => { html += `<option value="${po}">${po}</option>`; });
                    sel.innerHTML = html;
                }
            } catch (e) {
                document.getElementById('input-new-po').innerHTML = '<option value="">-- GAGAL MEMUAT PO --</option>';
            }
        }

        function translateBarcode(barcode) {
            let data = { tglProduksi: '-', mesin: '-', shift: '-', jenisItem: '-', namaItem: '-', panjang: '-', grade: '-', dus: '-', shading: '-', po: '-' };
            if(!barcode) return data;
            const parts = barcode.split('/'); if (parts.length < 1) return data;
            const h = barcode.charAt(0).toUpperCase();
            if (h === 'P') data.jenisItem = 'Plafon'; else if (h === 'L') data.jenisItem = 'List'; else if (h === 'W') data.jenisItem = 'WPC'; else data.jenisItem = h;

            let rawItem = parts[0]; 
            data.namaItem = rawItem; data.shading = parts[1] || '-';

            const p2 = parts[2];
            if(p2 && p2.length >= 4) {
                let digitPjg = (p2.length === 5) ? 2 : 1; let rawPjg = p2.substring(0, digitPjg);
                data.panjang = (digitPjg === 1) ? rawPjg + "M" : rawPjg[0] + "." + rawPjg[1] + "M";
                let rawGrade = p2.substring(digitPjg, digitPjg + 1); data.grade = rawGrade === '1' ? 'BAGUS' : (rawGrade === '2' ? 'A' : rawGrade);
                let rawDus = p2.substring(p2.length - 2); data.dus = rawDus;
            }
            const p3 = parts[3];
            if(p3 && p3.length >= 5) {
                const dayOfYear = parseInt(p3.substring(0, 3)); const realYear = parseInt('20' + p3.substring(3, 5).split('').reverse().join(''));
                if (!isNaN(dayOfYear) && !isNaN(realYear)) {
                    const dateObj = new Date(realYear, 0); dateObj.setDate(dayOfYear);
                    data.tglProduksi = `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
                }
                let sisaString = p3.substring(5); let match = sisaString.match(/(C.*?)(S.*?)(P.*)/);
                if(match) { data.mesin = match[1]; data.shift = match[2]; data.po = match[3]; }
            }
            return data;
        }

        function buatDropdownKolom() {
            const container = document.getElementById('list-kolom-toggles'); let html = '';
            colDefinitions.forEach(col => {
                html += `<label class="flex items-center gap-2 cursor-pointer p-1.5 hover:bg-slate-50 rounded">
                            <input type="checkbox" checked onchange="toggleKolom('${col.id}', this.checked)" class="w-4 h-4 cursor-pointer text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                            <span class="text-xs font-bold text-slate-700">${col.label}</span>
                        </label>`;
            });
            container.innerHTML = html;
        }

        function toggleKolom(colId, isVisible) {
            if(isVisible) { hiddenCols = hiddenCols.filter(id => id !== colId); } 
            else { if(!hiddenCols.includes(colId)) hiddenCols.push(colId); }
            terapkanStyleKolom();
        }
        function resetKolom() { hiddenCols = []; document.querySelectorAll('#list-kolom-toggles input[type="checkbox"]').forEach(cb => cb.checked = true); terapkanStyleKolom(); }
        function terapkanStyleKolom() { document.getElementById('dynamic-col-styles').innerHTML = hiddenCols.map(id => `.${id} { display: none !important; }`).join('\n'); }

        async function muatDataStok() {
            document.getElementById('tbody-ks').innerHTML = `<tr><td colspan="15" class="p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-2 text-slate-500"></i><p class="font-bold text-slate-500">Mengkalkulasi Kartu Stok dari Barcode Gudang...</p></td></tr>`;
            lucide.createIcons();
            try {
                const { data: dbStok, error } = await db.from('stok_qr').select('*');
                if(error) throw error;
                stokQRRaw = dbStok || [];

                const { data: dbStbj } = await db.from('hasil_stbj').select('qrcode, keterangan');
                let ketMap = {};
                if(dbStbj) dbStbj.forEach(d => { ketMap[d.qrcode] = d.keterangan || '-'; });

                dataKSQR = [];
                let areaMap = {};
                
                stokQRRaw.forEach(r => {
                    if(!r.id_sku) return;
                    let ket = ketMap[r.qrcode] || '-';
                    let t = translateBarcode(r.qrcode);
                    
                    let p = r.id_sku.split('_'); 
                    let poAktual = p.length >= 8 ? p[7] : t.po;
                    let areaBarang = p.length > 0 ? p[0] : r.area;

                    // Push untuk Mode QR
                    dataKSQR.push({
                        qrcode: r.qrcode,
                        id_sku: r.id_sku,
                        area: areaBarang,
                        tglProduksi: t.tglProduksi,
                        mesin: t.mesin,
                        shift: t.shift,
                        jenis: p[1] || t.jenisItem,
                        nama: p[2] || t.namaItem,
                        pjg: p[3] || t.panjang,
                        grade: p[4] || t.grade,
                        dus: p[5] || t.dus,
                        shading: p[6] || t.shading,
                        po_bawaan: t.po,
                        po_aktual: poAktual,
                        ket: ket
                    });

                    // Kalkulasi Agregasi untuk Area
                    let keyArea = `${r.id_sku}_${ket}`;
                    if(!areaMap[keyArea]) {
                        areaMap[keyArea] = { 
                            id_sku: r.id_sku, key_lengkap: keyArea, area: areaBarang, jenis: p[1] || t.jenisItem, nama: p[2] || t.namaItem,

                    grade: cb.dataset.grade,
                    dus: cb.dataset.dus,
                    shading: cb.dataset.shading,
                    area: cb.dataset.area,
                    po: cb.dataset.po,
                    ket: cb.dataset.ket
                });
                totalDus += qrs.length;
            });

            sourcePOContext = context;
            document.getElementById('input-new-po').value = '';
            
            const inputQty = document.getElementById('input-qty-ganti');
            inputQty.value = totalDus;
            inputQty.max = totalDus; 

            document.getElementById('modal-po').classList.remove('hidden');
            document.getElementById('overlay-klik-luar').classList.remove('hidden');
        }

        function tutupModalPO() { 
            document.getElementById('modal-po').classList.add('hidden'); 
            if(document.getElementById('modal-breakdown').classList.contains('hidden')) {
                document.getElementById('overlay-klik-luar').classList.add('hidden'); 
            }
        }

        async function eksekusiGantiPO() {
            const newPO = document.getElementById('input-new-po').value.trim().toUpperCase();
            if(!newPO) return alert("Silakan Pilih PO Baru dari daftar dropdown!");

            const qtyDiminta = parseInt(document.getElementById('input-qty-ganti').value);
            if(isNaN(qtyDiminta) || qtyDiminta <= 0) return alert("Jumlah dus tidak valid!");

            let maxDus = selectedForPO.reduce((sum, row) => sum + row.qrcodes.length, 0);
            if(qtyDiminta > maxDus) return alert(`Maksimal yang bisa diganti adalah ${maxDus} dus!`);

            const btn = document.getElementById('btn-simpan-po'); const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> MENYIMPAN...'; btn.disabled = true;

            try {
                let qtySisaUntukDiupdate = qtyDiminta;
                let payloadItems = [];
                
                for(let row of selectedForPO) {
                    if (qtySisaUntukDiupdate <= 0) break; 
                    
                    let qrsUntukDiupdate = row.qrcodes.slice(0, qtySisaUntukDiupdate);
                    let jumlahBerubah = qrsUntukDiupdate.length;
                    qtySisaUntukDiupdate -= jumlahBerubah;

                    let parts = row.id_sku.split('_');
                    parts[7] = newPO; 
                    let newIdSku = parts.join('_');

                    payloadItems.push({
                        new_id_sku: newIdSku,
                        qrcodes: qrsUntukDiupdate,
                        jenis_item: row.jenis, 
                        nama: row.nama, pjg: row.pjg, grade: row.grade, dus: row.dus,
                        shading: row.shading, area: row.area,
                        po_lama: row.po, po_baru: newPO, ket: row.ket,
                        qty_berubah: jumlahBerubah
                    });
                }

                const { error } = await db.rpc('eksekusi_ganti_po_aman', { payload: { items: payloadItems } });
                if(error) throw error;
                
                alert(`BERHASIL!\nPO Aktual berhasil diubah menjadi ${newPO} untuk ${qtyDiminta} dus.`);
                tutupModalPO(); if(sourcePOContext === 'breakdown') tutupModalBreakdown();
                await muatDataStok();
            } catch (error) { alert("GAGAL UPDATE: " + error.message); } 
            finally { btn.innerHTML = ori; btn.disabled = false; lucide.createIcons(); }
        }

        function toggleSidebarFilter() { document.getElementById('sidebar-filter').classList.toggle('translate-x-full'); document.getElementById('overlay-klik-luar').classList.toggle('hidden'); }
        function tutupSemuaPopups() { document.getElementById('sidebar-filter').classList.add('translate-x-full'); document.getElementById('dropdown-kolom').classList.add('hidden'); tutupModalPO(); tutupModalBreakdown(); document.getElementById('overlay-klik-luar').classList.add('hidden'); }

        function resetFilter() { const ids = ['f-area','f-jenis','f-nama','f-pjg','f-grade','f-dus','f-shading','f-po','f-ket']; ids.forEach(id => document.getElementById(id).value = ''); saringTabel(); toggleSidebarFilter(); }

        function saringTabel() {
            const f = { area: document.getElementById('f-area').value.toLowerCase(), jenis: document.getElementById('f-jenis').value.toLowerCase(), nama: document.getElementById('f-nama').value.toLowerCase(), pjg: document.getElementById('f-pjg').value.toLowerCase(), grade: document.getElementById('f-grade').value.toLowerCase(), dus: document.getElementById('f-dus').value.toLowerCase(), shading: document.getElementById('f-shading').value.toLowerCase(), po: document.getElementById('f-po').value.toLowerCase(), ket: document.getElementById('f-ket').value.toLowerCase() };
            document.querySelectorAll('.row-ks').forEach(row => {
                let show = true;
                for(let key in f) {
                    if(f[key]) {
                        const cell = row.querySelector('.col-' + key);
                        if(cell && !cell.innerText.toLowerCase().includes(f[key])) { show = false; break; }
                    }
                }
                row.style.display = show ? '' : 'none';
            });
        }

        function salinData() {
            const cek = document.querySelectorAll('.cb-main:checked');
            if(cek.length === 0) return alert("Pilih baris yang ingin disalin (centang).");
            let copyString = "";
            const headers = Array.from(document.querySelectorAll('#thead-ks th')).filter(th => window.getComputedStyle(th).display !== 'none' && !th.classList.contains('col-cb') && !th.classList.contains('col-open')).map(th => th.innerText.trim().replace(/\n/g, ' '));
            copyString += headers.join('\t') + '\n';
            cek.forEach(cb => {
                const tr = cb.closest('tr'); const rowData = [];
                Array.from(tr.children).forEach(td => {
                    if(td.classList.contains('col-cb') || td.classList.contains('col-open')) return;
                    if(window.getComputedStyle(td).display !== 'none') { rowData.push(td.innerText.trim().replace(/\n/g, ' ')); }
                });
                copyString += rowData.join('\t') + '\n';
            });
            navigator.clipboard.writeText(copyString).then(() => alert(`Tersalin ${cek.length} baris!\nBuka Excel lalu Paste.`));
        }

        function salinDataBreakdown() {
            const cek = document.querySelectorAll('.cb-bd:checked');
            if(cek.length === 0) return alert("Centang baris detail Area yang ingin disalin.");
            let copyString = "Area\tPO Aktual\tKeterangan\tQTY\n";
            cek.forEach(cb => {
                const tr = closest('tr');
                copyString += `${tr.children[2].innerText}\t${tr.children[3].innerText}\t${tr.children[4].innerText}\t${tr.children[5].innerText}\n`;
            });
            navigator.clipboard.writeText(copyString).then(() => alert(`Tersalin!\nBuka Excel lalu Paste.`));
        }

        function downloadXLS() {
            let csvContent = "data:text/csv;charset=utf-8,";
            const headers = Array.from(document.querySelectorAll('#thead-ks th')).filter(th => window.getComputedStyle(th).display !== 'none' && !th.classList.contains('col-cb') && !th.classList.contains('col-open')).map(th => th.innerText.trim());
            csvContent += headers.join(",") + "\n";
            document.querySelectorAll('.row-ks').forEach(tr => {
                if(tr.style.display !== 'none') {
                    const rowData = [];
                    Array.from(tr.children).forEach(td => {
                        if(td.classList.contains('col-cb') || td.classList.contains('col-open')) return;
                        if(window.getComputedStyle(td).display !== 'none') { rowData.push(`"${td.innerText.trim()}"`); }
                    });
                    csvContent += rowData.join(",") + "\n";
                }
            });
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `KartuStok_${modeKS.toUpperCase()}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
    </script>
</body>
