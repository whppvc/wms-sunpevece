<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Kartu Stok Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-black { background-color: #1e293b !important; color: white !important; }
        .hdr-blue { background-color: #f1f5f9 !important; color: #0f172a !important; }
    </style>
</head>
<body class="font-sans antialiased text-slate-800 bg-slate-50 flex flex-col min-h-screen">

    <main class="p-4 md:p-6 w-full max-w-[98%] mx-auto flex-grow pt-6">
        <header class="mb-4 flex flex-col md:flex-row md:justify-between md:items-end gap-4 border-b border-slate-200 pb-4">
            <h2 class="text-2xl font-black flex items-center gap-2 text-slate-800"><i data-lucide="layers" class="w-7 h-7 text-blue-600"></i> Kartu Stok & Alokasi PO</h2>
        </header>

        <div class="bg-white p-5 rounded-2xl shadow-sm mb-4 border border-slate-200 relative">
            <h3 class="text-xs font-black opacity-60 uppercase mb-3 flex items-center gap-2 text-slate-600"><i data-lucide="filter" class="w-4 h-4"></i> Filter Stok</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
                <input type="text" id="flt-area" oninput="saringTabel()" class="p-3 text-xs border border-slate-300 font-bold rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200" placeholder="Area...">
                <input type="text" id="flt-jenis" oninput="saringTabel()" class="p-3 text-xs border border-slate-300 font-bold rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200" placeholder="Jenis Item...">
                <input type="text" id="flt-nama" oninput="saringTabel()" class="p-3 text-xs border border-slate-300 font-bold rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200" placeholder="Nama Item...">
                <input type="text" id="flt-pjg" oninput="saringTabel()" class="p-3 text-xs border border-slate-300 font-bold rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200" placeholder="Panjang...">
                <input type="text" id="flt-grade" oninput="saringTabel()" class="p-3 text-xs border border-slate-300 font-bold rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200" placeholder="Grade...">
                <input type="text" id="flt-shading" oninput="saringTabel()" class="p-3 text-xs border border-slate-300 font-bold rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200" placeholder="Shading...">
                <input type="text" id="flt-po" oninput="saringTabel()" class="p-3 text-xs border border-slate-300 font-bold rounded-xl outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-200" placeholder="PO Aktual...">
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="table-container overflow-x-auto w-full max-h-[60vh]">
                <table class="w-full text-left text-sm whitespace-nowrap" id="main-table">
                    <thead class="uppercase text-[11px] font-black sticky top-0 z-10 shadow-sm tracking-wider">
                        <tr>
                            <th class="p-3 hdr-black text-center w-12">No</th>
                            <th class="p-3 hdr-black text-center border-r border-slate-600">Aksi (CS)</th>
                            <th class="p-3 hdr-blue text-blue-700">Area</th>
                            <th class="p-3 hdr-blue border-r border-slate-300">Jenis Item</th>
                            <th class="p-3 bg-slate-50 text-slate-800">Nama Item</th>
                            <th class="p-3 bg-slate-50 text-slate-800">Pjg</th>
                            <th class="p-3 bg-slate-50 text-slate-800">Grade</th>
                            <th class="p-3 bg-slate-50 text-slate-800">Dus</th>
                            <th class="p-3 bg-slate-50 text-slate-800 border-r border-slate-300">Shading</th>
                            <th class="p-3 bg-[#1e293b] text-orange-400 text-center border-x border-slate-600">PO AKTUAL</th>
                            <th class="p-3 bg-blue-100 text-blue-900 text-center text-sm">QTY (DUS)</th>
                        </tr>
                    </thead>
                    <tbody id="data-body"><tr><td colspan="11" class="text-center p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-3 text-blue-500"></i><p class="font-bold text-slate-500">Memuat Stok...</p></td></tr></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-mutasi" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[80] px-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-lg border border-slate-200">
            <h3 class="text-2xl font-black mb-1 flex items-center gap-2 text-slate-800"><i data-lucide="arrow-right-left" class="text-blue-600"></i> Mutasi / Ganti PO</h3>
            <p class="text-xs font-semibold text-slate-500 mb-6">Pindahkan alokasi kuantiti ke PO lain tanpa mengubah fisik QR Code.</p>
            
            <div class="space-y-4 bg-slate-50 p-5 rounded-2xl border border-slate-200 mb-6 text-sm">
                <input type="hidden" id="mut-sku"><input type="hidden" id="mut-area"><input type="hidden" id="mut-jenis"><input type="hidden" id="mut-nama">
                <input type="hidden" id="mut-pjg"><input type="hidden" id="mut-grade"><input type="hidden" id="mut-dus"><input type="hidden" id="mut-shading">

                <div class="flex justify-between border-b border-slate-200 pb-2"><span class="font-bold opacity-60 text-slate-600">Item:</span> <span id="lbl-item" class="font-black text-slate-800 text-right"></span></div>
                <div class="flex justify-between border-b border-slate-200 pb-2"><span class="font-bold opacity-60 text-slate-600">Lokasi Area:</span> <span id="lbl-area" class="font-black text-right text-emerald-600"></span></div>
                <div class="flex justify-between border-b border-slate-200 pb-2"><span class="font-bold opacity-60 text-slate-600">PO Sumber Saat Ini:</span> <span id="lbl-po" class="font-black text-right text-orange-600"></span></div>
                <div class="flex justify-between pt-1"><span class="font-bold opacity-60 text-slate-600">Sisa Qty Dipindah:</span> <span id="lbl-qty" class="font-black text-right text-blue-600 text-lg"></span></div>
            </div>

            <div class="flex gap-4 mb-8">
                <div class="w-2/3">
                    <label class="block text-xs font-black uppercase tracking-widest mb-2 text-slate-600">PO Tujuan</label>
                    <select id="mut-po-baru" class="w-full p-4 border border-slate-300 rounded-xl outline-none focus:border-blue-500 font-black uppercase text-blue-700 bg-white cursor-pointer transition">
                        <option value="">-- MEMUAT PO... --</option>
                    </select>
                </div>
                <div class="w-1/3">
                    <label class="block text-xs font-black uppercase tracking-widest mb-2 text-slate-600">Qty Pindah</label>
                    <input type="number" id="mut-qty-pindah" min="1" class="w-full p-4 border border-slate-300 rounded-xl outline-none focus:border-blue-500 font-black text-center text-lg bg-white transition" placeholder="0">
                </div>
            </div>

            <div class="flex gap-3">
                <button type="button" onclick="tutupModal()" class="w-1/3 py-3.5 bg-slate-100 text-slate-600 font-black rounded-xl hover:bg-slate-200 transition cursor-pointer">BATAL</button>
                <button type="button" onclick="eksekusiMutasi()" id="btn-eksekusi" class="w-2/3 py-3.5 bg-blue-600 font-black rounded-xl shadow-md text-white hover:bg-blue-700 transition flex justify-center items-center gap-2 cursor-pointer active:scale-95"><i data-lucide="check-circle" class="w-5 h-5"></i> EKSEKUSI</button>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        const PAGE_META = { id: 'kartu_stok', title: 'KARTU STOK', url: 'kartu_stok.html' };
        let globalData = [];

        window.addEventListener('DOMContentLoaded', async () => {
            initModernTopBar(PAGE_META);
            await loadPOOptions(); 
            await loadData();
        });

        async function loadPOOptions() {
            const { data } = await db.from('master_2').select('po');
            if (data) {
                const listPO = [...new Set(data.map(d => d.po).filter(x => x && x.trim() !== ''))].sort();
                const sel = document.getElementById('mut-po-baru');
                sel.innerHTML = '<option value="">-- PILIH PO TUJUAN --</option>';
                listPO.forEach(p => { sel.innerHTML += `<option value="${p}">${p}</option>` });
            }
        }

        async function loadData() {
            try {
                const { data, error } = await db.from('stok_global').select('*').gt('qty', 0).order('area', {ascending: true});
                if(error) throw error;
                globalData = data || []; renderTable();
            } catch (err) {
                document.getElementById('data-body').innerHTML = `<tr><td colspan="11" class="p-10 text-center text-red-500 font-bold">Error Memuat Data: ${err.message}</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('data-body');
            if(globalData.length === 0) { 
                tbody.innerHTML = `<tr><td colspan="11" class="text-center p-10 opacity-50"><i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2"></i> Gudang Kosong.</td></tr>`; 
                lucide.createIcons(); return; 
            }
            let htmlContent = ''; 
            globalData.forEach((r, i) => {
                const amanData = JSON.stringify(r).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                htmlContent += `
                    <tr class="border-b border-slate-200 hover:bg-slate-100 transition data-row">
                        <td class="p-3 text-center font-bold text-slate-400">${i+1}</td>
                        <td class="p-2 text-center border-r border-slate-200">
                            <button onclick="bukaModalMutasi('${amanData}')" class="px-3 py-1.5 bg-white hover:bg-orange-50 text-orange-600 font-bold rounded-lg border border-slate-300 hover:border-orange-300 text-[10px] uppercase shadow-sm flex items-center justify-center gap-1 mx-auto transition cursor-pointer active:scale-95">
                                <i data-lucide="edit-3" class="w-3 h-3"></i> GANTI PO
                            </button>
                        </td>
                        <td class="p-3 font-black text-emerald-600 col-area">${r.area}</td>
                        <td class="p-3 font-bold text-blue-700 col-jenis border-r border-slate-200">${r.jenis_item}</td>
                        <td class="p-3 font-bold text-slate-700 col-nama">${r.nama_item}</td>
                        <td class="p-3 font-bold text-slate-500 col-pjg">${r.panjang}</td>
                        <td class="p-3 font-semibold text-slate-700 col-grade">${r.grade}</td>
                        <td class="p-3 text-slate-700 col-dus">${r.dus}</td>
                        <td class="p-3 font-medium text-slate-600 col-shading border-r border-slate-200">${r.shading}</td>
                        <td class="p-3 font-black text-center text-orange-600 bg-orange-50/50 col-po border-x border-slate-200">${r.po_aktual}</td>
                        <td class="p-3 text-center font-black text-lg text-blue-900 col-qty">${r.qty}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlContent;
            lucide.createIcons(); saringTabel();
        }

        function saringTabel() {
            const filters = { area: document.getElementById('flt-area').value.toLowerCase(), jenis: document.getElementById('flt-jenis').value.toLowerCase(), nama: document.getElementById('flt-nama').value.toLowerCase(), pjg: document.getElementById('flt-pjg').value.toLowerCase(), grade: document.getElementById('flt-grade').value.toLowerCase(), shading: document.getElementById('flt-shading').value.toLowerCase(), po: document.getElementById('flt-po').value.toLowerCase() };
            document.querySelectorAll('.data-row').forEach(row => {
                let show = true;
                for(let key in filters) {
                    if(filters[key] !== '') {
                        const cell = row.querySelector('.col-' + key);
                        if(cell && !cell.innerText.toLowerCase().includes(filters[key])) { show = false; break; }
                    }
                }
                row.style.display = show ? '' : 'none';
            });
        }

        function bukaModalMutasi(jsonString) {
            const data = JSON.parse(jsonString);
            document.getElementById('mut-sku').value = data.id_sku; document.getElementById('mut-area').value = data.area; document.getElementById('mut-jenis').value = data.jenis_item; document.getElementById('mut-nama').value = data.nama_item; document.getElementById('mut-pjg').value = data.panjang; document.getElementById('mut-grade').value = data.grade; document.getElementById('mut-dus').value = data.dus; document.getElementById('mut-shading').value = data.shading;
            document.getElementById('lbl-item').innerText = `${data.jenis_item} ${data.nama_item} - ${data.panjang} (${data.grade})`;
            document.getElementById('lbl-area').innerText = data.area; document.getElementById('lbl-po').innerText = data.po_aktual; document.getElementById('lbl-qty').innerText = data.qty + " Dus";
            document.getElementById('mut-qty-pindah').max = data.qty; document.getElementById('mut-qty-pindah').value = ''; document.getElementById('mut-po-baru').value = '';
            document.getElementById('modal-mutasi').classList.remove('hidden');
        }

        function tutupModal() { document.getElementById('modal-mutasi').classList.add('hidden'); }

        async function eksekusiMutasi() {
            const poBaru = document.getElementById('mut-po-baru').value.trim().toUpperCase(); const qtyPindah = parseInt(document.getElementById('mut-qty-pindah').value); const skuLama = document.getElementById('mut-sku').value; const maxQty = parseInt(document.getElementById('mut-qty-pindah').max); const poLama = document.getElementById('lbl-po').innerText; const namaItem = document.getElementById('lbl-item').innerText;
            if(!poBaru) return alert("Pilih PO Tujuan terlebih dahulu!"); if(poBaru === poLama) return alert("PO Tujuan tidak boleh sama dengan PO Sumber!"); if(!qtyPindah || qtyPindah <= 0 || qtyPindah > maxQty) return alert(`Qty tidak valid! (Maksimal ${maxQty})`);

            const btnEks = document.getElementById('btn-eksekusi'); btnEks.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> MEMPROSES...'; btnEks.disabled = true;

            const user = JSON.parse(localStorage.getItem('user_session')) || {username: 'Unknown'};
            const area = document.getElementById('mut-area').value; const jenis = document.getElementById('mut-jenis').value; const nama = document.getElementById('mut-nama').value; const pjg = document.getElementById('mut-pjg').value; const grade = document.getElementById('mut-grade').value; const dus = document.getElementById('mut-dus').value; const shading = document.getElementById('mut-shading').value;
            const skuBaru = `${area}_${jenis}_${nama}_${pjg}_${grade}_${dus}_${shading}_${poBaru}`;

            const payloadData = { sku_lama: skuLama, sku_baru: skuBaru, qty_pindah: qtyPindah, area: area, jenis: jenis, nama: nama, pjg: pjg, grade: grade, dus: dus, shading: shading, po_baru: poBaru, detail_log: `Mutasi ${qtyPindah} Dus [${namaItem}]. Dari PO: ${poLama} -> PO: ${poBaru}. Lokasi: ${area}.`, pic: user.username };

            const { data, error } = await db.rpc('eksekusi_mutasi_aman', { payload: payloadData });
            if (error || (data && data.startsWith('ERROR'))) { alert("GAGAL MUTASI: " + (error ? error.message : data)); btnEks.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> EKSEKUSI'; btnEks.disabled = false; return; }

            alert("Mutasi PO Berhasil!"); tutupModal(); await loadData(); 
            btnEks.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i> EKSEKUSI'; btnEks.disabled = false;
        }
    </script>
</body>
</html>
