<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Kartu Stok</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; border: 1px solid #334155; padding: 0.75rem; text-transform: uppercase; font-size: 11px; font-weight: 900; white-space: nowrap; }
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
    </style>
    <style id="dynamic-table-settings"></style>
    <style id="dynamic-col-styles"></style>
</head>
<body class="font-sans bg-slate-50 overflow-x-hidden text-slate-800 pb-20">
    <div class="w-full px-2 sm:px-4 pt-4 relative">
        
        <div class="flex border-b border-slate-200 mb-3 bg-white rounded-t-xl shadow-sm overflow-x-auto hide-scrollbar">
            <button onclick="setModeKS('qr')" id="tab-qr" class="px-5 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="qr-code" class="w-4 h-4"></i> KS QR (DETAIL)</button>
            <button onclick="setModeKS('area')" id="tab-area" class="px-5 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="map" class="w-4 h-4"></i> KS AREA (LOKASI)</button>
            <button onclick="setModeKS('global')" id="tab-global" class="px-5 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="globe-2" class="w-4 h-4"></i> KS GLOBAL (KUMULATIF)</button>
            <button onclick="setModeKS('lembaran')" id="tab-lembaran" class="px-5 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="file" class="w-4 h-4"></i> KS LEMBARAN</button>
        </div>

        <div class="bg-white p-3 sm:p-4 rounded-xl border border-slate-200 shadow-sm mb-3 flex items-center">
            <div class="flex gap-2 items-center overflow-x-auto pt-1 pb-4 px-1 hide-scrollbar whitespace-nowrap scroll-smooth select-none flex-1" style="-webkit-overflow-scrolling: touch;">
                
                <button id="btn-ganti-po-main" onclick="siapkanGantiPO('main')" class="p-2.5 px-4 bg-orange-600 hover:bg-orange-700 text-white font-black text-xs rounded-lg shadow-sm flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-orange-800"><i data-lucide="edit-3" class="w-4 h-4"></i> GANTI PO AKTUAL</button>
                <button onclick="alert('Fitur Konversi akan dibahas dan dikembangkan lebih lanjut.')" class="p-2.5 px-4 bg-purple-600 hover:bg-purple-700 text-white font-black rounded-lg shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-purple-800"><i data-lucide="refresh-cw" class="w-4 h-4"></i> KONVERSI</button>
                <button onclick="alert('Fitur Note akan dibahas dan dikembangkan lebih lanjut.')" class="p-2.5 px-4 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-lg shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-amber-700"><i data-lucide="file-text" class="w-4 h-4"></i> NOTE</button>
                <button onclick="downloadXLS()" class="p-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-lg shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-emerald-800"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> EXCEL</button>

                <div class="w-px h-8 bg-slate-300 mx-1"></div>

                <button onclick="toggleSidebarFilter()" class="p-2.5 px-4 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-lg shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-slate-950"><i data-lucide="filter" class="w-4 h-4"></i> FILTER</button>
                
                <div class="relative">
                    <button onclick="document.getElementById('dropdown-kolom').classList.toggle('hidden')" class="p-2.5 px-4 bg-white text-slate-700 hover:bg-slate-50 font-black rounded-lg shadow-sm border-2 border-slate-200 text-xs flex items-center gap-2 active:scale-95 transition uppercase"><i data-lucide="eye-off" class="w-4 h-4"></i> KOLOM</button>
                    <div id="dropdown-kolom" class="hidden absolute top-full left-0 mt-2 w-56 bg-white border border-slate-200 shadow-xl rounded-xl p-3 z-40">
                        <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-2">
                            <span class="text-xs font-black text-slate-500 uppercase">Sembunyikan</span>
                            <button onclick="resetKolom()" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200">RESET</button>
                        </div>
                        <div class="flex flex-col gap-2 max-h-64 overflow-y-auto" id="list-kolom-toggles"></div>
                    </div>
                </div>

                <button onclick="salinData()" class="p-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-lg shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-blue-800"><i data-lucide="copy" class="w-4 h-4"></i> SALIN</button>

            </div>

            <button onclick="bukaModalSetting()" class="ml-2 mb-3 p-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-black rounded-lg shadow-sm flex items-center justify-center active:scale-95 transition border-b-2 border-slate-300 flex-shrink-0" title="Pengaturan Tampilan Tabel">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="text-[9px] text-slate-400 text-center font-black uppercase tracking-wider -mt-4 mb-2 pointer-events-none flex items-center justify-center gap-1 animate-pulse">
            <i data-lucide="arrow-left-right" class="w-3 h-3"></i> Geser menu aksi ke kanan-kiri
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative mb-4">
            <div class="overflow-x-auto w-full max-h-[65vh] hide-scrollbar">
                <table class="w-full border-collapse text-sm whitespace-nowrap" id="main-table">
                    <thead class="sticky top-0 z-10 shadow-sm" id="thead-ks"></thead>
                    <tbody id="tbody-ks" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4"></i> Filter Kartu Stok</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-4 overflow-y-auto">
            <div class="grid grid-cols-2 gap-3">
                <div id="f-area-container"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Area / K.Master</label><input type="text" id="f-area" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div id="f-qr-container"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="f-qr" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><input type="text" id="f-jenis" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label><input type="text" id="f-nama" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><input type="text" id="f-pjg" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><input type="text" id="f-grade" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><input type="text" id="f-dus" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="f-shading" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PO / Target</label><input type="text" id="f-po" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="f-ket" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            </div>
            <button onclick="resetFilter()" class="mt-4 py-3 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-lg text-xs uppercase transition border border-slate-300">RESET FILTER</button>
        </div>
    </div>

    <div id="modal-breakdown" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-black text-slate-800 flex flex-col gap-1 uppercase tracking-wide">
                    <span class="flex items-center gap-2"><i data-lucide="package-open" class="w-5 h-5 text-blue-600"></i> DETAIL AREA ITEM</span>
                    <span id="bd-title-item" class="text-xs text-blue-700 font-bold ml-7">NAMA ITEM - 4M - BAGUS</span>
                </h3>
                <button onclick="tutupModalBreakdown()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-2 rounded-lg transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-3 bg-white border-b border-slate-100 flex gap-2">
                <button onclick="salinDataBreakdown()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg flex items-center gap-2 shadow-sm transition"><i data-lucide="copy" class="w-4 h-4"></i> SALIN DETAIL</button>
                <button onclick="siapkanGantiPO('breakdown')" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white font-bold text-xs rounded-lg flex items-center gap-2 shadow-sm transition"><i data-lucide="edit-3" class="w-4 h-4"></i> GANTI PO AKTUAL</button>
            </div>
            <div class="overflow-y-auto flex-1 hide-scrollbar bg-slate-50 p-4">
                <table class="w-full border-collapse text-sm whitespace-nowrap bg-white rounded-xl shadow-sm overflow-hidden" id="table-breakdown">
                    <thead>
                        <tr>
                            <th class="hdr-std w-10"><input type="checkbox" onchange="toggleCentangBreakdown(this.checked)" class="cursor-pointer"></th>
                            <th class="hdr-std">No</th>
                            <th class="hdr-std">Area Penyimpanan</th>
                            <th class="hdr-std border-r border-slate-500">PO Aktual (Saat ini)</th>
                            <th class="hdr-std border-r border-slate-500 text-left">Keterangan</th>
                            <th class="hdr-std bg-emerald-700 text-white">Total Dus (QTY)</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-breakdown" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-po" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[80] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-200">
            <h3 class="text-lg font-black mb-6 flex items-center gap-2 text-slate-800"><i data-lucide="edit-3" class="text-orange-600"></i> Ganti PO Aktual</h3>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-black uppercase tracking-wide mb-2 text-slate-600">Pilih PO Aktual</label>
                    <select id="input-new-po" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-orange-600 font-bold text-slate-800 uppercase bg-slate-50 cursor-pointer">
                        <option value="">-- MEMUAT PO... --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-wide mb-2 text-slate-600">Jumlah Dus</label>
                    <input type="number" id="input-qty-ganti" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-orange-600 font-bold text-slate-800 bg-slate-50" placeholder="Contoh: 5" min="1">
                </div>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="tutupModalPO()" class="w-1/2 py-3 bg-slate-200 text-slate-700 font-black rounded-xl hover:bg-slate-300 transition cursor-pointer text-xs uppercase">BATAL</button>
                <button type="button" onclick="eksekusiGantiPO()" id="btn-simpan-po" class="w-1/2 py-3 bg-orange-600 hover:bg-orange-700 text-white font-black rounded-xl shadow-md transition flex justify-center items-center gap-2 cursor-pointer active:scale-95 text-xs uppercase border-b-4 border-orange-800"><i data-lucide="save" class="w-4 h-4"></i> SIMPAN</button>
            </div>
        </div>
    </div>

    <div id="modal-setting" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[90] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm">
                    <i data-lucide="settings" class="w-5 h-5 text-slate-600"></i> PENGATURAN TAMPILAN TABEL
                </h3>
                <button onclick="document.getElementById('modal-setting').classList.add('hidden')" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-5 flex flex-col gap-5 overflow-y-auto max-h-[70vh]">
                <div class="border border-slate-200 rounded-xl p-4 bg-slate-50/50">
                    <h4 class="font-black text-xs text-blue-600 mb-3 uppercase flex items-center gap-1"><i data-lucide="heading" class="w-3.5 h-3.5"></i> Styling Header Tabel</h4>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-600">Warna Background</label>
                            <input type="color" id="set-th-bg" class="w-10 h-8 cursor-pointer rounded border border-slate-300">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-600">Warna Teks (HEX)</label>
                            <input type="color" id="set-th-color" class="w-10 h-8 cursor-pointer rounded border border-slate-300">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-600">Ukuran Font (px)</label>
                            <input type="number" id="set-th-size" class="w-20 p-1.5 text-center text-xs font-bold border border-slate-300 rounded" min="8" max="24">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-600">Perataan Teks (Align)</label>
                            <select id="set-th-align" class="w-24 p-1.5 text-xs font-bold border border-slate-300 rounded outline-none cursor-pointer">
                                <option value="left">Kiri</option><option value="center">Tengah</option><option value="right">Kanan</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="border border-slate-200 rounded-xl p-4 bg-slate-50/50">
                    <h4 class="font-black text-xs text-emerald-600 mb-3 uppercase flex items-center gap-1"><i data-lucide="table-2" class="w-3.5 h-3.5"></i> Styling Isi Tabel</h4>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-600">Warna Teks (HEX)</label>
                            <input type="color" id="set-td-color" class="w-10 h-8 cursor-pointer rounded border border-slate-300">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-600">Ukuran Font (px)</label>
                            <input type="number" id="set-td-size" class="w-20 p-1.5 text-center text-xs font-bold border border-slate-300 rounded" min="8" max="24">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-600">Perataan Teks (Align)</label>
                            <select id="set-td-align" class="w-24 p-1.5 text-xs font-bold border border-slate-300 rounded outline-none cursor-pointer">
                                <option value="left">Kiri</option><option value="center">Tengah</option><option value="right">Kanan</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-between bg-slate-50 items-center rounded-b-2xl">
                <button onclick="resetSettingDefault()" class="text-[10px] font-black text-red-500 hover:text-red-700 underline uppercase">Kembali ke Default</button>
                <button onclick="simpanSettingTabel()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-lg shadow-sm text-xs transition flex items-center gap-2"><i data-lucide="check" class="w-4 h-4"></i> TERAPKAN</button>
            </div>
        </div>
    </div>

    <div id="overlay-klik-luar" onclick="tutupSemuaPopups()" class="hidden fixed inset-0 z-30 bg-slate-900/20 backdrop-blur-sm"></div>

    <script src="global.js"></script>
    <script>
        let modeKS = 'qr'; 
        let stokQRRaw = []; let stokLembaranRaw = [];
        let dataKSQR = []; let dataKSArea = []; let dataKSGlobal = [];
        let selectedForPO = []; let sourcePOContext = ''; let currentBreakdownData = [];
        let sortState = {};
        let masterData = { kamus: [] };

        // FUNGSI AMAN PARSE JSON AGAR TIDAK BLANK / CRASH
        function safeJSONParse(str, fallback) {
            try { return str && str !== 'undefined' ? JSON.parse(str) : fallback; }
            catch(e) { return fallback; }
        }

        const currentUser = safeJSONParse(localStorage.getItem('user_session'), {username: 'Admin', role: 'admin'});

        const colDefinitions = [
            { id: 'col-cb', label: 'Checkbox', default: true }, { id: 'col-open', label: 'Tombol Buka', default: true },
            { id: 'col-no', label: 'Nomor Urut', default: true }, { id: 'col-area', label: 'Area', default: true },
            { id: 'col-qr', label: 'QRCode', default: true },
            { id: 'col-tgl', label: 'Tgl Produksi', default: true }, { id: 'col-mesin', label: 'Mesin', default: true },
            { id: 'col-shift', label: 'Shift', default: true }, { id: 'col-jenis', label: 'Jenis Item', default: true }, 
            { id: 'col-nama', label: 'Nama Item', default: true }, { id: 'col-pjg', label: 'Panjang', default: true }, 
            { id: 'col-grade', label: 'Grade', default: true }, { id: 'col-dus', label: 'Dus', default: true }, 
            { id: 'col-shading', label: 'Shading', default: true }, { id: 'col-po-bawaan', label: 'PO Bawaan', default: true },
            { id: 'col-po', label: 'PO Aktual', default: true }, { id: 'col-ket', label: 'Keterangan', default: true },
            { id: 'col-qty', label: 'Total QTY', default: true }
        ];

        // ========================================================
        // 1. DYNAMIC STYLING MANAGEMENT (GEAR SETTING TABEL)
        // ========================================================
        const defaultSettings = { thBg: '#1e293b', thColor: '#ffffff', thSize: 11, thAlign: 'center', tdColor: '#334155', tdSize: 12, tdAlign: 'center' };

        function terapkanSettingAwal() {
            let saved = safeJSONParse(localStorage.getItem('wms_table_settings'), defaultSettings);
            if (!saved || !saved.thBg) saved = defaultSettings;
            applyCSS(saved);
        }

        function applyCSS(s) {
            const styleEl = document.getElementById('dynamic-table-settings');
            styleEl.innerHTML = `
                #main-table th.hdr-std { background-color: ${s.thBg} !important; color: ${s.thColor} !important; font-size: ${s.thSize}px !important; text-align: ${s.thAlign} !important; justify-content: ${s.thAlign === 'left' ? 'flex-start' : (s.thAlign === 'right' ? 'flex-end' : 'center')} !important; }
                #main-table td { color: ${s.tdColor} !important; font-size: ${s.tdSize}px !important; text-align: ${s.tdAlign} !important; }
            `;
        }

        function bukaModalSetting() {
            let s = safeJSONParse(localStorage.getItem('wms_table_settings'), defaultSettings);
            if (!s || !s.thBg) s = defaultSettings;

            document.getElementById('set-th-bg').value = s.thBg;
            document.getElementById('set-th-color').value = s.thColor;
            document.getElementById('set-th-size').value = s.thSize;
            document.getElementById('set-th-align').value = s.thAlign;
            document.getElementById('set-td-color').value = s.tdColor;
            document.getElementById('set-td-size').value = s.tdSize;
            document.getElementById('set-td-align').value = s.tdAlign;

            document.getElementById('modal-setting').classList.remove('hidden');
            document.getElementById('overlay-klik-luar').classList.remove('hidden');
        }

        function simpanSettingTabel() {
            let s = {
                thBg: document.getElementById('set-th-bg').value,
                thColor: document.getElementById('set-th-color').value,
                thSize: parseInt(document.getElementById('set-th-size').value) || 11,
                thAlign: document.getElementById('set-th-align').value,
                tdColor: document.getElementById('set-td-color').value,
                tdSize: parseInt(document.getElementById('set-td-size').value) || 12,
                tdAlign: document.getElementById('set-td-align').value
            };

        function translateBarcode(barcode) {
            let data = { tglProduksi: '-', mesin: '-', shift: '-', jenisItem: '-', namaItem: '-', panjang: '-', grade: '-', dus: '-', shading: '-', po: '-' };
            if(!barcode) return data;
            const parts = barcode.split('/'); if (parts.length < 1) return data;
            
            const h = barcode.charAt(0).toUpperCase();
            if (h === 'P') data.jenisItem = 'Plafon'; else if (h === 'L') data.jenisItem = 'List'; else if (h === 'W') data.jenisItem = 'WPC'; else data.jenisItem = h;

            let rawItem = parts[0]; data.namaItem = rawItem; data.shading = parts[1] || '-';
            const p2 = parts[2];
            if(p2 && p2.length >= 4) {
                let digitPjg = (p2.length === 5) ? 2 : 1; let rawPjg = p2.substring(0, digitPjg);
                data.panjang = (digitPjg === 1) ? rawPjg + "M" : rawPjg[0] + "." + rawPjg[1] + "M";
                let rawGrade = p2.substring(digitPjg, digitPjg + 1); data.grade = rawGrade === '1' ? 'BAGUS' : (rawGrade === '2' ? 'A' : rawGrade);
                let rawDus = p2.substring(p2.length - 2); data.dus = rawDus;
            }
            const p3 = parts[3];
            if(p3 && p3.length >= 5) {
                const dayOfYear = parseInt(p3.substring(0, 3)); const realYear = parseInt('20' + p3.substring(3, 5).split('').reverse().join(''));
                if (!isNaN(dayOfYear) && !isNaN(realYear)) {
                    const dateObj = new Date(realYear, 0); dateObj.setDate(dayOfYear);
                    data.tglProduksi = `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
                }
                let sisaString = p3.substring(5); let match = sisaString.match(/(C.*?)(S.*?)(P.*)/);
                if(match) { data.mesin = match[1]; data.shift = match[2]; data.po = match[3]; }
            }
            return data;
        }

        async function muatDataStok() {
            const thead = document.getElementById('thead-ks');
            const tbody = document.getElementById('tbody-ks');
            tbody.innerHTML = `<tr><td colspan="16" class="p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-2 text-slate-500"></i><p class="font-bold text-slate-500">Menghubungkan ke Gudang Supabase...</p></td></tr>`;
            lucide.createIcons();

            try {
                const [resStok, resSTBJ, resLembaran] = await Promise.all([
                    db.from('stok_qr').select('*'),
                    db.from('hasil_stbj').select('qrcode, keterangan'),
                    db.from('stok_lembaran').select('*').order('created_at', {ascending: false})
                ]);
                
                if(resStok.error) throw resStok.error;
                stokQRRaw = resStok.data || [];
                stokLembaranRaw = resLembaran.data || [];

                let ketMap = {};
                if(resSTBJ.data) resSTBJ.data.forEach(d => { if(d.qrcode) ketMap[d.qrcode.trim()] = d.keterangan || '-'; });

                dataKSQR = [];
                let areaMap = {};
                
                stokQRRaw.forEach(r => {
                    if(!r.id_sku) return;
                    let trimQR = (r.qrcode || '').toString().trim();
                    let ket = ketMap[trimQR] || r.keterangan || '-';
                    let t = translateBarcode(trimQR);
                    
                    let p = r.id_sku.split('_'); 
                    let areaBarang = r.area || p[0] || '-';
                    let jenisBarang = r.jenis_item || p[1] || t.jenisItem;
                    let namaBarang = r.nama_item || p[2] || t.namaItem;
                    let panjangBarang = r.panjang || p[3] || t.panjang;
                    let gradeBarang = r.grade || p[4] || t.grade;
                    let dusBarang = r.dus || p[5] || t.dus;
                    let shadingBarang = r.shading || p[6] || t.shading;

                    // PENERJEMAHAN KODE DENGAN SAFE TRIM() ANTI-SPASI
                    let rawMesin = (r.mesin || t.mesin || '').toString().trim();
                    let cM = masterData.kamus.find(m => m.kode_mesin && m.kode_mesin.toString().trim() === rawMesin);
                    let txtMesin = cM && cM.mesin ? cM.mesin : rawMesin;

                    let rawShift = (r.shift || t.shift || '').toString().trim();
                    let cS = masterData.kamus.find(m => m.kode_shift && m.kode_shift.toString().trim() === rawShift);
                    let txtShift = cS && cS.shift ? cS.shift : rawShift;

                    let rawPoBawaan = (r.po_bawaan || t.po || '').toString().trim();
                    let cP = masterData.kamus.find(m => m.kode_po && m.kode_po.toString().trim() === rawPoBawaan);
                    let txtPoBawaan = cP && cP.po ? cP.po : rawPoBawaan;

                    let rawPoAktual = (p.length >= 8 ? p[7] : rawPoBawaan).toString().trim();
                    let cPA = masterData.kamus.find(m => m.kode_po && m.kode_po.toString().trim() === rawPoAktual);
                    let txtPoAktual = cPA && cPA.po ? cPA.po : rawPoAktual;

                    // INJEKSI DATA DETAIL QR (REVISI 1: ANTI-UNDEFINED)
                    dataKSQR.push({
                        qrcode: trimQR || '-',
                        id_sku: r.id_sku || '-',
                        area: areaBarang || '-',
                        tglProduksi: r.tgl_produksi || t.tglProduksi || '-',
                        mesin: txtMesin || '-',
                        shift: txtShift || '-',
                        jenis: jenisBarang || '-',
                        nama: namaBarang || '-',
                        pjg: panjangBarang || '-',
                        grade: gradeBarang || '-',
                        dus: dusBarang || '-',
                        shading: shadingBarang || '-',
                        po_bawaan: txtPoBawaan || '-',
                        po_aktual: txtPoAktual || '-',
                        ket: ket
                    });

                    // Agregasi Data per Area Gudang
                    let keyArea = `${r.id_sku}_${ket}`;
                    if(!areaMap[keyArea]) {
                        areaMap[keyArea] = { 
                            id_sku: r.id_sku, key_lengkap: keyArea, area: areaBarang, jenis: jenisBarang, nama: namaBarang, 
                            pjg: panjangBarang, grade: gradeBarang, dus: dusBarang, shading: shadingBarang, po: txtPoAktual, ket: ket,
                            qty: 0, qrcodes: [] 
                        };
                    }
                    areaMap[keyArea].qty++;
                    areaMap[keyArea].qrcodes.push(trimQR);
                });
                dataKSArea = Object.values(areaMap);

                // Agregasi Data Kumulatif Global
                let globalMap = {};
                dataKSArea.forEach(a => {
                    let gKey = `${a.jenis}_${a.nama}_${a.pjg}_${a.grade}_${a.dus}_${a.shading}_${a.po}_${a.ket}`;
                    if(!globalMap[gKey]) {
                        globalMap[gKey] = { 
                            gKey: gKey, jenis: a.jenis, nama: a.nama, pjg: a.pjg, 
                            grade: a.grade, dus: a.dus, shading: a.shading, po: a.po, ket: a.ket,
                            qty: 0, areas: [] 
                        };
                    }
                    globalMap[gKey].qty += a.qty;
                    globalMap[gKey].areas.push({
                        id_sku: a.id_sku, key_lengkap: a.key_lengkap, area: a.area, po: a.po, ket: a.ket, qty: a.qty, qrcodes: a.qrcodes,
                        nama: a.nama, pjg: a.pjg, grade: a.grade, dus: a.dus, shading: a.shading, jenis: a.jenis 
                    });
                });
                dataKSGlobal = Object.values(globalMap);

                renderTabel();
            } catch(e) { tbody.innerHTML = `<tr><td colspan="16" class="p-10 text-red-500 font-bold">Gagal mengolah data: ${e.message}</td></tr>`; }
        }

                        <th class="hdr-std text-emerald-300 bg-slate-900 col-qty cursor-pointer hover:bg-slate-700 transition" onclick="sortTable(11, this)"><div class="flex items-center justify-center gap-1">TOTAL (DUS) <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></div></th>
                    </tr>`;

                if(dataKSGlobal.length === 0) { tbody.innerHTML = `<tr><td colspan="12" class="p-6 font-bold text-slate-400">Tidak ada data kumulatif.</td></tr>`; return; }

                let h = '';
                dataKSGlobal.forEach((r, i) => {
                    h += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50 transition row-ks text-xs">
                            <td class="p-3 col-cb"><input type="checkbox" class="cb-main cursor-pointer w-4 h-4 text-blue-600 rounded"></td>
                            <td class="p-2 col-open"><button onclick="bukaBreakdown('${r.gKey}')" class="p-1.5 bg-blue-100 text-blue-700 hover:bg-blue-600 hover:text-white rounded shadow-sm transition flex mx-auto items-center justify-center"><i data-lucide="box" class="w-4 h-4"></i></button></td>
                            <td class="p-3 font-bold opacity-50 col-no">${i+1}</td>
                            <td class="p-3 font-black text-blue-700 border-l border-slate-200 col-jenis">${r.jenis}</td>
                            <td class="p-3 font-bold text-left col-nama">${r.nama}</td>
                            <td class="p-3 font-bold col-pjg">${r.pjg}</td>
                            <td class="p-3 font-bold col-grade">${r.grade}</td>
                            <td class="p-3 font-bold border-r border-slate-200 col-dus">${r.dus}</td>
                            <td class="p-3 font-bold col-shading">${r.shading}</td>
                            <td class="p-3 font-black text-orange-600 bg-orange-50/50 border-x border-slate-200 col-po">${r.po}</td>
                            <td class="p-3 font-semibold opacity-70 border-r border-slate-200 col-ket text-center">${r.ket}</td>
                            <td class="p-3 font-black text-slate-900 bg-slate-100 col-qty">${r.qty}</td>
                        </tr>`;
                });
                tbody.innerHTML = h;
            } 
            // REVISI 6: RENDER MODE KS LEMBARAN
            else if (modeKS === 'lembaran') {
                thead.innerHTML = `
                    <tr>
                        <th class="hdr-std w-10 col-cb"><input type="checkbox" onchange="toggleCentangUtama(this.checked)" class="cursor-pointer rounded text-blue-600"></th>
                        <th class="hdr-std w-12 col-no cursor-pointer hover:bg-slate-700 transition" onclick="sortTable(1, this)"><div class="flex items-center justify-center gap-1">No <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></div></th>
                        <th class="hdr-std border-r border-slate-500 col-area cursor-pointer hover:bg-slate-700 transition" onclick="sortTable(2, this)"><div class="flex items-center justify-center gap-1">Kode Master <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></div></th>
                        <th class="hdr-std col-nama cursor-pointer hover:bg-slate-700 transition" onclick="sortTable(3, this)"><div class="flex items-center justify-center gap-1">Nama Item <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></div></th>
                        <th class="hdr-std col-pjg cursor-pointer hover:bg-slate-700 transition" onclick="sortTable(4, this)"><div class="flex items-center justify-center gap-1">Pjg <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></div></th>
                        <th class="hdr-std col-grade cursor-pointer hover:bg-slate-700 transition" onclick="sortTable(5, this)"><div class="flex items-center justify-center gap-1">Grade <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></div></th>
                        <th class="hdr-std col-dus cursor-pointer hover:bg-slate-700 transition" onclick="sortTable(6, this)"><div class="flex items-center justify-center gap-1">Dus <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></div></th>
                        <th class="hdr-std border-r border-slate-500 col-shading cursor-pointer hover:bg-slate-700 transition" onclick="sortTable(7, this)"><div class="flex items-center justify-center gap-1">Shading <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></div></th>
                        <th class="hdr-std col-ket text-center cursor-pointer hover:bg-slate-700 transition" onclick="sortTable(8, this)"><div class="flex items-center justify-center gap-1">Keterangan <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></div></th>
                    </tr>`;
                
                if(stokLembaranRaw.length === 0) { tbody.innerHTML = `<tr><td colspan="9" class="p-6 font-bold text-slate-400">Tabel Stok Lembaran Kosong.</td></tr>`; return; }

                let h = '';
                stokLembaranRaw.forEach((r, i) => {
                    h += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50 transition row-ks text-xs">
                            <td class="p-3 col-cb"><input type="checkbox" value="${r.id}" class="cb-main cursor-pointer w-4 h-4 text-blue-600 rounded"></td>
                            <td class="p-3 font-bold opacity-50 col-no">${i+1}</td>
                            <td class="p-3 font-black text-emerald-700 bg-emerald-50 border-r border-slate-200 col-area text-center">${r.kode_master || '-'}</td>
                            <td class="p-3 font-bold text-slate-800 text-left col-nama">${r.nama_item || '-'}</td>
                            <td class="p-3 font-bold text-slate-600 text-center col-pjg">${r.pjg || '-'}</td>
                            <td class="p-3 font-bold text-slate-800 text-center col-grade">${r.grade || '-'}</td>
                            <td class="p-3 font-bold text-slate-800 text-center col-dus">${r.dus || '-'}</td>
                            <td class="p-3 font-bold text-slate-600 border-r border-slate-200 text-center col-shading">${r.shading || '-'}</td>
                            <td class="p-3 font-semibold opacity-70 col-ket text-center">${r.keterangan || '-'}</td>
                        </tr>`;
                });
                tbody.innerHTML = h;
            }

            lucide.createIcons(); 
            if(modeKS !== 'lembaran') saringTabel();
        }

        // ========================================================
        // 4. ACTION ENGINE & CORE AUXILIARY FUNCTIONS
        // ========================================================
        function bukaBreakdown(gKey) {
            const item = dataKSGlobal.find(g => g.gKey === gKey); if(!item) return;

            document.getElementById('bd-title-item').innerText = `${item.nama} | ${item.pjg} | ${item.grade} | DUS: ${item.dus} | SHADING: ${item.shading} | KET: ${item.ket}`;
            currentBreakdownData = item.areas;

            const tbody = document.getElementById('tbody-breakdown'); let h = '';
            item.areas.forEach((a, i) => {
                const safeQRs = JSON.stringify(a.qrcodes).replace(/"/g, "&quot;");
                h += `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 transition bd-row text-xs">
                        <td class="p-3"><input type="checkbox" data-idsku="${a.id_sku}" data-qrs="${safeQRs}" data-jenis="${a.jenis}" data-nama="${a.nama}" data-pjg="${a.pjg}" data-grade="${a.grade}" data-dus="${a.dus}" data-shading="${a.shading}" data-area="${a.area}" data-po="${a.po}" data-ket="${a.ket}" class="cb-bd cursor-pointer w-4 h-4 text-blue-600 rounded"></td>
                        <td class="p-3 font-bold opacity-50">${i+1}</td>
                        <td class="p-3 font-black text-emerald-700 bg-emerald-50 text-center">${a.area}</td>
                        <td class="p-3 font-black text-orange-600 border-r border-slate-200 bg-orange-50/50 text-center">${a.po}</td>
                        <td class="p-3 font-semibold opacity-70 border-r border-slate-200 text-center">${a.ket}</td>
                        <td class="p-3 font-black text-slate-900 bg-slate-100 text-center">${a.qty}</td>
                    </tr>`;
            });
            tbody.innerHTML = h;

            document.getElementById('modal-breakdown').classList.remove('hidden');
            document.getElementById('overlay-klik-luar').classList.remove('hidden');
            lucide.createIcons();
        }

        function tutupModalBreakdown() { document.getElementById('modal-breakdown').classList.add('hidden'); document.getElementById('overlay-klik-luar').classList.add('hidden'); }
        function toggleCentangBreakdown(checked) { document.querySelectorAll('.cb-bd').forEach(cb => cb.checked = checked); }

        function siapkanGantiPO(context) {
            let checkboxes = [];
            if(context === 'main') {
                if(modeKS === 'global' || modeKS === 'lembaran') return;
                checkboxes = document.querySelectorAll('.cb-main:checked');
            } else { checkboxes = document.querySelectorAll('.cb-bd:checked'); }

            if(checkboxes.length === 0) return alert('Silakan centang item / area yang ingin diganti PO-nya.');

            selectedForPO = []; let totalDus = 0;
            checkboxes.forEach(cb => {
                const qrs = JSON.parse(cb.dataset.qrs);
                selectedForPO.push({ 
                    id_sku: cb.dataset.idsku, qrcodes: qrs, jenis: cb.dataset.jenis, nama: cb.dataset.nama,
                    pjg: cb.dataset.pjg, grade: cb.dataset.grade, dus: cb.dataset.dus, shading: cb.dataset.shading,
                    area: cb.dataset.area, po: cb.dataset.po, ket: cb.dataset.ket
                });
                totalDus += qrs.length;
            });

            sourcePOContext = context;
            document.getElementById('input-new-po').value = '';
            
            const inputQty = document.getElementById('input-qty-ganti');
            inputQty.value = totalDus; inputQty.max = totalDus; 

            document.getElementById('modal-po').classList.remove('hidden');
            document.getElementById('overlay-klik-luar').classList.remove('hidden');
        }

        function tutupModalPO() { 
            document.getElementById('modal-po').classList.add('hidden'); 
            if(document.getElementById('modal-breakdown').classList.contains('hidden') && document.getElementById('modal-setting').classList.contains('hidden')) {
                document.getElementById('overlay-klik-luar').classList.add('hidden'); 
            }
        }

        async function eksekusiGantiPO() {
            const newPO = document.getElementById('input-new-po').value.trim().toUpperCase();
            if(!newPO) return alert("Silakan Pilih PO Baru!");

            const qtyDiminta = parseInt(document.getElementById('input-qty-ganti').value);
            if(isNaN(qtyDiminta) || qtyDiminta <= 0) return alert("Jumlah dus tidak valid!");

            let maxDus = selectedForPO.reduce((sum, row) => sum + row.qrcodes.length, 0);
            if(qtyDiminta > maxDus) return alert(`Maksimal jatah adalah ${maxDus} dus!`);

            const btn = document.getElementById('btn-simpan-po'); const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> MENYIMPAN...'; btn.disabled = true;

            try {
                let qtySisaUntukDiupdate = qtyDiminta; let payloadItems = [];
                for(let row of selectedForPO) {
                    if (qtySisaUntukDiupdate <= 0) break; 
                    let qrsUntukDiupdate = row.qrcodes.slice(0, qtySisaUntukDiupdate);
                    let jumlahBerubah = qrsUntukDiupdate.length; qtySisaUntukDiupdate -= jumlahBerubah;

                    let parts = row.id_sku.split('_'); parts[7] = newPO; let newIdSku = parts.join('_');
                    payloadItems.push({
                        new_id_sku: newIdSku, qrcodes: qrsUntukDiupdate, jenis_item: row.jenis, 
                        nama: row.nama, pjg: row.pjg, grade: row.grade, dus: row.dus,
                        shading: row.shading, area: row.area, po_lama: row.po, po_baru: newPO, ket: row.ket, qty_berubah: jumlahBerubah
                    });
                }
                const { error } = await db.rpc('eksekusi_ganti_po_aman', { payload: { items: payloadItems } });
                if(error) throw error;
                
                alert(`BERHASIL! PO Aktual berubah ke ${newPO}.`);
                tutupModalPO(); if(sourcePOContext === 'breakdown') tutupModalBreakdown();
                await muatDataStok();
            } catch (error) { alert("GAGAL UPDATE: " + error.message); } 
            finally { btn.innerHTML = ori; btn.disabled = false; lucide.createIcons(); }
        }

        function toggleSidebarFilter() { document.getElementById('sidebar-filter').classList.toggle('translate-x-full'); document.getElementById('overlay-klik-luar').classList.toggle('hidden'); }
        function resetFilter() { const ids = ['f-area','f-qr','f-jenis','f-nama','f-pjg','f-grade','f-dus','f-shading','f-po','f-ket']; ids.forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = ''; }); saringTabel(); toggleSidebarFilter(); }

        function saringTabel() {
            const f = { area: document.getElementById('f-area').value.toLowerCase(), qr: document.getElementById('f-qr') ? document.getElementById('f-qr').value.toLowerCase() : '', jenis: document.getElementById('f-jenis').value.toLowerCase(), nama: document.getElementById('f-nama').value.toLowerCase(), pjg: document.getElementById('f-pjg').value.toLowerCase(), grade: document.getElementById('f-grade').value.toLowerCase(), dus: document.getElementById('f-dus').value.toLowerCase(), shading: document.getElementById('f-shading').value.toLowerCase(), po: document.getElementById('f-po').value.toLowerCase(), ket: document.getElementById('f-ket').value.toLowerCase() };
            document.querySelectorAll('.row-ks').forEach(row => {
                let show = true;
                for(let key in f) {
                    if(f[key]) {
                        const cell = row.querySelector('.col-' + key);
                        if(cell && !cell.innerText.toLowerCase().includes(f[key])) { show = false; break; }
                    }
                }
                row.style.display = show ? '' : 'none';
            });
        }

        function salinData() {
            const cek = document.querySelectorAll('.cb-main:checked'); if(cek.length === 0) return alert("Pilih baris yang ingin disalin!");
            let copyString = "";
            const headers = Array.from(document.querySelectorAll('#thead-ks th')).filter(th => window.getComputedStyle(th).display !== 'none' && !th.classList.contains('col-cb') && !th.classList.contains('col-open')).map(th => th.innerText.trim().replace(/\n/g, ' '));
            copyString += headers.join('\t') + '\n';
            cek.forEach(cb => {
                const tr = cb.closest('tr'); const rowData = [];
                Array.from(tr.children).forEach(td => {
                    if(td.classList.contains('col-cb') || td.classList.contains('col-open')) return;
                    if(window.getComputedStyle(td).display !== 'none') { rowData.push(td.innerText.trim().replace(/\n/g, ' ')); }
                });
                copyString += rowData.join('\t') + '\n';
            });
            navigator.clipboard.writeText(copyString).then(() => alert(`Tersalin ${cek.length} baris!`));
        }

        function salinDataBreakdown() {
            const cek = document.querySelectorAll('.cb-bd:checked'); if(cek.length === 0) return alert("Centang detail Area!");
            let copyString = "Area\tPO Aktual\tKeterangan\tQTY\n";
            cek.forEach(cb => { const tr = cb.closest('tr'); copyString += `${tr.children[2].innerText}\t${tr.children[3].innerText}\t${tr.children[4].innerText}\t${tr.children[5].innerText}\n`; });
            navigator.clipboard.writeText(copyString).then(() => alert(`Tersalin!`));
        }

        function downloadXLS() {
            let csvContent = "data:text/csv;charset=utf-8,";
            const headers = Array.from(document.querySelectorAll('#thead-ks th')).filter(th => window.getComputedStyle(th).display !== 'none' && !th.classList.contains('col-cb') && !th.classList.contains('col-open')).map(th => th.innerText.trim());
            csvContent += headers.join(",") + "\n";
            document.querySelectorAll('.row-ks').forEach(tr => {
                if(tr.style.display !== 'none') {
                    const rowData = [];
                    Array.from(tr.children).forEach(td => {
                        if(td.classList.contains('col-cb') || td.classList.contains('col-open')) return;
                        if(window.getComputedStyle(td).display !== 'none') { rowData.push(`"${td.innerText.trim()}"`); }
                    });
                    csvContent += rowData.join(",") + "\n";
                }
            });
            const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `KartuStok_${modeKS.toUpperCase()}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
    </script>
