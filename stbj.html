<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - STBJ System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --bg-main: #f8fafc; --bg-box: #ffffff; --text-main: #1f2937; --border-color: #e2e8f0; }
        body[data-bg="dark"] { --bg-main: #0f172a; --bg-box: #1e293b; --text-main: #f8fafc; --border-color: #334155; }
        body[data-bg="grey"] { --bg-main: #e2e8f0; --bg-box: #f1f5f9; --text-main: #0f172a; --border-color: #cbd5e1; }
        body { background-color: var(--bg-main); color: var(--text-main); transition: background 0.3s ease; min-height: 100vh;}
        .card-dynamic { background-color: var(--bg-box); border-color: var(--border-color); }
        .input-dynamic { background-color: var(--bg-main); color: var(--text-main); border-color: var(--border-color); }
        .table-container { scrollbar-width: thin; }
        
        /* WARNA TABEL SESUAI GAMBAR */
        .hdr-black { background-color: #1e293b !important; color: white !important; }
        .hdr-green { background-color: #15803d !important; color: white !important; }
        .hdr-blue { background-color: #2563eb !important; color: white !important; }
        .hdr-orange { background-color: #f97316 !important; color: white !important; }
    </style>
</head>
<body id="app-body" class="font-sans">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-[60] hidden backdrop-blur-sm transition-all"></div>
    <div id="sidebar-menu" class="fixed top-0 left-0 h-full w-64 card-dynamic shadow-2xl z-[70] transform -translate-x-full transition-transform duration-300 flex flex-col border-r">
        <div class="p-5 border-b flex justify-between items-center bg-blue-50/50">
            <h2 class="font-black text-blue-700 text-lg flex items-center gap-2"><i data-lucide="layers" class="w-5 h-5"></i> WMS Menu</h2>
            <button onclick="toggleSidebar()" class="p-2 text-gray-500 hover:text-red-500 rounded-full bg-white shadow-sm cursor-pointer transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-2 overflow-y-auto flex-grow">
            <a href="menu.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
            <a href="stbj.html" class="flex items-center gap-3 p-3 rounded-xl bg-blue-600 text-white font-bold shadow-md"><i data-lucide="scan-barcode" class="w-5 h-5"></i> Scan STBJ</a>
            <a href="hasil_stbj.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="file-spreadsheet" class="w-5 h-5"></i> Laporan STBJ</a>
            <a href="data_control.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="settings-2" class="w-5 h-5"></i> Data Control</a>
        </div>
    </div>

    <nav class="card-dynamic shadow-sm px-4 py-3 flex items-center justify-between sticky top-0 z-40 border-b">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-full transition cursor-pointer active:scale-95 shadow-inner"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <button onclick="history.back()" class="p-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full transition cursor-pointer active:scale-95"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <div class="flex flex-col ml-1">
                <span class="font-extrabold text-lg tracking-wide leading-tight text-blue-700">PORTAL WMS</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative">
                <button id="btn-profile" class="w-10 h-10 bg-blue-600 font-bold rounded-full flex items-center justify-center text-white shadow-md border-2 border-blue-200 cursor-pointer" id="profile-initial">U</button>
                <div id="profile-menu" class="hidden absolute right-0 mt-2 w-48 card-dynamic rounded-xl shadow-xl py-2 z-50 border">
                    <div class="px-4 py-2 border-b border-gray-200/20 text-xs font-bold mb-1 opacity-70" id="user-role-display">Role: User</div>
                    <button onclick="localStorage.clear(); window.location.href='index.html'" class="w-full text-left px-4 py-2 hover:bg-red-500/10 text-red-600 font-bold text-sm flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="p-4 md:p-6 w-full max-w-[98%] mx-auto flex flex-col gap-4 pt-6">

        <div id="view-menu" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div onclick="switchView('scan')" class="card-dynamic p-6 rounded-xl shadow-sm border hover:shadow-md cursor-pointer flex items-center justify-center flex-col gap-3 active:scale-95 transition h-40">
                <div class="bg-blue-100 p-4 rounded-full"><i data-lucide="scan-line" class="w-10 h-10 text-blue-600"></i></div>
                <h3 class="font-black text-xl">SCAN STBJ BARU</h3>
            </div>
            <div onclick="switchView('import')" class="card-dynamic p-6 rounded-xl shadow-sm border hover:shadow-md cursor-pointer flex items-center justify-center flex-col gap-3 active:scale-95 transition h-40">
                <div class="bg-emerald-100 p-4 rounded-full"><i data-lucide="file-down" class="w-10 h-10 text-emerald-600"></i></div>
                <h3 class="font-black text-xl text-emerald-700">IMPORT CSV MASSAL</h3>
            </div>
        </div>

        <div id="view-scan" class="hidden space-y-4">
            <div class="card-dynamic p-5 rounded-xl shadow-sm border space-y-4 relative">
                <button onclick="undoDelete()" class="absolute top-4 right-4 px-4 py-2 bg-orange-100 text-orange-700 font-black rounded-lg border border-orange-200 hover:bg-orange-200 transition cursor-pointer text-xs flex items-center gap-2 shadow-sm active:scale-95">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> UNDO
                </button>
                
                <div class="flex flex-col gap-4 pt-2">
                    <div class="w-full md:w-1/2">
                        <label class="block text-xs font-bold uppercase mb-1 opacity-70">Pilih Troli</label>
                        <select id="select-troli" class="input-dynamic w-full p-3 border-2 rounded-lg font-bold outline-none border-blue-400 text-blue-600 cursor-pointer"></select>
                    </div>
                    <div class="w-full">
                        <label class="block text-xs font-bold uppercase mb-1 flex justify-between opacity-70">
                            <span>Input Text QR Code</span>
                            <span id="dup-notif" class="text-red-500 hidden animate-pulse bg-red-100 px-2 rounded">Duplikat Layar Dihapus!</span>
                        </label>
                        <form id="form-scan" class="flex gap-2">
                            <input type="text" id="input-qrcode" class="input-dynamic flex-1 p-3 border-2 rounded-lg outline-none focus:border-blue-500 font-bold" placeholder="Scan atau ketik (spasi untuk memisahkan)..." autocomplete="off">
                            <button type="submit" class="bg-blue-600 text-white px-8 rounded-lg font-bold shadow-md cursor-pointer"><i data-lucide="corner-down-left"></i></button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="card-dynamic rounded-xl shadow-md border overflow-hidden">
                <div class="table-container overflow-x-auto w-full max-h-[50vh]">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-stbj">
                        <thead class="sticky top-0 z-10">
                            <tr class="uppercase text-[11px] font-bold tracking-wider">
                                <th class="p-3 hdr-black w-10 text-center"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                                <th class="p-3 hdr-black w-12 text-center">No</th>
                                <th class="p-3 hdr-black">Troli</th>
                                <th class="p-3 hdr-black border-r border-gray-600">Text QRCode</th>
                                <th class="p-3 hdr-green">Tgl Produksi</th>
                                <th class="p-3 hdr-green">Mesin</th>
                                <th class="p-3 hdr-green">Shift</th>
                                <th class="p-3 hdr-blue">Jenis Item</th>
                                <th class="p-3 hdr-green">Nama Item</th>
                                <th class="p-3 hdr-green">Pjg</th>
                                <th class="p-3 hdr-green">Grade</th>
                                <th class="p-3 hdr-green">Dus</th>
                                <th class="p-3 hdr-green">Shading</th>
                                <th class="p-3 hdr-green">PO</th>
                                <th class="p-3 hdr-orange">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-stbj"></tbody>
                    </table>
                </div>
            </div>

            <div class="pt-2">
                <button id="btn-save" onclick="saveToSupabase()" class="w-full py-4 bg-blue-700 hover:bg-blue-800 text-white font-black rounded-xl shadow-lg flex items-center justify-center gap-2 text-lg uppercase tracking-wide cursor-pointer transition active:scale-95">
                    <i data-lucide="save" class="w-6 h-6"></i> SAVE DATA HASIL STBJ
                </button>
            </div>
        </div>

        <div id="view-import" class="hidden space-y-4">
            <div class="flex justify-between items-center mb-2 bg-emerald-50 p-4 rounded-xl border border-emerald-200">
                <h2 class="font-bold text-lg flex items-center gap-2 text-emerald-700"><i data-lucide="file-down"></i> Import Data Massal</h2>
                <button onclick="processImportToTable()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl font-bold shadow cursor-pointer hover:bg-emerald-700">Format ke Tabel Scan</button>
            </div>
            <div class="card-dynamic p-4 md:p-6 rounded-2xl border shadow-md">
                <div id="import-rows" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-[55vh] overflow-y-auto pr-2"></div>
            </div>
        </div>
    </main>

    <script src="stbj_logic.js"></script>
    <script>
        // Update Profil dan Navigasi
        const sessionData = JSON.parse(localStorage.getItem('user_session'));
        if(sessionData) {
            document.getElementById('user-role-display').innerText = "Role: " + sessionData.role;
            document.getElementById('profile-initial').innerText = sessionData.username.charAt(0).toUpperCase();
        }
        function toggleSidebar() {
            document.getElementById('sidebar-menu').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        const btnProfile = document.getElementById('btn-profile');
        const profileMenu = document.getElementById('profile-menu');
        btnProfile.addEventListener('click', (e) => { e.stopPropagation(); profileMenu.classList.toggle('hidden'); });
        window.addEventListener('click', (e) => { if (!btnProfile.contains(e.target) && !profileMenu.contains(e.target)) profileMenu.classList.add('hidden'); });
    </script>
</body>
</html>
