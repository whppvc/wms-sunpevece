<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stock Control - STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> .table-container { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; } </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <header class="bg-white shadow-sm px-4 py-3 flex items-center gap-3 sticky top-0 z-40">
        <button onclick="window.location.href='menu.html'" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-full transition"><i data-lucide="arrow-left" class="w-5 h-5 text-gray-700"></i></button>
        <h1 class="font-bold text-lg text-blue-700 uppercase tracking-wide">Menu STBJ</h1>
    </header>

    <main class="p-4 md:p-6 max-w-[95%] mx-auto">
        <div id="view-menu" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div onclick="bukaScanItem()" class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:shadow-md cursor-pointer flex items-center gap-4 transition active:scale-95">
                <div class="bg-blue-100 p-3 rounded-lg"><i data-lucide="scan-barcode" class="w-8 h-8 text-blue-600"></i></div>
                <div><h3 class="font-bold text-lg">Scan per item</h3><p class="text-xs text-gray-500">Scan per dus atau ketik qrcode</p></div>
            </div>
            <div class="bg-white p-5 rounded-xl opacity-50 cursor-not-allowed flex items-center gap-4">
                <div class="bg-gray-200 p-3 rounded-lg"><i data-lucide="file-down" class="w-8 h-8 text-gray-500"></i></div>
                <div><h3 class="font-bold text-lg">Import CSV</h3><p class="text-xs">Tahap Pengembangan</p></div>
            </div>
        </div>

        <div id="view-scan" class="hidden space-y-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-bold text-xl flex items-center gap-2"><i data-lucide="scan-barcode" class="w-6 h-6 text-blue-600"></i> Scan Per Item</h2>
                <button onclick="kembaliKeMenu()" class="text-sm font-bold text-gray-500 hover:text-gray-800 bg-gray-200 px-3 py-1 rounded-md">Kembali</button>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Pilih Troli</label>
                    <select id="select-troli" class="w-full p-3 border-2 border-blue-200 rounded-lg outline-none focus:border-blue-500 bg-blue-50 text-blue-800 font-bold text-sm">
                        <option value="">-- Memuat Data Master... --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1 flex justify-between">
                        <span>Input QR Code</span>
                        <span id="alert-dup" class="text-red-500 hidden animate-pulse bg-red-100 px-2 rounded">Duplikat dihapus otomatis!</span>
                    </label>
                    <form id="form-scan" class="flex gap-2">
                        <input type="text" id="input-qrcode" class="flex-1 p-3 border-2 border-gray-300 rounded-lg outline-none focus:border-blue-500 text-sm" placeholder="Scan kode..." autocomplete="off">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-5 rounded-lg font-bold shadow-md transition flex items-center gap-2"><i data-lucide="corner-down-left" class="w-5 h-5"></i></button>
                    </form>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden relative">
                <div class="table-container overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-stbj">
                        <thead>
                            <tr class="bg-slate-800 text-white uppercase text-xs font-bold" id="tr-header">
                                <th class="p-3 w-10 text-center"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                                <th class="p-3 w-12 text-center">No</th>
                                <th class="p-3">Troli</th>
                                <th class="p-3 border-r border-slate-600">Text QRCode</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-stbj"></tbody>
                    </table>
                </div>
                <div id="empty-state" class="p-8 text-center text-gray-400">
                    <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                    <p class="text-sm">Belum ada QR Code.</p>
                </div>
            </div>

            <div class="pt-2 pb-10">
                <button id="btn-terjemahkan" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 text-lg disabled:opacity-50" disabled>
                    <i data-lucide="cpu" class="w-6 h-6"></i> TERJEMAHKAN QR CODE
                </button>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // KONEKSI SUPABASE
        const SUPABASE_URL = 'https://mjpqzftwbyrbvbvmarol.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcHF6ZnR3YnlyYnZidm1hcm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA0MTgsImV4cCI6MjA5NDE1NjQxOH0.0VT56HA-cGB4CP3u89PShcddt9jARh85KKMgnwCkse4';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let masterData = { mesin: [], item: [], dus: [], po: [] };
        let kamusKaidah = []; // Akan diisi dari qr_rules
        let isTranslated = false;
        let rowCount = 0;

        const viewMenu = document.getElementById('view-menu'), viewScan = document.getElementById('view-scan');
        const inputQr = document.getElementById('input-qrcode'), selectTroli = document.getElementById('select-troli');
        const tbody = document.getElementById('tbody-stbj'), emptyState = document.getElementById('empty-state');
        const btnTerjemahkan = document.getElementById('btn-terjemahkan');

        window.onload = async () => {
            if (!localStorage.getItem('user_session')) { window.location.href = 'index.html'; return; }
            await loadData();
        };

        function bukaScanItem() { viewMenu.classList.add('hidden'); viewScan.classList.remove('hidden'); inputQr.focus(); }
        function kembaliKeMenu() { viewScan.classList.add('hidden'); viewMenu.classList.remove('hidden'); }

        async function loadData() {
            // Ambil Master
            const { data: mData } = await db.from('master_1').select('*');
            selectTroli.innerHTML = '<option value="">-- Pilih Troli --</option>';
            if(mData) {
                mData.forEach(row => {
                    if(row.nama_troli && !selectTroli.querySelector(`option[value="${row.nama_troli}"]`)) selectTroli.innerHTML += `<option value="${row.nama_troli}">${row.nama_troli}</option>`;
                    if(row.mesin && !masterData.mesin.includes(row.mesin)) masterData.mesin.push(row.mesin);
                    if(row.nama_item && !masterData.item.includes(row.nama_item)) masterData.item.push(row.nama_item);
                    if(row.dus && !masterData.dus.includes(row.dus)) masterData.dus.push(row.dus);
                    if(row.po && !masterData.po.includes(row.po)) masterData.po.push(row.po);
                });
            }
            // Ambil Kaidah QR (Kamus Singkatan)
            const { data: rData } = await db.from('qr_rules').select('*');
            if(rData) kamusKaidah = rData;
        }

        // FUNGSI INPUT BARCODE (DENGAN FILTER DUPLIKAT OTOMATIS)
        document.getElementById('form-scan').addEventListener('submit', (e) => {
            e.preventDefault();
            const rawInput = inputQr.value.trim();
            const troliDipilih = selectTroli.value;
            if(!troliDipilih) { alert("Pilih Nama Troli terlebih dahulu!"); inputQr.focus(); return; }
            if(!rawInput) return;

            // Membaca daftar QR yang sedang tertulis di tabel agar tidak ada ganda
            const existingQRs = Array.from(document.querySelectorAll('.qr-text')).map(el => el.innerText);
            
            const qrList = rawInput.split(/[\r\n;]+/).map(q => q.trim()).filter(q => q !== '');
            
            let adaDuplikat = false;
            qrList.forEach(qrCode => {
                if(existingQRs.includes(qrCode)) {
                    adaDuplikat = true; // Kode ini dibuang/diabaikan
                } else {
                    tambahkanBaris(troliDipilih, qrCode);
                    existingQRs.push(qrCode); // Masukkan ke memori filter agar copy-paste ganda dari excel juga disaring
                }
            });
            
            // Tampilkan Notifikasi jika ada yang dibuang
            if(adaDuplikat) {
                document.getElementById('alert-dup').classList.remove('hidden');
                setTimeout(() => document.getElementById('alert-dup').classList.add('hidden'), 2000);
            }
            
            inputQr.value = ''; inputQr.focus(); cekEmptyState();
        });

        // ------------------------------------------------------------------
        // REVERSE-ENGINEERING MENGGUNAKAN TABEL KAMUS
        // ------------------------------------------------------------------
        function buatKodeMesin(namaMesin) { try { let kata = namaMesin.split(' '); return kata[0].slice(-1) + parseInt(kata[1], 10); } catch(e) { return namaMesin; } }

        function buatKodeItem(namaItem) {
            let words = namaItem.toUpperCase().split(/\s+/);
            let res = "";
            for(let w of words) {
                // 1. Cek apakah ada di Kamus Kaidah QR
                let rule = kamusKaidah.find(r => r.kata_asli === w);
                if (rule) {
                    res += rule.kode;
                } 
                // 2. Jika angka murni, tulis angka
                else if(w.match(/^[0-9]+$/)) {
                    res += w;
                } 
                // 3. Sisanya, ambil huruf depannya saja
                else {
                    let hurufSaja = w.replace(/[^A-Z]/g, '');
                    if(hurufSaja.length > 0) res += hurufSaja.charAt(0);
                }
            }
            return res;
        }

        function jalankanPenerjemah(barcode) {
            const parts = barcode.split('/');
            let data = { tglProduksi: '-', mesin: '-', shift: '-', jenisItem: '-', namaItem: '-', pjg: '-', grade: '-', dus: '-', shading: '-', po: '-' };
            try {
                if (parts.length >= 4) {
                    let rawItemCode = parts[0]; 
                    data.namaItem = rawItemCode; 
                    for(let i=0; i<masterData.item.length; i++) {
                        if(buatKodeItem(masterData.item[i]) === rawItemCode) { data.namaItem = masterData.item[i]; break; }
                    }

                    data.shading = parts[1];

                    const p2 = parts[2];
                    if (p2.length > 0) {
                        const kodeJenis = p2.slice(-1);
                        if (kodeJenis === 'P') data.jenisItem = 'Plafon'; else if (kodeJenis === 'L') data.jenisItem = 'List'; else if (kodeJenis === 'W') data.jenisItem = 'WPC'; else data.jenisItem = kodeJenis;

                        const matchPjg = p2.match(/^\d+/);
                        if (matchPjg) {
                            let angkaPjg = matchPjg[0];
                            data.pjg = angkaPjg.length === 2 ? `${angkaPjg[0]}.${angkaPjg[1]}M` : `${angkaPjg}M`;
                            let startIndex = angkaPjg.length;
                            if (startIndex < p2.length - 1) {
                                let kodeGrade = p2.charAt(startIndex);
                                if (kodeGrade === 'B') data.grade = 'Bagus'; else if (kodeGrade === 'A') data.grade = 'A'; else data.grade = kodeGrade;
                                let rawDusCode = p2.substring(startIndex + 1, p2.length - 1);
                                data.dus = rawDusCode;
                                for(let i=0; i<masterData.dus.length; i++) { let expectedCode = masterData.dus[i].charAt(0).toUpperCase() + (i + 1); if(expectedCode === rawDusCode) { data.dus = masterData.dus[i]; break; } }
                            }
                        }
                    }

                    const p3 = parts[3];
                    if (p3.length >= 5) {
                        const dayOfYear = parseInt(p3.substring(0, 3)); const yearRev = p3.substring(3, 5); const realYear = parseInt('20' + yearRev.split('').reverse().join(''));
                        const dateObj = new Date(realYear, 0); dateObj.setDate(dayOfYear);
                        const dd = String(dateObj.getDate()).padStart(2, '0'); const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                        data.tglProduksi = `${dd}/${mm}/${dateObj.getFullYear()}`;

                        if (p3.length >= 8) {
                            let rawMesinCode = p3.substring(5, 7); data.mesin = rawMesinCode;
                            for(let i=0; i<masterData.mesin.length; i++) { if(buatKodeMesin(masterData.mesin[i]) === rawMesinCode) { data.mesin = masterData.mesin[i]; break; } }
                            data.shift = p3.substring(7, 8);
                            let rawPO = p3.substring(8); if(rawPO) { let poIndex = parseInt(rawPO) - 1; data.po = masterData.po[poIndex] || rawPO; }
                        }
                    }
                }
            } catch (err) {}
            return data;
        }

        // --- RENDER TABEL ---
        function _generateKolomTerjemahan(h) {
            return `
                <td class="p-3 text-gray-700">${h.tglProduksi}</td><td class="p-3 text-gray-700">${h.mesin}</td><td class="p-3 text-gray-700">${h.shift}</td>
                <td class="p-3 text-blue-700 font-bold bg-blue-50/50">${h.jenisItem}</td><td class="p-3 font-semibold">${h.namaItem}</td>
                <td class="p-3 text-gray-700 font-bold">${h.pjg}</td><td class="p-3 text-gray-700 font-bold">${h.grade}</td><td class="p-3 text-gray-700">${h.dus}</td>
                <td class="p-3 text-gray-700">${h.shading}</td><td class="p-3 text-gray-700 font-bold">${h.po}</td>
                <td class="p-2 min-w-[150px]"><input type="text" class="w-full p-2 border border-gray-300 rounded text-xs outline-none focus:border-blue-500 uppercase font-semibold text-gray-800 bg-white" oninput="this.value = this.value.toUpperCase()" placeholder="Ketik Ket..."></td>
            `;
        }

        function tambahkanBaris(troli, qrcode) {
            rowCount++; const tr = document.createElement('tr'); tr.className = "border-b border-gray-200 hover:bg-blue-50 transition"; tr.id = `row-${rowCount}`;
            let htmlString = `<td class="p-3 text-center"><button onclick="hapusBaris('row-${rowCount}')" class="text-red-500 hover:bg-red-200 p-1.5 rounded-md"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td><td class="p-3 text-center font-bold text-gray-500 row-number">${rowCount}</td><td class="p-3 font-semibold text-blue-700">${troli}</td><td class="p-3 font-mono text-gray-800 qr-text border-r border-slate-300">${qrcode}</td>`;
            if(isTranslated) htmlString += _generateKolomTerjemahan(jalankanPenerjemah(qrcode));
            tr.innerHTML = htmlString; tbody.prepend(tr); lucide.createIcons(); updateNomorUrut();
        }

        btnTerjemahkan.addEventListener('click', () => {
            if(isTranslated) return;
            const trHeader = document.getElementById('tr-header'); const newHeaders = ['Tgl Produksi', 'Mesin', 'Shift', 'Jenis Item', 'Nama Item', 'Pjg', 'Grade', 'Dus', 'Shading', 'PO', 'Keterangan'];
            newHeaders.forEach(headText => { const th = document.createElement('th'); th.className = headText === 'Jenis Item' ? "p-3 bg-blue-600 text-white whitespace-nowrap" : "p-3 bg-slate-700 text-white whitespace-nowrap border-l border-slate-600"; th.innerText = headText; trHeader.appendChild(th); });
            const rows = tbody.querySelectorAll('tr'); rows.forEach(tr => { const qrText = tr.querySelector('.qr-text').innerText; const hasil = jalankanPenerjemah(qrText); tr.insertAdjacentHTML('beforeend', _generateKolomTerjemahan(hasil)); });
            isTranslated = true; btnTerjemahkan.innerHTML = `<i data-lucide="check-circle" class="w-6 h-6"></i> TERJEMAHAN SELESAI`; btnTerjemahkan.classList.replace('bg-emerald-600', 'bg-slate-700'); btnTerjemahkan.disabled = true; lucide.createIcons();
        });

        window.hapusBaris = (rowId) => { document.getElementById(rowId).remove(); updateNomorUrut(); cekEmptyState(); inputQr.focus(); };
        function updateNomorUrut() { const rows = tbody.querySelectorAll('tr'); rowCount = rows.length; let counter = rowCount; rows.forEach(tr => { tr.querySelector('.row-number').innerText = counter; counter--; }); }
        function cekEmptyState() { if(tbody.children.length > 0) { emptyState.classList.add('hidden'); if(!isTranslated) btnTerjemahkan.disabled = false; } else { emptyState.classList.remove('hidden'); btnTerjemahkan.disabled = true; } }
    </script>
</body>
</html>
