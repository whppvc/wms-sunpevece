<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Scan STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans">
    <div class="w-full">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 relative mb-4">
            <label class="block text-xs font-bold uppercase tracking-wide mb-2 text-slate-600">Scan Fisik Kardus (STBJ)</label>
            <form id="form-scan" class="flex gap-3">
                <input type="text" id="input-qrcode" class="flex-1 p-3 border border-slate-300 rounded outline-none focus:border-slate-800 font-bold text-slate-800 text-lg bg-slate-50" placeholder="Arahkan scanner ke kardus..." autocomplete="off">
                <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-8 rounded font-bold shadow-sm cursor-pointer transition active:scale-95 flex items-center gap-2"><i data-lucide="corner-down-left"></i> ENTER</button>
            </form>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="overflow-x-auto w-full max-h-[50vh] hide-scrollbar">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-stbj">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-10"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std">QRCode Scanned</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-stbj" class="text-center text-slate-700">
                        <tr><td colspan="3" class="p-6 text-slate-400 font-bold">Silakan scan QR Code...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="pt-4">
            <button id="btn-save" onclick="saveSTBJ()" class="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl shadow-md flex items-center justify-center gap-2 text-base tracking-widest cursor-pointer transition active:scale-95 uppercase"><i data-lucide="save" class="w-5 h-5"></i> SIMPAN STBJ</button>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        let scannedQRs = [];

        document.addEventListener('DOMContentLoaded', () => { 
            initModernLayout({ id: 'stbj', title: 'SCAN STBJ', url: 'stbj.html' }); 
            
            // Jeda sejenak untuk memastikan form sudah dirender oleh global.js
            setTimeout(() => {
                const formScan = document.getElementById('form-scan');
                if(formScan) {
                    formScan.addEventListener('submit', (e) => {
                        e.preventDefault(); // <-- INI YANG MENCEGAH HALAMAN REFRESH SAAT ENTER
                        const inputEl = document.getElementById('input-qrcode');
                        const rawInput = inputEl.value.trim();
                        if(!rawInput) return;
                        
                        // Pecah jika scanner menembak banyak baris sekaligus
                        const codes = rawInput.split(/[\r\n; ]+/).map(q => q.trim()).filter(q => q);
                        codes.forEach(code => {
                            if(!scannedQRs.includes(code)) {
                                scannedQRs.push(code);
                            }
                        });
                        
                        renderSTBJTable();
                        inputEl.value = '';
                        inputEl.focus();
                    });
                }
            }, 300);
        });

        function renderSTBJTable() {
            const tbody = document.getElementById('tbody-stbj');
            if(scannedQRs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-6 text-slate-400 font-bold">Silakan scan QR Code...</td></tr>';
                lucide.createIcons();
                return;
            }
            
            let html = '';
            // Render dari bawah ke atas agar scan terbaru muncul di atas
            scannedQRs.slice().reverse().forEach((qr, index) => {
                const actualIndex = scannedQRs.length - index;
                html += `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 transition">
                        <td class="p-3 text-center border-r border-slate-200"><button onclick="deleteSTBJ('${qr}')" class="text-red-500 hover:text-red-700 cursor-pointer"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></button></td>
                        <td class="p-3 font-bold text-center border-r border-slate-200">${actualIndex}</td>
                        <td class="p-3 font-mono font-bold text-slate-900 bg-slate-50 tracking-wider">${qr}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            lucide.createIcons();
        }

        function deleteSTBJ(qrCode) {
            scannedQRs = scannedQRs.filter(q => q !== qrCode);
            renderSTBJTable();
        }

        async function saveSTBJ() {
            if(scannedQRs.length === 0) return alert('Belum ada QR Code yang di-scan!');
            
            const btn = document.getElementById('btn-save');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> MENYIMPAN KE DATABASE...';
            btn.disabled = true;

            const user = JSON.parse(localStorage.getItem('user_session')) || {username: 'Admin'};
            const payload = scannedQRs.map(qr => ({
                qrcode: qr,
                pic_input: user.username
            }));

            try {
                // Upsert data ke tabel hasil_stbj
                const { error } = await db.from('hasil_stbj').upsert(payload, { onConflict: 'qrcode' });
                if(error) throw error;
                
                alert(`BERHASIL!\n${scannedQRs.length} data QR Code STBJ telah tersimpan ke sistem.`);
                scannedQRs = []; // Kosongkan array setelah sukses
                renderSTBJTable();
            } catch (err) {
                alert('GAGAL MENYIMPAN: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
