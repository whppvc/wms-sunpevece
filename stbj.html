<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Scan STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; border: 1px solid #334155; padding: 0.75rem; text-transform: uppercase; font-size: 11px; font-weight: 900; white-space: nowrap; }
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
    </style>
    <style id="dynamic-col-styles"></style>
</head>
<body class="font-sans bg-slate-50 overflow-x-hidden text-slate-800 pb-28">

    <div class="w-full px-2 sm:px-4 pt-4 relative">
        
        <div class="flex border-b border-slate-200 mb-3 bg-white rounded-t-xl shadow-sm overflow-x-auto hide-scrollbar">
            <button onclick="switchTab('scan')" id="btn-tab-scan" class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs"><i data-lucide="barcode" class="w-4 h-4"></i> SCAN ITEM PER DUS</button>
            <button onclick="switchTab('csv')" id="btn-tab-csv" class="px-6 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> IMPORT CSV</button>
        </div>

        <div class="bg-white p-3 sm:p-5 rounded-b-xl rounded-tr-xl shadow-sm border border-slate-200 mb-3">
            
            <div class="grid grid-cols-1 md:grid-cols-12 gap-2 sm:gap-4 items-end mb-4 border-b border-slate-100 pb-4">
                <div class="md:col-span-3">
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Pilih Troli</label>
                    <select id="select-troli" class="w-full p-2 sm:p-2.5 border-2 border-slate-200 rounded-lg font-bold outline-none focus:border-blue-600 text-slate-800 cursor-pointer bg-slate-50 text-sm">
                        <option value="">-- Memuat Troli... --</option>
                    </select>
                </div>

                <div id="view-scan" class="md:col-span-9">
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Scan Fisik Kardus</label>
                    <form id="form-scan" class="flex gap-2">
                        <div class="relative flex-1">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="scan-line" class="w-5 h-5 text-slate-400"></i></div>
                            <input type="text" id="input-qrcode" class="w-full pl-10 p-2 sm:p-2.5 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-600 font-black text-slate-800 text-sm sm:text-base bg-slate-50 placeholder-slate-400 transition" placeholder="Arahkan scanner..." autocomplete="off">
                        </div>
                        <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-white px-4 sm:px-6 py-2 sm:py-2.5 rounded-lg font-black shadow-sm cursor-pointer transition active:scale-95 flex items-center justify-center gap-2 border-b-2 border-blue-900 text-xs sm:text-sm uppercase"><i data-lucide="plus-square" class="w-4 h-4"></i> <span class="hidden sm:inline">ADD</span></button>
                    </form>
                </div>

                <div id="view-csv" class="md:col-span-9 hidden">
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Upload File CSV</label>
                    <div class="flex gap-2">
                        <input type="file" id="input-csv" accept=".csv" class="flex-1 p-1.5 border-2 border-slate-200 rounded-lg outline-none text-sm font-bold text-slate-700 bg-slate-50 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-[11px] file:font-black file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 transition cursor-pointer">
                        <button onclick="prosesCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 sm:px-6 py-2 rounded-lg font-black shadow-sm cursor-pointer transition active:scale-95 flex items-center justify-center gap-2 border-b-2 border-emerald-800 text-xs sm:text-sm uppercase"><i data-lucide="upload-cloud" class="w-4 h-4"></i> <span class="hidden sm:inline">PROSES</span></button>
                    </div>
                </div>
            </div>

            <div class="flex flex-row justify-between gap-2 items-center">
                
                <div class="flex gap-1.5">
                    <button onclick="toggleSidebarFilter()" class="p-2 sm:px-3 sm:py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded shadow-sm text-xs flex items-center justify-center gap-1.5 transition uppercase" title="Filter"><i data-lucide="filter" class="w-4 h-4"></i> <span class="hidden sm:inline">Filter</span></button>
                    
                    <div class="relative">
                        <button onclick="document.getElementById('dropdown-kolom').classList.toggle('hidden')" class="p-2 sm:px-3 sm:py-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-bold rounded shadow-sm text-xs flex items-center justify-center gap-1.5 transition uppercase" title="Kolom"><i data-lucide="eye-off" class="w-4 h-4"></i> <span class="hidden sm:inline">Kolom</span></button>
                        <div id="dropdown-kolom" class="hidden absolute top-full left-0 mt-2 w-56 bg-white border border-slate-200 shadow-xl rounded-xl p-3 z-40">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-2">
                                <span class="text-[11px] font-black text-slate-500 uppercase">Sembunyikan Kolom</span>
                                <button onclick="resetKolom()" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200">RESET</button>
                            </div>
                            <div class="flex flex-col gap-2 max-h-64 overflow-y-auto" id="list-kolom-toggles"></div>
                        </div>
                    </div>
                    
                    <button onclick="undoHapusSTBJ()" class="p-2 sm:px-3 sm:py-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 font-bold rounded shadow-sm text-xs flex items-center justify-center gap-1.5 transition uppercase" title="Undo"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> <span class="hidden sm:inline">Undo</span></button>
                    <button onclick="hapusBarisTerpilih()" class="p-2 sm:px-3 sm:py-2 bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 font-bold rounded shadow-sm text-xs flex items-center justify-center gap-1.5 transition uppercase" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i> <span class="hidden sm:inline">Hapus</span></button>
                </div>

                <div class="flex gap-1.5">
                    <button onclick="holdManual()" class="p-2 sm:px-4 sm:py-2 bg-amber-100 hover:bg-amber-200 text-amber-800 border border-amber-300 font-black rounded-lg shadow-sm text-[10px] sm:text-xs flex items-center justify-center gap-1.5 transition uppercase whitespace-nowrap"><i data-lucide="pause-circle" class="w-4 h-4"></i> <span class="hidden sm:inline">Hold</span></button>
                    <button onclick="cekGudangSTBJ()" id="btn-cek-gudang" class="px-3 py-2 sm:px-5 sm:py-2 bg-slate-900 text-white font-black rounded-lg shadow-sm hover:bg-black border-b-2 border-slate-950 transition text-[10px] sm:text-xs flex items-center justify-center gap-1.5 uppercase whitespace-nowrap"><i data-lucide="search-check" class="w-4 h-4"></i> Validasi <span class="hidden sm:inline">Duplikat</span></button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="table-container overflow-x-auto w-full max-h-[60vh]">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-stbj">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-10 col-cb"><input type="checkbox" onchange="toggleAll(this.checked)" class="cursor-pointer"></th>
                            <th class="hdr-std w-12 col-no">No</th>
                            <th class="hdr-std border-r border-slate-500 col-status">Status</th>
                            <th class="hdr-std col-troli text-amber-300">Troli</th>
                            <th class="hdr-std border-r border-slate-500 col-qr">Text QRCode</th>
                            <th class="hdr-std col-tgl">Tgl Produksi</th>
                            <th class="hdr-std col-mesin">Mesin</th>
                            <th class="hdr-std border-r border-slate-500 col-shift">Shift</th>
                            <th class="hdr-std text-blue-300 col-jenis">Jenis Item</th>
                            <th class="hdr-std col-nama">Nama Item</th>
                            <th class="hdr-std col-pjg">Pjg</th>
                            <th class="hdr-std col-grade">Grade</th>
                            <th class="hdr-std col-dus">Dus</th>
                            <th class="hdr-std border-r border-slate-500 col-shading">Shading</th>
                            <th class="hdr-std col-po">PO Awal</th>
                            <th class="hdr-std col-ket">Keterangan</th>
                            <th class="hdr-std col-pic">PIC Input</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-stbj" class="text-center text-slate-700">
                        <tr><td colspan="17" class="p-10 text-slate-400 font-bold"><i data-lucide="box" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data di-scan / di-import.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
        <div class="w-full px-2 sm:px-4 flex justify-center md:justify-end">
            <button id="btn-save" onclick="saveToDatabaseSTBJ()" class="w-full md:w-auto px-8 py-2.5 sm:py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-md flex items-center justify-center gap-2 text-sm tracking-wide cursor-pointer transition active:scale-95 uppercase border-b-2 border-emerald-800">
                <i data-lucide="save" class="w-5 h-5"></i> 
                <span>SIMPAN KE GUDANG</span>
                <span class="hidden sm:inline font-semibold text-[10px] ml-2 bg-emerald-800 px-2 py-1 rounded-md opacity-90">(Unique = Hasil, Duplikat = Hold)</span>
            </button>
        </div>
    </div>

    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4"></i> Filter Tabel</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 flex flex-col gap-3 overflow-y-auto">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status</label><input type="text" id="fs-status" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli</label><input type="text" id="fs-troli" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="fs-qr" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="text" id="fs-tgl" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label><input type="text" id="fs-mesin" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label><input type="text" id="fs-shift" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><input type="text" id="fs-jenis" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label><input type="text" id="fs-nama" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><input type="text" id="fs-pjg" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><input type="text" id="fs-grade" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><input type="text" id="fs-dus" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="fs-shading" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PO</label><input type="text" id="fs-po" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="fs-ket" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            </div>
            <button onclick="resetFilterSTBJ()" class="mt-2 py-2.5 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-lg text-xs uppercase transition border border-slate-300">RESET FILTER</button>
        </div>
    </div>

    <div id="overlay-klik-luar" onclick="tutupPopups()" class="hidden fixed inset-0 z-30"></div>

    <script src="global.js"></script>
    <script>
        let currentTab = 'scan';
        let dataStbj = []; 
        let deletedStbjStack = []; 
        let masterKamus = [];
        let globalRowId = 0;
        let hiddenCols = [];
        const currentUser = JSON.parse(localStorage.getItem('user_session')) || {username: 'Admin'};

        const colDefinitions = [
            { id: 'col-cb', label: 'Checkbox', default: true },
            { id: 'col-no', label: 'Nomor Urut', default: true },
            { id: 'col-status', label: 'Status Hold', default: true },
            { id: 'col-troli', label: 'Troli', default: true },
            { id: 'col-qr', label: 'QRCode', default: true },
            { id: 'col-tgl', label: 'Tgl Produksi', default: true },
            { id: 'col-mesin', label: 'Mesin', default: true },
            { id: 'col-shift', label: 'Shift', default: true },
            { id: 'col-jenis', label: 'Jenis Item', default: true },
            { id: 'col-nama', label: 'Nama Item', default: true },
            { id: 'col-pjg', label: 'Pjg', default: true },
            { id: 'col-grade', label: 'Grade', default: true },
            { id: 'col-dus', label: 'Dus', default: true },
            { id: 'col-shading', label: 'Shading', default: true },
            { id: 'col-po', label: 'PO Awal', default: true },
            { id: 'col-ket', label: 'Keterangan', default: true },
            { id: 'col-pic', label: 'PIC Input', default: true }
        ];

        document.addEventListener('DOMContentLoaded', async () => { 
            initModernLayout({ id: 'stbj', title: 'SCAN STBJ', url: 'stbj.html' }); 
            buatDropdownKolom();
            await loadInitialSTBJData();
        });

        function buatDropdownKolom() {
            const container = document.getElementById('list-kolom-toggles');
            let html = '';
            colDefinitions.forEach(col => {
                html += `
                    <label class="flex items-center gap-2 cursor-pointer p-1.5 hover:bg-slate-50 rounded">
                        <input type="checkbox" checked onchange="toggleKolom('${col.id}', this.checked)" class="w-4 h-4 cursor-pointer text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        <span class="text-xs font-bold text-slate-700">${col.label}</span>
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        function toggleKolom(colId, isVisible) {
            if(isVisible) { hiddenCols = hiddenCols.filter(id => id !== colId); } 
            else { if(!hiddenCols.includes(colId)) hiddenCols.push(colId); }
            terapkanStyleKolom();
        }

        function resetKolom() {
            hiddenCols = [];
            document.querySelectorAll('#list-kolom-toggles input[type="checkbox"]').forEach(cb => cb.checked = true);
            terapkanStyleKolom();
        }

        function terapkanStyleKolom() {
            const cssString = hiddenCols.map(id => `.${id} { display: none !important; }`).join('\n');
            document.getElementById('dynamic-col-styles').innerHTML = cssString;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('view-scan').classList.toggle('hidden', tab !== 'scan');
            document.getElementById('view-csv').classList.toggle('hidden', tab !== 'csv');
            document.getElementById('btn-tab-scan').className = tab === 'scan' ? 'px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs' : 'px-6 py-3.5 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-xs';
            document.getElementById('btn-tab-csv').className = tab === 'csv' ? 'px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs' : 'px-6 py-3.5 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-xs';
        }

        async function loadInitialSTBJData() {
            try {
                const { data: mData1 } = await db.from('master_1').select('nama_troli').order('id', { ascending: true });
                if(mData1) {
                    const trolis = [...new Set(mData1.map(r => r.nama_troli).filter(x => x))];
                    const sel = document.getElementById('select-troli');
                    sel.innerHTML = '<option value="">-- Pilih Troli --</option>';
                    trolis.forEach(t => sel.innerHTML += `<option value="${t}">${t}</option>`);
                }
                const { data: mData2 } = await db.from('master_2').select('*');
                if(mData2) masterKamus = mData2;
            } catch (err) { console.error("Gagal muat referensi:", err); }
        }

        function translateBarcode(barcode) {
            let td = { tglProduksi: '-', mesin: '-', shift: '-', jenisItem: '-', namaItem: '-', panjang: '-', grade: '-', dus: '-', shading: '-', po: '-' };
            const parts = barcode.split('/'); if (parts.length < 4) return td;
            
            const hurufDepan = barcode.charAt(0).toUpperCase();
            if (hurufDepan === 'P') td.jenisItem = 'Plafon'; else if (hurufDepan === 'L') td.jenisItem = 'List'; else if (hurufDepan === 'W') td.jenisItem = 'WPC'; else td.jenisItem = hurufDepan;

            let rawItem = parts[0]; let cariItem = masterKamus.find(m => m.kode_nama_item === rawItem); 
            td.namaItem = cariItem && cariItem.nama_item ? cariItem.nama_item : rawItem; td.shading = parts[1];
            
            const p2 = parts[2];
            if (p2 && p2.length >= 4) {
                let digitPjg = (p2.length === 5) ? 2 : 1; let rawPjg = p2.substring(0, digitPjg);
                td.panjang = (digitPjg === 1) ? rawPjg + "M" : rawPjg[0] + "." + rawPjg[1] + "M"; 
                let rawGrade = p2.substring(digitPjg, digitPjg + 1); td.grade = rawGrade === '1' ? 'BAGUS' : (rawGrade === '2' ? 'A' : rawGrade);
                let rawDus = p2.substring(p2.length - 2); let cariDus = masterKamus.find(m => m.kode_dus === rawDus); td.dus = cariDus && cariDus.dus ? cariDus.dus : rawDus;
            }
            const p3 = parts[3];
            if (p3.length >= 5) {
                const dayOfYear = parseInt(p3.substring(0, 3)); const realYear = parseInt('20' + p3.substring(3, 5).split('').reverse().join(''));
                const dateObj = new Date(realYear, 0); dateObj.setDate(dayOfYear);
                td.tglProduksi = `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
                let sisaString = p3.substring(5); let match = sisaString.match(/(C.*?)(S.*?)(P.*)/);
                if (match) {
                    let cariMesin = masterKamus.find(m => m.kode_mesin === match[1]); td.mesin = cariMesin && cariMesin.mesin ? cariMesin.mesin : match[1];
                    let cariShift = masterKamus.find(m => m.kode_shift === match[2]); td.shift = cariShift && cariShift.shift ? cariShift.shift : match[2];
                    let cariPO = masterKamus.find(m => m.kode_po === match[3]); td.po = cariPO && cariPO.po ? cariPO.po : match[3];
                }
            }
            return td;
        }

        document.getElementById('form-scan').addEventListener('submit', (e) => {
            e.preventDefault();
            const troli = document.getElementById('select-troli').value;
            const inputEl = document.getElementById('input-qrcode');
            const rawInput = inputEl.value.trim();
            if(!troli) return alert("Pilih Troli terlebih dahulu!");
            if(!rawInput) return;

            const codes = rawInput.split(/[\r\n; ]+/).map(q => q.trim()).filter(q => q);
            codes.forEach(code => {
                const isLocalDuplicate = dataStbj.some(d => d.qrcode === code);
                const trans = translateBarcode(code);
                
                dataStbj.unshift({ 
                    id: ++globalRowId, 
                    qrcode: code, 
                    troli: troli, 
                    status: 'BELUM CEK', 
                    keterangan: isLocalDuplicate ? 'DUPLIKAT SCAN' : '', 
                    pic: currentUser.username, 
                    isLocalDuplicate: isLocalDuplicate,
                    ...trans 
                });
            });
            renderTable();
            inputEl.value = ''; inputEl.focus();
        });

        function prosesCSV() {
            const troli = document.getElementById('select-troli').value;
            const fileInput = document.getElementById('input-csv');
            if(!troli) return alert("Pilih Troli terlebih dahulu!");
            if(!fileInput.files.length) return alert("Pilih file CSV!");

            Papa.parse(fileInput.files[0], {
                header: false, skipEmptyLines: true,
                complete: function(results) {
                    let added = 0;
                    results.data.forEach(row => {
                        const code = row[0] ? row[0].trim() : '';
                        if(code) {
                            const isLocalDuplicate = dataStbj.some(d => d.qrcode === code);
                            const trans = translateBarcode(code);
                            
                            dataStbj.push({ 
                                id: ++globalRowId, 
                                qrcode: code, 
                                troli: troli, 
                                status: 'BELUM CEK', 
                                keterangan: isLocalDuplicate ? 'DUPLIKAT SCAN (CSV)' : 'Dari CSV', 
                                pic: currentUser.username, 
                                isLocalDuplicate: isLocalDuplicate, 
                                ...trans 
                            });
                            added++;
                        }
                    });
                    alert(`${added} QR Code dari CSV berhasil dimuat ke tabel.`); renderTable(); fileInput.value = '';
                }
            });
        }

        function toggleAll(checked) { document.querySelectorAll('.row-cb').forEach(cb => cb.checked = checked); }
        function getCheckedIds() {
            const ids = []; document.querySelectorAll('.row-cb:checked').forEach(cb => ids.push(parseInt(cb.value))); return ids;
        }

        function hapusBarisTerpilih() {
            const ids = getCheckedIds(); if(ids.length === 0) return alert("Centang baris yang ingin dihapus!");
            const removed = dataStbj.filter(d => ids.includes(d.id));
            deletedStbjStack.push(removed);
            dataStbj = dataStbj.filter(d => !ids.includes(d.id)); 
            renderTable(); document.querySelector('input[onchange="toggleAll(this.checked)"]').checked = false;
        }

        function undoHapusSTBJ() {
            if(deletedStbjStack.length === 0) return alert("Tidak ada histori penghapusan yang dapat di-undo.");
            const last = deletedStbjStack.pop();
            dataStbj = [...last, ...dataStbj];
            renderTable();
        }

        function holdManual() {
            const ids = getCheckedIds(); if(ids.length === 0) return alert("Centang baris yang ingin di-HOLD manual!");
            dataStbj.forEach(d => { if(ids.includes(d.id)) d.status = 'HOLD'; });
            renderTable(); document.querySelector('input[onchange="toggleAll(this.checked)"]').checked = false;
        }

        function toggleSidebarFilter() {
            document.getElementById('sidebar-filter').classList.toggle('translate-x-full');
            document.getElementById('overlay-klik-luar').classList.toggle('hidden');
        }

        function tutupPopups() {
            document.getElementById('sidebar-filter').classList.add('translate-x-full');
            document.getElementById('dropdown-kolom').classList.add('hidden');
            document.getElementById('overlay-klik-luar').classList.add('hidden');
        }

        function resetFilterSTBJ() {
            const ids = ['fs-status','fs-troli','fs-qr','fs-tgl','fs-mesin','fs-shift','fs-jenis','fs-nama','fs-pjg','fs-grade','fs-dus','fs-shading','fs-po','fs-ket','fs-pic'];
            ids.forEach(id => document.getElementById(id).value = '');
            saringTabelSTBJ(); toggleSidebarFilter();
        }

        function saringTabelSTBJ() {
            const f = {
                status: document.getElementById('fs-status').value.toLowerCase(),
                troli: document.getElementById('fs-troli').value.toLowerCase(),
                qr: document.getElementById('fs-qr').value.toLowerCase(),
                tgl: document.getElementById('fs-tgl').value.toLowerCase(),
                mesin: document.getElementById('fs-mesin').value.toLowerCase(),
                shift: document.getElementById('fs-shift').value.toLowerCase(),
                jenis: document.getElementById('fs-jenis').value.toLowerCase(),
                nama: document.getElementById('fs-nama').value.toLowerCase(),
                pjg: document.getElementById('fs-pjg').value.toLowerCase(),
                grade: document.getElementById('fs-grade').value.toLowerCase(),
                dus: document.getElementById('fs-dus').value.toLowerCase(),
                shading: document.getElementById('fs-shading').value.toLowerCase(),
                po: document.getElementById('fs-po').value.toLowerCase(),
                ket: document.getElementById('fs-ket').value.toLowerCase(),
                pic: document.getElementById('fs-pic').value.toLowerCase()
            };

            document.querySelectorAll('.row-stbj').forEach(row => {
                let show = true;
                for(let key in f) {
                    if(f[key]) {
                        const cell = row.querySelector('.col-' + key);
                        if(cell && !cell.innerText.toLowerCase().includes(f[key])) { show = false; break; }
                    }
                }
                row.style.display = show ? '' : 'none';
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tbody-stbj');
            if(dataStbj.length === 0) return tbody.innerHTML = '<tr><td colspan="17" class="p-10 text-slate-400 font-bold"><i data-lucide="box" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data di-scan / di-import.</td></tr>';
            
            let html = '';
            dataStbj.forEach((d, index) => {
                let badgeClass = "bg-slate-200 text-slate-700";
                let displayStatus = d.status;

                if(d.status === 'UNIQUE') badgeClass = "bg-emerald-500 text-white";
                if(d.status === 'DUPLIKAT') badgeClass = "bg-red-600 text-white";
                if(d.status === 'HOLD') badgeClass = "bg-amber-500 text-white";

                if(d.status === 'BELUM CEK' && d.isLocalDuplicate) {
                    badgeClass = "bg-red-600 text-white";
                    displayStatus = "DUPLIKAT SCAN";
                }

                const isRedHighlight = d.status === 'DUPLIKAT' || d.isLocalDuplicate;
                const trBaseClass = isRedHighlight ? 'bg-red-50 hover:bg-red-100 text-red-900' : (d.status === 'HOLD' ? 'bg-amber-50 hover:bg-amber-100 text-amber-900' : 'hover:bg-slate-50 text-slate-700');

                html += `
                    <tr class="border-b border-slate-200 transition ${trBaseClass} row-stbj">
                        <td class="p-3 text-center col-cb"><input type="checkbox" value="${d.id}" class="row-cb cursor-pointer w-4 h-4 text-blue-600 rounded"></td>
                        <td class="p-3 font-bold col-no">${index + 1}</td>
                        <td class="p-3 font-black text-[10px] border-r border-slate-200 col-status"><span class="px-2 py-1 rounded shadow-sm border border-black/10 ${badgeClass}">${displayStatus}</span></td>
                        <td class="p-3 font-bold ${isRedHighlight ? 'text-red-900' : 'text-slate-700'} col-troli">${d.troli}</td>
                        <td class="p-3 font-mono font-bold border-r border-slate-200 tracking-wider col-qr">${d.qrcode}</td>
                        <td class="p-3 font-bold col-tgl">${d.tglProduksi}</td>
                        <td class="p-3 font-bold col-mesin">${d.mesin}</td>
                        <td class="p-3 font-bold border-r border-slate-200 col-shift">${d.shift}</td>
                        <td class="p-3 font-black ${isRedHighlight ? 'text-red-700' : 'text-blue-700'} col-jenis">${d.jenisItem}</td>
                        <td class="p-3 font-bold text-left col-nama">${d.namaItem}</td>
                        <td class="p-3 font-bold col-pjg">${d.panjang}</td>
                        <td class="p-3 font-bold col-grade">${d.grade}</td>
                        <td class="p-3 font-bold col-dus">${d.dus}</td>
                        <td class="p-3 font-bold border-r border-slate-200 col-shading">${d.shading}</td>
                        <td class="p-3 font-black ${isRedHighlight ? 'text-red-700' : 'text-orange-600'} col-po">${d.po}</td>
                        <td class="p-2 col-ket"><input type="text" onchange="updateKet(${d.id}, this.value)" value="${d.keterangan}" class="w-full p-2 text-xs border border-slate-300 rounded outline-none focus:border-blue-500 bg-white/50 ${isRedHighlight ? 'placeholder-red-400' : ''}" placeholder="Keterangan..."></td>
                        <td class="p-3 font-bold uppercase text-[10px] opacity-70 col-pic">${d.pic}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html; lucide.createIcons(); saringTabelSTBJ();
        }

        function updateKet(id, val) { const item = dataStbj.find(d => d.id === id); if(item) item.keterangan = val; }

        async function cekGudangSTBJ() {
            if(dataStbj.length === 0) return alert("Belum ada data.");
            const btn = document.getElementById('btn-cek-gudang'); const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> MENCEK DB...'; btn.disabled = true;

            const allQRs = dataStbj.map(d => d.qrcode);
            try {
                const { data, error } = await db.from('hasil_stbj').select('qrcode').in('qrcode', allQRs);
                if(error) throw error;
                
                const existingQRs = data.map(d => d.qrcode);
                dataStbj.forEach(d => {
                    if(d.status === 'HOLD') return; 
                    if(existingQRs.includes(d.qrcode) || d.isLocalDuplicate) { d.status = 'DUPLIKAT'; } 
                    else { d.status = 'UNIQUE'; }
                });
                renderTable();
                alert("Validasi Selesai!\nData telah dicocokkan dengan Database STBJ.");
            } catch (err) { alert("Gagal cek database: " + err.message); }
            finally { btn.innerHTML = ori; btn.disabled = false; lucide.createIcons(); }
        }

        async function saveToDatabaseSTBJ() {
            if(dataStbj.length === 0) return alert('Data kosong!');
            const blmCek = dataStbj.filter(d => d.status === 'BELUM CEK');
            if(blmCek.length > 0) return alert('Tekan tombol VALIDASI DUPLIKAT terlebih dahulu sebelum menyimpan!');

            const btn = document.getElementById('btn-save'); const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> MEMPROSES...'; btn.disabled = true;

            const uniques = dataStbj.filter(d => d.status === 'UNIQUE');
            const dupes = dataStbj.filter(d => d.status === 'DUPLIKAT' || d.status === 'HOLD');

            try {
                if(uniques.length > 0) {
                    const payloadHasil = uniques.map(d => ({ qrcode: d.qrcode, troli: d.troli, pic_input: d.pic, keterangan: d.keterangan }));
                    const { error: err1 } = await db.from('hasil_stbj').insert(payloadHasil);
                    if(err1) throw err1;
                }
                
                if(dupes.length > 0) {
                    const payloadHold = dupes.map(d => ({ qrcode: d.qrcode, troli: d.troli, pic_input: d.pic, keterangan: d.keterangan, status: d.status }));
                    const { error: err2 } = await db.from('hold_stbj').insert(payloadHold);
                    if(err2) throw err2;
                }

                alert(`BERHASIL DISIMPAN!\n- ${uniques.length} Barang Unique masuk ke Hasil STBJ\n- ${dupes.length} Barang Hold/Duplikat masuk ke Hold STBJ`);
                dataStbj = []; renderTable();
                document.querySelector('input[onchange="toggleAll(this.checked)"]').checked = false;
            } catch (err) { alert('GAGAL MENYIMPAN: ' + err.message); } 
            finally { btn.innerHTML = ori; btn.disabled = false; lucide.createIcons(); }
        }
    </script>
</body>
</html>
