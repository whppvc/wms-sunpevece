<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Scan STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .hdr-std { 
            background-color: #f8fafc !important; 
            color: #64748b !important; 
            text-align: center !important; 
            padding: 0.75rem 1rem !important; 
            font-size: 0.75rem !important; 
            font-weight: 600 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.05em !important; 
            white-space: nowrap !important; 
            position: sticky !important; 
            top: 0 !important; 
            z-index: 20 !important; 
            border-bottom: 1px solid #e2e8f0 !important; 
        }
        
        tr.selected-row { background-color: #f0f9ff !important; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; border-bottom: 2px solid transparent; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">

            <div class="flex px-6 pt-2 gap-6 overflow-x-auto hide-scrollbar">
                <button onclick="switchTab('scan')" id="btn-tab-scan" class="pb-3 tab-active transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="barcode" class="w-4 h-4"></i> Scan Item Per Dus</button>
                <button onclick="switchTab('csv')" id="btn-tab-csv" class="pb-3 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Import CSV</button>
            </div>

            <div class="p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-50/50 border-t border-slate-100">
                <div class="flex items-center gap-3 shrink-0 w-full sm:w-auto">
                    <label class="text-xs font-semibold text-slate-500">Pilih Troli:</label>
                    <select id="select-troli" class="py-1.5 px-3 bg-white border border-slate-300 rounded-md font-medium text-sm text-slate-700 outline-none cursor-pointer focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition shadow-sm w-full sm:w-auto">
                        <option value="">-- Memuat Troli... --</option>
                    </select>
                </div>

                <div id="view-scan" class="flex-1 w-full">

                            <i data-lucide="scan-line" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                            <input type="text" id="input-qrcode" class="w-full pl-9 p-2 text-sm border border-slate-300 rounded-md outline-none focus:border-blue-500 transition shadow-sm" placeholder="Scan fisik kardus di sini..." autocomplete="off">
                        </div>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm transition flex items-center gap-2 text-sm"><i data-lucide="plus" class="w-4 h-4"></i> <span class="hidden sm:inline">Add</span></button>
                    </form>

                <div id="view-csv" class="flex-1 w-full hidden">

            <button onclick="resetFilterSTBJ()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-md text-sm transition">Reset Filter</button>
        </div>

    <!-- OVERLAY -->
    <div id="overlay-klik-luar" onclick="tutupPopups()" class="hidden fixed inset-0 z-[50] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="global.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.style.overflow = 'hidden';
            const wmsMain = document.querySelector('main');
            if(wmsMain) {
                wmsMain.style.overflow = 'hidden';
                wmsMain.style.padding = '0'; 
            }
        });

        let currentTab = 'scan';
        let dataStbj = []; 
        let deletedStbjStack = []; 
        let masterKamus = [];
        let globalRowId = 0;
        let sortState = {}; 
        const currentUser = JSON.parse(localStorage.getItem('user_session')) || {username: 'Admin'};

        document.addEventListener('DOMContentLoaded', async () => { 
            initModernLayout({ id: 'stbj', title: 'SCAN STBJ', url: 'stbj.html' }); 
            await loadInitialSTBJData();
        });

        function toggleInputSTBJ() {
            const body = document.getElementById('body-input-stbj');
            const icon = document.getElementById('icon-toggle-input');
            if (body.classList.contains('hidden')) {
                body.classList.remove('hidden');
                icon.classList.remove('rotate-180');
            } else {
                body.classList.add('hidden');
                icon.classList.add('rotate-180');
            }
        }

        function sortTable(colIndex, headerEl) {
            const tbody = document.getElementById('tbody-stbj');
            const rows = Array.from(tbody.querySelectorAll('tr.row-stbj'));
            
            let isAsc = sortState[colIndex] !== 'asc';
            sortState[colIndex] = isAsc ? 'asc' : 'desc';
            
            rows.sort((a, b) => {
                let cellA = a.cells[colIndex];
                let cellB = b.cells[colIndex];
                
                let valA = cellA.querySelector('input') ? cellA.querySelector('input').value.trim() : cellA.innerText.trim();
                let valB = cellB.querySelector('input') ? cellB.querySelector('input').value.trim() : cellB.innerText.trim();
                
                let numA = parseFloat(valA);
                let numB = parseFloat(valB);
                
                if(!isNaN(numA) && !isNaN(numB)) {
                    return isAsc ? numA - numB : numB - numA;
                } else {
                    return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
            });
            
            rows.forEach(row => tbody.appendChild(row));
            
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.setAttribute('data-lucide', 'arrow-up-down'); 
                icon.classList.add('opacity-30');
            });
            
            const icon = headerEl.querySelector('.sort-icon');
            if(icon) {
                icon.setAttribute('data-lucide', isAsc ? 'arrow-up-a-z' : 'arrow-down-z-a');
                icon.classList.remove('opacity-30');
                lucide.createIcons();
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('view-scan').classList.toggle('hidden', tab !== 'scan');
            document.getElementById('view-csv').classList.toggle('hidden', tab !== 'csv');
            document.getElementById('btn-tab-scan').className = tab === 'scan' ? 'pb-3 tab-active transition whitespace-nowrap flex items-center gap-2 text-sm' : 'pb-3 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-sm';
            document.getElementById('btn-tab-csv').className = tab === 'csv' ? 'pb-3 tab-active transition whitespace-nowrap flex items-center gap-2 text-sm' : 'pb-3 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-sm';
        }

        async function loadInitialSTBJData() {
            try {
                const { data: mData1 } = await db.from('master_1').select('nama_troli').order('id', { ascending: true });
                if(mData1) {
                    const trolis = [...new Set(mData1.map(r => r.nama_troli).filter(x => x))];
                    const sel = document.getElementById('select-troli');
                    sel.innerHTML = '<option value="">-- Memuat Troli... --</option>';
                    trolis.forEach(t => sel.innerHTML += `<option value="${t}">${t}</option>`);
                }
                const { data: mData2 } = await db.from('master_2').select('*');
                if(mData2) masterKamus = mData2;
            } catch (err) { console.error("Gagal muat referensi:", err); }
        }

        function translateBarcode(barcode) {
            let td = { tglProduksi: '-', mesin: '-', shift: '-', jenisItem: '-', namaItem: '-', panjang: '-', grade: '-', dus: '-', shading: '-', po: '-' };
            const parts = barcode.split('/'); if (parts.length < 4) return td;
            
            const hurufDepan = barcode.charAt(0).toUpperCase();
            if (hurufDepan === 'P') td.jenisItem = 'Plafon'; else if (hurufDepan === 'L') td.jenisItem = 'List'; else if (hurufDepan === 'W') td.jenisItem = 'WPC'; else td.jenisItem = hurufDepan;

            let rawItem = parts[0]; let cariItem = masterKamus.find(m => m.kode_nama_item === rawItem); 
            td.namaItem = cariItem && cariItem.nama_item ? cariItem.nama_item : rawItem; td.shading = parts[1];
            
            const p2 = parts[2];
            if (p2 && p2.length >= 4) {
                let digitPjg = (p2.length === 5) ? 2 : 1; let rawPjg = p2.substring(0, digitPjg);
                td.panjang = (digitPjg === 1) ? rawPjg + "M" : rawPjg[0] + "." + rawPjg[1] + "M"; 
                let rawGrade = p2.substring(digitPjg, digitPjg + 1); td.grade = rawGrade === '1' ? 'BAGUS' : (rawGrade === '2' ? 'A' : rawGrade);
                let rawDus = p2.substring(p2.length - 2); let cariDus = masterKamus.find(m => m.kode_dus === rawDus); td.dus = cariDus && cariDus.dus ? cariDus.dus : rawDus;
            }
            const p3 = parts[3];
            if (p3.length >= 5) {
                const dayOfYear = parseInt(p3.substring(0, 3)); const realYear = parseInt('20' + p3.substring(3, 5).split('').reverse().join(''));
                const dateObj = new Date(realYear, 0); dateObj.setDate(dayOfYear);
                td.tglProduksi = `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
                let sisaString = p3.substring(5); let match = sisaString.match(/(C.*?)(S.*?)(P.*)/);
                if (match) {
                    let cariMesin = masterKamus.find(m => m.kode_mesin === match[1]); td.mesin = cariMesin && cariMesin.mesin ? cariMesin.mesin : match[1];
                    let cariShift = masterKamus.find(m => m.kode_shift === match[2]); td.shift = cariShift && cariShift.shift ? cariShift.shift : match[2];
                    let cariPO = masterKamus.find(m => m.kode_po === match[3]); td.po = cariPO && cariPO.po ? cariPO.po : match[3];
                }
            }
            return td;
        }

        document.getElementById('form-scan').addEventListener('submit', (e) => {
            e.preventDefault();
            const troli = document.getElementById('select-troli').value;
            const inputEl = document.getElementById('input-qrcode');
            const rawInput = inputEl.value.trim();
            if(!troli) return alert("Pilih Troli terlebih dahulu!");
            if(!rawInput) return;

            const codes = rawInput.split(/[\r\n; ]+/).map(q => q.trim()).filter(q => q);
            
            // REVISI: Mengubah unshift menjadi push agar urutan kronologis (No 1 di atas)
            codes.forEach(code => {
                const isLocalDuplicate = dataStbj.some(d => d.qrcode === code);
                const trans = translateBarcode(code);
                
                dataStbj.push({ 
                    id: ++globalRowId, 
                    qrcode: code, 
                    troli: troli, 
                    status: 'BELUM CEK', 
                    keterangan: isLocalDuplicate ? 'DUPLIKAT SCAN' : '', 
                    pic: currentUser.username, 
                    isLocalDuplicate: isLocalDuplicate,
                    ...trans 
                });
            });
            renderTable();
            inputEl.value = ''; inputEl.focus();
            
            // REVISI: Auto scroll ke bawah karena data baru di-push
            const scrollContainer = document.querySelector('.table-container');
            if (scrollContainer) scrollContainer.scrollTop = scrollContainer.scrollHeight;
        });

        function prosesCSV() {
            const troli = document.getElementById('select-troli').value;
            const fileInput = document.getElementById('input-csv');
            if(!troli) return alert("Pilih Troli terlebih dahulu!");
            if(!fileInput.files.length) return alert("Pilih file CSV!");

            Papa.parse(fileInput.files[0], {
                header: false, skipEmptyLines: true,
                complete: function(results) {
                    let added = 0;
                    results.data.forEach(row => {
                        const code = row[0] ? row[0].trim() : '';
                        if(code) {
                            const isLocalDuplicate = dataStbj.some(d => d.qrcode === code);
                            const trans = translateBarcode(code);
                            
                            dataStbj.push({ 
                                id: ++globalRowId, 
                                qrcode: code, 
                                troli: troli, 
                                status: 'BELUM CEK', 
                                keterangan: isLocalDuplicate ? 'DUPLIKAT SCAN (CSV)' : 'Dari CSV', 
                                pic: currentUser.username, 
                                isLocalDuplicate: isLocalDuplicate, 
                                ...trans 
                            });
                            added++;
                        }
                    });
                    alert(`${added} QR Code dari CSV berhasil dimuat ke tabel.`); renderTable(); fileInput.value = '';
                    
                    const scrollContainer = document.querySelector('.table-container');
                    if (scrollContainer) scrollContainer.scrollTop = scrollContainer.scrollHeight;
                }
            });
        }

        function toggleAll(checked) { document.querySelectorAll('.row-cb').forEach(cb => cb.checked = checked); }
        function getCheckedIds() {
            const ids = []; document.querySelectorAll('.row-cb:checked').forEach(cb => ids.push(parseInt(cb.value))); return ids;
        }

        function hapusBaris(id) {
            const removed = dataStbj.find(d => d.id === id);
            if(removed) {
                deletedStbjStack.push([removed]);
                dataStbj = dataStbj.filter(d => d.id !== id);
                renderTable();
            }
        }

        function undoHapusSTBJ() {
            if(deletedStbjStack.length === 0) return alert("Tidak ada histori penghapusan yang dapat di-undo.");
            const last = deletedStbjStack.pop();
            dataStbj = [...dataStbj, ...last]; // REVISI: Kembalikan ke bawah agar urutan tetap
            renderTable();
        }

        function holdManual() {
            const ids = getCheckedIds(); if(ids.length === 0) return alert("Centang baris yang ingin di-HOLD manual!");
            dataStbj.forEach(d => { if(ids.includes(d.id)) { d.status = 'HOLD'; d.keterangan = 'Dihold Manual'; } });
            renderTable(); document.querySelector('input[onchange="toggleAll(this.checked)"]').checked = false;
        }

        function toggleSidebarFilter() {
            document.getElementById('sidebar-filter').classList.toggle('translate-x-full');
            document.getElementById('overlay-klik-luar').classList.toggle('hidden');
        }

        function tutupPopups() {
            document.getElementById('sidebar-filter').classList.add('translate-x-full');
            document.getElementById('overlay-klik-luar').classList.add('hidden');
        }

        function resetFilterSTBJ() {
            const ids = ['fs-status','fs-troli','fs-qr','fs-tgl','fs-mesin','fs-shift','fs-jenis','fs-nama','fs-pjg','fs-grade','fs-dus','fs-shading','fs-po','fs-ket'];
            ids.forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = ''; });
            saringTabelSTBJ(); toggleSidebarFilter();
        }

        function saringTabelSTBJ() {
            const f = {
                status: document.getElementById('fs-status')?.value.toLowerCase() || '',
                troli: document.getElementById('fs-troli')?.value.toLowerCase() || '',
                qr: document.getElementById('fs-qr')?.value.toLowerCase() || '',
                tgl: document.getElementById('fs-tgl')?.value.toLowerCase() || '',
                mesin: document.getElementById('fs-mesin')?.value.toLowerCase() || '',
                shift: document.getElementById('fs-shift')?.value.toLowerCase() || '',
                jenis: document.getElementById('fs-jenis')?.value.toLowerCase() || '',
                nama: document.getElementById('fs-nama')?.value.toLowerCase() || '',
                pjg: document.getElementById('fs-pjg')?.value.toLowerCase() || '',
                grade: document.getElementById('fs-grade')?.value.toLowerCase() || '',
                dus: document.getElementById('fs-dus')?.value.toLowerCase() || '',
                shading: document.getElementById('fs-shading')?.value.toLowerCase() || '',
                po: document.getElementById('fs-po')?.value.toLowerCase() || '',
                ket: document.getElementById('fs-ket')?.value.toLowerCase() || ''
            };

            document.querySelectorAll('.row-stbj').forEach(row => {
                let show = true;
                for(let key in f) {
                    if(f[key]) {
                        const cell = row.querySelector('.col-' + key);
                        if(cell && !cell.innerText.toLowerCase().includes(f[key])) { show = false; break; }
                    }
                }
                row.style.display = show ? '' : 'none';
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tbody-stbj');
            if(dataStbj.length === 0) return tbody.innerHTML = '<tr><td colspan="18" class="p-10 text-center font-medium text-slate-400"><i data-lucide="box" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data di-scan / di-import.</td></tr>';
            
            let html = '';
            dataStbj.forEach((d, index) => {
                let badgeClass = "bg-slate-100 text-slate-600";
                let displayStatus = d.status;

                if(d.status === 'BELUM STBJ') badgeClass = "bg-orange-500 text-white border-orange-600";
                if(d.status === 'SUDAH STBJ') badgeClass = "bg-red-600 text-white border-red-700"; 
                if(d.status === 'DUPLIKAT LOKAL') badgeClass = "bg-red-600 text-white border-red-700";
                if(d.status === 'HOLD') badgeClass = "bg-amber-500 text-white";

                if(d.status === 'BELUM CEK' && d.isLocalDuplicate) {
                    badgeClass = "bg-red-600 text-white";
                    displayStatus = "DUPLIKAT LOKAL";
                }

                const isRedHighlight = d.status === 'SUDAH STBJ' || d.status === 'DUPLIKAT LOKAL' || d.isLocalDuplicate;
                const trBaseClass = isRedHighlight ? 'bg-red-50 hover:bg-red-100 text-red-900' : (d.status === 'HOLD' ? 'bg-amber-50 hover:bg-amber-100 text-amber-900' : 'hover:bg-slate-50 even:bg-slate-50/50 text-slate-700');

                html += `
                    <tr class="border-b border-slate-100 transition ${trBaseClass} row-stbj text-sm">
                        <td class="p-3 text-center col-cb"><input type="checkbox" value="${d.id}" class="row-cb cursor-pointer w-4 h-4 text-blue-600 rounded focus:ring-blue-500"></td>
                        <td class="p-2 text-center col-btn">
                            <button onclick="hapusBaris(${d.id})" class="text-slate-400 hover:text-rose-600 transition p-1 rounded-md hover:bg-rose-50 mx-auto flex">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                        <td class="p-3 font-medium text-slate-500 col-no">${index + 1}</td>
                        <td class="p-3 font-semibold text-xs col-status"><span class="px-2 py-1 rounded-md shadow-sm border border-black/5 ${badgeClass}">${displayStatus}</span></td>
                        <td class="p-3 font-medium ${isRedHighlight ? 'text-red-900' : 'text-slate-700'} col-troli">${d.troli}</td>
                        <td class="p-3 font-mono font-medium tracking-wider col-qr">${d.qrcode}</td>
                        <td class="p-3 font-medium col-tgl">${d.tglProduksi}</td>
                        <td class="p-3 font-medium col-mesin">${d.mesin}</td>
                        <td class="p-3 font-medium col-shift">${d.shift}</td>
                        <td class="p-3 font-medium ${isRedHighlight ? 'text-red-700' : 'text-blue-600'} col-jenis">${d.jenisItem}</td>
                        <td class="p-3 font-medium text-left col-nama">${d.namaItem}</td>
                        <td class="p-3 font-medium col-pjg">${d.panjang}</td>
                        <td class="p-3 font-medium col-grade">${d.grade}</td>
                        <td class="p-3 font-medium col-dus">${d.dus}</td>
                        <td class="p-3 font-medium col-shading">${d.shading}</td>
                        <td class="p-3 font-medium ${isRedHighlight ? 'text-red-700' : 'text-orange-600'} col-po">${d.po}</td>
                        <td class="p-2 col-ket text-center"><input type="text" onchange="updateKet(${d.id}, this.value)" value="${d.keterangan}" class="w-full p-1.5 text-sm text-center border border-slate-200 rounded-md outline-none focus:border-blue-500 bg-white/50 ${isRedHighlight ? 'placeholder-red-400' : ''}" placeholder="Keterangan..."></td>
                        <td class="p-3 font-medium uppercase text-xs opacity-70 col-pic">${d.pic}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html; 
            lucide.createIcons(); 
            saringTabelSTBJ();
            
            document.getElementById('lbl-tampil-baris').innerText = dataStbj.length;
        }

        function updateKet(id, val) { const item = dataStbj.find(d => d.id === id); if(item) item.keterangan = val; }

        async function cekGudangSTBJ() {
            if(dataStbj.length === 0) return alert("Belum ada data.");
            const btn = document.getElementById('btn-cek-gudang'); const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> MENCEK DB...'; btn.disabled = true;

            const allQRs = dataStbj.map(d => d.qrcode);
            try {
                const { data: resStokGlobal, error } = await db.from('stok_global').select('qrcode').in('qrcode', allQRs);
                if(error) throw error;
                
                const existingGlobal = resStokGlobal.map(d => d.qrcode);

                let infoDuplikat = 0;
                dataStbj.forEach(d => {
                    if(d.status === 'HOLD') return; 
                    
                    if (existingGlobal.includes(d.qrcode)) {
                        d.status = 'SUDAH STBJ'; 
                        d.keterangan = 'SUDAH ADA DI STOK GLOBAL';
                        infoDuplikat++;
                    } else if (d.isLocalDuplicate) {
                        d.status = 'DUPLIKAT LOKAL';
                    } else {
                        d.status = 'BELUM STBJ'; 
                    }
                });

                renderTable();
                if(infoDuplikat > 0) alert(`Verifikasi Selesai!\nDitemukan ${infoDuplikat} data DUPLIKAT (sudah ada di Stok Global).`);
                else alert("Verifikasi Selesai!\nSemua data UNIK (Belum STBJ) dan aman untuk disimpan.");

            } catch (err) { alert("Gagal cek database: " + err.message); }
            finally { btn.innerHTML = ori; btn.disabled = false; lucide.createIcons(); }
        }

        async function saveToDatabaseSTBJ() {
            if(dataStbj.length === 0) return alert('Data kosong!');
            const blmCek = dataStbj.filter(d => d.status === 'BELUM CEK');
            if(blmCek.length > 0) return alert('Tekan tombol Verifikasi Database terlebih dahulu sebelum menyimpan!');

            const btn = document.getElementById('btn-save'); const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> MEMPROSES...'; btn.disabled = true;

            const UNIKs = dataStbj.filter(d => d.status === 'BELUM STBJ');
            const dupes = dataStbj.filter(d => d.status === 'SUDAH STBJ' || d.status === 'DUPLIKAT LOKAL' || d.status === 'HOLD');

            const mapToSchema = (d, finalStatus) => ({
                troli: d.troli,
                qrcode: d.qrcode,
                tgl_produksi: d.tglProduksi,
                shift: d.shift,
                mesin: d.mesin,
                jenis_item: d.jenisItem, 
                nama_item: d.namaItem,
                panjang: d.panjang,
                grade: d.grade,
                dus: d.dus,
                shading: d.shading,
                po_bawaan: d.po,
                keterangan: d.keterangan || '-',
                status: finalStatus,
                status_data: 'BELUM',
                posisi: 'TROLI',
                pic_input: d.pic,
                created_at: new Date().toISOString() 
            });

            try {
                if(UNIKs.length > 0) {
                    const payloadGlobal = UNIKs.map(d => mapToSchema(d, 'SUDAH STBJ'));
                    const { error: err1 } = await db.from('stok_global').insert(payloadGlobal);
                    if(err1) throw err1;
                }
                
                if(dupes.length > 0) {
                    const payloadHold = dupes.map(d => mapToSchema(d, 'HOLD'));
                    const { error: err2 } = await db.from('hold_stbj').insert(payloadHold);
                    if(err2) throw err2;
                }

                alert(`BERHASIL DISIMPAN!\n- ${UNIKs.length} Barang UNIK masuk ke Stok Global\n- ${dupes.length} Barang Hold/Duplikat masuk ke Hold STBJ`);
                dataStbj = []; renderTable();
                document.querySelector('input[onchange="toggleAll(this.checked)"]').checked = false;
            } catch (err) { alert('GAGAL MENYIMPAN: ' + err.message); } 
            finally { btn.innerHTML = ori; btn.disabled = false; lucide.createIcons(); }
        }
    </script>
</body>
</html>
