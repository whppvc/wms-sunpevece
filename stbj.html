<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Scan STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; border: 1px solid #334155; padding: 0.75rem; text-transform: uppercase; font-size: 11px; font-weight: 900; white-space: nowrap; }
        .tab-active { border-bottom: 4px solid #1e40af; color: #1e40af; font-weight: 900; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 4px solid transparent; }
    </style>
    <style id="dynamic-col-styles"></style>
</head>
<body class="font-sans overflow-x-hidden">
    <div class="w-full relative">
        
        <div class="flex border-b border-slate-200 mb-4 bg-white px-2 rounded-t-xl shadow-sm overflow-x-auto hide-scrollbar">
            <button onclick="switchTab('scan')" id="btn-tab-scan" class="px-6 py-4 tab-active transition whitespace-nowrap flex items-center gap-2"><i data-lucide="barcode" class="w-4 h-4"></i> SCAN ITEM PER DUS</button>
            <button onclick="switchTab('csv')" id="btn-tab-csv" class="px-6 py-4 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> IMPORT CSV</button>
        </div>

        <div class="bg-white p-5 md:p-6 rounded-b-xl rounded-tr-xl shadow-sm border border-slate-200 relative mb-4">
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <div class="w-full md:w-1/3">
                    <label class="block text-[11px] font-black uppercase tracking-wide mb-2 text-slate-600">Pilih Troli</label>
                    <select id="select-troli" class="w-full p-3.5 border-2 border-slate-200 rounded-xl font-bold outline-none focus:border-blue-700 text-slate-800 cursor-pointer bg-slate-50 transition">
                        <option value="">-- Memuat Troli... --</option>
                    </select>
                </div>

                <div id="view-scan" class="w-full md:w-2/3">
                    <label class="block text-[11px] font-black uppercase tracking-wide mb-2 text-slate-600">Scan Fisik Kardus</label>
                    <form id="form-scan" class="flex flex-col sm:flex-row gap-2">
                        <input type="text" id="input-qrcode" class="flex-1 p-3.5 border-2 border-slate-200 rounded-xl outline-none focus:border-blue-700 font-black text-slate-800 text-lg transition" placeholder="Arahkan scanner ke kardus..." autocomplete="off">
                        <button type="submit" class="w-full sm:w-auto bg-blue-700 hover:bg-blue-800 text-white px-8 py-3.5 rounded-xl font-black shadow-md cursor-pointer transition active:scale-95 flex items-center justify-center gap-2 border-b-4 border-blue-900"><i data-lucide="plus-square" class="w-5 h-5"></i> ADD</button>
                    </form>
                </div>

                <div id="view-csv" class="w-full md:w-2/3 hidden">
                    <label class="block text-[11px] font-black uppercase tracking-wide mb-2 text-slate-600">Upload File CSV</label>
                    <div class="flex flex-col sm:flex-row gap-2">
                        <input type="file" id="input-csv" accept=".csv" class="flex-1 p-2.5 border-2 border-slate-200 rounded-xl outline-none focus:border-blue-700 font-bold text-slate-700 bg-slate-50 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 transition">
                        <button onclick="prosesCSV()" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3.5 rounded-xl font-black shadow-md cursor-pointer transition active:scale-95 flex items-center justify-center gap-2 border-b-4 border-emerald-800"><i data-lucide="upload-cloud" class="w-5 h-5"></i> PROSES CSV</button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-between gap-3 mt-4 pt-4 border-t border-slate-100">
                <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                    <button onclick="toggleSidebarFilter()" class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-lg shadow-sm border-b-2 border-slate-950 text-xs flex items-center justify-center gap-2 active:scale-95 transition uppercase"><i data-lucide="filter" class="w-4 h-4"></i> FILTER</button>
                    <div class="relative">
                        <button onclick="document.getElementById('dropdown-kolom').classList.toggle('hidden')" class="px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 font-black rounded-lg shadow-sm border border-slate-300 text-xs flex items-center gap-2 active:scale-95 transition uppercase"><i data-lucide="eye-off" class="w-4 h-4"></i> KOLOM</button>
                        <div id="dropdown-kolom" class="hidden absolute top-full left-0 mt-2 w-56 bg-white border border-slate-200 shadow-xl rounded-xl p-3 z-40">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-2">
                                <span class="text-xs font-black text-slate-500 uppercase">Sembunyikan</span>
                                <button onclick="resetKolom()" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200">RESET</button>
                            </div>
                            <div class="flex flex-col gap-2 max-h-64 overflow-y-auto" id="list-kolom-toggles"></div>
                        </div>
                    </div>
                    <button onclick="hapusBarisTerpilih()" class="flex-1 sm:flex-none px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-black rounded-lg shadow-sm text-xs flex items-center justify-center gap-2 active:scale-95 transition border-b-2 border-red-800"><i data-lucide="trash-2" class="w-4 h-4"></i> HAPUS</button>
                    <button onclick="undoHapusSTBJ()" class="flex-1 sm:flex-none px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-lg shadow-sm text-xs flex items-center justify-center gap-2 active:scale-95 transition border border-slate-300"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> UNDO HAPUS</button>
                </div>
                <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-end">
                    <button onclick="holdManual()" class="flex-1 sm:flex-none px-4 py-3 bg-amber-600 hover:bg-amber-700 text-white font-black rounded-lg shadow-sm text-xs flex items-center justify-center gap-2 active:scale-95 transition"><i data-lucide="pause-circle" class="w-4 h-4"></i> HOLD MANUAL</button>
                    <button onclick="cekGudangSTBJ()" id="btn-cek-gudang" class="flex-1 sm:flex-none px-5 py-3 bg-slate-800 text-white font-black rounded-lg shadow-sm hover:bg-slate-900 border-b-4 border-slate-900 transition text-xs flex items-center justify-center gap-2 active:scale-95 uppercase"><i data-lucide="search-check" class="w-4 h-4"></i> CEK STATUS DUPLIKAT</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative mb-4">
            <div class="table-container overflow-x-auto w-full max-h-[50vh]">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-stbj">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-10 col-cb"><input type="checkbox" onchange="toggleAll(this.checked)" class="cursor-pointer"></th>
                            <th class="hdr-std w-12 col-no">No</th>
                            <th class="hdr-std border-r border-slate-500 col-status">Status</th>
                            <th class="hdr-std col-troli text-amber-300">Troli</th>
                            <th class="hdr-std border-r border-slate-500 col-qr">Text QRCode</th>
                            <th class="hdr-std col-tgl">Tgl Produksi</th>
                            <th class="hdr-std col-mesin">Mesin</th>
                            <th class="hdr-std border-r border-slate-500 col-shift">Shift</th>
                            <th class="hdr-std text-blue-300 col-jenis">Jenis Item</th>
                            <th class="hdr-std col-nama">Nama Item</th>
                            <th class="hdr-std col-pjg">Pjg</th>
                            <th class="hdr-std col-grade">Grade</th>
                            <th class="hdr-std col-dus">Dus</th>
                            <th class="hdr-std border-r border-slate-500 col-shading">Shading</th>
                            <th class="hdr-std col-po">PO Awal</th>
                            <th class="hdr-std col-ket">Keterangan</th>
                            <th class="hdr-std col-pic">PIC Input</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-stbj" class="text-center text-slate-700">
                        <tr><td colspan="17" class="p-10 text-slate-400 font-bold"><i data-lucide="box" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data di-scan / di-import.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="pt-2 pb-10">
            <button id="btn-save" onclick="saveToDatabaseSTBJ()" class="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl shadow-lg flex items-center justify-center gap-2 text-base tracking-widest cursor-pointer transition active:scale-95 uppercase border-b-4 border-black"><i data-lucide="save" class="w-5 h-5"></i> SIMPAN DATA (UNIQUE -> HASIL, DUPLIKAT/HOLD -> HOLD)</button>
        </div>
    </div>

    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide"><i data-lucide="filter" class="w-5 h-5"></i> Filter STBJ Lengkap</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-4 overflow-y-auto">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status</label><input type="text" id="fs-status" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli</label><input type="text" id="fs-troli" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="fs-qr" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="text" id="fs-tgl" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label><input type="text" id="fs-mesin" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label><input type="text" id="fs-shift" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><input type="text" id="fs-jenis" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label><input type="text" id="fs-nama" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><input type="text" id="fs-pjg" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><input type="text" id="fs-grade" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><input type="text" id="fs-dus" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="fs-shading" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PO</label><input type="text" id="fs-po" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="fs-ket" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PIC Input</label><input type="text" id="fs-pic" oninput="saringTabelSTBJ()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            </div>
            <button onclick="resetFilterSTBJ()" class="mt-4 py-3 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-lg text-xs uppercase transition border border-slate-300">RESET FILTER</button>
        </div>
    </div>

    <div id="overlay-klik-luar" onclick="tutupPopups()" class="hidden fixed inset-0 z-30"></div>

    <script src="global.js"></script>
    <script>
        let currentTab = 'scan';
        let dataStbj = []; 
        let deletedStbjStack = []; 
        let masterKamus = [];
        let globalRowId = 0;
        let hiddenCols = [];
        const currentUser = JSON.parse(localStorage.getItem('user_session')) || {username: 'Admin'};

        const colDefinitions = [
            { id: 'col-cb', label: 'Checkbox', default: true },
            { id: 'col-no', label: 'Nomor Urut', default: true },
            { id: 'col-status', label: 'Status Hold', default: true },
            { id: 'col-troli', label: 'Troli', default: true },
            { id: 'col-qr', label: 'QRCode', default: true },
            { id: 'col-tgl', label: 'Tgl Produksi', default: true },
            { id: 'col-mesin', label: 'Mesin', default: true },
            { id: 'col-shift', label: 'Shift', default: true },
            { id: 'col-jenis', label: 'Jenis Item', default: true },
            { id: 'col-nama', label: 'Nama Item', default: true },
            { id: 'col-pjg', label: 'Pjg', default: true },
            { id: 'col-grade', label: 'Grade', default: true },
            { id: 'col-dus', label: 'Dus', default: true },
            { id: 'col-shading', label: 'Shading', default: true },
            { id: 'col-po', label: 'PO Awal', default: true },
            { id: 'col-ket', label: 'Keterangan', default: true },
            { id: 'col-pic', label: 'PIC Input', default: true }
        ];

        document.addEventListener('DOMContentLoaded', async () => { 
            initModernLayout({ id: 'stbj', title: 'SCAN STBJ', url: 'stbj.html' }); 
            buatDropdownKolom();
            await loadInitialSTBJData();
        });

        function buatDropdownKolom() {
            const container = document.getElementById('list-kolom-toggles');
            let html = '';
            colDefinitions.forEach(col => {
                html += `
                    <label class="flex items-center gap-2 cursor-pointer p-1.5 hover:bg-slate-50 rounded">
                        <input type="checkbox" checked onchange="toggleKolom('${col.id}', this.checked)" class="w-4 h-4 cursor-pointer text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        <span class="text-xs font-bold text-slate-700">${col.label}</span>
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        function toggleKolom(colId, isVisible) {
            if(isVisible) { hiddenCols = hiddenCols.filter(id => id !== colId); } 
            else { if(!hiddenCols.includes(colId)) hiddenCols.push(colId); }
            terapkanStyleKolom();
        }

        function resetKolom() {
            hiddenCols = [];
            document.querySelectorAll('#list-kolom-toggles input[type="checkbox"]').forEach(cb => cb.checked = true);
            terapkanStyleKolom();
        }

        function terapkanStyleKolom() {
            const cssString = hiddenCols.map(id => `.${id} { display: none !important; }`).join('\n');
            document.getElementById('dynamic-col-styles').innerHTML = cssString;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('view-scan').classList.toggle('hidden', tab !== 'scan');
            document.getElementById('view-csv').classList.toggle('hidden', tab !== 'csv');
            document.getElementById('btn-tab-scan').className = tab === 'scan' ? 'px-6 py-4 tab-active transition whitespace-nowrap flex items-center gap-2' : 'px-6 py-4 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2';
            document.getElementById('btn-tab-csv').className = tab === 'csv' ? 'px-6 py-4 tab-active transition whitespace-nowrap flex items-center gap-2' : 'px-6 py-4 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2';
        }

        async function loadInitialSTBJData() {
            try {
                const { data: mData1 } = await db.from('master_1').select('nama_troli').order('id', { ascending: true });
                if(mData1) {
                    const trolis = [...new Set(mData1.map(r => r.nama_troli).filter(x => x))];
                    const sel = document.getElementById('select-troli');
                    sel.innerHTML = '<option value="">-- Pilih Troli --</option>';
                    trolis.forEach(t => sel.innerHTML += `<option value="${t}">${t}</option>`);
                }
                const { data: mData2 } = await db.from('master_2').select('*');
                if(mData2) masterKamus = mData2;
            } catch (err) { console.error("Gagal muat referensi:", err); }
        }
