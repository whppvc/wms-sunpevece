<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Scan STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .selected-row { border-color: #2563eb !important; background-color: #dbeafe !important; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <div class="shrink-0 bg-white flex flex-col z-20 shadow-[0_4px_10px_-3px_rgba(0,0,0,0.05)] border-b border-slate-200">
            
            <!-- SELECT ALL & QTY & FILTER -->
            <div class="flex justify-between items-center px-3 py-3 bg-white border-b border-slate-200">
                <div class="flex items-center gap-2">
                    <input type="checkbox" onchange="toggleAll(this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer border-slate-400" id="cb-all">
                    <label for="cb-all" class="text-[11px] font-black text-slate-500 uppercase tracking-wide cursor-pointer">Pilih Semua</label>
                </div>
                <div class="flex items-center gap-2">
                    <div class="bg-cyan-50 border border-cyan-300 px-3 py-1.5 rounded text-cyan-800 text-[11px] font-black shadow-sm uppercase tracking-wider">
                        Total Qty: <span id="lbl-tampil-baris" class="text-slate-900 text-[13px] ml-1">0</span> Dus
                    </div>
                    <!-- ICON FILTER -->
                    <button onclick="toggleSidebarFilter()" class="p-1.5 bg-white border border-slate-300 text-slate-600 rounded hover:bg-slate-100 transition shadow-sm active:scale-95">
                        <i data-lucide="filter" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION (CARD VIEW) -->
        <div class="flex-1 min-h-0 bg-slate-200 p-2 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 bg-white border border-slate-300 shadow-inner overflow-y-auto custom-scroll" id="scroll-container">
                <div id="tbody-stbj" class="flex flex-col gap-0 w-full"></div>
            </div>
        </div>

        <!-- FOOTER ACTION (4 KOTAK BOTTOM BAR) -->
        <div class="shrink-0 w-full bg-slate-50 p-2 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300 pb-4">
            <div class="grid grid-cols-4 gap-2 h-[55px]">
                
                <!-- KOTAK 1: ADD (DROPUP) -->
                <div class="relative w-full h-full">
                    <button onclick="toggleAddMenu(event)" class="w-full h-full bg-[#0f172a] hover:bg-black text-white flex flex-col justify-center items-center shadow-md active:scale-95 transition rounded border-b-4 border-slate-900">
                        <i data-lucide="plus" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                    </button>
                    
                    <!-- Dropup Menu Add -->
                    <div id="dropup-add" class="hidden absolute bottom-full left-0 mb-2 w-56 bg-white shadow-2xl rounded-xl border border-slate-200 z-50 flex flex-col overflow-hidden">
                        <button onclick="bukaModalAdd(); toggleAddMenu(event)" class="text-left px-5 py-4 border-b border-slate-100 text-sm font-bold text-slate-700 flex items-center gap-3 hover:bg-slate-50 active:bg-slate-100 transition"><i data-lucide="qr-code" class="w-5 h-5 text-blue-600"></i> Input QRCode</button>
                        <button onclick="bukaModalManual(); toggleAddMenu(event)" class="text-left px-5 py-4 text-sm font-bold text-slate-700 flex items-center gap-3 hover:bg-slate-50 active:bg-slate-100 transition"><i data-lucide="keyboard" class="w-5 h-5 text-purple-600"></i> Input Manual</button>
                    </div>
                </div>

                <!-- KOTAK 2: VERIFIKASI -->
                <button onclick="cekGudangSTBJ()" id="btn-cek-gudang" class="w-full h-full bg-blue-600 hover:bg-blue-700 text-white font-black shadow-md flex flex-col items-center justify-center gap-1 text-[9px] sm:text-[11px] cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-blue-800 leading-none">
                    <i data-lucide="shield-check" class="w-4 h-4 sm:w-5 sm:h-5"></i> Verifikasi
                </button>

                <!-- KOTAK 3: SIMPAN -->
                <button id="btn-save" onclick="saveToDatabaseSTBJ()" class="w-full h-full bg-[#058c5e] hover:bg-[#04724d] text-white font-black shadow-md flex flex-col items-center justify-center gap-1 text-[9px] sm:text-[11px] cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-[#035237] leading-none">
                    <i data-lucide="save" class="w-4 h-4 sm:w-5 sm:h-5"></i> Simpan
                </button>

                <!-- KOTAK 4: LAINNYA (DROPUP) -->
                <div class="relative w-full h-full">
                    <button onclick="toggleMoreMenu(event)" class="w-full h-full bg-slate-700 hover:bg-slate-800 text-white font-black shadow-md flex flex-col items-center justify-center gap-1 text-[9px] sm:text-[11px] cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-slate-900 leading-none">
                        <i data-lucide="more-horizontal" class="w-4 h-4 sm:w-5 sm:h-5"></i> Lainnya
                    </button>
                    
                    <!-- Dropup Menu Lainnya -->
                    <div id="dropup-more" class="hidden absolute bottom-full right-0 mb-2 w-48 bg-white shadow-2xl rounded-xl border border-slate-200 z-50 flex flex-col overflow-hidden">
                        <button onclick="undoHapusSTBJ(); toggleMoreMenu(event)" class="text-left px-5 py-4 border-b border-slate-100 text-sm font-bold text-rose-600 flex items-center gap-3 hover:bg-slate-50 active:bg-slate-100 transition"><i data-lucide="rotate-ccw" class="w-5 h-5"></i> Undo Hapus</button>
                        <button onclick="holdManual(); toggleMoreMenu(event)" class="text-left px-5 py-4 text-sm font-bold text-amber-600 flex items-center gap-3 hover:bg-slate-50 active:bg-slate-100 transition"><i data-lucide="pause-circle" class="w-5 h-5"></i> Hold Item</button>
                    </div>
                </div>

            </div>
        </div>
        
    </div>

    <!-- MODAL ADD SCAN QR -->
    <div id="modal-add-scan" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="scan-line" class="w-5 h-5 text-blue-600"></i> INPUT DATA STBJ</h3>
                <button type="button" onclick="tutupModalAdd()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="form-scan" class="flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Scan Fisik Kardus</label>
                    <input type="text" id="input-qrcode" class="w-full p-2.5 border border-slate-300 rounded outline-none focus:border-blue-500 font-mono font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition" placeholder="Arahkan scanner..." autocomplete="off">
                </div>
                <button type="submit" class="mt-2 w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded font-black shadow transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase border-b-4 border-black">
                    <i data-lucide="plus-square" class="w-4 h-4"></i> TAMBAHKAN KODE
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL INPUT MANUAL -->
    <div id="modal-manual" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/70 z-[60] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl border border-slate-200 flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-purple-50 rounded-t-2xl">
                <h3 class="text-base font-black flex items-center gap-2 text-purple-800"><i data-lucide="keyboard" class="w-5 h-5"></i> Form Input Manual STBJ</h3>
                <button type="button" onclick="tutupModalManual()" class="text-purple-600 hover:text-red-600 bg-white p-1.5 rounded-md transition shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto custom-scroll p-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="date" id="m-tgl" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none font-bold bg-slate-50"></div>
                    
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label>
                        <div class="flex gap-2">
                            <input type="text" id="m-mesin" readonly class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none font-bold bg-slate-100 text-slate-600 cursor-not-allowed" placeholder="Pilih Mesin...">
                            <button onclick="bukaModalSearch('mesin')" class="px-3 bg-purple-100 text-purple-700 font-bold rounded-lg hover:bg-purple-200 transition text-xs shadow-sm"><i data-lucide="search" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label>
                        <select id="m-shift" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none font-bold bg-slate-50 cursor-pointer"></select>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label>
                        <div class="flex gap-2">
                            <input type="text" id="m-item" readonly class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none font-bold bg-slate-100 text-slate-600 cursor-not-allowed" placeholder="Pilih Item...">
                            <button onclick="bukaModalSearch('item')" class="px-3 bg-purple-100 text-purple-700 font-bold rounded-lg hover:bg-purple-200 transition text-xs shadow-sm"><i data-lucide="search" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    
                    <!-- REVISI: Input Panjang menjadi free text angka -->
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang (M)</label>
                        <input type="number" step="0.01" id="m-panjang" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:border-purple-500 font-bold bg-slate-50" placeholder="Cth: 4 atau 5.95">
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label>
                        <select id="m-grade" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none font-bold bg-slate-50 cursor-pointer"></select>
                    </div>
                    
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus / Merk</label>
                        <div class="flex gap-2">
                            <input type="text" id="m-dus" readonly class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none font-bold bg-slate-100 text-slate-600 cursor-not-allowed" placeholder="Pilih Dus...">
                            <button onclick="bukaModalSearch('dus')" class="px-3 bg-purple-100 text-purple-700 font-bold rounded-lg hover:bg-purple-200 transition text-xs shadow-sm"><i data-lucide="search" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    
                    <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="m-shading" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:border-purple-500 font-bold bg-slate-50 uppercase" placeholder="Ketik Shading..."></div>
                    
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Customer</label>
                        <div class="flex gap-2">
                            <input type="text" id="m-customer" readonly class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none font-bold bg-slate-100 text-slate-600 cursor-not-allowed" placeholder="Pilih Customer...">
                            <button onclick="bukaModalSearch('customer')" class="px-3 bg-purple-100 text-purple-700 font-bold rounded-lg hover:bg-purple-200 transition text-xs shadow-sm"><i data-lucide="search" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    
                    <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="m-ket" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg outline-none focus:border-purple-500 font-bold bg-slate-50" placeholder="Keterangan..."></div>
                    
                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-black uppercase text-purple-600 mb-1">QTY (DUS)</label>
                        <input type="number" id="m-qty" value="1" min="1" class="w-full p-3 text-lg border-2 border-purple-300 rounded-xl outline-none focus:border-purple-600 font-black text-center bg-purple-50 text-purple-800">
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 bg-white flex gap-2 rounded-b-2xl">
                <button type="button" onclick="tutupModalManual()" class="w-1/3 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs uppercase hover:bg-slate-300 transition">Batal</button>
                <button type="button" onclick="simpanManual()" id="btn-simpan-manual" class="w-2/3 py-3 bg-purple-600 hover:bg-purple-700 text-white font-black rounded-xl shadow-md text-xs uppercase transition active:scale-95 flex justify-center items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Simpan Data</button>
            </div>
        </div>
    </div>

    <!-- MODAL PENCARIAN (MESIN, ITEM, DUS, CUSTOMER) -->
    <div id="modal-search" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/70 z-[100] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 flex flex-col max-h-[85vh] overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-base font-black flex items-center gap-2 text-slate-800"><i data-lucide="search" class="text-blue-600 w-5 h-5"></i> <span id="title-modal-search">Cari Data</span></h3>
                <button type="button" onclick="document.getElementById('modal-search').classList.add('hidden')" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-md transition shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            
            <div class="p-4 border-b border-slate-100 bg-white">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                    <input type="text" id="input-search-list" onkeyup="filterSearchList()" class="w-full pl-9 p-2.5 border border-slate-300 rounded-lg outline-none focus:border-blue-500 font-bold text-sm bg-slate-50" placeholder="Ketik untuk mencari..." autocomplete="off">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll p-2 bg-slate-50">
                <ul id="list-search-result" class="space-y-1"></ul>
            </div>

            <div class="p-4 border-t border-slate-100 bg-white">
                <button type="button" onclick="pilihDataSearch()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl shadow-sm text-sm uppercase transition active:scale-95 flex justify-center items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Pilih Data</button>
            </div>
        </div>
    </div>

    <!-- SIDEBAR FILTER LENGKAP -->
    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4"></i> Filter Data</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 flex flex-col gap-3 overflow-y-auto custom-scroll flex-1">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status</label><select id="fs-status" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli</label><select id="fs-troli" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div class="col-span-2"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="fs-qr" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none bg-slate-50" placeholder="Ketik QR Code..."></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><select id="fs-tgl" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label><select id="fs-mesin" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label><select id="fs-shift" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><select id="fs-jenis" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div class="col-span-2"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label><select id="fs-nama" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><select id="fs-pjg" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><select id="fs-grade" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><select id="fs-dus" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><select id="fs-shading" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Customer</label><select id="fs-customer" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div class="col-span-2"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="fs-ket" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none bg-slate-50" placeholder="Ketik Keterangan..."></div>
            </div>
            <button onclick="resetFilterSTBJ()" class="mt-2 py-3 w-full bg-slate-800 hover:bg-slate-900 text-white font-black rounded text-xs uppercase transition shrink-0">RESET FILTER</button>
        </div>
    </div>

    <!-- OVERLAY -->
    <div id="overlay-klik-luar" onclick="tutupPopups()" class="hidden fixed inset-0 z-[50] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="wms_parser.js"></script>
    <script src="stbj_logic.js"></script>
</body>
</html>
