<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - STBJ System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root { --bg-main: #f8fafc; --bg-box: #ffffff; --text-main: #1f2937; --border-color: #e2e8f0; }
        body[data-bg="dark"] { --bg-main: #0f172a; --bg-box: #1e293b; --text-main: #f8fafc; --border-color: #334155; }
        body[data-bg="grey"] { --bg-main: #e2e8f0; --bg-box: #f1f5f9; --text-main: #0f172a; --border-color: #cbd5e1; }
        body { background-color: var(--bg-main); color: var(--text-main); transition: all 0.3s ease; }
        .card-dynamic { background-color: var(--bg-box); border-color: var(--border-color); }
        .input-dynamic { background-color: var(--bg-main); color: var(--text-main); border-color: var(--border-color); }
        
        .table-container { scrollbar-width: thin; }
        .header-green { background-color: #15803d !important; color: white !important; }
        .header-black { background-color: #1e293b !important; color: white !important; }
        .header-blue { background-color: #2563eb !important; color: white !important; }
    </style>
</head>
<body id="app-body" class="min-h-screen font-sans">

    <header class="card-dynamic shadow-sm px-4 py-3 flex items-center justify-between sticky top-0 z-40 border-b">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="p-2 bg-blue-100 text-blue-700 hover:bg-blue-200 rounded-full transition cursor-pointer"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <h1 class="font-bold text-lg text-blue-600 uppercase tracking-wide">Menu STBJ</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="window.location.href='hasil_stbj.html'" class="hidden md:flex items-center gap-2 bg-blue-50 border border-blue-400 text-blue-700 px-4 py-1.5 rounded-lg font-bold text-sm cursor-pointer hover:bg-blue-100"><i data-lucide="file-text" class="w-4 h-4"></i> Laporan STBJ</button>
            <button onclick="undoDelete()" class="px-4 py-1.5 bg-orange-100 text-orange-700 font-black rounded-lg border border-orange-200 hover:bg-orange-200 cursor-pointer text-sm">UNDO</button>
        </div>
    </header>

    <main class="p-4 md:p-6 max-w-[98%] mx-auto">
        <div id="view-menu" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div onclick="switchView('scan')" class="card-dynamic p-5 rounded-xl shadow-sm border hover:shadow-md cursor-pointer flex items-center gap-4 active:scale-95 transition">
                <div class="bg-blue-100 p-3 rounded-lg"><i data-lucide="scan-barcode" class="w-8 h-8 text-blue-600"></i></div>
                <div><h3 class="font-bold text-lg">Scan per item</h3><p class="text-xs opacity-60">Scan per dus atau ketik qrcode</p></div>
            </div>
            <div onclick="switchView('import')" class="card-dynamic p-5 rounded-xl shadow-sm border hover:shadow-md cursor-pointer flex items-center gap-4 active:scale-95 transition">
                <div class="bg-emerald-100 p-3 rounded-lg"><i data-lucide="file-down" class="w-8 h-8 text-emerald-600"></i></div>
                <div><h3 class="font-bold text-lg">Import CSV</h3><p class="text-xs opacity-60">Upload file Excel daftar barcode</p></div>
            </div>
            <div class="card-dynamic p-5 rounded-xl shadow-sm border opacity-50 cursor-not-allowed flex items-center gap-4">
                <div class="bg-purple-100 p-3 rounded-lg"><i data-lucide="upload-cloud" class="w-8 h-8 text-purple-600"></i></div>
                <div><h3 class="font-bold text-lg">Upload file QC & STBJ</h3><p class="text-xs opacity-60">Tahap Pengembangan</p></div>
            </div>
            <div class="card-dynamic p-5 rounded-xl shadow-sm border opacity-50 cursor-not-allowed flex items-center gap-4">
                <div class="bg-orange-100 p-3 rounded-lg"><i data-lucide="file-text" class="w-8 h-8 text-orange-600"></i></div>
                <div><h3 class="font-bold text-lg">STBJ Lembaran</h3><p class="text-xs opacity-60">Tahap Pengembangan</p></div>
            </div>
        </div>

        <div id="view-scan" class="hidden space-y-4">
            <div class="card-dynamic p-5 rounded-xl shadow-sm border space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 opacity-70">Pilih Troli</label>
                    <select id="select-troli" class="input-dynamic w-full p-3 border-2 rounded-lg font-bold outline-none border-blue-400 text-blue-600 cursor-pointer"></select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase mb-1 flex justify-between opacity-70">
                        <span>Input QR Code</span>
                        <span id="dup-notif" class="text-red-500 hidden animate-pulse bg-red-100 px-2 rounded">Duplikat Dihapus!</span>
                    </label>
                    <form id="form-scan" class="flex gap-2">
                        <input type="text" id="input-qrcode" class="input-dynamic flex-1 p-3 border-2 rounded-lg outline-none focus:border-blue-500 font-bold" placeholder="Scan atau ketik (bisa pakai spasi)..." autocomplete="off">
                        <button type="submit" class="bg-blue-600 text-white px-6 rounded-lg font-bold shadow-md cursor-pointer"><i data-lucide="corner-down-left"></i></button>
                    </form>
                </div>
            </div>

            <div class="card-dynamic rounded-xl shadow-md border overflow-hidden">
                <div class="table-container overflow-x-auto w-full">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-stbj">
                        <thead>
                            <tr class="uppercase text-[11px] font-bold">
                                <th class="p-3 header-black w-10 text-center"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                                <th class="p-3 header-black w-12 text-center">No</th>
                                <th class="p-3 header-black">Troli</th>
                                <th class="p-3 header-black border-r border-gray-600">Text QRCode</th>
                                <th class="p-3 header-green">Tgl Produksi</th>
                                <th class="p-3 header-green">Mesin</th>
                                <th class="p-3 header-green">Shift</th>
                                <th class="p-3 header-blue">Jenis Item</th>
                                <th class="p-3 header-green">Nama Item</th>
                                <th class="p-3 header-green">Pjg</th>
                                <th class="p-3 header-green">Grade</th>
                                <th class="p-3 header-green">Dus</th>
                                <th class="p-3 header-green">Shading</th>
                                <th class="p-3 header-green">PO</th>
                                <th class="p-3 header-green">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-stbj"></tbody>
                    </table>
                </div>
            </div>

            <div class="flex flex-col gap-3 pb-16 pt-2">
                <button id="btn-save" onclick="saveToSupabase()" class="w-full py-4 bg-blue-700 hover:bg-blue-800 text-white font-black rounded-xl shadow-lg flex items-center justify-center gap-2 text-lg uppercase tracking-wide cursor-pointer transition active:scale-95">
                    <i data-lucide="save" class="w-6 h-6"></i> SAVE DATA HASIL STBJ
                </button>
            </div>
        </div>

        <div id="view-import" class="hidden space-y-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-bold text-xl flex items-center gap-2"><i data-lucide="file-down" class="text-emerald-500"></i> Import Data</h2>
                <button onclick="processImportToTable()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold shadow cursor-pointer">Format ke Tabel</button>
            </div>
            <div class="card-dynamic p-4 md:p-6 rounded-3xl border shadow-xl">
                <div id="import-rows" class="grid grid-cols-1 md:grid-cols-2 gap-5 max-h-[65vh] overflow-y-auto pr-2"></div>
            </div>
        </div>
    </main>

    <script src="stbj_logic.js"></script>
</body>
</html>
