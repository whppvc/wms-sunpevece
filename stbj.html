<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Scan STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        html, body {
            height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y;
        }
        .custom-scroll::-webkit-scrollbar { width: 12px; height: 12px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-left: 1px solid #cbd5e1; border-top: 1px solid #cbd5e1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border: 3px solid #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        .table-container { position: relative; will-change: transform; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } 
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* REVISI: Header Solid Anti-Tembus Scroll */
        .hdr-std { 
            background-color: #1e293b !important; 
            color: #ffffff !important; 
            text-align: center !important; 
            border-bottom: 2px solid #cbd5e1 !important; 
            padding: 0.75rem; 
            text-transform: uppercase; 
            font-family: inherit;
            font-size: 12px; 
            font-weight: 800; 
            white-space: nowrap; 
            position: sticky;
            top: 0;
            z-index: 40 !important;
            background-clip: padding-box !important; 
        }
        
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
        tr.selected-row td { background-color: #dbeafe !important; }

        /* REVISI: Resizable Column Handle */
        .resizer {
            position: absolute;
            top: 0; right: 0; width: 5px;
            cursor: col-resize; user-select: none;
            height: 100%; z-index: 50;
        }
        .resizer:hover, .resizing { background-color: rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="font-sans bg-slate-50 text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- 1. TOP FREEZE SECTION -->
        <div class="shrink-0 bg-slate-50 flex flex-col z-20 shadow-[0_4px_10px_-3px_rgba(0,0,0,0.05)] border-b border-slate-300">
            
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar">
                <button onclick="switchTab('scan')" id="btn-tab-scan" class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs"><i data-lucide="barcode" class="w-4 h-4"></i> SCAN ITEM PER DUS</button>
                <button onclick="switchTab('csv')" id="btn-tab-csv" class="px-6 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i> IMPORT CSV</button>
            </div>

            <div class="bg-white border-b border-slate-200 flex flex-col">
                <button onclick="toggleInputSTBJ()" class="w-full bg-slate-50 p-3 flex justify-between items-center border-b border-slate-200 hover:bg-slate-100 transition active:bg-slate-200">
                    <span class="font-black text-[11px] uppercase tracking-wide text-slate-700 flex items-center gap-2">
                        <i data-lucide="package-plus" class="w-4 h-4"></i> INPUT DATA STBJ
                    </span>
                    <i data-lucide="chevron-up" id="icon-toggle-input" class="w-4 h-4 text-slate-500 transition-transform duration-300"></i>
                </button>
                
                <div id="body-input-stbj" class="p-3 sm:p-4 transition-all duration-300 origin-top">
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
                        <div class="md:col-span-3">
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Pilih Troli</label>
                            <select id="select-troli" class="w-full h-11 px-3 border-2 border-slate-200 rounded-lg font-bold outline-none focus:border-blue-600 text-slate-800 cursor-pointer bg-slate-50 text-sm shadow-inner">
                                <option value="">-- Memuat Troli... --</option>
                            </select>
                        </div>

                        <div id="view-scan" class="md:col-span-9">
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Scan Fisik Kardus</label>
                            <form id="form-scan" class="flex gap-2">
                                <div class="relative flex-1">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="scan-line" class="w-5 h-5 text-slate-400"></i></div>
                                    <input type="text" id="input-qrcode" class="w-full h-11 pl-11 pr-3 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-600 font-black text-slate-800 text-sm sm:text-base bg-slate-50 placeholder-slate-400 transition shadow-inner" placeholder="Arahkan scanner..." autocomplete="off">
                                </div>
                                <button type="submit" class="h-11 bg-blue-700 hover:bg-blue-800 text-white px-4 sm:px-6 rounded-lg font-black shadow-sm cursor-pointer transition active:scale-95 flex items-center justify-center gap-2 border-b-2 border-blue-900 text-xs sm:text-sm uppercase"><i data-lucide="plus-square" class="w-4 h-4"></i> <span class="hidden sm:inline">ADD</span></button>
                            </form>
                        </div>

                        <div id="view-csv" class="md:col-span-9 hidden">
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Upload File CSV</label>
                            <div class="flex gap-2">
                                <input type="file" id="input-csv" accept=".csv" class="flex-1 h-11 px-3 py-2 border-2 border-slate-200 rounded-lg outline-none text-sm font-bold text-slate-700 bg-slate-50 file:mr-4 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-[11px] file:font-black file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200 transition cursor-pointer shadow-inner">
                                <button onclick="prosesCSV()" class="h-11 bg-emerald-600 hover:bg-emerald-700 text-white px-4 sm:px-6 rounded-lg font-black shadow-sm cursor-pointer transition active:scale-95 flex items-center justify-center gap-2 border-b-2 border-emerald-800 text-xs sm:text-sm uppercase"><i data-lucide="upload-cloud" class="w-4 h-4"></i> <span class="hidden sm:inline">PROSES</span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- REVISI: Tombol Filter Dihapus, Tombol Verifikasi jadi Hitam -->
            <div class="flex gap-2 overflow-x-auto p-2 bg-slate-50 hide-scrollbar whitespace-nowrap scroll-smooth select-none">
                <button onclick="cekGudangSTBJ()" id="btn-cek-gudang" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded overflow-hidden border border-black">
                    <div class="bg-black text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="search-check" class="w-4 h-4"></i></div>
                    <div class="bg-slate-900 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-black transition">Verifikasi Kode</div>
                </button>
                
                <div class="w-px h-8 bg-slate-300 mx-1 shrink-0"></div> 
                
                <button onclick="undoHapusSTBJ()" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded overflow-hidden border border-rose-700">
                    <div class="bg-rose-700 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></div>
                    <div class="bg-rose-600 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-rose-500 transition">Undo</div>
                </button>
                
                <button onclick="holdManual()" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded overflow-hidden border border-amber-600">
                    <div class="bg-amber-600 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="pause-circle" class="w-4 h-4"></i></div>
                    <div class="bg-amber-500 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-amber-400 transition">Hold Item</div>
                </button>
            </div>
        </div>

        <!-- 2. MIDDLE SCROLL SECTION -->
        <div class="flex-1 min-h-0 bg-slate-200 p-2 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 bg-white border border-slate-300 shadow-inner overflow-y-auto custom-scroll table-container">
                <!-- REVISI: border-separate border-spacing-0 agar border tidak tembus header -->
                <table class="w-full text-center border-separate border-spacing-0 whitespace-nowrap" id="table-stbj">
                    <thead class="sticky top-0 z-40 shadow-md bg-slate-800">
                        <tr>
                            <th class="hdr-std w-10 col-cb relative"><input type="checkbox" onchange="toggleAll(this.checked)" class="cursor-pointer w-4 h-4 text-blue-600 rounded"></th>
                            <th class="hdr-std w-10 col-btn relative"><i data-lucide="trash-2" class="w-4 h-4 mx-auto text-slate-400"></i></th>
                            
                            <th class="hdr-std w-12 col-no relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(2, this.closest('th'))">No <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                </div>
                            </th>
                            
                            <!-- REVISI: Header dengan Filter Excel -->
                            <th class="hdr-std col-status relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(3, this.closest('th'))">Status <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-status', 'Status')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-troli relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(4, this.closest('th'))">Troli <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-troli', 'Troli')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std border-r border-slate-500 col-qr relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(5, this.closest('th'))">Text QRCode <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-qr', 'QRCode')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-tgl relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(6, this.closest('th'))">Tgl Produksi <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-tgl', 'Tgl Produksi')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-mesin relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(7, this.closest('th'))">Mesin <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-mesin', 'Mesin')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std border-r border-slate-500 col-shift relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(8, this.closest('th'))">Shift <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-shift', 'Shift')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std text-blue-300 col-jenis relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(9, this.closest('th'))">Jenis Item <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-jenis', 'Jenis Item')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-nama relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(10, this.closest('th'))">Nama Item <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-nama', 'Nama Item')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-pjg relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(11, this.closest('th'))">Pjg <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-pjg', 'Panjang')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-grade relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(12, this.closest('th'))">Grade <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-grade', 'Grade')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-dus relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(13, this.closest('th'))">Dus <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-dus', 'Dus')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std border-r border-slate-500 col-shading relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(14, this.closest('th'))">Shading <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-shading', 'Shading')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-po relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(15, this.closest('th'))">PO Bawaan <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-po', 'PO Bawaan')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-ket relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(16, this.closest('th'))">Keterangan <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-ket', 'Keterangan')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                            <th class="hdr-std col-pic relative">
                                <div class="flex items-center justify-center gap-1">
                                    <span class="cursor-pointer hover:text-blue-300 transition flex items-center gap-1" onclick="sortTable(17, this.closest('th'))">PIC Input <i data-lucide="arrow-up-down" class="w-3 h-3 sort-icon opacity-50"></i></span>
                                    <button onclick="openColumnFilter(event, 'col-pic', 'PIC Input')" class="p-1 hover:bg-slate-600 rounded transition"><i data-lucide="filter" class="w-3.5 h-3.5 filter-icon opacity-40 hover:opacity-100 text-white"></i></button>
                                </div>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="tbody-stbj" class="text-center text-slate-700">
                        <tr><td colspan="18" class="p-10 text-slate-400 font-bold"><i data-lucide="box" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data di-scan / di-import.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. BOTTOM FREEZE SECTION -->
        <div class="shrink-0 w-full bg-slate-50 p-2 sm:p-3 flex items-center justify-end z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300">
            <button id="btn-save" onclick="saveToDatabaseSTBJ()" class="w-full md:w-auto px-8 py-2.5 sm:py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-md flex items-center justify-center gap-2 text-sm tracking-wide cursor-pointer transition active:scale-95 uppercase border-b-4 border-emerald-800">
                <i data-lucide="save" class="w-5 h-5"></i> 
                <span>SIMPAN KE GUDANG</span>
                <span class="hidden sm:inline font-semibold text-[10px] ml-2 bg-emerald-800 px-2 py-1 rounded-md opacity-90">(Unik = Masuk, Duplikat = Hold)</span>
            </button>
        </div>
        
    </div>

    <!-- MODAL FILTER EXCEL -->
    <div id="excel-filter-menu" class="hidden absolute bg-white shadow-2xl border border-slate-300 rounded-lg w-64 z-[100] flex flex-col font-sans text-sm">
        <div class="p-3 border-b border-slate-200 bg-slate-100 flex justify-between items-center rounded-t-lg">
            <span class="font-black text-slate-700 text-xs uppercase tracking-wider" id="filter-col-name">Filter</span>
            <button onclick="closeFilterMenu()" class="text-slate-400 hover:text-rose-500 bg-white p-1 rounded transition shadow-sm"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>
        <div class="p-2 border-b border-slate-200 bg-white">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
                <input type="text" id="filter-search-input" oninput="searchFilterList(this.value)" class="w-full pl-8 p-1.5 text-xs font-bold border border-slate-300 bg-slate-50 rounded focus:border-blue-500 focus:bg-white outline-none transition" placeholder="Cari Spesifik...">
            </div>
        </div>
        <div class="p-2 max-h-48 overflow-y-auto flex flex-col gap-1 text-xs bg-white" id="filter-values-list"></div>
        <div class="p-2 border-t border-slate-200 bg-slate-50 flex justify-between gap-2 rounded-b-lg">
            <button onclick="clearFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded hover:bg-slate-100 transition shadow-sm">Reset</button>
            <button onclick="applyFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-white bg-blue-600 rounded hover:bg-blue-700 transition shadow-sm">Terapkan</button>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.body.style.overflow = 'hidden';
            const wmsMain = document.querySelector('main');
            if(wmsMain) {
                wmsMain.style.overflow = 'hidden';
                wmsMain.style.padding = '0'; 
            }
        });

        let currentTab = 'scan';
        let dataStbj = []; 
        let deletedStbjStack = []; 
        let masterKamus = [];
        let globalRowId = 0;
        let sortState = {}; 
        
        // REVISI: State Filter Excel
        let activeFilters = {}; 
        let currentFilterCol = '';

        const currentUser = JSON.parse(localStorage.getItem('user_session')) || {username: 'Admin'};

        document.addEventListener('DOMContentLoaded', async () => { 
            initModernLayout({ id: 'stbj', title: 'SCAN STBJ', url: 'stbj.html' }); 
            await loadInitialSTBJData();
        });

        // REVISI: Event Listener untuk menutup modal filter jika klik di luar
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('excel-filter-menu');
            if (menu && !menu.classList.contains('hidden')) {
                if (!menu.contains(e.target) && !e.target.closest('button[onclick^="openColumnFilter"]')) {
                    closeFilterMenu();
                }
            }
        });

        function toggleInputSTBJ() {
            const body = document.getElementById('body-input-stbj');
            const icon = document.getElementById('icon-toggle-input');
            if (body.classList.contains('hidden')) {
                body.classList.remove('hidden');
                icon.classList.remove('rotate-180');
            } else {
                body.classList.add('hidden');
                icon.classList.add('rotate-180');
            }
        }

        function sortTable(colIndex, headerEl) {
            const tbody = document.getElementById('tbody-stbj');
            const rows = Array.from(tbody.querySelectorAll('tr.row-stbj'));
            
            let isAsc = sortState[colIndex] !== 'asc';
            sortState[colIndex] = isAsc ? 'asc' : 'desc';
            
            rows.sort((a, b) => {
                let cellA = a.cells[colIndex];
                let cellB = b.cells[colIndex];
                
                let valA = cellA.querySelector('input') ? cellA.querySelector('input').value.trim() : cellA.innerText.trim();
                let valB = cellB.querySelector('input') ? cellB.querySelector('input').value.trim() : cellB.innerText.trim();
                
                let numA = parseFloat(valA);
                let numB = parseFloat(valB);
                
                if(!isNaN(numA) && !isNaN(numB)) {
                    return isAsc ? numA - numB : numB - numA;
                } else {
                    return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
            });
            
            rows.forEach(row => tbody.appendChild(row));
            
            document.querySelectorAll('.sort-icon').forEach(icon => {
                icon.setAttribute('data-lucide', 'arrow-up-down'); 
                icon.classList.add('opacity-50');

            const icon = headerEl.querySelector('.sort-icon');

        function translateBarcode(barcode) {
            let td = { tglProduksi: '-', mesin: '-', shift: '-', jenisItem: '-', namaItem: '-', panjang: '-', grade: '-', dus: '-', shading: '-', po: '-' };
            const parts = barcode.split('/'); if (parts.length < 4) return td;
            
            const hurufDepan = barcode.charAt(0).toUpperCase();
            if (hurufDepan === 'P') td.jenisItem = 'Plafon'; else if (hurufDepan === 'L') td.jenisItem = 'List'; else if (hurufDepan === 'W') td.jenisItem = 'WPC'; else td.jenisItem = hurufDepan;

            let rawItem = parts[0]; let cariItem = masterKamus.find(m => m.kode_nama_item === rawItem); 
            td.namaItem = cariItem && cariItem.nama_item ? cariItem.nama_item : rawItem; td.shading = parts[1];
            
            const p2 = parts[2];
            if (p2 && p2.length >= 4) {
                let digitPjg = (p2.length === 5) ? 2 : 1; let rawPjg = p2.substring(0, digitPjg);
                td.panjang = (digitPjg === 1) ? rawPjg + "M" : rawPjg[0] + "." + rawPjg[1] + "M"; 
                let rawGrade = p2.substring(digitPjg, digitPjg + 1); td.grade = rawGrade === '1' ? 'BAGUS' : (rawGrade === '2' ? 'A' : rawGrade);
                let rawDus = p2.substring(p2.length - 2); let cariDus = masterKamus.find(m => m.kode_dus === rawDus); td.dus = cariDus && cariDus.dus ? cariDus.dus : rawDus;
            }
            const p3 = parts[3];
            if (p3.length >= 5) {
                const dayOfYear = parseInt(p3.substring(0, 3)); const realYear = parseInt('20' + p3.substring(3, 5).split('').reverse().join(''));
                const dateObj = new Date(realYear, 0); dateObj.setDate(dayOfYear);
                td.tglProduksi = `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
                let sisaString = p3.substring(5); let match = sisaString.match(/(C.*?)(S.*?)(P.*)/);
                if (match) {
                    let cariMesin = masterKamus.find(m => m.kode_mesin === match[1]); td.mesin = cariMesin && cariMesin.mesin ? cariMesin.mesin : match[1];
                    let cariShift = masterKamus.find(m => m.kode_shift === match[2]); td.shift = cariShift && cariShift.shift ? cariShift.shift : match[2];
                    let cariPO = masterKamus.find(m => m.kode_po === match[3]); td.po = cariPO && cariPO.po ? cariPO.po : match[3];
                }
            }
            return td;
        }

        function prosesCSV() {
            const troli = document.getElementById('select-troli').value;

            if(!fileInput.files.length) return alert("Pilih file CSV!");

                header: false, skipEmptyLines: true,
                complete: function(results) {
                    let added = 0;
                    results.data.forEach(row => {
                        const code = row[0] ? row[0].trim() : '';

                            const isLocalDuplicate = dataStbj.some(d => d.qrcode === code);
                            const trans = translateBarcode(code);
                            
                            dataStbj.push({ 
                                id: ++globalRowId,

                                pic: currentUser.username,

        function initResizableColumns() {
            const cols = document.querySelectorAll('#table-stbj th');
            cols.forEach(col => {
                // Hapus resizer lama jika ada
                const existing = col.querySelector('.resizer');
                if(existing) existing.remove();

                // Buat elemen div transparan di sisi kanan TH
                const resizer = document.createElement('div');
                resizer.classList.add('resizer');
                col.appendChild(resizer);
                
                createResizableColumn(col, resizer);
            });
        }

        function createResizableColumn(col, resizer) {
            let x = 0;
            let w = 0;

            const mouseDownHandler = function(e) {
                x = e.clientX;
                const styles = window.getComputedStyle(col);
                w = parseInt(styles.width, 10);

                document.addEventListener('mousemove', mouseMoveHandler);
                document.addEventListener('mouseup', mouseUpHandler);
                resizer.classList.add('resizing');
            };

            const mouseMoveHandler = function(e) {
                const dx = e.clientX - x;
                col.style.width = `${w + dx}px`;
                col.style.minWidth = `${w + dx}px`;
            };

            const mouseUpHandler = function() {
                document.removeEventListener('mousemove', mouseMoveHandler);
                document.removeEventListener('mouseup', mouseUpHandler);
                resizer.classList.remove('resizing');
            };

            resizer.addEventListener('mousedown', mouseDownHandler);
        }

        async function cekGudangSTBJ() {
            if(dataStbj.length === 0) return alert("Belum ada data.");
            const btn = document.getElementById('btn-cek-gudang'); const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> MENCEK DB...'; btn.disabled = true;

            const allQRs = dataStbj.map(d => d.qrcode);
            try {
                const { data: resStokGlobal, error } = await db.from('stok_global').select('qrcode').in('qrcode', allQRs);
                if(error) throw error;
                
                const existingGlobal = resStokGlobal.map(d => d.qrcode);

                let infoDuplikat = 0;
                dataStbj.forEach(d => {
                    if(d.status === 'HOLD') return; 
                    
                    if (existingGlobal.includes(d.qrcode)) {
                        d.status = 'SUDAH STBJ'; 
                        d.keterangan = 'SUDAH ADA DI STOK GLOBAL';
                        infoDuplikat++;
                    } else if (d.isLocalDuplicate) {
                        d.status = 'DUPLIKAT SCAN';
                    } else {
                        d.status = 'BELUM STBJ'; 
                    }
                });

                renderTable();
                if(infoDuplikat > 0) alert(`Verifikasi Selesai!\nDitemukan ${infoDuplikat} data DUPLIKAT (sudah ada di Stok Global).`);
                else alert("Verifikasi Selesai!\nSemua data UNIK (Belum STBJ) dan aman untuk disimpan.");

            } catch (err) { alert("Gagal cek database: " + err.message); }
            finally { btn.innerHTML = ori; btn.disabled = false; lucide.createIcons(); }
        }

        async function saveToDatabaseSTBJ() {
            if(dataStbj.length === 0) return alert('Data kosong!');
            const blmCek = dataStbj.filter(d => d.status === 'BELUM CEK');
            if(blmCek.length > 0) return alert('Tekan tombol Verifikasi Kode terlebih dahulu sebelum menyimpan!');

            const btn = document.getElementById('btn-save'); const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> MEMPROSES...'; btn.disabled = true;

            const UNIKs = dataStbj.filter(d => d.status === 'BELUM STBJ');
            const dupes = dataStbj.filter(d => d.status === 'SUDAH STBJ' || d.status === 'DUPLIKAT SCAN' || d.status === 'HOLD');

            const mapToSchema = (d, finalStatus) => ({
                troli: d.troli,
                qrcode: d.qrcode,
                tgl_produksi: d.tglProduksi,
                shift: d.shift,
                mesin: d.mesin,
                jenis_item: d.jenisItem, 
                nama_item: d.namaItem,
                panjang: d.panjang,
                grade: d.grade,
                dus: d.dus,
                shading: d.shading,
                po_bawaan: d.po,
                keterangan: d.keterangan || '-',
                status: finalStatus,
                status_data: 'BELUM',
                posisi: 'TROLI',
                pic_input: d.pic,
                created_at: new Date().toISOString() 
            });

            try {
                if(UNIKs.length > 0) {
                    const payloadGlobal = UNIKs.map(d => mapToSchema(d, 'SUDAH STBJ'));
                    const { error: err1 } = await db.from('stok_global').insert(payloadGlobal);
                    if(err1) throw err1;
                }
                
                if(dupes.length > 0) {
                    const payloadHold = dupes.map(d => mapToSchema(d, 'HOLD'));
                    const { error: err2 } = await db.from('hold_stbj').insert(payloadHold);
                    if(err2) throw err2;
                }

                alert(`BERHASIL DISIMPAN!\n- ${UNIKs.length} Barang UNIK masuk ke Stok Global\n- ${dupes.length} Barang Hold/Duplikat masuk ke Hold STBJ`);
                dataStbj = []; renderTable();
                document.querySelector('input[onchange="toggleAll(this.checked)"]').checked = false;
            } catch (err) { alert('GAGAL MENYIMPAN: ' + err.message); } 
            finally { btn.innerHTML = ori; btn.disabled = false; lucide.createIcons(); }
        }
    </script>
</body>
</html>
