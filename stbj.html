<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input STBJ - WMS Sunpevece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Fokus otomatis ke input barcode agar PIC tidak perlu klik manual */
        #barcodeInput:focus {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans pb-20">

    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="index.html" class="p-2 hover:bg-blue-700 rounded transition">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </a>
            <h1 class="text-lg font-bold tracking-wide">STBJ PRODUKSI</h1>
        </div>
        <img src="logo.png" alt="Logo" class="h-8 bg-white p-1 rounded">
    </header>

    <main class="p-4 max-w-2xl mx-auto space-y-4">
        
        <div class="bg-white p-5 rounded-2xl shadow-sm border-2 border-blue-100">
            <label class="block text-sm font-bold text-blue-800 mb-2">SCAN KODE BARCODE / QR</label>
            <input type="text" id="barcodeInput" autofocus 
                class="w-full p-4 text-xl border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 bg-blue-50 font-mono"
                placeholder="Arahkan scanner di sini...">
            <p class="text-[10px] text-gray-400 mt-2 italic">*Sistem akan otomatis memproses setelah scan</p>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3 border border-gray-200">
            <div class="flex justify-between items-center border-b pb-2 mb-2">
                <h2 class="font-bold text-gray-700 uppercase">Detail Produksi</h2>
                <span id="statusBadge" class="hidden px-3 py-1 bg-green-100 text-green-700 text-xs font-bold rounded-full">TERVERIFIKASI</span>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-500">TGL PRODUKSI</label>
                    <input type="text" id="tgl_produksi" class="w-full border-b p-1 text-sm bg-gray-50" readonly>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-500">SHIFT</label>
                    <input type="text" id="shift" class="w-full border-b p-1 text-sm bg-gray-50" readonly>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-500">MESIN</label>
                    <input type="text" id="mesin" class="w-full border-b p-1 text-sm bg-gray-50" readonly>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-500">GRADE</label>
                    <input type="text" id="grade" class="w-full border-b p-1 text-sm bg-gray-50" readonly>
                </div>
            </div>

            <div class="pt-2">
                <label class="text-[10px] font-bold text-gray-500">NAMA ITEM</label>
                <input type="text" id="nama_item" class="w-full border-b p-1 text-sm bg-gray-50 font-bold" readonly>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-500">PANJANG</label>
                    <input type="text" id="panjang" class="w-full border-b p-1 text-sm bg-gray-50" readonly>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-500">PO</label>
                    <input type="text" id="po" class="w-full border-b p-1 text-sm bg-gray-50" readonly>
                </div>
            </div>

            <div class="bg-yellow-50 p-4 rounded-xl text-center border border-yellow-200">
                <label class="block text-xs font-bold text-yellow-700 mb-1 uppercase">Jumlah (Qty)</label>
                <span id="qtyDisplay" class="text-4xl font-black text-blue-900">0</span>
            </div>
        </div>

        <div class="overflow-x-auto bg-white rounded-xl shadow-inner border border-gray-200">
            <table class="min-w-full text-xs text-left">
                <thead class="bg-gray-100 text-gray-600 uppercase font-bold">
                    <tr>
                        <th class="px-3 py-2">No</th>
                        <th class="px-3 py-2">Kode Barcode</th>
                        <th class="px-3 py-2">Status</th>
                    </tr>
                </thead>
                <tbody id="tempTableBody" class="divide-y divide-gray-100">
                    </tbody>
            </table>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 flex gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
        <button onclick="undoScan()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-300 transition">
            UNDO
        </button>
        <button onclick="saveSTBJ()" class="flex-[2] bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 shadow-lg transition">
            SAVE DATA
        </button>
        <button onclick="lanjutSTBJ()" class="flex-1 bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 shadow-lg transition">
            LANJUT
        </button>
    </div>

    <audio id="beepOk" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="beepError" src="https://assets.mixkit.co/active_storage/sfx/2681/2681-preview.mp3"></audio>

    <script>
        let tempScans = [];

        // Fokus otomatis saat buka laman
        window.onload = () => document.getElementById('barcodeInput').focus();

        // Logika saat input di-Enter (Simulasi Scan)
        document.getElementById('barcodeInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const val = this.value.trim();
                if (val) {
                    processScan(val);
                }
                this.value = ''; // Kosongkan input untuk scan berikutnya
            }
        });

        function processScan(code) {
            // Sistem penolakan double scan
            if (tempScans.includes(code)) {
                document.getElementById('beepError').play();
                alert('Warning: Kode ' + code + ' sudah di-scan!');
                return;
            }

            tempScans.push(code);
            document.getElementById('beepOk').play();
            
            // Update Tabel Sementara
            updateTable();

            // Simulasi Parsing Barcode NGLSYSP/WT/4/12662/05201
            // Disini nantinya kita sambungkan ke tabel "database_kode_unik" di Supabase
            // Untuk sekarang kita tampilkan parsing sederhana
            parseBarcodeData(code);
        }

        function parseBarcodeData(code) {
            // Contoh parsing jika formatnya dipisah '/'
            const parts = code.split('/');
            if (parts.length >= 4) {
                document.getElementById('tgl_produksi').value = '20-05-2026'; // Contoh statis
                document.getElementById('shift').value = 'Shift 1';
                document.getElementById('mesin').value = parts[2] || '-';
                document.getElementById('grade').value = 'A';
                document.getElementById('nama_item').value = 'Plafon Type ' + parts[1];
                document.getElementById('panjang').value = '4 Meter';
                document.getElementById('po').value = parts[3] || '-';
                
                // Qty dihitung dari jumlah baris scan
                document.getElementById('qtyDisplay').innerText = tempScans.length;
                document.getElementById('statusBadge').classList.remove('hidden');
            }
        }

        function updateTable() {
            const tbody = document.getElementById('tempTableBody');
            tbody.innerHTML = '';
            tempScans.forEach((code, index) => {
                const row = `<tr>
                    <td class="px-3 py-2">${index + 1}</td>
                    <td class="px-3 py-2 font-mono">${code}</td>
                    <td class="px-3 py-2 text-green-600"><i class="fa-solid fa-check"></i> OK</td>
                </tr>`;
                tbody.insertAdjacentHTML('afterbegin', row);
            });
        }

        function undoScan() {
            if (tempScans.length > 0) {
                tempScans.pop();
                updateTable();
                document.getElementById('qtyDisplay').innerText = tempScans.length;
                if (tempScans.length === 0) {
                    document.getElementById('statusBadge').classList.add('hidden');
                }
            }
        }

        function saveSTBJ() {
            if (tempScans.length === 0) {
                alert('Tidak ada data untuk disimpan!');
                return;
            }
            alert('Data berhasil disimpan ke tabel hasil_stbj!');
            // Logika simpan ke Supabase akan diletakkan di sini
        }

        function lanjutSTBJ() {
            // Reset semua field untuk scan bundling baru
            tempScans = [];
            updateTable();
            document.getElementById('qtyDisplay').innerText = '0';
            document.getElementById('statusBadge').classList.add('hidden');
            document.getElementById('barcodeInput').focus();
        }
    </script>
</body>
</html>
