<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Riwayat Mutasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans">
    <div class="w-full">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="overflow-x-auto w-full max-h-[70vh] hide-scrollbar">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std border-r border-slate-500">WAKTU MUTASI</th>
                            <th class="hdr-std border-r border-slate-500">PIC</th>
                            <th class="hdr-std text-left pl-4">Detail Perubahan PO</th>
                        </tr>
                    </thead>
                    <tbody id="data-body"><tr><td colspan="4" class="text-center p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-3 text-slate-500"></i><p class="font-bold text-slate-500">Memuat Riwayat...</p></td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initModernLayout({ id: 'riwayat_mutasi', title: 'RIWAYAT MUTASI', url: 'riwayat_mutasi.html' });
            setTimeout(() => { loadData(); }, 200);
        });

        async function loadData() {
            try {
                // BUG FIX: Menggunakan 'created_at' bukan 'waktu'
                const { data, error } = await db.from('log_mutasi').select('*').eq('aktifitas', 'GANTI PO (CS)').order('created_at', {ascending: false}).limit(200);
                if(error) throw error;
                
                const tbody = document.getElementById('data-body');
                if(!data || data.length === 0) { 
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center p-10 text-slate-500 font-bold">Belum ada riwayat mutasi PO.</td></tr>`; 
                    lucide.createIcons(); return; 
                }

                let html = ''; 
                data.forEach((r, i) => {
                    const date = new Date(r.created_at).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    html += `
                        <tr class="border-b border-slate-200 hover:bg-slate-100 transition">
                            <td class="p-4 text-center font-bold text-slate-400">${i+1}</td>
                            <td class="p-4 text-center font-black text-slate-700 border-r border-slate-200">${date}</td>
                            <td class="p-4 text-center font-bold text-slate-700 uppercase border-r border-slate-200">${r.pic}</td>
                            <td class="p-4 font-medium text-slate-800 whitespace-normal min-w-[300px] leading-relaxed">${r.detail}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html; lucide.createIcons();
            } catch (err) {
                document.getElementById('data-body').innerHTML = `<tr><td colspan="4" class="p-10 text-center text-red-500 font-bold">Error: ${err.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
