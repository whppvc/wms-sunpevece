<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Dashboard Utama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg-main: #f8fafc; --bg-box: #ffffff; --text-main: #1f2937; --border-color: #e2e8f0; --theme-main: #2563eb; --theme-hover: #1d4ed8;}
        body[data-bg="dark"] { --bg-main: #0f172a; --bg-box: #1e293b; --text-main: #f8fafc; --border-color: #334155; }
        body[data-bg="grey"] { --bg-main: #e2e8f0; --bg-box: #f1f5f9; --text-main: #0f172a; --border-color: #cbd5e1; }
        body { background-color: var(--bg-main); color: var(--text-main); transition: background 0.3s ease; min-height: 100vh;}
        .card-dynamic { background-color: var(--bg-box); border-color: var(--border-color); }
        .bg-theme { background-color: var(--theme-main); color: #fff; }
        body[data-ui="formal"] .menu-card { background: var(--bg-box); border: 1px solid var(--border-color); border-left: 6px solid var(--theme-main); flex-direction: row; align-items: center; justify-content: flex-start; gap: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        body[data-ui="modern"] .menu-card { background: linear-gradient(135deg, var(--theme-main), var(--theme-hover)); color: white; border: none; flex-direction: column; }
    </style>
</head>
<body id="app-body" data-bg="light" data-ui="formal" class="font-sans">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-[60] hidden backdrop-blur-sm transition-all"></div>
    <div id="sidebar-menu" class="fixed top-0 left-0 h-full w-64 card-dynamic shadow-2xl z-[70] transform -translate-x-full transition-transform duration-300 flex flex-col border-r">
        <div class="p-5 border-b flex justify-between items-center bg-blue-50/50">
            <h2 class="font-black text-blue-700 text-lg flex items-center gap-2"><i data-lucide="layers" class="w-5 h-5"></i> WMS Menu</h2>
            <button onclick="toggleSidebar()" class="p-2 text-gray-500 hover:text-red-500 rounded-full bg-white shadow-sm cursor-pointer transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-2 overflow-y-auto flex-grow">
            <a href="menu.html" class="flex items-center gap-3 p-3 rounded-xl bg-blue-600 text-white font-bold shadow-md"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
            <a href="stbj.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="scan-barcode" class="w-5 h-5"></i> Scan STBJ</a>
            <a href="hasil_stbj.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="file-spreadsheet" class="w-5 h-5"></i> Laporan STBJ</a>
            <a href="data_control.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="settings-2" class="w-5 h-5"></i> Data Control</a>
        </div>
    </div>

    <nav class="card-dynamic shadow-sm px-4 py-3 flex items-center justify-between sticky top-0 z-40 border-b">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-full transition cursor-pointer active:scale-95 shadow-inner"><i data-lucide="menu" class="w-5 h-5"></i></button>
            <div class="flex flex-col ml-1">
                <span class="font-extrabold text-lg tracking-wide leading-tight text-blue-700">PORTAL WMS</span>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <div class="relative">
                <button id="btn-profile" class="w-10 h-10 bg-blue-600 font-bold rounded-full flex items-center justify-center text-white shadow-md border-2 border-blue-200 cursor-pointer" id="profile-initial">U</button>
                <div id="profile-menu" class="hidden absolute right-0 mt-2 w-48 card-dynamic rounded-xl shadow-xl py-2 z-50 border">
                    <div class="px-4 py-2 border-b border-gray-200/20 text-xs font-bold mb-1 opacity-70" id="user-role-display">Role: User</div>
                    <button onclick="localStorage.clear(); window.location.href='index.html'" class="w-full text-left px-4 py-2 hover:bg-red-500/10 text-red-600 font-bold text-sm flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="w-full max-w-7xl mx-auto p-4 md:p-8 pt-8">
        <div id="menu-grid" class="grid grid-cols-1 gap-4">
            <div class="col-span-full p-10 flex flex-col items-center justify-center opacity-50">
                <i data-lucide="loader-2" class="animate-spin w-8 h-8 mb-2 text-blue-600"></i>
                <p class="font-bold">Menyelaraskan Menu...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://mjpqzftwbyrbvbvmarol.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcHF6ZnR3YnlyYnZidm1hcm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA0MTgsImV4cCI6MjA5NDE1NjQxOH0.0VT56HA-cGB4CP3u89PShcddt9jARh85KKMgnwCkse4';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const masterMenus = [
            { id: 'stbj', title: 'Stbj', icon: 'clipboard-check', redirect: 'stbj.html' },
            { id: 'hasil_stbj', title: 'Hasil Laporan Stbj', icon: 'file-spreadsheet', redirect: 'hasil_stbj.html' },
            { id: 'scan_input', title: 'Scan & Input', icon: 'scan-barcode' },
            { id: 'data_control', title: 'Data Control', icon: 'settings-2', redirect: 'data_control.html' },
            { id: 'langsir', title: 'Langsir', icon: 'arrow-right-left' },
            { id: 'riwayat_langsir', title: 'Riwayat Langsir', icon: 'history' },
            { id: 'kartu_stok', title: 'Kartu Stok', icon: 'layers' }
        ];

        let currentUser = null;

        window.onload = async () => {
            lucide.createIcons();
            const sessionData = localStorage.getItem('user_session');
            if (!sessionData) { window.location.href = 'index.html'; return; }
            currentUser = JSON.parse(sessionData);
            document.getElementById('profile-initial').innerText = currentUser.username.charAt(0).toUpperCase();
            document.getElementById('user-role-display').innerText = "Role: " + currentUser.role;
            
            document.body.setAttribute('data-bg', localStorage.getItem('app_bg') || 'light');
            await fetchMenus();
        };

        async function fetchMenus() {
            const grid = document.getElementById('menu-grid');
            const { data: aksesData, error } = await db.from('menu_access').select('*').order('sort_order', { ascending: true });
            
            grid.innerHTML = '';
            if(error) return;

            aksesData.forEach(akses => {
                let allowed = akses.allowed_users ? akses.allowed_users.split(',').map(s=>s.trim()) : [];
                if (currentUser.role === 'Creator' || allowed.includes(currentUser.username)) {
                    let menuAsli = masterMenus.find(m => m.id === akses.menu_id);
                    if(!menuAsli) return;
                    const card = document.createElement('div');
                    card.className = `menu-card p-6 rounded-2xl transition-all duration-300 cursor-pointer flex group w-full hover:-translate-y-1 active:scale-95`;
                    card.innerHTML = `<div class="menu-icon mb-2 group-hover:scale-110 transition-transform"><i data-lucide="${menuAsli.icon}" class="w-10 h-10"></i></div><div class="font-bold text-lg tracking-wide">${menuAsli.title}</div>`;
                    card.onclick = () => { if(menuAsli.redirect) window.location.href = menuAsli.redirect; else alert(menuAsli.title + ' sedang dikembangkan.'); };
                    grid.appendChild(card);
                }
            });
            lucide.createIcons();
        }

        function toggleSidebar() {
            document.getElementById('sidebar-menu').classList.toggle('-translate-x-full');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        // LOGIKA PROFIL DROPDOWN
        const btnProfile = document.getElementById('btn-profile');
        const profileMenu = document.getElementById('profile-menu');
        btnProfile.addEventListener('click', (e) => { e.stopPropagation(); profileMenu.classList.toggle('hidden'); });
        window.addEventListener('click', (e) => { if (!btnProfile.contains(e.target) && !profileMenu.contains(e.target)) profileMenu.classList.add('hidden'); });
    </script>
</body>
</html>
