<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans antialiased text-slate-800 bg-slate-50">

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div onclick="window.location.href='langsir.html'" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:shadow-lg hover:border-emerald-300 transition-all cursor-pointer group">
            <div class="flex items-start justify-between">
                <div>
                    <p class="text-slate-500 font-bold text-xs uppercase tracking-wider mb-1">Inbound</p>
                    <h3 class="text-xl font-black text-slate-800 group-hover:text-emerald-600 transition">Langsir Gudang</h3>
                </div>
                <div class="bg-emerald-100 p-3 rounded-xl text-emerald-600"><i data-lucide="log-in" class="w-6 h-6"></i></div>
            </div>
            <p class="text-sm text-slate-500 mt-4">Penerimaan barang jadi dari produksi ke dalam gudang fisik.</p>
        </div>

        <div onclick="window.location.href='keluar.html'" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:shadow-lg hover:border-rose-300 transition-all cursor-pointer group">
            <div class="flex items-start justify-between">
                <div>
                    <p class="text-slate-500 font-bold text-xs uppercase tracking-wider mb-1">Outbound</p>
                    <h3 class="text-xl font-black text-slate-800 group-hover:text-rose-600 transition">Pengiriman Keluar</h3>
                </div>
                <div class="bg-rose-100 p-3 rounded-xl text-rose-600"><i data-lucide="truck" class="w-6 h-6"></i></div>
            </div>
            <p class="text-sm text-slate-500 mt-4">Pemotongan stok fisik & virtual berdasarkan PO tujuan.</p>
        </div>

        <div onclick="window.location.href='kartu_stok.html'" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 hover:shadow-lg hover:border-blue-300 transition-all cursor-pointer group">
            <div class="flex items-start justify-between">
                <div>
                    <p class="text-slate-500 font-bold text-xs uppercase tracking-wider mb-1">Inventory</p>
                    <h3 class="text-xl font-black text-slate-800 group-hover:text-blue-600 transition">Kartu Stok & Mutasi</h3>
                </div>
                <div class="bg-blue-100 p-3 rounded-xl text-blue-600"><i data-lucide="layers" class="w-6 h-6"></i></div>
            </div>
            <p class="text-sm text-slate-500 mt-4">Pantau saldo virtual dan alokasi pergantian PO aktual.</p>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        // Panggil Mesin UI saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            initModernLayout('dashboard', 'Dashboard Utama');
        });
    </script>
</body>
</html>
