<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Input Stok Opname</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="global.js"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active { border-bottom: 3px solid #b45309; color: #b45309; font-weight: 900; background-color: #fffbeb; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; padding: 0.75rem 1rem !important; font-size: 0.75rem !important; font-weight: 600 !important; text-transform: uppercase !important; white-space: nowrap !important; position: sticky !important; top: 0 !important; z-index: 20 !important; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER TABS -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200 shadow-sm">
            <div class="flex justify-between items-center border-b border-slate-200 bg-white px-2">
                <div class="flex overflow-x-auto hide-scrollbar">
                    <button onclick="switchTab('pic')" id="tab-pic" class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="user" class="w-4 h-4"></i> Data Saya</button>
                    <button onclick="switchTab('all')" id="tab-all" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="database" class="w-4 h-4"></i> Semua Data</button>
                </div>
                <div class="flex items-center gap-3 pr-4">
                    <span class="text-xs font-black text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200" id="lbl-pic-aktif">PIC: -</span>
                    <button onclick="logoutOpname()" class="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold rounded-lg text-xs transition flex items-center gap-1"><i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar</button>
                </div>
            </div>
        </div>

        <!-- MAIN WORKSPACE -->
        <div class="flex-1 flex flex-col md:flex-row min-h-0 bg-slate-100">
            
            <!-- PANEL KIRI (FORM INPUT) -->
            <div class="w-full md:w-1/3 lg:w-1/4 bg-white border-r border-slate-300 flex flex-col min-h-0 shadow-md z-10">
                <div class="p-3 bg-amber-50 border-b border-amber-200 shrink-0">
                    <h3 class="font-black text-amber-800 text-xs uppercase flex items-center gap-2"><i data-lucide="edit-3" class="w-4 h-4"></i> Form Input Opname</h3>
                </div>
                <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-4">
                    <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="date" id="o-tgl" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50"></div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Area</label>
                        <input type="text" id="o-area" list="dl-area" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 uppercase" placeholder="Ketik/Pilih Area..." autocomplete="off">
                        <datalist id="dl-area"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label>
                        <input type="text" id="o-mesin" list="dl-mesin" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 uppercase" placeholder="Ketik/Pilih Mesin..." autocomplete="off">
                        <datalist id="dl-mesin"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label>
                        <input type="text" id="o-shift" list="dl-shift" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 uppercase" placeholder="Ketik/Pilih Shift..." autocomplete="off">
                        <datalist id="dl-shift"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label>
                        <select id="o-jenis" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 cursor-pointer">
                            <option value="Plafon">Plafon</option>
                            <option value="Lis">Lis</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label>
                        <input type="text" id="o-item" list="dl-item" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 uppercase" placeholder="Ketik/Pilih Item..." autocomplete="off">
                        <datalist id="dl-item"></datalist>
                    </div>
                    <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang (M)</label><input type="text" id="o-panjang" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 uppercase" placeholder="Cth: 4 atau 5.95"></div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label>
                        <input type="text" id="o-grade" list="dl-grade" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 uppercase" placeholder="Ketik/Pilih Grade..." autocomplete="off">
                        <datalist id="dl-grade"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus / Merk</label>
                        <input type="text" id="o-dus" list="dl-dus" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 uppercase" placeholder="Ketik/Pilih Dus..." autocomplete="off">
                        <datalist id="dl-dus"></datalist>
                    </div>
                    <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="o-shading" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 uppercase" placeholder="Cth: WT-1"></div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Customer (PO)</label>
                        <input type="text" id="o-po" list="dl-po" class="w-full p-2 text-sm border border-slate-300 rounded outline-none font-bold bg-slate-50 uppercase" placeholder="Ketik/Pilih PO..." autocomplete="off">
                        <datalist id="dl-po"></datalist>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-amber-600 mb-1">QTY (DUS)</label>
                        <input type="number" id="o-qty" value="1" min="1" class="w-full p-3 text-lg border-2 border-amber-300 rounded outline-none focus:border-amber-600 font-black text-center bg-amber-50 text-amber-800">
                    </div>
                </div>
                <div class="p-3 bg-white border-t border-slate-200 shrink-0">
                    <button onclick="simpanOpname()" id="btn-simpan-opname" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-black rounded-lg shadow-md text-xs uppercase transition active:scale-95 flex justify-center items-center gap-2 border-b-4 border-amber-800"><i data-lucide="save" class="w-4 h-4"></i> Simpan Data</button>
                </div>
            </div>

            <!-- PANEL KANAN (TABEL DATA) -->
            <div class="flex-1 flex flex-col min-w-0 bg-slate-200 relative p-4">
                <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden flex flex-col">
                    <div class="p-3 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
                        <h3 class="font-black text-slate-700 text-xs uppercase flex items-center gap-2"><i data-lucide="table" class="w-4 h-4 text-blue-600"></i> Data Tersimpan</h3>
                        <button onclick="loadDataOpname()" class="p-1.5 bg-white border border-slate-300 text-slate-600 rounded hover:bg-slate-100 transition shadow-sm active:scale-95"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
                    </div>
                    <div class="flex-1 overflow-y-auto custom-scroll">
                        <table class="w-full text-center border-collapse text-sm whitespace-nowrap">
                            <thead class="sticky top-0 z-10">
                                <tr>
                                    <th class="hdr-std w-12">No</th>
                                    <th class="hdr-std">Tgl Produksi</th>
                                    <th class="hdr-std">Area</th>
                                    <th class="hdr-std">Mesin</th>
                                    <th class="hdr-std">Shift</th>
                                    <th class="hdr-std">Jenis Item</th>
                                    <th class="hdr-std">Nama Item</th>
                                    <th class="hdr-std">Panjang</th>
                                    <th class="hdr-std">Grade</th>
                                    <th class="hdr-std">Dus</th>
                                    <th class="hdr-std">Shading</th>
                                    <th class="hdr-std">PO</th>
                                    <th class="hdr-std text-amber-300">QTY</th>
                                    <th class="hdr-std">PIC</th>
                                </tr>
                            </thead>
                            <tbody id="tbody-opname" class="text-slate-700">
                                <tr><td colspan="14" class="p-10 text-slate-400 font-bold"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto mb-2"></i> Memuat data...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL LOGIN OPNAME -->
    <div id="modal-login-opname" class="fixed inset-0 flex items-center justify-center bg-slate-900/80 z-[100] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-200 text-center">
            <h3 class="text-lg font-black mb-1 text-slate-800 flex items-center justify-center gap-2"><i data-lucide="user-check" class="text-amber-600"></i> Login Stok Opname</h3>
            <p class="text-xs font-bold text-slate-500 mb-5">Masukkan identitas Anda untuk mencatat data.</p>
            <div class="space-y-4 mb-6 text-left">
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama PIC</label>
                    <input type="text" id="input-opname-pic" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-amber-500 font-black text-slate-800 bg-slate-50 uppercase" placeholder="Nama Anda..." autocomplete="off">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Password / PIN</label>
                    <input type="password" id="input-opname-pass" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-amber-500 font-black text-center text-lg tracking-[0.5em] text-slate-800 bg-slate-50" placeholder="••••">
                </div>
            </div>
            <button type="button" onclick="loginOpname()" class="w-full py-3 bg-amber-600 hover:bg-amber-700 text-white font-black rounded-xl shadow-md text-xs uppercase transition active:scale-95 border-b-4 border-amber-800">Masuk</button>
        </div>
    </div>

    <script src="input_opname_logic.js"></script>
</body>
</html>
