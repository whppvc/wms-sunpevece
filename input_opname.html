<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Input Stok Opname</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .selected-row { border-color: #2563eb !important; background-color: #dbeafe !important; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <div class="shrink-0 bg-white flex flex-col z-20 shadow-[0_4px_10px_-3px_rgba(0,0,0,0.05)] border-b border-slate-200">
            
            <!-- SELECT ALL & QTY & FILTER -->
            <div class="flex justify-between items-center px-3 py-3 bg-white border-b border-slate-200">
                <div class="flex items-center gap-2">
                    <input type="checkbox" onchange="toggleAll(this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer border-slate-400" id="cb-all">
                    <label for="cb-all" class="text-[11px] font-black text-slate-500 uppercase tracking-wide cursor-pointer">Pilih Semua</label>
                </div>
                <div class="flex items-center gap-2">
                    <div class="bg-emerald-50 border border-emerald-300 px-3 py-1.5 rounded text-emerald-800 text-[11px] font-black shadow-sm uppercase tracking-wider">
                        Total Qty: <span id="lbl-tampil-baris" class="text-slate-900 text-[13px] ml-1">0</span> Dus
                    </div>
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION (CARD VIEW YANG LEBIH BESAR) -->
        <div class="flex-1 min-h-0 bg-slate-200 p-2 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 bg-white border border-slate-300 shadow-inner overflow-y-auto custom-scroll" id="scroll-container">
                <div id="tbody-opname" class="flex flex-col gap-0 w-full"></div>
            </div>
        </div>

        <!-- FOOTER ACTION (4 KOTAK BOTTOM BAR) -->
        <div class="shrink-0 w-full bg-slate-50 p-2 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300 pb-4">
            <div class="grid grid-cols-4 gap-2 h-[55px]">
                
                <!-- KOTAK 1: ADD (Langsung Buka Modal) -->
                <button onclick="bukaModalAdd()" class="w-full h-full bg-[#0f172a] hover:bg-black text-white flex flex-col justify-center items-center shadow-md active:scale-95 transition rounded border-b-4 border-slate-900">
                    <i data-lucide="plus" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </button>

                <!-- KOTAK 2: VERIFIKASI -->
                <button onclick="verifikasiOpname()" id="btn-verifikasi" class="w-full h-full bg-blue-600 hover:bg-blue-700 text-white font-black shadow-md flex flex-col items-center justify-center gap-1 text-[9px] sm:text-[11px] cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-blue-800 leading-none">
                    <i data-lucide="shield-check" class="w-4 h-4 sm:w-5 sm:h-5"></i> Verifikasi
                </button>

                <!-- KOTAK 3: SIMPAN -->
                <button id="btn-save" onclick="simpanOpnameKeGudang()" class="w-full h-full bg-[#058c5e] hover:bg-[#04724d] text-white font-black shadow-md flex flex-col items-center justify-center gap-1 text-[9px] sm:text-[11px] cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-[#035237] leading-none">
                    <i data-lucide="save" class="w-4 h-4 sm:w-5 sm:h-5"></i> Simpan
                </button>

                <!-- KOTAK 4: LAINNYA (DROPUP UNDO) -->
                <div class="relative w-full h-full">
                    <button onclick="toggleMoreMenu(event)" class="w-full h-full bg-slate-700 hover:bg-slate-800 text-white font-black shadow-md flex flex-col items-center justify-center gap-1 text-[9px] sm:text-[11px] cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-slate-900 leading-none">
                        <i data-lucide="more-horizontal" class="w-4 h-4 sm:w-5 sm:h-5"></i> Lainnya
                    </button>
                    
                    <div id="dropup-more" class="hidden absolute bottom-full right-0 mb-2 w-48 bg-white shadow-2xl rounded-xl border border-slate-200 z-50 flex flex-col overflow-hidden">
                        <button onclick="undoHapusOpname(); toggleMoreMenu(event)" class="text-left px-5 py-4 border-b border-slate-100 text-sm font-bold text-rose-600 flex items-center gap-3 hover:bg-slate-50 active:bg-slate-100 transition"><i data-lucide="rotate-ccw" class="w-5 h-5"></i> Undo Hapus</button>
                    </div>
                </div>

            </div>
        </div>
        
    </div>

    <!-- MODAL ADD SCAN OPNAME -->
    <div id="modal-add-scan" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="scan-line" class="w-5 h-5 text-emerald-600"></i> INPUT STOK OPNAME</h3>
                <button type="button" onclick="tutupModalAdd()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="form-scan" class="flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Area Penyimpanan</label>
                    <div class="flex border border-slate-300 rounded overflow-hidden shadow-sm">
                        <!-- REVISI: Mengubah input readonly menjadi button agar tidak memicu keyboard di HP -->
                        <button type="button" id="btn-pilih-area" onclick="bukaModalSearch('area')" class="flex-1 p-2.5 text-sm outline-none bg-slate-50 text-slate-400 font-bold text-left cursor-pointer">Pilih Area...</button>
                        <input type="hidden" id="input-area" required>
                        <button type="button" onclick="bukaModalSearch('area')" class="px-4 bg-emerald-100 text-emerald-700 font-bold text-xs hover:bg-emerald-200 border-l border-slate-300 transition">CARI</button>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Scan Fisik Kardus</label>
                    <textarea id="input-qrcode" rows="4" class="w-full p-2.5 border border-slate-300 rounded outline-none focus:border-emerald-500 font-mono font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition custom-scroll" placeholder="Arahkan scanner atau paste QR Code..." required></textarea>
                </div>
                <button type="submit" class="mt-2 w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded font-black shadow transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase border-b-4 border-black">
                    <i data-lucide="plus-square" class="w-4 h-4"></i> TAMBAHKAN KODE
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL PENCARIAN AREA -->
    <div id="modal-search" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/70 z-[100] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 flex flex-col max-h-[85vh] overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-base font-black flex items-center gap-2 text-slate-800"><i data-lucide="search" class="text-emerald-600 w-5 h-5"></i> Cari Area</h3>
                <button type="button" onclick="document.getElementById('modal-search').classList.add('hidden')" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-md transition shadow-sm active:scale-95"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            
            <div class="p-4 border-b border-slate-100 bg-white">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                    <input type="text" id="input-search-list" onkeyup="filterSearchList()" class="w-full pl-9 p-2.5 border border-slate-300 rounded-lg outline-none focus:border-emerald-500 font-bold text-sm bg-slate-50" placeholder="Ketik untuk mencari..." autocomplete="off">
                </div>
            </div>

            <div class="flex-1 overflow-y-auto custom-scroll p-2 bg-slate-50">
                <ul id="list-search-result" class="space-y-1"></ul>
            </div>

            <div class="p-4 border-t border-slate-100 bg-white">
                <button type="button" onclick="pilihDataSearch()" class="w-full py-3 bg-emerald-600 text-white font-black rounded-xl text-sm uppercase flex justify-center items-center gap-2 active:scale-95 transition"><i data-lucide="check-circle" class="w-4 h-4"></i> Pilih Area</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY -->
    <div id="overlay-klik-luar" onclick="tutupPopups()" class="hidden fixed inset-0 z-[50] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="wms_parser.js"></script>
    <script src="input_opname_logic.js"></script>
</body>
</html>
