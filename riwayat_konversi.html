<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Riwayat Konversi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; border: 1px solid #334155; padding: 0.75rem; text-transform: uppercase; font-size: 11px; font-weight: 900; white-space: nowrap; }
    </style>
</head>
<body class="font-sans bg-slate-50 overflow-x-hidden text-slate-800 pb-20">
    <div class="w-full px-2 sm:px-4 pt-4 relative">
        
        <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 mb-4">
            <h3 class="font-black text-[11px] uppercase tracking-wide text-slate-700 mb-3 flex items-center gap-2 border-b border-slate-100 pb-2">
                <i data-lucide="history" class="w-4 h-4 text-blue-600"></i> NAVIGASI DATA
            </h3>
            
            <div class="flex gap-2 overflow-x-auto pt-1 pb-4 px-1 hide-scrollbar whitespace-nowrap scroll-smooth select-none" style="-webkit-overflow-scrolling: touch;">
                <button onclick="toggleFilter()" class="p-2.5 px-5 rounded-lg font-black text-xs flex items-center gap-2 shadow-sm uppercase bg-slate-800 text-white border-b-2 border-slate-950 active:scale-95 transition">
                    <i data-lucide="filter" class="w-4 h-4"></i> Filter
                </button>
                <button onclick="salinData()" class="p-2.5 px-5 rounded-lg font-black text-xs flex items-center gap-2 shadow-sm uppercase bg-blue-600 text-white border-b-2 border-blue-800 active:scale-95 transition">
                    <i data-lucide="copy" class="w-4 h-4"></i> Salin
                </button>
                <button onclick="downloadExcel()" class="p-2.5 px-5 rounded-lg font-black text-xs flex items-center gap-2 shadow-sm uppercase bg-emerald-600 text-white border-b-2 border-emerald-800 active:scale-95 transition">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel
                </button>
            </div>
            
            <div class="text-[9px] text-slate-400 text-center font-black uppercase tracking-wider -mt-2.5 mb-1 pointer-events-none flex items-center justify-center gap-1 animate-pulse">
                <i data-lucide="arrow-left-right" class="w-3 h-3"></i> Geser menu aksi ke kanan-kiri
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="table-container overflow-x-auto w-full max-h-[65vh]">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std">Waktu Eksekusi</th>
                            <th class="hdr-std text-blue-300">ID Konversi</th>
                            <th class="hdr-std text-rose-300">Aktifitas</th>
                            <th class="hdr-std text-emerald-300 border-x border-slate-500">Total Dus</th>
                            <th class="hdr-std">PIC Eksekusi</th>
                            <th class="hdr-std text-left pl-4">Detail Keterangan</th>
                            <th class="hdr-std border-r border-slate-500 text-left pl-4">QR Code(s) Fisik</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-riwayat" class="text-center text-slate-700">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4"></i> Filter Riwayat</h3>
            <button onclick="toggleFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition active:scale-95"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-4 overflow-y-auto">
            <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">ID Konversi</label><input type="text" id="f-kode" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Aktifitas</label><input type="text" id="f-aktifitas" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama PIC</label><input type="text" id="f-pic" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Kode QR / Barcode</label><input type="text" id="f-qr" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            
            <button onclick="resetFilter()" class="mt-4 py-3 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-lg text-xs uppercase transition border border-slate-300 shadow-sm active:scale-95">RESET FILTER</button>
        </div>
    </div>
    
    <div id="overlay-klik-luar" onclick="toggleFilter()" class="hidden fixed inset-0 z-30 bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="global.js"></script>
    <script src="riwayat_konversi_logic.js"></script>
</body>
</html>
