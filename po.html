<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - PO & Estimasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ROUTE GUARD & LAYOUT -->
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; will-change: transform; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .hdr-std { 
            background-color: #1e293b !important; 
            color: #ffffff !important; 
            text-align: center !important; 
            padding: 0.75rem 1rem !important; 
            font-size: 0.75rem !important; 
            font-weight: 600 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.05em !important; 
            white-space: nowrap !important; 
            position: sticky !important; 
            top: 0 !important; 
            z-index: 40 !important; 
            border-bottom: 2px solid #cbd5e1 !important; 
            background-clip: padding-box !important; 
        }
        
        tr.selected-row { background-color: #dbeafe !important; }
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }

        .resizer {
            position: absolute;
            top: 0; right: 0; width: 5px;
            cursor: col-resize; user-select: none;
            height: 100%; z-index: 50;
        }
        .resizer:hover, .resizing { background-color: rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200 shadow-[0_4px_10px_-3px_rgba(0,0,0,0.05)]">
            
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar">
                <button onclick="switchTab('input')" id="tab-input" class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="file-plus-2" class="w-4 h-4"></i> INPUT PO</button>
                <button onclick="switchTab('tabel')" id="tab-tabel" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="table" class="w-4 h-4"></i> TABEL PO</button>
            </div>

            <!-- COLLAPSIBLE INPUT BOX -->
            <div id="view-input" class="bg-white border-b border-slate-200 flex flex-col">
                <button onclick="toggleInputPO()" class="w-full bg-slate-50 p-3 flex justify-between items-center border-b border-slate-200 hover:bg-slate-100 transition active:bg-slate-200">
                    <span class="font-black text-[11px] uppercase tracking-wide text-slate-700 flex items-center gap-2">
                        <i data-lucide="package-plus" class="w-4 h-4"></i> INPUT PO BARU
                    </span>
                    <i data-lucide="chevron-up" id="icon-toggle-input" class="w-4 h-4 text-slate-500 transition-transform duration-300"></i>
                </button>
                
                <div id="body-input-po" class="p-3 sm:p-4 transition-all duration-300 origin-top">
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-3 mb-4">
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Kode PO</label>
                            <input type="text" id="in-kode-po" class="w-full p-2 border border-slate-300 rounded-md font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 uppercase" placeholder="Ketik Kode PO...">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Customer PO</label>
                            <select id="in-customer-po" class="w-full p-2 border border-slate-300 rounded-md font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 cursor-pointer uppercase">
                                <option value="">-- Memuat --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Nama Item</label>
                            <select id="in-nama-item" class="w-full p-2 border border-slate-300 rounded-md font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 cursor-pointer">
                                <option value="">-- Memuat --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Panjang</label>
                            <input type="text" id="in-panjang" class="w-full p-2 border border-slate-300 rounded-md font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 uppercase" placeholder="Cth: 4M">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Grade</label>
                            <select id="in-grade" class="w-full p-2 border border-slate-300 rounded-md font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 cursor-pointer">
                                <option value="">-- Memuat --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Dus</label>
                            <select id="in-dus" class="w-full p-2 border border-slate-300 rounded-md font-bold text-xs outline-none focus:border-blue-600 bg-slate-50 cursor-pointer">
                                <option value="">-- Memuat --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">QTY PO</label>
                            <input type="number" id="in-qty-po" class="w-full p-2 border border-orange-300 rounded-md font-black text-xs outline-none focus:border-orange-600 text-orange-700 bg-orange-50" placeholder="Cth: 100">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Note</label>
                            <input type="text" id="in-note" class="w-full p-2 border border-slate-300 rounded-md font-bold text-xs outline-none focus:border-blue-600 bg-slate-50" placeholder="Catatan...">
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <button onclick="addEstimasiLokal()" class="px-6 py-2 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-md shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase"><i data-lucide="plus-circle" class="w-4 h-4"></i> Add Data</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION -->
        <div class="flex-1 min-h-0 bg-slate-200 p-2 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 bg-white border border-slate-300 shadow-inner overflow-y-auto custom-scroll table-container">
                <table class="w-full text-center border-separate border-spacing-0 whitespace-nowrap" id="main-table">
                    <thead class="sticky top-0 z-40 shadow-md bg-slate-800" id="thead-po"></thead>
                    <tbody id="tbody-po" class="text-slate-700"></tbody>
                </table>
            </div>
        </div>

        <!-- FOOTER PAGINATION & ACTION -->
        <div class="shrink-0 w-full bg-white p-3 flex flex-col md:flex-row justify-between items-center gap-4 z-20 border-t border-slate-200 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)]">
            
            <!-- Info & Paginasi (Hanya tampil di Tab Tabel) -->
            <div id="footer-tabel" class="hidden flex-1 flex flex-col md:flex-row justify-between items-center gap-4 w-full">
                <div class="flex items-center gap-4 text-sm text-slate-500">
                    <button id="btn-hapus-po" onclick="hapusMassalPO()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-md shadow-sm flex items-center gap-2 text-xs transition active:scale-95 uppercase">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Hapus PO
                    </button>
                    <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                    <span>Qty PO: <strong class="text-orange-600" id="lbl-total-qty">0</strong> dus</span>
                    <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                    <span>Jumlah PO: <strong class="text-blue-600" id="lbl-total-kodepo">0</strong></span>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-slate-500">Baris:</span>
                        <select id="select-rows-per-page" onchange="changeRowsPerPage(this.value)" class="text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md outline-none cursor-pointer px-2 py-1 focus:border-blue-500 transition">
                            <option value="10" selected>10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="ALL">Semua</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="prevPage()" class="p-1.5 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-md transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                        <span class="text-sm font-medium text-slate-700 px-2">Hal <span id="lbl-halaman">1</span> / <span id="lbl-total-halaman">1</span></span>
                        <button onclick="nextPage()" class="p-1.5 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-md transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                    </div>
                </div>
            </div>

            <!-- Tombol Simpan (Hanya tampil di Tab Input) -->
            <div id="footer-input" class="w-full flex justify-end">
                <button id="btn-submit-db" onclick="simpanMassalKeDatabase()" class="w-full md:w-auto px-8 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-md shadow-sm flex items-center justify-center gap-2 text-sm transition active:scale-95 uppercase border-b-4 border-emerald-800">
                    <i data-lucide="save" class="w-4 h-4"></i> <span>SIMPAN PO KE DATABASE</span>
                </button>
            </div>

        </div>

    </div>

    <!-- MODAL FILTER EXCEL -->
    <div id="excel-filter-menu" class="hidden absolute bg-white shadow-xl border border-slate-200 rounded-lg w-64 z-[100] flex flex-col font-sans text-sm">
        <div class="p-3 border-b border-slate-100 flex justify-between items-center">
            <span class="font-semibold text-slate-700 text-xs uppercase tracking-wider" id="filter-col-name">Filter</span>
            <button onclick="closeFilterMenu()" class="text-slate-400 hover:text-slate-700 transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-2 border-b border-slate-100">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
                <input type="text" id="filter-search-input" oninput="searchFilterList(this.value)" class="w-full pl-8 p-1.5 text-sm border border-slate-200 rounded-md focus:border-blue-500 outline-none transition" placeholder="Cari...">
            </div>
        </div>
        <div class="p-2 max-h-48 overflow-y-auto flex flex-col gap-1 text-sm custom-scroll" id="filter-values-list"></div>
        <div class="p-2 border-t border-slate-100 flex justify-between gap-2 bg-slate-50 rounded-b-lg">
            <button onclick="clearFilterForCurrentCol()" class="w-1/2 py-1.5 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition">Reset</button>
            <button onclick="applyFilterForCurrentCol()" class="w-1/2 py-1.5 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition">Terapkan</button>
        </div>
    </div>

    <script src="estimasi_pengiriman_logic.js"></script>
</body>
</html>
