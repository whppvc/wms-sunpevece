<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Barang Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-black { background-color: #1e293b !important; color: white !important; }
        .hdr-green { background-color: #f1f5f9 !important; color: #334155 !important; }
        .hdr-blue { background-color: #e2e8f0 !important; color: #0f172a !important; }
    </style>
</head>
<body class="font-sans antialiased text-slate-800 bg-slate-50 flex flex-col min-h-screen">

    <main class="p-4 md:p-6 w-full max-w-[98%] mx-auto flex flex-col gap-4 pt-6">

        <header class="flex flex-col md:flex-row md:justify-between md:items-end gap-2 border-b border-slate-200 pb-4">
            <h2 class="text-2xl font-black flex items-center gap-2 text-slate-800"><i data-lucide="truck" class="w-7 h-7 text-rose-600"></i> Barang Keluar (Kirim)</h2>
            <p class="text-sm font-semibold text-slate-500">Scan QR untuk memotong saldo & mengeluarkan fisik.</p>
        </header>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 relative">
            <button onclick="undoDelete()" class="absolute top-4 right-6 px-3 py-1.5 bg-slate-100 text-slate-600 font-bold rounded-lg border border-slate-200 hover:bg-slate-200 transition cursor-pointer text-xs flex items-center gap-1 active:scale-95"><i data-lucide="rotate-ccw" class="w-3 h-3"></i> UNDO</button>
            <label class="block text-xs font-black uppercase tracking-wider mb-3 text-slate-500">Scan Fisik Kardus Keluar</label>
            <form id="form-scan" class="flex gap-3">
                <input type="text" id="input-qrcode" class="flex-1 p-4 border-2 border-slate-200 rounded-xl outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-100 font-black text-slate-800 text-lg transition" placeholder="Arahkan scanner ke kardus..." autocomplete="off">
                <button type="submit" class="bg-rose-700 hover:bg-rose-800 text-white px-10 rounded-xl font-black shadow-md cursor-pointer transition active:scale-95 flex items-center gap-2"><i data-lucide="corner-down-left"></i> ENTER</button>
            </form>
        </div>

        <div class="flex justify-end mt-2">
            <button onclick="crossCekOutbound()" id="btn-crosscek" class="px-6 py-3 bg-white text-rose-700 font-black rounded-xl border border-slate-200 hover:border-rose-300 hover:bg-rose-50 transition cursor-pointer text-sm flex items-center gap-2 shadow-sm active:scale-95"><i data-lucide="scan-search" class="w-5 h-5"></i> VALIDASI FISIK GUDANG</button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="table-container overflow-x-auto w-full max-h-[50vh]">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-keluar">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr class="uppercase text-[11px] font-black tracking-wider">
                            <th class="p-3 hdr-black w-10 text-center"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                            <th class="p-3 hdr-black w-12 text-center">No</th>
                            <th class="p-3 bg-rose-900 text-white text-center border-r border-rose-950">Status Fisik</th>
                            <th class="p-3 hdr-black text-emerald-300">Lokasi Auto</th>
                            <th class="p-3 hdr-black border-r border-slate-600">Text QRCode</th>
                            <th class="p-3 hdr-green">Tgl Produksi</th>
                            <th class="p-3 hdr-green">Mesin</th>
                            <th class="p-3 hdr-green">Shift</th>
                            <th class="p-3 hdr-blue text-center">Jenis Item</th>
                            <th class="p-3 hdr-green">Nama Item</th>
                            <th class="p-3 hdr-green">Pjg</th>
                            <th class="p-3 hdr-green">Grade</th>
                            <th class="p-3 hdr-green border-r border-slate-300">Dus</th>
                            <th class="p-3 bg-slate-200 text-slate-800">Shading</th>
                            <th class="p-3 bg-slate-300 text-slate-900 text-center font-black">PO Bawaan</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-keluar"></tbody>
                </table>
            </div>
        </div>
        
        <div class="pt-2">
            <button id="btn-proses-keluar" onclick="bukaModalKeluar()" class="w-full py-4 bg-rose-700 hover:bg-rose-800 text-white font-black rounded-2xl shadow-md flex items-center justify-center gap-2 text-lg uppercase tracking-wider cursor-pointer transition active:scale-95"><i data-lucide="truck-fast" class="w-6 h-6"></i> PROSES PENGELUARAN BARANG</button>
        </div>
    </main>

    <div id="modal-keluar" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[80] px-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-200">
            <h3 class="text-2xl font-black mb-1 flex items-center gap-2 text-slate-800"><i data-lucide="package-minus" class="text-rose-600"></i> Tujuan Kirim</h3>
            <p class="text-xs font-semibold text-slate-500 mb-6">Pilih PO untuk memotong saldo Kartu Stok virtual.</p>
            
            <div class="space-y-5 mb-8">
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest mb-2 text-slate-600">PO Target</label>
                    <select id="out-po-target" class="w-full p-4 border border-slate-300 rounded-xl outline-none focus:border-rose-500 font-black text-rose-700 uppercase bg-slate-50 cursor-pointer transition">
                        <option value="">-- MEMUAT PO... --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest mb-2 text-slate-600">Keterangan / Supir / Nopol</label>
                    <input type="text" id="out-keterangan" class="w-full p-4 border border-slate-300 rounded-xl outline-none focus:border-rose-500 font-bold text-slate-700 bg-slate-50 transition" placeholder="Cth: BM 1234 XX, Supir Budi...">
                </div>
            </div>

            <div class="flex gap-3">
                <button type="button" onclick="document.getElementById('modal-keluar').classList.add('hidden')" class="w-1/3 py-3.5 bg-slate-100 text-slate-600 font-black rounded-xl hover:bg-slate-200 transition cursor-pointer">BATAL</button>
                <button type="button" onclick="eksekusiKeluar()" id="btn-eksekusi" class="w-2/3 py-3.5 bg-rose-700 font-black rounded-xl shadow-md text-white hover:bg-rose-800 transition flex justify-center items-center gap-2 cursor-pointer active:scale-95"><i data-lucide="check-circle" class="w-5 h-5"></i> EKSEKUSI</button>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script src="keluar_logic.js"></script>
    <script>
        const PAGE_META = { id: 'keluar', title: 'BARANG KELUAR', url: 'keluar.html' };
        window.addEventListener('DOMContentLoaded', () => { 
            initModernTopBar(PAGE_META); 
            loadInitialOutboundData(); 
        });
    </script>
</body>
</html>
