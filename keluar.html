<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Barang Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .selected-row { border-color: #2563eb !important; background-color: #dbeafe !important; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- INFO BAR ATAS -->
        <div class="shrink-0 bg-white flex flex-col z-20 shadow-[0_4px_10px_-3px_rgba(0,0,0,0.05)] border-b border-slate-200">
            <div class="flex justify-between items-center px-3 py-3 bg-white border-b border-slate-200">
                <div class="flex items-center gap-2">
                    <input type="checkbox" onchange="toggleAll(this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer border-slate-400" id="cb-all">
                    <label for="cb-all" class="text-[11px] font-black text-slate-500 uppercase tracking-wide cursor-pointer">Pilih Semua</label>
                </div>
                <div class="flex items-center gap-2">
                    <div class="bg-cyan-50 border border-cyan-300 px-3 py-1.5 rounded text-cyan-800 text-[11px] font-black shadow-sm uppercase tracking-wider">
                        Total Qty: <span id="lbl-tampil-baris" class="text-slate-900 text-[13px] ml-1">0</span> Dus
                    </div>
                    <button onclick="toggleSidebarFilter()" class="p-1.5 bg-white border border-slate-300 text-slate-600 rounded hover:bg-slate-100 transition shadow-sm active:scale-95">
                        <i data-lucide="filter" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION (CARD VIEW) -->
        <div class="flex-1 min-h-0 bg-slate-200 p-2 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 bg-white border border-slate-300 shadow-inner overflow-y-auto custom-scroll" id="scroll-container">
                <div id="tbody-keluar" class="flex flex-col gap-0 w-full">
                    <div class="p-10 text-center font-medium text-slate-400 h-full flex flex-col items-center justify-center">
                        <i data-lucide="package-search" class="w-12 h-12 mx-auto mb-3 opacity-30"></i> 
                        Belum ada data di-scan.
                    </div>
                </div>
            </div>
        </div>

        <!-- FOOTER ACTION (4 KOTAK BOTTOM BAR) -->
        <div class="shrink-0 w-full bg-slate-50 p-2 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300 pb-4">
            <div class="grid grid-cols-4 gap-2 h-[55px]">
                
                <!-- KOTAK 1: ADD -->
                <button onclick="bukaModalAdd()" class="w-full h-full bg-[#0f172a] hover:bg-black text-white flex flex-col justify-center items-center shadow-md active:scale-95 transition rounded border-b-4 border-slate-900">
                    <i data-lucide="plus" class="w-5 h-5 sm:w-6 sm:h-6"></i>
                </button>

                <!-- KOTAK 2: VERIFIKASI -->
                <button onclick="verifikasiKeluar()" id="btn-verifikasi" class="w-full h-full bg-blue-600 hover:bg-blue-700 text-white font-black shadow-md flex flex-col items-center justify-center gap-1 text-[9px] sm:text-[11px] cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-blue-800 leading-none">
                    <i data-lucide="shield-check" class="w-4 h-4 sm:w-5 sm:h-5"></i> Verifikasi
                </button>

                <!-- KOTAK 3: SIMPAN KELUAR -->
                <button id="btn-save" onclick="simpanKeluar()" class="w-full h-full bg-rose-700 hover:bg-rose-800 text-white font-black shadow-md flex flex-col items-center justify-center gap-1 text-[9px] sm:text-[11px] cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-rose-900 leading-none">
                    <i data-lucide="truck-fast" class="w-4 h-4 sm:w-5 sm:h-5"></i> Proses Keluar
                </button>

                <!-- KOTAK 4: LAINNYA (DROPUP) -->
                <div class="relative w-full h-full">
                    <button onclick="toggleMoreMenu(event)" class="w-full h-full bg-slate-700 hover:bg-slate-800 text-white font-black shadow-md flex flex-col items-center justify-center gap-1 text-[9px] sm:text-[11px] cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-slate-900 leading-none">
                        <i data-lucide="more-horizontal" class="w-4 h-4 sm:w-5 sm:h-5"></i> Lainnya
                    </button>
                    
                    <div id="dropup-more" class="hidden absolute bottom-full right-0 mb-2 w-56 bg-white shadow-2xl rounded-xl border border-slate-200 z-50 flex flex-col overflow-hidden">
                        <button onclick="undoHapusKeluar(); toggleMoreMenu(event)" class="text-left px-5 py-4 border-b border-slate-100 text-sm font-bold text-slate-700 flex items-center gap-3 hover:bg-slate-50 active:bg-slate-100 transition"><i data-lucide="rotate-ccw" class="w-5 h-5 text-slate-500"></i> Undo Hapus</button>
                        <!-- TOMBOL BARU: CANCEL KELUAR -->
                        <button onclick="bukaModalCancelKeluar(); toggleMoreMenu(event)" class="text-left px-5 py-4 border-b border-slate-100 text-sm font-bold text-amber-600 flex items-center gap-3 hover:bg-slate-50 active:bg-slate-100 transition"><i data-lucide="scan-line" class="w-5 h-5"></i> Cancel Keluar (Scan)</button>
                    </div>
                </div>

            </div>
        </div>
        
    </div>

    <!-- MODAL ADD SCAN -->
    <div id="modal-add-scan" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="scan-line" class="w-5 h-5 text-rose-600"></i> INPUT BARANG KELUAR</h3>
                <button type="button" onclick="tutupModalAdd()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="form-scan" class="flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Customer Keluar (Tujuan)</label>
                    <select id="select-customer-keluar" class="w-full p-3 border-2 border-slate-200 rounded-xl font-bold outline-none focus:border-rose-600 text-slate-800 cursor-pointer bg-slate-50 text-sm uppercase" required>
                        <option value="">-- Memuat Customer... --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Trip Ke</label>
                    <input type="number" id="input-trip" min="1" class="w-full p-3 border-2 border-slate-200 rounded-xl font-bold outline-none focus:border-rose-600 text-slate-800 bg-slate-50 text-sm" placeholder="Contoh: 1" required>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Scan Fisik Kardus</label>
                    <textarea id="input-qrcode" rows="4" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-rose-600 font-mono font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition custom-scroll" placeholder="Arahkan scanner atau paste QR Code..." oninput="autoEnterScan(this)" required></textarea>
                </div>
                <button type="submit" class="mt-2 w-full bg-rose-700 hover:bg-rose-800 text-white py-3 rounded-xl font-black shadow transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase border-b-4 border-rose-900">
                    <i data-lucide="plus-square" class="w-4 h-4"></i> TAMBAHKAN KODE
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL CANCEL KELUAR SCAN -->
    <div id="modal-cancel-keluar" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[70] p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="scan-line" class="w-5 h-5 text-amber-600"></i> SCAN CANCEL KELUAR</h3>
                <button type="button" onclick="tutupModalCancelKeluar()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Scan Fisik Kardus yang di-Cancel</label>
                    <textarea id="input-qr-cancel" rows="5" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-amber-500 font-mono font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 custom-scroll" placeholder="Scan barcode di sini..."></textarea>
                </div>
                <button type="button" onclick="prosesCancelKeluarScan()" id="btn-proses-cancel-scan" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 rounded-xl font-black shadow transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase border-b-4 border-amber-800">
                    <i data-lucide="arrow-right-left" class="w-4 h-4"></i> Pindahkan ke Hold
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL PINJAM ESTIMASI -->
    <div id="modal-pinjam-estimasi" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[70] p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-2 pb-2 border-b border-slate-100">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="users" class="w-5 h-5 text-indigo-600"></i> PILIH PINJAM CUSTOMER</h3>
                <button type="button" onclick="tutupModalPinjamEstimasi()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            
            <!-- INFORMASI BATCH GROUPING -->
            <div class="bg-indigo-50 border border-indigo-200 p-2.5 rounded-lg mb-4">
                <p class="text-xs font-bold text-indigo-800" id="lbl-batch-pinjam-info">Pilihan ini akan diterapkan ke semua kardus serupa di layar.</p>
            </div>

            <input type="hidden" id="pinjam-id-item">
            <input type="hidden" id="pinjam-is-aktual">
            <div class="flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Customer Estimasi Tersedia</label>
                    <select id="select-pinjam-estimasi" class="w-full p-3 border-2 border-slate-200 rounded-xl font-bold outline-none focus:border-indigo-600 text-slate-800 cursor-pointer bg-slate-50 text-sm uppercase">
                        <option value="">-- Memuat Data... --</option>
                    </select>
                </div>
                <button type="button" onclick="simpanPinjamEstimasi()" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-black shadow transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase border-b-4 border-indigo-800">
                    <i data-lucide="check-circle" class="w-4 h-4"></i> TERAPKAN KE SEMUA ITEM SERUPA
                </button>
            </div>
        </div>
    </div>

    <!-- SIDEBAR FILTER LENGKAP -->
    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4"></i> Filter Data</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 flex flex-col gap-3 overflow-y-auto custom-scroll flex-1">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status</label><select id="fs-status" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Customer Keluar</label><select id="fs-cust-keluar" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Trip</label><select id="fs-trip" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Customer Aktual</label><select id="fs-cust-aktual" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div class="col-span-2"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="fs-qr" oninput="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none bg-slate-50" placeholder="Ketik QR Code..."></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Customer Estimasi</label><select id="fs-cust-estimasi" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><select id="fs-jenis" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div class="col-span-2"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label><select id="fs-nama" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><select id="fs-pjg" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><select id="fs-grade" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><select id="fs-dus" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><select id="fs-shading" onchange="saringTabelKeluar()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50"><option value="">-- Semua --</option></select></div>
            </div>
            <button onclick="resetFilterKeluar()" class="mt-2 py-3 w-full bg-slate-800 hover:bg-slate-900 text-white font-black rounded text-xs uppercase transition shrink-0">RESET FILTER</button>
        </div>
    </div>

    <!-- OVERLAY -->
    <div id="overlay-klik-luar" onclick="tutupPopups()" class="hidden fixed inset-0 z-[50] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script>
        function autoEnterScan(el) {
            let val = el.value;
            if (val.match(/\/0001( N)?$/)) {
                el.value = val + '\n';
            }
        }
    </script>
    <script src="wms_parser.js"></script>
    <script src="keluar_logic.js"></script>
</body>
</html>
