<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Barang Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans">
    <div class="w-full">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 relative mb-4">
            <button onclick="undoDelete()" class="absolute top-4 right-6 px-4 py-1.5 bg-slate-200 text-slate-700 font-bold rounded border border-slate-300 hover:bg-slate-300 transition cursor-pointer text-xs flex items-center gap-1 active:scale-95"><i data-lucide="rotate-ccw" class="w-3 h-3"></i> UNDO</button>
            <label class="block text-xs font-bold uppercase tracking-wide mb-2 text-slate-600">Scan Fisik Kardus Keluar</label>
            <form id="form-scan" class="flex gap-3">
                <input type="text" id="input-qrcode" class="flex-1 p-3 border border-slate-300 rounded outline-none focus:border-slate-800 font-bold text-slate-800 text-lg bg-slate-50" placeholder="Arahkan scanner ke kardus..." autocomplete="off">
                <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-8 rounded font-bold shadow-sm cursor-pointer transition active:scale-95 flex items-center gap-2"><i data-lucide="corner-down-left"></i> ENTER</button>
            </form>
        </div>

        <div class="flex justify-end mt-2 mb-4">
            <button onclick="crossCekOutbound()" id="btn-crosscek" class="px-5 py-2.5 bg-white text-slate-800 font-black rounded border-2 border-slate-800 hover:bg-slate-100 transition cursor-pointer text-sm flex items-center gap-2 active:scale-95 uppercase tracking-wide"><i data-lucide="scan-search" class="w-4 h-4"></i> VALIDASI FISIK GUDANG</button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="overflow-x-auto w-full max-h-[50vh] hide-scrollbar">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-keluar">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-10"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std">Status Fisik</th>
                            <th class="hdr-std">Lokasi Auto</th>
                            <th class="hdr-std">Text QRCode</th>
                            <th class="hdr-std">Tgl Produksi</th>
                            <th class="hdr-std">Mesin</th>
                            <th class="hdr-std">Shift</th>
                            <th class="hdr-std">Jenis Item</th>
                            <th class="hdr-std">Nama Item</th>
                            <th class="hdr-std">Pjg</th>
                            <th class="hdr-std">Grade</th>
                            <th class="hdr-std">Dus</th>
                            <th class="hdr-std">Shading</th>
                            <th class="hdr-std">PO Bawaan</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-keluar" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
        
        <div class="pt-4">
            <button id="btn-proses-keluar" onclick="bukaModalKeluar()" class="w-full py-4 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl shadow-md flex items-center justify-center gap-2 text-base tracking-widest cursor-pointer transition active:scale-95 uppercase"><i data-lucide="truck-fast" class="w-5 h-5"></i> PROSES PENGELUARAN BARANG</button>
        </div>
    </div>

    <div id="modal-keluar" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[80] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-md border border-slate-200">
            <h3 class="text-xl font-black mb-1 flex items-center gap-2 text-slate-800"><i data-lucide="package-minus" class="text-slate-600"></i> Tujuan Kirim</h3>
            <p class="text-xs font-semibold text-slate-500 mb-6">Pilih PO untuk memotong saldo Kartu Stok virtual.</p>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide mb-2 text-slate-600">PO Target</label>
                    <select id="out-po-target" class="w-full p-3 border border-slate-300 rounded outline-none focus:border-slate-800 font-bold text-slate-800 uppercase cursor-pointer bg-slate-50"><option value="">-- MEMUAT PO... --</option></select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wide mb-2 text-slate-600">Keterangan / Supir / Nopol</label>
                    <input type="text" id="out-keterangan" class="w-full p-3 border border-slate-300 rounded outline-none focus:border-slate-800 font-bold text-slate-800 bg-slate-50" placeholder="Cth: BM 1234 XX, Supir Budi...">
                </div>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="document.getElementById('modal-keluar').classList.add('hidden')" class="w-1/3 py-2.5 bg-slate-200 text-slate-700 font-bold rounded hover:bg-slate-300 transition cursor-pointer">BATAL</button>
                <button type="button" onclick="eksekusiKeluar()" id="btn-eksekusi" class="w-2/3 py-2.5 bg-slate-800 font-bold rounded shadow-sm text-white hover:bg-slate-900 transition flex justify-center items-center gap-2 cursor-pointer active:scale-95"><i data-lucide="check-circle" class="w-4 h-4"></i> EKSEKUSI</button>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script src="keluar_logic.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { 
            initModernLayout({ id: 'keluar', title: 'BARANG KELUAR', url: 'keluar.html' }); 
            setTimeout(() => { if(typeof loadInitialOutboundData === 'function') loadInitialOutboundData(); }, 200);
        });
    </script>
</body>
</html>
