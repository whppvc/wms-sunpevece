<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Barang Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ROUTE GUARD -->
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; border-bottom: 2px solid transparent; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION (RAPAT SEPERTI LANGSIR) -->
        <div class="shrink-0 bg-white border-b border-slate-200 px-3 py-3 flex flex-col gap-3 shadow-sm z-20">
            
            <!-- TABS -->
            <div class="flex px-6 pt-2 gap-6 overflow-x-auto hide-scrollbar">
                <button onclick="switchTab('kirim')" id="tab-kirim" class="pb-3 tab-active transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="truck" class="w-4 h-4"></i> Kirim / Keluar</button>
                <button onclick="switchTab('bs')" id="tab-bs" class="pb-3 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="package-x" class="w-4 h-4"></i> Barang BS</button>
            </div>

            <!-- TOOLBAR KIRI & KANAN -->
            <div class="flex gap-2 items-center w-full pb-1">
                <div class="flex-1 flex gap-2 overflow-x-auto hide-scrollbar">
                    <button onclick="crossCekOutbound()" id="btn-crosscek" class="shrink-0 flex items-stretch rounded-md overflow-hidden shadow-sm active:scale-95 transition h-9 border border-slate-800">
                        <div class="w-9 bg-slate-900 text-white flex items-center justify-center shrink-0"><i data-lucide="scan-search" class="w-4 h-4"></i></div>
                        <div class="flex-1 bg-slate-800 text-white font-black text-[11px] uppercase flex items-center justify-center px-3 tracking-wider">Verifikasi Gudang</div>
                    </button>

                    <button onclick="bukaModalReqPO()" class="shrink-0 flex items-stretch rounded-md overflow-hidden shadow-sm active:scale-95 transition h-9 border border-orange-600">
                        <div class="w-9 bg-orange-700 text-white flex items-center justify-center shrink-0"><i data-lucide="help-circle" class="w-4 h-4"></i></div>
                        <div class="flex-1 bg-orange-600 text-white font-black text-[11px] uppercase flex items-center justify-center px-3 tracking-wider">Req Ganti Customer</div>
                    </button>
                </div>
                
                <div class="relative shrink-0">
                    <button onclick="undoDelete()" class="flex items-stretch rounded-md overflow-hidden shadow-sm active:scale-95 transition h-9 border border-pink-400">
                        <div class="bg-pink-100 text-pink-700 flex items-center justify-center px-4 hover:bg-pink-200 h-full font-bold text-xs gap-1.5"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Undo</div>
                    </button>
                </div>
            </div>

            <!-- SCAN INPUT & TOTAL QTY -->
            <div class="flex justify-between items-center px-1 gap-2">
                <form id="form-scan" class="flex-1 flex gap-2 items-center">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="scan-line" class="w-4 h-4 text-slate-400"></i></div>
                        <input type="text" id="input-qrcode" class="w-full h-9 pl-9 pr-3 border border-slate-300 rounded-md outline-none focus:border-blue-600 font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition shadow-inner" placeholder="Scan kardus keluar..." autocomplete="off">
                    </div>
                    <button type="submit" class="h-9 bg-blue-700 hover:bg-blue-800 text-white px-4 rounded-md font-bold shadow-sm transition active:scale-95 flex items-center justify-center gap-1 text-xs uppercase"><i data-lucide="corner-down-left" class="w-4 h-4"></i> Enter</button>
                </form>
                <div class="bg-cyan-50 border border-cyan-300 px-3 py-1.5 rounded text-cyan-800 text-[11px] font-black shadow-sm uppercase tracking-wider shrink-0">
                    Total Qty: <span id="lbl-total-baris" class="text-slate-900 text-[13px] ml-1">0</span> Dus
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION (CARD VIEW) -->
        <div class="flex-1 min-h-0 bg-slate-200 p-2 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 bg-white border border-slate-300 shadow-inner overflow-y-auto custom-scroll" id="scroll-container">
                <div id="card-container" class="flex flex-col gap-0 w-full">
                    <div class="p-10 text-center font-medium text-slate-400"><i data-lucide="package-search" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data di-scan.</div>
                </div>
            </div>
        </div>

        <!-- FOOTER ACTION -->
        <div class="shrink-0 w-full bg-slate-50 p-2 flex items-center gap-2 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300 pb-4">
            <button id="btn-proses-keluar" onclick="bukaModalKeluar()" class="flex-1 h-[50px] bg-slate-800 hover:bg-slate-900 text-white font-black shadow-md flex items-center justify-center gap-2 text-[13px] tracking-widest cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-slate-950">
                <i data-lucide="truck-fast" class="w-5 h-5"></i> PROSES KELUAR BARANG
            </button>
        </div>

    </div>

    <!-- MODAL KELUAR -->
    <div id="modal-keluar" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[80] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md border border-slate-200">
            <h3 class="text-base font-semibold mb-1 flex items-center gap-2 text-slate-800"><i data-lucide="package-minus" class="text-slate-600 w-5 h-5"></i> Tujuan Kirim</h3>
            <p class="text-xs text-slate-500 mb-5 border-b border-slate-100 pb-3 leading-relaxed">Pilih Customer Tujuan. Jika fisik item memiliki Customer aktual yang berbeda, ia <span class="text-red-600 font-bold">TIDAK AKAN KELUAR</span>.</p>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Pilih Customer Tujuan</label>
                    <select id="out-po-target" class="w-full p-2.5 border border-slate-300 rounded-md outline-none focus:border-slate-800 font-semibold text-slate-800 uppercase cursor-pointer bg-slate-50 text-sm"></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Keterangan / Supir / Nopol</label>
                    <input type="text" id="out-keterangan" class="w-full p-2.5 border border-slate-300 rounded-md outline-none focus:border-slate-800 font-semibold text-slate-800 bg-slate-50 text-sm" placeholder="Cth: PO security, BM 1234 ...">
                </div>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="document.getElementById('modal-keluar').classList.add('hidden')" class="w-1/3 py-2.5 bg-slate-100 text-slate-600 font-medium rounded-md hover:bg-slate-200 transition text-sm">Batal</button>
                <button type="button" onclick="eksekusiKeluar()" id="btn-eksekusi" class="w-2/3 py-2.5 bg-slate-800 text-white font-medium rounded-md shadow-sm hover:bg-slate-900 transition flex justify-center items-center gap-2 text-sm"><i data-lucide="check-circle" class="w-4 h-4"></i> Eksekusi</button>
            </div>
        </div>
    </div>

    <!-- MODAL REQ PO -->
    <div id="modal-req-po" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[90] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md border border-slate-200">
            <h3 class="text-base font-semibold mb-1 flex items-center gap-2 text-orange-600"><i data-lucide="file-warning" class="w-5 h-5"></i> Request Ganti Customer</h3>
            <p class="text-xs text-slate-500 mb-5 border-b border-slate-100 pb-3 leading-relaxed">Semua baris bermasalah (merah / belum diVerifikasi) akan dipindah ke tabel antrean untuk diganti Customernya oleh CS.</p>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Pilih Customer Tujuan</label>
                    <select id="req-po-target" class="w-full p-2.5 border border-orange-300 rounded-md outline-none focus:border-orange-500 font-semibold text-slate-800 uppercase bg-orange-50/50 cursor-pointer text-sm">
                        <option value="">-- MEMUAT CUSTOMER --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Alasan / Keterangan (Opsional)</label>
                    <input type="text" id="req-keterangan" class="w-full p-2.5 border border-slate-300 rounded-md outline-none focus:border-orange-500 font-semibold text-slate-800 bg-slate-50 text-sm" placeholder="Alasan ganti Customer...">
                </div>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="document.getElementById('modal-req-po').classList.add('hidden')" class="w-1/3 py-2.5 bg-slate-100 text-slate-600 font-medium rounded-md hover:bg-slate-200 transition text-sm">Batal</button>
                <button type="button" onclick="submitReqPO()" id="btn-submit-req" class="w-2/3 py-2.5 bg-orange-600 text-white font-medium rounded-md shadow-sm hover:bg-orange-700 transition flex justify-center items-center gap-2 text-sm"><i data-lucide="send" class="w-4 h-4"></i> Request</button>
            </div>
        </div>
    </div>

    <script src="keluar_logic.js"></script>
</body>
</html>
