<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Barang Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- PINDAHKAN GLOBAL.JS KE SINI -->
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
        .selected-row { border-color: #2563eb !important; background-color: #dbeafe !important; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200 shadow-[0_4px_10px_-3px_rgba(0,0,0,0.05)]">
            
            <!-- TABS -->
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar">
                <button onclick="switchTab('kirim')" id="tab-kirim" class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="truck" class="w-4 h-4"></i> KIRIM / KELUAR</button>
                <button onclick="switchTab('bs')" id="tab-bs" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="package-x" class="w-4 h-4"></i> BARANG BS</button>
            </div>

            <!-- SCAN INPUT -->
            <div class="p-3 sm:p-4 flex flex-col gap-2 border-b border-slate-100">
                <label class="block text-[10px] font-black uppercase tracking-wide text-slate-500">Scan Fisik Kardus Keluar</label>
                <form id="form-scan" class="flex gap-2 items-center">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="scan-line" class="w-5 h-5 text-slate-400"></i></div>
                        <input type="text" id="input-qrcode" class="w-full h-11 pl-10 pr-3 border border-slate-300 rounded-md outline-none focus:border-slate-800 font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition" placeholder="Arahkan scanner ke kardus..." autocomplete="off">
                    </div>
                    <button type="submit" class="h-11 bg-slate-800 hover:bg-slate-900 text-white px-6 rounded-md font-bold shadow-sm transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase"><i data-lucide="corner-down-left" class="w-4 h-4"></i> <span class="hidden sm:inline">ENTER</span></button>
                </form>
            </div>

            <!-- TOOLBAR -->
            <div class="flex justify-between items-center p-2 bg-slate-50 hide-scrollbar whitespace-nowrap scroll-smooth select-none">
                <button onclick="undoDelete()" class="flex items-center gap-2 px-4 py-2 bg-pink-100 border border-pink-300 text-pink-700 hover:bg-pink-200 rounded-md text-sm font-bold transition shadow-sm active:scale-95">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Undo
                </button>
                
                <div class="flex gap-2 items-center">
                    <button onclick="toggleSidebarFilter()" class="flex items-center gap-2 px-4 py-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm active:scale-95">
                        <i data-lucide="filter" class="w-4 h-4 text-blue-600"></i> Filter
                    </button>
                    <div class="w-px h-6 bg-slate-300 mx-1 shrink-0"></div> 
                    <button onclick="bukaModalReqPO()" class="flex items-center gap-2 px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-md text-sm font-bold transition shadow-sm active:scale-95">
                        <i data-lucide="help-circle" class="w-4 h-4"></i> Req Ganti PO
                    </button>
                    <button onclick="crossCekOutbound()" id="btn-crosscek" class="flex items-center gap-2 px-4 py-2 bg-slate-900 hover:bg-black text-white rounded-md text-sm font-bold transition shadow-sm active:scale-95">
                        <i data-lucide="scan-search" class="w-4 h-4"></i> Verifikasi Gudang
                    </button>
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION (CARD VIEW) -->
        <div class="flex-1 min-h-0 bg-slate-200 p-2 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 bg-white border border-slate-300 shadow-inner overflow-y-auto custom-scroll" id="scroll-container">
                <div id="card-container" class="flex flex-col gap-0 w-full">
                    <div class="p-10 text-center font-medium text-slate-400"><i data-lucide="package-search" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data di-scan.</div>
                </div>
            </div>
        </div>

        <!-- FOOTER ACTION -->
        <div class="shrink-0 w-full bg-slate-50 p-3 flex items-center justify-between z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300">
            <div class="text-xs font-bold text-slate-500">Total: <span id="lbl-total-baris" class="text-slate-800 text-sm">0</span> Dus</div>
            <button id="btn-proses-keluar" onclick="bukaModalKeluar()" class="w-full md:w-auto px-8 py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-md shadow-sm flex items-center justify-center gap-2 text-sm transition active:scale-95 uppercase border-b-4 border-slate-950">
                <i data-lucide="truck-fast" class="w-5 h-5"></i> PROSES KELUAR BARANG
            </button>
        </div>

    </div>

    <!-- MODAL KELUAR -->
    <div id="modal-keluar" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[80] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md border border-slate-200">
            <h3 class="text-base font-semibold mb-1 flex items-center gap-2 text-slate-800"><i data-lucide="package-minus" class="text-slate-600 w-5 h-5"></i> Tujuan Kirim</h3>
            <p class="text-xs text-slate-500 mb-5 border-b border-slate-100 pb-3 leading-relaxed">Pilih PO Tujuan. Jika fisik item memiliki PO aktual yang berbeda, ia <span class="text-red-600 font-bold">TIDAK AKAN KELUAR</span>.</p>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Pilih PO Tujuan</label>
                    <select id="out-po-target" class="w-full p-2.5 border border-slate-300 rounded-md outline-none focus:border-slate-800 font-semibold text-slate-800 uppercase cursor-pointer bg-slate-50 text-sm"></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Keterangan / Supir / Nopol</label>
                    <input type="text" id="out-keterangan" class="w-full p-2.5 border border-slate-300 rounded-md outline-none focus:border-slate-800 font-semibold text-slate-800 bg-slate-50 text-sm" placeholder="Cth: PO security, BM 1234 ...">
                </div>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="document.getElementById('modal-keluar').classList.add('hidden')" class="w-1/3 py-2.5 bg-slate-100 text-slate-600 font-medium rounded-md hover:bg-slate-200 transition text-sm">Batal</button>
                <button type="button" onclick="eksekusiKeluar()" id="btn-eksekusi" class="w-2/3 py-2.5 bg-slate-800 text-white font-medium rounded-md shadow-sm hover:bg-slate-900 transition flex justify-center items-center gap-2 text-sm"><i data-lucide="check-circle" class="w-4 h-4"></i> Eksekusi</button>
            </div>
        </div>
    </div>

    <!-- MODAL REQ PO -->
    <div id="modal-req-po" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[90] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-md border border-slate-200">
            <h3 class="text-base font-semibold mb-1 flex items-center gap-2 text-orange-600"><i data-lucide="file-warning" class="w-5 h-5"></i> Request Ganti PO</h3>
            <p class="text-xs text-slate-500 mb-5 border-b border-slate-100 pb-3 leading-relaxed">Semua baris bermasalah (merah / belum diVerifikasi) akan dipindah ke tabel antrean untuk diganti PO-nya oleh CS.</p>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Pilih PO Tujuan</label>
                    <select id="req-po-target" class="w-full p-2.5 border border-orange-300 rounded-md outline-none focus:border-orange-500 font-semibold text-slate-800 uppercase bg-orange-50/50 cursor-pointer text-sm">
                        <option value="">-- MEMUAT PO --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Alasan / Keterangan (Opsional)</label>
                    <input type="text" id="req-keterangan" class="w-full p-2.5 border border-slate-300 rounded-md outline-none focus:border-orange-500 font-semibold text-slate-800 bg-slate-50 text-sm" placeholder="Alasan ganti PO...">
                </div>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="document.getElementById('modal-req-po').classList.add('hidden')" class="w-1/3 py-2.5 bg-slate-100 text-slate-600 font-medium rounded-md hover:bg-slate-200 transition text-sm">Batal</button>
                <button type="button" onclick="submitReqPO()" id="btn-submit-req" class="w-2/3 py-2.5 bg-orange-600 text-white font-medium rounded-md shadow-sm hover:bg-orange-700 transition flex justify-center items-center gap-2 text-sm"><i data-lucide="send" class="w-4 h-4"></i> Request</button>
            </div>
        </div>
    </div>

    <!-- SIDEBAR FILTER -->
    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white">
            <h3 class="font-semibold text-slate-800 flex items-center gap-2 text-base"><i data-lucide="filter" class="w-5 h-5 text-blue-600"></i> Filter Data</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-slate-700 hover:bg-slate-100 p-1.5 rounded-md transition"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-3 overflow-y-auto custom-scroll flex-1 bg-slate-50/50">
            <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Status</label><input type="text" id="f-status" oninput="saringData()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
            <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="f-qr" oninput="saringData()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
            <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Nama Item</label><input type="text" id="f-nama" oninput="saringData()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
        </div>
        <div class="p-4 border-t border-slate-100 bg-white">
            <button onclick="resetFilter()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-md text-sm transition">Reset Filter</button>
        </div>
    </div>

    <div id="overlay-klik-luar" onclick="toggleSidebarFilter()" class="hidden fixed inset-0 z-[70] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="keluar_logic.js?v=2"></script>
</body>
</html>
