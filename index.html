<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Sunpevece - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 via-blue-700 to-blue-400 relative">

    <div class="absolute top-4 right-4 z-20">
        <button id="btn-setting-menu" class="p-3 bg-white/20 rounded-full hover:bg-white/40 transition text-white shadow-lg cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-md shadow-2xl py-1 text-gray-800 z-30 border border-gray-200">
            <button id="btn-web-setting" class="block w-full text-left px-5 py-3 hover:bg-blue-50 font-semibold border-b">⚙️ Web Setting</button>
            <button class="block w-full text-left px-5 py-3 hover:bg-blue-50">🎨 Ganti Theme</button>
            <button class="block w-full text-left px-5 py-3 hover:bg-blue-50">🖼️ Ganti Background</button>
        </div>
    </div>

    <div id="popup-setting" class="hidden absolute inset-0 flex items-center justify-center bg-black/70 z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-[90%] max-w-sm">
            <h3 class="text-xl font-bold mb-4 text-center text-gray-800">Akses Creator</h3>
            <p id="error-setting" class="text-red-600 text-center text-sm mb-4 hidden font-semibold bg-red-100 py-2 rounded">Password Salah!</p>
            <input type="password" id="input-pass-setting" class="w-full p-3 border-2 border-gray-300 rounded-lg mb-6 text-black outline-none focus:border-blue-600" placeholder="Masukkan PIN 9909...">
            <div class="flex justify-between gap-3">
                <button id="btn-batal-setting" class="w-1/2 py-3 text-gray-700 bg-gray-200 hover:bg-gray-300 rounded-lg font-bold transition">Batal</button>
                <button id="btn-masuk-setting" class="w-1/2 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold transition shadow-md">Masuk</button>
            </div>
        </div>
    </div>

    <div class="relative z-10 glass-box p-10 rounded-2xl shadow-[0_20px_50px_rgba(8,_112,_184,_0.7)] w-[90%] max-w-lg">
        <div class="flex justify-center mb-8">
            <img src="sunpevece.png" alt="Logo Sunpevece" class="h-20 object-contain" onerror="this.style.display='none'">
        </div>
        
        <h2 class="text-3xl font-extrabold text-center text-gray-800 mb-8 tracking-wide">PORTAL WMS</h2>

        <div id="error-login" class="hidden mb-6 p-4 bg-red-100 border-l-4 border-red-600 text-red-700 text-sm rounded-r-md font-semibold text-center">
            Password atau Username salah!
        </div>

        <form id="form-login" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Username</label>
                <input type="text" id="username" class="w-full p-4 border-2 border-gray-300 rounded-lg outline-none text-black focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Password</label>
                <input type="password" id="password" class="w-full p-4 border-2 border-gray-300 rounded-lg outline-none text-black focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all mt-4 text-lg">
                MASUK KE SISTEM
            </button>
        </form>
    </div>

    <script>
        // MASUKKAN KUNCI SUPABASE ANDA DI SINI
        const SUPABASE_URL = 'https://mjpqzftwbyrbvbvmarol.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcHF6ZnR3YnlyYnZidm1hcm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA0MTgsImV4cCI6MjA5NDE1NjQxOH0.0VT56HA-cGB4CP3u89PShcddt9jARh85KKMgnwCkse4';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // LOGIKA UI
        document.getElementById('btn-setting-menu').addEventListener('click', () => {
            document.getElementById('dropdown-menu').classList.toggle('hidden');
        });

        document.getElementById('btn-web-setting').addEventListener('click', () => {
            document.getElementById('dropdown-menu').classList.add('hidden');
            document.getElementById('popup-setting').classList.remove('hidden');
        });

        document.getElementById('btn-batal-setting').addEventListener('click', () => {
            document.getElementById('popup-setting').classList.add('hidden');
            document.getElementById('input-pass-setting').value = '';
            document.getElementById('error-setting').classList.add('hidden');
        });

        document.getElementById('btn-masuk-setting').addEventListener('click', () => {
            if(document.getElementById('input-pass-setting').value === '9909') {
                alert("Password Setting Benar! Berpindah ke Halaman Setting...");
                window.location.href = 'setting.html';
            } else {
                document.getElementById('error-setting').classList.remove('hidden');
            }
        });

        // LOGIKA LOGIN
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;
            const errorLogin = document.getElementById('error-login');

            const { data, error } = await supabase
                .from('app_users')
                .select('*')
                .eq('username', userVal)
                .eq('password', passVal)
                .single();

            if (error || !data) {
                errorLogin.classList.remove('hidden');
            } else {
                errorLogin.classList.add('hidden');
                localStorage.setItem('user_session', JSON.stringify(data));
                alert("Login Berhasil! Berpindah ke Halaman Menu...");
                window.location.href = 'menu.html';
            }
        });

        // CEK SESI
        window.onload = () => {
            if(localStorage.getItem('user_session')) {
                // Dimatikan sementara agar Anda bisa melihat halaman login
                // window.location.href = 'menu.html'; 
            }
        };
    </script>
</body>
</html>
