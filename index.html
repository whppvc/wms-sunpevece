<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Sunpevece - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <!-- Logo Area -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-600">PT SUNPEVECE INDODELI</h1>
            <p class="text-gray-500 text-sm">Warehouse Management System</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Pilih Bagian</label>
                <select id="role" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                    <option value="Gudang">Gudang</option>
                    <option value="PPC">PPC</option>
                    <option value="QC">QC</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition">
                Masuk ke Dashboard
            </button>
        </form>
        
        <div id="message" class="mt-4 text-center text-red-500 text-sm hidden">
            Password salah, silakan coba lagi.
        </div>
    </div>

    <script>
        // Logika sederhana untuk simulasi login (Nanti kita hubungkan ke Supabase)
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const pass = document.getElementById('password').value;
            
            // Contoh validasi sementara
            if(pass) {
                alert('Mencoba masuk sebagai ' + role);
                // Logika redirect akan diletakkan di sini
            }
        });
    </script>
</body>
</html>
