<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Sunpevece - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 via-blue-800 to-blue-500 relative">

    <div class="absolute top-6 right-6 z-20">
        <button id="btn-setting" class="p-3 bg-white/10 rounded-full hover:bg-white/30 backdrop-blur-md border border-white/20 transition-all text-white shadow-lg cursor-pointer">
            <i data-lucide="settings" class="w-6 h-6"></i>
        </button>
    </div>

    <div id="popup-setting" class="hidden absolute inset-0 flex items-center justify-center bg-black/70 z-50 backdrop-blur-sm transition-all">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-[90%] max-w-sm border border-gray-100">
            <h3 class="text-xl font-bold mb-4 text-center text-gray-800 flex flex-col items-center gap-2">
                <i data-lucide="shield-alert" class="w-10 h-10 text-blue-600"></i>
                Akses Creator
            </h3>
            <p id="error-setting" class="text-red-600 text-center text-sm mb-4 hidden font-semibold bg-red-50 border border-red-200 py-2 rounded-lg">PIN Salah!</p>
            <input type="password" id="input-pass-setting" class="w-full p-4 text-2xl font-bold text-center tracking-[0.5em] border-2 border-gray-200 rounded-xl mb-6 text-black outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-100 transition" placeholder="••••">
            <div class="flex justify-between gap-3">
                <button id="btn-batal-setting" class="w-1/2 py-3 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-xl font-bold transition">Batal</button>
                <button id="btn-masuk-setting" class="w-1/2 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-bold transition shadow-md">Masuk</button>
            </div>
        </div>
    </div>

    <div class="relative z-10 bg-white/20 backdrop-blur-lg border border-white/30 p-10 rounded-3xl shadow-[0_8px_32px_0_rgba(0,0,0,0.3)] w-[90%] max-w-lg">
        <div class="flex justify-center mb-6">
            <div class="bg-white/90 p-4 rounded-2xl shadow-inner">
                <img src="sunpevece.png" alt="Logo Sunpevece" class="h-16 object-contain" onerror="this.style.display='none'">
            </div>
        </div>
        
        <h2 class="text-3xl font-extrabold text-center text-white mb-8 tracking-wider uppercase drop-shadow-md">PORTAL WMS</h2>

        <div id="error-login" class="hidden mb-6 p-4 bg-red-500/80 backdrop-blur-sm border border-red-400 text-white text-sm rounded-xl font-semibold text-center shadow-lg">
            Password atau Username salah!
        </div>

        <form id="form-login" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-white/90 mb-2 ml-1">Username</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-4 top-4 w-5 h-5 text-gray-400"></i>
                    <input type="text" id="username" class="w-full py-4 pl-12 pr-4 bg-white/90 border-0 rounded-xl outline-none text-black focus:ring-4 focus:ring-blue-300 transition shadow-inner" placeholder="Masukkan username" required>
                </div>
            </div>
            <div>
                <label class="block text-sm font-bold text-white/90 mb-2 ml-1">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-4 w-5 h-5 text-gray-400"></i>
                    <input type="password" id="password" class="w-full py-4 pl-12 pr-12 bg-white/90 border-0 rounded-xl outline-none text-black focus:ring-4 focus:ring-blue-300 transition shadow-inner" placeholder="Masukkan password" required>
                    <button type="button" id="btn-toggle-pass" class="absolute right-4 top-4 text-gray-400 hover:text-blue-600 transition cursor-pointer">
                        <i data-lucide="eye" id="icon-eye" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-4 rounded-xl shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] hover:shadow-[0_6px_20px_rgba(37,99,235,0.23)] transition-all mt-6 text-lg flex items-center justify-center gap-2">
                <span>LOGIN</span>
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
        </form>
    </div>

    <script>
        lucide.createIcons();
        
        // MASUKKAN KUNCI SUPABASE ANDA DI SINI
        const SUPABASE_URL = 'https://mjpqzftwbyrbvbvmarol.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcHF6ZnR3YnlyYnZidm1hcm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA0MTgsImV4cCI6MjA5NDE1NjQxOH0.0VT56HA-cGB4CP3u89PShcddt9jARh85KKMgnwCkse4';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fungsi Lihat/Sembunyikan Password
        document.getElementById('btn-toggle-pass').addEventListener('click', () => {
            const passInput = document.getElementById('password');
            const iconEye = document.getElementById('icon-eye');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                iconEye.setAttribute('data-lucide', 'eye-off');
            } else {
                passInput.type = 'password';
                iconEye.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });

        // LOGIKA UI LAINNYA
        document.getElementById('btn-setting').addEventListener('click', () => document.getElementById('popup-setting').classList.remove('hidden'));
        document.getElementById('btn-batal-setting').addEventListener('click', () => { document.getElementById('popup-setting').classList.add('hidden'); document.getElementById('input-pass-setting').value = ''; document.getElementById('error-setting').classList.add('hidden'); });
        document.getElementById('btn-masuk-setting').addEventListener('click', () => {
            if(document.getElementById('input-pass-setting').value === '9909') window.location.href = 'setting.html';
            else document.getElementById('error-setting').classList.remove('hidden');
        });

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;
            const errorLogin = document.getElementById('error-login');
            
            const { data, error } = await db.from('app_users').select('*').eq('username', userVal).eq('password', passVal).single();
            if (error || !data) errorLogin.classList.remove('hidden');
            else {
                errorLogin.classList.add('hidden');
                localStorage.setItem('user_session', JSON.stringify(data));
                window.location.href = 'menu.html';
            }
        });
        window.onload = () => { if(localStorage.getItem('user_session')) window.location.href = 'menu.html'; };
    </script>
</body>
</html>
