<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Sunpevece - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Tema Biru Abstrak Default */
        body {
            background-color: #0d47a1;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            margin: 0;
            font-family: sans-serif;
        }
        .glass-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">

    <div class="absolute top-4 right-4 z-20">
        <button id="btn-setting-menu" class="p-2 bg-white/20 rounded-full hover:bg-white/40 transition text-white">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

        <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 text-gray-800 z-30">
            <button id="btn-web-setting" class="block w-full text-left px-4 py-2 hover:bg-gray-100 font-medium">Web Setting</button>
            <button class="block w-full text-left px-4 py-2 hover:bg-gray-100">Ganti Theme</button>
            <button class="block w-full text-left px-4 py-2 hover:bg-gray-100">Ganti Background</button>
        </div>
    </div>

    <div id="popup-setting" class="hidden absolute inset-0 flex items-center justify-center bg-black/60 z-50">
        <div class="bg-white p-6 rounded-lg shadow-xl w-[90%] max-w-sm">
            <h3 class="text-lg font-bold mb-4 text-black">Masukkan Password Creator</h3>
            <p id="error-setting" class="text-red-500 text-sm mb-3 hidden">Password Salah!</p>
            <input type="password" id="input-pass-setting" class="w-full p-2 border border-gray-300 rounded mb-4 text-black outline-none focus:border-blue-500" placeholder="Password Setting...">
            <div class="flex justify-end gap-2">
                <button id="btn-batal-setting" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Batal</button>
                <button id="btn-masuk-setting" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Masuk</button>
            </div>
        </div>
    </div>

    <div class="relative z-10 glass-box p-8 rounded-xl shadow-2xl w-[90%] max-w-md">
        <div class="flex justify-center mb-6">
            <img src="sunpevece.png" alt="Logo Sunpevece" class="h-16 object-contain" onerror="this.style.display='none'">
        </div>
        
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Silahkan Login</h2>

        <div id="error-login" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-md text-center font-semibold">
            Password atau Username salah!
        </div>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" id="username" class="w-full p-3 border border-gray-300 rounded-md outline-none text-black" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full p-3 border border-gray-300 rounded-md outline-none text-black" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition mt-2">
                LOGIN
            </button>
        </form>
    </div>

    <script>
        // --- MASUKKAN KUNCI SUPABASE ANDA DI SINI ---
        const SUPABASE_URL = 'https://mjpqzftwbyrbvbvmarol.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcHF6ZnR3YnlyYnZidm1hcm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA0MTgsImV4cCI6MjA5NDE1NjQxOH0.0VT56HA-cGB4CP3u89PShcddt9jARh85KKMgnwCkse4';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- LOGIKA UI (Tombol & Popup) ---
        const btnSettingMenu = document.getElementById('btn-setting-menu');
        const dropdownMenu = document.getElementById('dropdown-menu');
        const btnWebSetting = document.getElementById('btn-web-setting');
        const popupSetting = document.getElementById('popup-setting');
        const btnBatalSetting = document.getElementById('btn-batal-setting');
        const btnMasukSetting = document.getElementById('btn-masuk-setting');
        const inputPassSetting = document.getElementById('input-pass-setting');
        const errorSetting = document.getElementById('error-setting');

        btnSettingMenu.addEventListener('click', () => {
            dropdownMenu.classList.toggle('hidden');
        });

        btnWebSetting.addEventListener('click', () => {
            dropdownMenu.classList.add('hidden');
            popupSetting.classList.remove('hidden');
        });

        btnBatalSetting.addEventListener('click', () => {
            popupSetting.classList.add('hidden');
            inputPassSetting.value = '';
            errorSetting.classList.add('hidden');
        });

        btnMasukSetting.addEventListener('click', () => {
            if(inputPassSetting.value === '9909') {
                window.location.href = 'setting.html';
            } else {
                errorSetting.classList.remove('hidden');
            }
        });

        // --- LOGIKA LOGIN SUPABASE ---
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;
            const errorLogin = document.getElementById('error-login');

            // Cek ke tabel app_users di Supabase
            const { data, error } = await supabase
                .from('app_users')
                .select('*')
                .eq('username', userVal)
                .eq('password', passVal)
                .single();

            if (error || !data) {
                errorLogin.classList.remove('hidden');
            } else {
                errorLogin.classList.add('hidden');
                // Simpan data login agar tidak perlu login berulang saat di-reload
                localStorage.setItem('user_session', JSON.stringify(data));
                window.location.href = 'menu.html';
            }
        });

        // --- CEK SESI (Jika sudah login, langsung lempar ke menu) ---
        window.onload = () => {
            if(localStorage.getItem('user_session')) {
                window.location.href = 'menu.html';
            }
        };
    </script>
</body>
</html>
