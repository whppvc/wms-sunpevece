<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Sunpevece - Halaman Utama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Efek Kotak Transparan Cantik */
        .glass-box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 via-blue-600 to-blue-400 min-h-screen flex flex-col items-center justify-center p-4 relative font-sans">

    <div class="text-center mb-8 z-10">
        <img src="sunpevece.png" alt="Logo Sunpevece" class="h-24 mx-auto mb-4 object-contain bg-white p-2 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-white tracking-wider drop-shadow-md">WMS SUNPEVECE</h1>
    </div>

    <div class="glass-box p-8 rounded-2xl shadow-2xl w-full max-w-5xl z-10">
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            
            <button onclick="openModal('PPC', 'dashboard-ppc.html')" class="bg-white/80 hover:bg-white text-blue-900 p-6 rounded-xl shadow transition transform hover:scale-105 flex flex-col items-center gap-3">
                <i class="fa-solid fa-clipboard-list text-3xl"></i>
                <span class="font-bold">PPC</span>
            </button>

           <button onclick="window.open('https://script.google.com/macros/s/AKfycbyqZaLKl-Za15ueokNrB5H1RvJOpqgnRyr5yHfTlJdIML_uo1KuUVpU-Zdgw0BCO_fw5A/exec', '_blank')" 
        class="bg-white/80 hover:bg-white text-blue-900 p-6 rounded-xl shadow transition transform hover:scale-105 flex flex-col items-center gap-3">
    <i class="fa-solid fa-magnifying-glass-chart text-3xl"></i>
    <span class="font-bold">QC</span>
</button>

            <button onclick="openModal('WH - Plafon', 'dashboard-plafon.html')" class="bg-white/80 hover:bg-white text-blue-900 p-6 rounded-xl shadow transition transform hover:scale-105 flex flex-col items-center gap-3 text-center">
                <i class="fa-solid fa-warehouse text-3xl"></i>
                <span class="font-bold">WH - Plafon</span>
            </button>

            <button onclick="openModal('WH - Lis', 'dashboard-lis.html')" class="bg-white/80 hover:bg-white text-blue-900 p-6 rounded-xl shadow transition transform hover:scale-105 flex flex-col items-center gap-3 text-center">
                <i class="fa-solid fa-boxes-stacked text-3xl"></i>
                <span class="font-bold">WH - Lis</span>
            </button>

            <button onclick="openModal('WH - Wpc', 'dashboard-wpc.html')" class="bg-white/80 hover:bg-white text-blue-900 p-6 rounded-xl shadow transition transform hover:scale-105 flex flex-col items-center gap-3 text-center">
                <i class="fa-solid fa-pallet text-3xl"></i>
                <span class="font-bold">WH - Wpc</span>
            </button>

            <button onclick="openModal('STBJ', 'stbj.html')" class="bg-white/80 hover:bg-white text-blue-900 p-6 rounded-xl shadow transition transform hover:scale-105 flex flex-col items-center gap-3">
                <i class="fa-solid fa-barcode text-3xl"></i>
                <span class="font-bold">STBJ</span>
            </button>

            <button onclick="openModal('Langsir', 'langsir.html')" class="bg-white/80 hover:bg-white text-blue-900 p-6 rounded-xl shadow transition transform hover:scale-105 flex flex-col items-center gap-3">
                <i class="fa-solid fa-truck-ramp-box text-3xl"></i>
                <span class="font-bold">Langsir</span>
            </button>

            <button onclick="openModal('Delivery', 'delivery.html')" class="bg-white/80 hover:bg-white text-blue-900 p-6 rounded-xl shadow transition transform hover:scale-105 flex flex-col items-center gap-3">
                <i class="fa-solid fa-truck-fast text-3xl"></i>
                <span class="font-bold">Delivery</span>
            </button>

        </div>
    </div>

    <div id="passwordModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm">
            <h2 id="modalTitle" class="text-xl font-bold text-blue-800 mb-4 text-center">Login Bagian</h2>
            <p class="text-sm text-gray-500 mb-4 text-center">Masukkan password untuk melanjutkan.</p>
            
            <input type="password" id="passwordInput" placeholder="Password..." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none mb-4 text-center tracking-widest text-lg">
            
            <div id="errorMsg" class="hidden text-red-500 text-sm text-center mb-4 font-semibold">
                Warning: Password Salah!
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-700 font-bold py-3 rounded-lg hover:bg-gray-300 transition">Batal</button>
                <button onclick="checkPassword()" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition shadow-lg">Masuk</button>
            </div>
        </div>
    </div>

    <script>
        let currentRole = '';
        let targetUrl = '';

        // Buka Pop-up
        function openModal(roleName, url) {
            currentRole = roleName;
            targetUrl = url;
            document.getElementById('modalTitle').innerText = 'Akses ' + roleName;
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('passwordModal').classList.remove('hidden');
            // Auto fokus ke input password
            setTimeout(() => document.getElementById('passwordInput').focus(), 100);
        }

        // Tutup Pop-up
        function closeModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        // Cek Password (Simulasi Sementara, Nanti kita sambung ke Supabase di file terpisah)
        function checkPassword() {
            const inputPass = document.getElementById('passwordInput').value;
            
            // Password bawaan dari langkah 1 (Bisa diganti jika ambil dari DB nanti)
            const mockPasswords = {
                'PPC': 'ppc123', 'QC': 'qc123', 'WH - Plafon': 'plafon123',
                'WH - Lis': 'lis123', 'WH - Wpc': 'wpc123', 'STBJ': 'stbj123',
                'Langsir': 'langsir123', 'Delivery': 'delivery123'
            };

            if (inputPass === mockPasswords[currentRole]) {
                // Kalo benar maka lanjut masuk ke dashboard masing2
                window.location.href = targetUrl;
            } else {
                // Klo salah maka muncul warning password salah
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        // Support tekan "Enter" di keyboard untuk login
        document.getElementById('passwordInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
