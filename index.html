<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS Sunpevece - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        
        <!-- Logo Area (Pastikan nama file di src="" sesuai dengan nama file gambar Anda) -->
        <div class="flex justify-center mb-4">
            <img src="sunpevece.png" alt="Logo PT Sunpevece" class="h-20 w-auto object-contain">
        </div>

        <!-- Judul & Deskripsi -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-600">PT SUNPEVECE</h1>
            <p class="text-gray-500 text-xs mt-3 leading-relaxed font-medium px-2">
                Report Produksi • STBJ • Catat Stok • Booking Stok • Pengiriman Stok • Laporan • Cetak Label
            </p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Pilih Bagian</label>
                <select id="role" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none">
                    <option value="Gudang">Gudang</option>
                    <option value="PPC">PPC</option>
                    <option value="QC">QC</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition font-semibold mt-4">
                Masuk ke Dashboard
            </button>
        </form>
        
        <div id="message" class="mt-4 text-center text-red-500 text-sm hidden">
            Password salah, silakan coba lagi.
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const pass = document.getElementById('password').value;
            
            if(pass) {
                alert('Mencoba masuk sebagai ' + role);
            }
        });
    </script>
</body>
</html>
