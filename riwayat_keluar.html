<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Riwayat Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-main: #f8fafc; --bg-box: #ffffff; --text-main: #1f2937; --border-color: #e2e8f0; }
        body[data-bg="dark"] { --bg-main: #0f172a; --bg-box: #1e293b; --text-main: #f8fafc; --border-color: #334155; }
        body { background-color: var(--bg-main); color: var(--text-main); transition: all 0.3s ease; min-height: 100vh; }
        .card-dynamic { background-color: var(--bg-box); border-color: var(--border-color); }
        .input-dynamic { background-color: var(--bg-main); color: var(--text-main); border-color: var(--border-color); }
    </style>
</head>
<body id="app-body" class="font-sans">

    <div class="sticky top-0 z-40 w-full flex flex-col shadow-md">
        <nav class="card-dynamic px-4 py-3 flex items-center justify-between border-b">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='menu.html'" class="p-2 bg-rose-100 hover:bg-rose-200 text-rose-900 rounded-full transition cursor-pointer active:scale-95 shadow-inner"><i data-lucide="home" class="w-5 h-5"></i></button>
                <div class="flex flex-col ml-1"><span class="font-extrabold text-lg tracking-wide leading-tight text-rose-900">PORTAL WMS</span></div>
            </div>
        </nav>
        <div id="tab-bar" class="w-full bg-[#0f172a] text-gray-400 flex overflow-x-auto text-[11px] font-black hide-scrollbar tracking-wider"></div>
    </div>

    <main class="p-4 md:p-6 w-full max-w-6xl mx-auto flex-grow pt-6">
        <header class="mb-4 flex flex-col md:flex-row md:justify-between md:items-center gap-4 border-b border-gray-200/50 pb-4">
            <div class="flex items-center gap-3">
                <div class="bg-rose-100 p-2.5 rounded-xl"><i data-lucide="history" class="w-7 h-7 text-rose-900"></i></div>
                <div>
                    <h2 class="text-2xl font-black text-rose-900">Riwayat Barang Keluar</h2>
                    <p class="text-xs font-bold opacity-60">Log Pengeluaran & Pemotongan Kartu Stok</p>
                </div>
            </div>
            <button onclick="loadData()" class="px-4 py-2 bg-rose-100 text-rose-900 font-bold rounded-lg border border-rose-300 hover:bg-rose-200 transition cursor-pointer text-sm flex items-center gap-2 shadow-sm active:scale-95"><i data-lucide="refresh-cw" class="w-4 h-4"></i> REFRESH DATA</button>
        </header>

        <div class="card-dynamic rounded-xl shadow-md border overflow-hidden">
            <div class="overflow-x-auto w-full max-h-[70vh]">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="uppercase text-[11px] sticky top-0 z-10 shadow-sm tracking-wider">
                        <tr>
                            <th class="p-4 bg-[#1e293b] text-white text-center w-12">No</th>
                            <th class="p-4 bg-rose-950 text-white border-r border-rose-800"><i data-lucide="calendar-clock" class="w-4 h-4 inline mr-1"></i> Waktu Eksekusi</th>
                            <th class="p-4 bg-[#1e293b] text-emerald-300 border-r border-gray-600">PIC Gudang</th>
                            <th class="p-4 bg-[#1e293b] text-white">Detail Pengeluaran (Tujuan & Supir)</th>
                        </tr>
                    </thead>
                    <tbody id="data-body"><tr><td colspan="4" class="text-center p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-3 text-rose-900"></i><p class="font-bold text-gray-500">Membaca Sejarah...</p></td></tr></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="global.js"></script> 

    <script>
        // 2. Deklarasi identitas halaman
        const PAGE_META = { id: 'riwayat_keluar', title: 'RIWAYAT KELUAR', url: 'riwayat_keluar.html' };
        
        // 3. Saat halaman dimuat, panggil pembuat Tab dari global.js, lalu muat data
        window.onload = () => { 
            initGlobalTabs(PAGE_META); 
            loadData(); 
        };

        // 4. Logika penarik data (TIDAK PERLU LAGI menulis URL Supabase dan db di sini)
        async function loadData() {
            try {
                // Filter hanya data KIRIM OUT
                const { data, error } = await db.from('log_mutasi').select('*').eq('aktifitas', 'KIRIM OUT').order('created_at', {ascending: false}).limit(200);
                if(error) throw error;
                
                const tbody = document.getElementById('data-body');
                if(!data || data.length === 0) { 
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center p-10 opacity-50"><i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2"></i> Belum ada riwayat pengiriman.</td></tr>`; 
                    lucide.createIcons(); return; 
                }

                let html = ''; 
                data.forEach((r, i) => {
                    const date = new Date(r.waktu).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                    html += `
                        <tr class="border-b border-inherit hover:bg-rose-50 transition">
                            <td class="p-4 text-center font-bold opacity-50">${i+1}</td>
                            <td class="p-4 font-black text-rose-900 bg-rose-50/50">${date}</td>
                            <td class="p-4 font-bold text-gray-700 uppercase">${r.pic}</td>
                            <td class="p-4 font-medium text-blue-800 whitespace-normal min-w-[300px] leading-relaxed"><i data-lucide="info" class="w-4 h-4 inline mr-1 opacity-50"></i>${r.detail}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html; lucide.createIcons();
            } catch (err) {
                document.getElementById('data-body').innerHTML = `<tr><td colspan="4" class="p-10 text-center text-red-500 font-bold">Error: ${err.message}</td></tr>`;
            }
        }
    </script>
</body>
</html>
</html>
