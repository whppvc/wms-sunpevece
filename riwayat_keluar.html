<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Riwayat Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }

        tr.selected-row td { background-color: #ccfbf1 !important; color: #0f766e !important; }
        .col-hidden { display: none !important; }
        .hdr-filtered { background-color: #312e81 !important; color: #fbbf24 !important; }
    </style>
</head>
<body class="font-sans text-slate-800">
    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- NAVIGASI TAB MENU -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200">
            <!-- KOMPONEN DINAMIS: SUBMENU TABS -->
            <div id="container-submenu"></div>

            <!-- TOOLBAR -->
            <div class="p-3 sm:p-4 flex items-center justify-between bg-slate-50/50 border-t border-slate-100 w-full gap-2">
                
                <!-- KIRI: Aksi / Filter Tanggal Mobile -->
                <div class="flex gap-2 items-center overflow-x-auto hide-scrollbar flex-1">
                    
                    <!-- Filter Tanggal Khusus Mode Mobile -->
                    <div id="mobile-date-filter" class="flex items-center gap-2 bg-white border border-slate-300 rounded-md p-1 shadow-sm shrink-0">
                        <i data-lucide="calendar" class="w-4 h-4 text-slate-400 ml-1"></i>
                        <input type="date" id="filter-date-mobile" onchange="renderMobileView()" class="p-1.5 text-xs font-bold text-slate-700 outline-none cursor-pointer bg-transparent">
                    </div>
                    
                    <button onclick="aksiMassal('cancel')" id="btn-cancel" class="hidden group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-rose-700">
                        <div class="bg-rose-700 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></div>
                        <div class="bg-rose-600 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-rose-500 transition">Cancel Keluar</div>
                    </button>

                </div>

                <!-- KANAN: Tombol Filter & Menu Aksi -->
                <div class="flex items-center gap-2 shrink-0">
                    <button onclick="muatDataDariSupabase()" class="p-2.5 bg-white rounded-md border border-slate-300 shadow-sm active:scale-95 text-slate-600 hover:bg-slate-50 transition" title="Refresh Data">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                    
                    <div class="relative">
                        <button onclick="toggleActionMenu(event)" class="p-2.5 bg-white rounded-md border border-slate-300 shadow-sm active:scale-95 text-slate-600 hover:bg-slate-50 transition" title="Menu Aksi">
                            <i data-lucide="menu" class="w-5 h-5"></i>
                        </button>
                        <div id="mobile-action-menu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white shadow-xl rounded-md border border-slate-200 z-50 flex flex-col overflow-hidden">
                            <button onclick="aksiMassal('salin'); toggleActionMenu(event)" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="copy" class="w-4 h-4 text-slate-500"></i> Salin Data</button>
                            <button onclick="aksiMassal('xlsx'); toggleActionMenu(event)" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i> Export Excel</button>
                            <button onclick="toggleSidebarKolom(); toggleActionMenu(event)" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-blue-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="columns" class="w-4 h-4 text-blue-600"></i> Atur Kolom</button>
                            <button onclick="bukaModalTableDesign(); toggleActionMenu(event)" class="text-left px-4 py-3 text-xs font-bold text-purple-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="palette" class="w-4 h-4 text-purple-600"></i> Table Design</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AREA KONTEN -->
        <div class="flex-1 min-h-0 bg-slate-100 p-4 overflow-hidden flex flex-col relative z-0">
            
            <!-- VIEW TABEL (Untuk Mode Item, Hold) -->
            <div id="view-table" class="hidden flex-1 min-h-0 overflow-y-auto custom-scroll table-container bg-white rounded-t-xl shadow-sm border border-slate-300">
                <table class="w-full text-left border-separate border-spacing-0 whitespace-nowrap" id="table-keluar-main">
                    <thead class="sticky top-0 z-50 shadow-sm" id="thead-keluar"></thead>
                    <tbody id="tbody-keluar" class="text-slate-700"></tbody>
                </table>
            </div>

            <!-- VIEW MOBILE (Folder / Drill-Down View) -->
            <div id="view-mobile" class="flex-1 min-h-0 overflow-y-auto custom-scroll flex flex-col gap-3 pb-32">
                <!-- Konten Mobile di-render oleh JS -->
            </div>

        </div>
        
        <!-- KOMPONEN DINAMIS: FOOTER PAGINATION -->
        <div id="container-footer" class="hidden shrink-0 w-full bg-white p-3 sm:p-4 flex-col md:flex-row justify-between items-center gap-4 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300"></div>

        <!-- FOOTER FREEZE LEVEL 5 MOBILE (PILIH SEMUA & TOMBOL CANCEL KELUAR) -->
        <div id="mobile-lvl5-footer" class="hidden shrink-0 w-full bg-white px-4 py-3.5 z-40 shadow-[0_-8px_25px_rgba(0,0,0,0.15)] border-t border-slate-300 flex justify-between items-center">
            <label class="flex items-center gap-3 cursor-pointer select-none">
                <input type="checkbox" id="cb-all-lvl5" onchange="toggleSelectAllLvl5(this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer border-slate-400">
                <span class="text-xs font-black text-slate-800 uppercase tracking-wider">Pilih Semua</span>
            </label>

            <button id="btn-cancel-mobile-lvl5" onclick="cancelKeluarMobile()" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-black text-xs uppercase rounded-xl shadow-lg flex items-center gap-2 transition border-b-4 border-rose-900 cursor-pointer">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>Cancel Keluar</span>
            </button>
        </div>

    </div>

    <!-- MODAL CUSTOM ALERT -->
    <div id="modal-custom-alert" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/70 z-[200] px-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-200 text-center flex flex-col items-center">
            <div id="alert-icon-container" class="w-16 h-16 rounded-full flex items-center justify-center mb-4">
                <i id="alert-icon" data-lucide="info" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-black mb-2 text-slate-800" id="alert-title">Perhatian</h3>
            <p class="text-sm font-semibold text-slate-500 mb-6 leading-relaxed" id="alert-message">Pesan alert di sini.</p>
            <button onclick="document.getElementById('modal-custom-alert').classList.add('hidden')" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl shadow-md text-xs uppercase transition active:scale-95">Tutup</button>
        </div>
    </div>

    <!-- MODAL CANCEL KELUAR (RETURN STOK DARI TABEL HOLD) -->
    <div id="modal-cancel-hold" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[100] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-200">
            <h3 class="text-lg font-black mb-4 flex items-center gap-2 text-rose-600"><i data-lucide="rotate-ccw"></i> Cancel Item Keluar</h3>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-black uppercase tracking-wide mb-2 text-slate-600">Pilih Area Kembali</label>
                    <select id="cancel-area" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-rose-600 font-bold text-slate-800 uppercase bg-slate-50 cursor-pointer">
                        <option value="">-- Memuat Area... --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-wide mb-2 text-slate-600">Keterangan</label>
                    <input type="text" id="cancel-ket" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-rose-600 font-bold text-slate-800 bg-slate-50 placeholder-slate-400" placeholder="Cth: Batal kirim / Retur gudang...">
                </div>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="document.getElementById('modal-cancel-hold').classList.add('hidden')" class="w-1/2 py-3 bg-slate-200 text-slate-700 font-black rounded-xl hover:bg-slate-300 transition cursor-pointer text-xs uppercase">BATAL</button>
                <button type="button" onclick="eksekusiCancelHold()" id="btn-submit-cancel" class="w-1/2 py-3 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-xl shadow-md transition flex justify-center items-center gap-2 cursor-pointer active:scale-95 text-xs uppercase border-b-4 border-rose-800"><i data-lucide="save" class="w-4 h-4"></i> PROSES</button>
            </div>
        </div>
    </div>

    <!-- MODAL FILTER EXCEL SPREADSHEET -->
    <div id="excel-filter-menu" class="hidden fixed bg-white shadow-2xl border border-slate-300 rounded-2xl w-64 z-[120] flex flex-col font-sans text-sm overflow-hidden">
        <div class="p-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <span class="font-black text-slate-700 text-xs uppercase tracking-wider" id="filter-col-name">Filter</span>
            <button onclick="closeFilterMenu()" class="text-slate-400 hover:text-rose-500 bg-white border border-slate-200 p-1 rounded transition shadow-sm"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>
        
        <div class="p-2 border-b border-slate-200 flex flex-col gap-1 bg-white">
            <button onclick="sortFromMenu('asc')" class="text-left px-3 py-2 hover:bg-slate-100 rounded-lg text-xs font-bold text-slate-700 flex items-center gap-2 transition"><i data-lucide="arrow-down-a-z" class="w-4 h-4 text-blue-600"></i> Urutkan A ke Z</button>
            <button onclick="sortFromMenu('desc')" class="text-left px-3 py-2 hover:bg-slate-100 rounded-lg text-xs font-bold text-slate-700 flex items-center gap-2 transition"><i data-lucide="arrow-up-z-a" class="w-4 h-4 text-blue-600"></i> Urutkan Z ke A</button>
        </div>

        <div class="p-2 border-b border-slate-100 bg-slate-50">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
                <input type="text" id="filter-search-input" oninput="searchFilterList(this.value)" autocomplete="off" class="w-full pl-8 p-1.5 text-xs font-bold border border-slate-300 bg-white rounded-lg focus:border-blue-500 outline-none transition shadow-inner" placeholder="Cari Spesifik...">
            </div>
        </div>
        <div class="p-2 max-h-48 overflow-y-auto flex flex-col gap-1 text-xs bg-white custom-scroll" id="filter-values-list"></div>
        <div class="p-3 border-t border-slate-200 bg-slate-50 flex justify-between gap-2">
            <button onclick="clearFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 transition shadow-sm">Reset</button>
            <button onclick="applyFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition shadow-sm">Terapkan</button>
        </div>
    </div>

    <!-- SIDEBAR ATUR KOLOM -->
    <div id="sidebar-kolom" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="columns" class="w-4 h-4 text-blue-600"></i> Atur Urutan Kolom</h3>
            <button onclick="toggleSidebarKolom()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 bg-blue-50 border-b border-blue-100 text-xs text-blue-800 font-medium leading-relaxed">
            Tahan dan geser (Drag & Drop) kotak di bawah ini untuk mengatur urutan kolom.
        </div>
        <div class="p-3 flex flex-col gap-2 overflow-y-auto custom-scroll flex-1" id="kolom-drag-container"></div>
        <div class="p-4 border-t border-slate-200 bg-slate-50 flex gap-2">
            <button onclick="resetUrutanKolom()" class="w-1/3 py-2.5 bg-white border border-slate-300 text-slate-600 font-bold rounded-md text-xs uppercase transition hover:bg-slate-100 shadow-sm">Reset</button>
            <button onclick="simpanUrutanKolom()" class="w-2/3 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-md text-xs uppercase transition shadow-md flex justify-center items-center gap-2 border-b-4 border-blue-800"><i data-lucide="save" class="w-4 h-4"></i> Simpan</button>
        </div>
    </div>

    <!-- OVERLAY KLIK LUAR -->
    <div id="overlay-klik-luar" onclick="tutupSemuaPopups()" class="hidden fixed inset-0 z-[50] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="wms_parser.js"></script>
    <script src="riwayat_keluar_logic.js"></script>
</body>
</html>
