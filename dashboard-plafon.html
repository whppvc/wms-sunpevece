<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gudang Plafon - WMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center relative z-20">
        <div class="flex items-center gap-3 md:gap-4">
            <button onclick="toggleSidebar()" class="p-2 bg-blue-700 hover:bg-blue-800 rounded transition focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <h1 class="text-base md:text-xl font-bold tracking-wide">DASHBOARD GUDANG PLAFON</h1>
        </div>

        <a href="index.html" class="bg-white p-1 rounded hover:scale-105 transition transform cursor-pointer">
            <img src="logo.png" alt="Logo Sunpevece" class="h-8 md:h-10 w-auto object-contain">
        </a>
    </header>

    <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-blue-900 text-white shadow-2xl transform -translate-x-full transition-transform duration-300 z-30 flex flex-col">
        <div class="p-4 flex justify-between items-center border-b border-blue-800 bg-blue-950">
            <h2 class="font-bold text-lg">Menu Plafon</h2>
            <button onclick="toggleSidebar()" class="text-gray-300 hover:text-white">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
        </div>
        
        <nav class="flex-1 p-4 flex flex-col gap-2 overflow-y-auto">
            <a href="#" class="p-3 hover:bg-blue-700 rounded flex items-center gap-3"><i class="fa-solid fa-boxes-stacked w-5"></i> Kartu Stok</a>
            <a href="#" class="p-3 hover:bg-blue-700 rounded flex items-center gap-3"><i class="fa-solid fa-file-lines w-5"></i> Report</a>
            <a href="#" class="p-3 hover:bg-blue-700 rounded flex items-center gap-3"><i class="fa-solid fa-arrow-right-to-bracket w-5"></i> Barang Masuk</a>
            <a href="#" class="p-3 hover:bg-blue-700 rounded flex items-center gap-3"><i class="fa-solid fa-arrow-right-from-bracket w-5"></i> Barang Keluar</a>
            <a href="#" class="p-3 hover:bg-blue-700 rounded flex items-center gap-3"><i class="fa-solid fa-people-carry-box w-5"></i> Pindah Area</a>
            <a href="#" class="p-3 hover:bg-blue-700 rounded flex items-center gap-3"><i class="fa-solid fa-right-left w-5"></i> Konversi</a>
            <a href="#" class="p-3 hover:bg-blue-700 rounded flex items-center gap-3"><i class="fa-solid fa-magnifying-glass w-5"></i> Pencarian Stok</a>
            <a href="#" class="p-3 hover:bg-blue-700 rounded flex items-center gap-3"><i class="fa-solid fa-layer-group w-5"></i> Lembaran</a>
        </nav>

        <div class="p-4 border-t border-blue-800">
            <a href="index.html" class="p-3 bg-red-600 hover:bg-red-700 rounded flex items-center justify-center gap-2 font-bold w-full shadow-lg">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar
            </a>
        </div>
    </div>

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 hidden z-10 transition-opacity"></div>

    <main class="p-4 md:p-8 max-w-6xl mx-auto mt-4">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
            
            <button class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center gap-4 text-blue-900 border-t-4 border-blue-500">
                <i class="fa-solid fa-boxes-stacked text-4xl text-blue-600"></i>
                <span class="font-bold text-sm md:text-base">Kartu Stok</span>
            </button>
            
            <button class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center gap-4 text-blue-900 border-t-4 border-green-500">
                <i class="fa-solid fa-file-lines text-4xl text-green-600"></i>
                <span class="font-bold text-sm md:text-base">Report</span>
            </button>

            <button class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center gap-4 text-blue-900 border-t-4 border-blue-400">
                <i class="fa-solid fa-arrow-right-to-bracket text-4xl text-blue-400"></i>
                <span class="font-bold text-sm md:text-base">Barang Masuk</span>
            </button>

            <button class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center gap-4 text-blue-900 border-t-4 border-red-500">
                <i class="fa-solid fa-arrow-right-from-bracket text-4xl text-red-500"></i>
                <span class="font-bold text-sm md:text-base">Barang Keluar</span>
            </button>

            <button class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center gap-4 text-blue-900 border-t-4 border-purple-500">
                <i class="fa-solid fa-people-carry-box text-4xl text-purple-600"></i>
                <span class="font-bold text-sm md:text-base">Pindah Area</span>
            </button>

            <button class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center gap-4 text-blue-900 border-t-4 border-orange-500">
                <i class="fa-solid fa-right-left text-4xl text-orange-500"></i>
                <span class="font-bold text-sm md:text-base">Konversi</span>
            </button>

            <button class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center gap-4 text-blue-900 border-t-4 border-teal-500">
                <i class="fa-solid fa-magnifying-glass text-4xl text-teal-600"></i>
                <span class="font-bold text-sm md:text-base text-center leading-tight">Pencarian Stok</span>
            </button>

            <button class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition transform hover:-translate-y-1 flex flex-col items-center gap-4 text-blue-900 border-t-4 border-yellow-500">
                <i class="fa-solid fa-layer-group text-4xl text-yellow-500"></i>
                <span class="font-bold text-sm md:text-base">Lembaran</span>
            </button>

        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            // Menggeser sidebar keluar / masuk layar
            sidebar.classList.toggle('-translate-x-full');
            
            // Menampilkan / menyembunyikan layar gelap di belakangnya
            if (overlay.classList.contains('hidden')) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
