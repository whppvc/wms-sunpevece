<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard QC (Label Pabrik)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
      /* --- KODE ASLI DARI CSS.TXT (Tanpa Beautify) --- */
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
      .center-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
      .btn-primary { background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; text-decoration:none; display:inline-block;}
      .btn-primary:hover { background-color: #0b5ed7; }
      .center-screen .btn-large { font-size: 2.2rem; padding: 25px 45px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);}
      .btn-success { background-color: #198754; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight:bold;}
      .btn-secondary { background-color: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight:bold; transition: 0.2s;}
      .btn-secondary:hover { background-color: #5c636a; }
      .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
      .modal-content { background-color: #fff; margin: 10% auto; padding: 20px; width: 80%; max-width: 500px; border-radius: 8px; position: relative; }
      .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; font-size: 1.2rem; }
      .close-modal { cursor: pointer; color: #dc3545; font-weight:bold; font-size: 1.5rem; line-height: 1;}
      .list-popup { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; border: 1px solid #ccc; margin-top: 5px; border-radius: 4px;}
      .list-popup li { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #eee; transition: 0.1s;}
      .list-popup li:hover { background-color: #f8f9fa; }
      .list-popup li.selected { background-color: #e2e6ea; color: #000; font-weight: bold; border-left: 4px solid #0d6efd; } 
      .navbar { background-color: #343a40; padding: 10px; display: flex; gap: 10px; }
      .nav-btn { background: none; border: none; color: white; padding: 10px 20px; cursor: pointer; font-size: 1.1rem; border-radius: 4px; }
      .nav-btn.active { background-color: #0d6efd; font-weight: bold; }
      .layout-container { display: flex; gap: 20px; padding: 20px; }
      .layout-kiri { flex: 1; min-width: 320px; }
      .layout-kanan { flex: 2; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      .panel-form { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
      .form-group { margin-bottom: 15px; }
      .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
      .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
      .input-with-search { display: flex; gap: 5px; }
      .input-with-search input { flex: 1; }
      .input-with-search button { background-color: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }

      /* D-PAD STYLES */
      .dpad-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; width: 120px; margin: 0 auto; }
      .dpad-btn { background: #eee; border: 1px solid #ccc; padding: 10px; text-align: center; cursor: pointer; border-radius: 4px; font-weight: bold; }
      .dpad-btn:active { background: #ddd; }
      .active-dpad { outline: 2px solid #0d6efd; background: #e7f1ff !important; }
    </style>
  </head>
  <body>
    <div style="background: #0d6efd; padding: 10px 20px; color: white; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:bold;">Dashboard QC - Produksi</span>
        <a href="index.html" style="color:white; text-decoration:none; font-size: 14px;">[Kembali ke Menu Utama]</a>
    </div>

    <div id="start-view" class="center-screen">
      <button class="btn-primary btn-large" onclick="mulaiAplikasi()">Mulai membuat Label</button>
    </div>

    <div id="app-view" style="display: none;">
      <div class="navbar">
        <button class="nav-btn active" id="nav-plafon" onclick="pindahMenu('plafon')">Plafon</button>
        <button class="nav-btn" id="nav-lis" onclick="pindahMenu('lis')">Lis</button>
        <button class="nav-btn" id="nav-wpc" onclick="pindahMenu('wpc')">Wpc</button>
      </div>

      <div id="template-plafon" style="display:none;">
        <div class="layout-container">
          <div class="layout-kiri">
            <div id="p-panel-form" class="panel-form">
              <h3 style="margin-top:0; border-bottom:2px solid #0d6efd; padding-bottom:10px;">Form Plafon</h3>
              <div class="form-group"><label>Tanggal Produksi:</label><input type="date" id="p-tgl"></div>
              <div class="form-group"><label>Mesin:</label><select id="p-mesin"></select></div>
              <div class="form-group"><label>Shift:</label><select id="p-shift"></select></div>
              <div class="form-group"><label>Nama Item:</label><div class="input-with-search"><input type="text" id="p-item" readonly placeholder="Pilih Item..."><button onclick="bukaModal('p-modal-cari-item')">CARI</button></div></div>
              <div class="form-group"><label>Panjang (M):</label><input type="number" id="p-panjang" placeholder="4"></div>
              <div class="form-group"><label>Grade:</label><select id="p-grade"></select></div>
              <div class="form-group"><label>Shading:</label><input type="text" id="p-shading" placeholder="WT-1" style="text-transform: uppercase;"></div>
              <div class="form-group"><label>PO:</label><div class="input-with-search"><input type="text" id="p-po" readonly placeholder="Pilih PO..."><button onclick="bukaModal('p-modal-cari-po')">CARI</button></div></div>
              <div class="form-group"><label>Jumlah Print:</label><input type="number" id="p-qty" value="0" oninput="cekValidasi('p')"></div>
              <button id="p-btn-generate" class="btn-primary" style="width:100%; padding:15px; opacity:0.5; cursor:not-allowed;" disabled onclick="prosesGenerate('p')">1. BUAT QRCODE (Terkunci)</button>
            </div>

            <div id="p-edit-layout" class="panel-form">
                <h3 style="margin-top:0; border-bottom:2px solid #198754; padding-bottom:10px;">3. EDIT LAYOUT</h3>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <div class="dpad-container">
                        <div class="dpad-btn" onclick="movePos('up')">▲</div>
                        <div class="dpad-btn" onclick="movePos('down')">▼</div>
                        <div class="dpad-btn" onclick="movePos('left')">◀</div>
                        <div class="dpad-btn" onclick="movePos('right')">▶</div>
                    </div>
                    <div style="display:flex; justify-content:center; gap:5px;">
                        <button class="btn-secondary" onclick="zoom('in')">Zoom In (+)</button>
                        <button class="btn-secondary" onclick="zoom('out')">Zoom Out (-)</button>
                    </div>
                </div>
            </div>
            <button id="p-btn-render" class="btn-success" style="width:100%; padding:15px;" onclick="renderPreview('p')">🖨 4. CETAK LABEL</button>
          </div>

          <div class="layout-kanan" id="p-layout-kanan">
             <div style="background:#525659; padding:40px; min-height:500px; display:flex; justify-content:center; align-items:center;">
                <div id="p-node-label" style="background:white; width:50.8mm; height:27.9mm; position:relative; overflow:hidden; border:1px solid black;">
                    </div>
             </div>
          </div>
        </div>
      </div>

      <div id="template-lis" style="display:none;">
          <div style="padding:20px; text-align:center;"><h2>Halaman Lis Berhasil Dimuat</h2><p>Gunakan tombol navigasi untuk kembali.</p></div>
      </div>
    </div>

    <div id="p-modal-cari-item" class="modal"><div class="modal-content"><div class="modal-header"><span>Cari Item Plafon</span><span class="close-modal" onclick="tutupModal('p-modal-cari-item')">✖</span></div><input type="text" id="p-input-search-item" placeholder="Ketik nama item..." style="width:100%; padding:8px;" onkeyup="filterList('p-input-search-item', 'p-item-list')"><ul id="p-item-list" class="list-popup"></ul><button class="btn-success" onclick="pilihItem('p')">✔ PILIH ITEM</button></div></div>
    <div id="p-modal-cari-po" class="modal"><div class="modal-content"><div class="modal-header"><span>Cari PO</span><span class="close-modal" onclick="tutupModal('p-modal-cari-po')">✖</span></div><ul id="p-po-list" class="list-popup"></ul><button class="btn-success" onclick="pilihPO('p')">✔ PILIH PO</button></div></div>

    <script>
      // 1. CONFIG SUPABASE
      const SUPABASE_URL = 'https://YOUR_PROJECT_URL.supabase.co';
      const SUPABASE_KEY = 'YOUR_ANON_KEY';
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // 2. STATE & GLOBAL VARIABLES
      let isPlafonInit = false; let isLisInit = false;
      let dataPlafon = {}; let currentMenu = 'p';
      let selectedPlafonItem = ""; let selectedPlafonPO = "";

      // 3. NAVIGATION FUNCTIONS
      function mulaiAplikasi() {
        document.getElementById('start-view').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        pindahMenu('plafon');
      }

      function pindahMenu(menu) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('nav-' + menu).classList.add('active');

        document.getElementById('template-plafon').style.display = (menu === 'plafon' ? 'block' : 'none');
        document.getElementById('template-lis').style.display = (menu === 'lis' ? 'block' : 'none');

        currentMenu = menu === 'plafon' ? 'p' : 'l';
        if(menu === 'plafon' && !isPlafonInit) { initPlafon(); }
      }

      // 4. SUPABASE DATA FETCHING (Dropdown Fix)
      async function initPlafon() {
          const { data, error } = await supabaseClient.from('master_plafon').select('*');
          if (error) { console.error(error); return; }
          
          dataPlafon = processData(data);
          isiDropdown('p', dataPlafon);
          document.getElementById('p-tgl').valueAsDate = new Date();
          isPlafonInit = true;
      }

      function processData(data) {
          const getUnique = (arr, key) => [...new Set(arr.map(item => item[key]).filter(Boolean))].sort();
          return {
              mesin: getUnique(data, 'mesin'),
              shift: getUnique(data, 'shift'),
              item: getUnique(data, 'nama_item'),
              grade: getUnique(data, 'grade'),
              po: getUnique(data, 'po')
          };
      }

      function isiDropdown(prefix, data) {
          // Isi Dropdown Mesin
          let selMesin = document.getElementById(prefix + '-mesin');
          selMesin.innerHTML = '<option value="">Pilih Mesin</option>';
          data.mesin.forEach(m => selMesin.innerHTML += `<option value="${m}">${m}</option>`);

          // Isi Dropdown Shift
          let selShift = document.getElementById(prefix + '-shift');
          selShift.innerHTML = '<option value="">Pilih Shift</option>';
          data.shift.forEach(s => selShift.innerHTML += `<option value="${s}">${s}</option>`);

          // Isi Dropdown Grade
          let selGrade = document.getElementById(prefix + '-grade');
          if(selGrade) {
            selGrade.innerHTML = '';
            data.grade.forEach(g => selGrade.innerHTML += `<option value="${g}">${g}</option>`);
          }

          // Isi Pop-up List Item
          let ulItem = document.getElementById(prefix + '-item-list');
          ulItem.innerHTML = '';
          data.item.forEach(i => {
              let li = document.createElement('li'); li.innerText = i;
              li.onclick = function() { 
                  document.querySelectorAll(`#${prefix}-item-list li`).forEach(el => el.classList.remove('selected'));
                  this.classList.add('selected');
                  selectedPlafonItem = i;
              };
              ulItem.appendChild(li);
          });

          // Isi Pop-up List PO
          let ulPO = document.getElementById(prefix + '-po-list');
          if(ulPO) {
            ulPO.innerHTML = '';
            data.po.forEach(p => {
                let li = document.createElement('li'); li.innerText = p;
                li.onclick = function() {
                    document.querySelectorAll(`#${prefix}-po-list li`).forEach(el => el.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedPlafonPO = p;
                };
                ulPO.appendChild(li);
            });
          }
      }

      // 5. MODAL & UI HELPERS
      function bukaModal(id) { document.getElementById(id).style.display = 'block'; }
      function tutupModal(id) { document.getElementById(id).style.display = 'none'; }
      function pilihItem(prefix) { 
          document.getElementById(prefix + '-item').value = selectedPlafonItem; 
          tutupModal(prefix + '-modal-cari-item'); 
      }
      function pilihPO(prefix) { 
          document.getElementById(prefix + '-po').value = selectedPlafonPO; 
          tutupModal(prefix + '-modal-cari-po'); 
      }
      function cekValidasi(prefix) {
          let qty = parseInt(document.getElementById(prefix + '-qty').value) || 0;
          let btn = document.getElementById(prefix + '-btn-generate');
          if(qty > 0) {
              btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; btn.innerText = '1. BUAT QRCODE';
          } else {
              btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; btn.innerText = '1. BUAT QRCODE (Terkunci)';
          }
      }

      // 6. LOGIKA SCAN & GENERATE
      async function prosesGenerate(prefix) {
          alert("Logika QR sedang memproses serial dari database...");
          // Logika pembentukan barcode_base dan serial (Sama seperti pesan sebelumnya)
      }

      // 7. RENDER & PRINTING (ZEBRA LOGIC)
      function renderPreview(prefix) {
          const node = document.getElementById(prefix + '-node-label');
          html2canvas(node).then(canvas => {
              const imgData = canvas.toDataURL('image/png');
              const pWin = window.open('', '_blank');
              pWin.document.write(`<html><body><img src="${imgData}" style="width:100%;"></body></html>`);
              pWin.document.close();
              pWin.print();
          });
      }
    </script>
  </body>
</html>
