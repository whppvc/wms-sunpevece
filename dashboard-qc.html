<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aplikasi Label Pabrik - Sunpevece</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="css_style.css">
  </head>
  <body>
    <div style="background: #0d6efd; padding: 10px 20px; color: white; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:bold;">QC DASHBOARD</span>
        <a href="index.html" style="color:white; text-decoration:none; font-size: 13px;">[Kembali ke Menu Utama]</a>
    </div>

    <div id="start-view" class="center-screen">
      <button class="btn-primary btn-large" onclick="mulaiAplikasi()">Mulai membuat Label</button>
    </div>

    <div id="app-view" style="display: none;">
      <div class="navbar">
        <button class="nav-btn active" id="nav-plafon" onclick="pindahMenu('plafon')">Plafon</button>
        <button class="nav-btn" id="nav-lis" onclick="pindahMenu('lis')">Lis</button>
      </div>

      <div id="main-content">
        <div id="template-plafon" class="layout-container">
          
          <div class="layout-kiri">
            <div class="form-group"><label>Tanggal:</label><input type="date" id="p-tgl"></div>
            <div class="form-group"><label>Mesin:</label><select id="p-mesin"></select></div>
            <div class="form-group"><label>Shift:</label><select id="p-shift"></select></div>
            <div class="form-group"><label>Item:</label><input type="text" id="p-item" readonly onclick="bukaModal('p-modal-cari-item')"></div>
            <div class="form-group"><label>Panjang (M):</label><input type="number" id="p-panjang" value="4"></div>
            <div class="form-group" style="margin-top:20px;">
              <button class="btn-success" style="width:100%; padding:15px;" onclick="prosesGenerate('p')">⚡ 1. Buat QRCode & Simpan</button>
            </div>
          </div>

          <div class="layout-kanan">
            <div class="preview-header">
              <div style="display:flex; gap:10px;">
                <button class="btn-primary" onclick="renderPreview('p')">🖨 CETAK LABEL</button>
              </div>
              <div class="zoom-controls">
                <button onclick="ubahZoom('p', -0.2)">🔍 -</button>
                <span id="p-zoom-text" style="color:white; font-size:12px; margin:auto 5px;">300%</span>
                <button onclick="ubahZoom('p', 0.2)">🔍 +</button>
              </div>
            </div>

            <div class="preview-box-container">
              <div id="p-label-canvas" class="label-canvas" style="transform: scale(3.0);">
                <div id="p-inner-label" style="width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                  <span style="font-size:8px; color:#ccc;">Preview Label</span>
                </div>
              </div>
            </div>
            
            <div style="text-align:center; margin-top:10px;">
                <button class="btn-secondary" onclick="movePos('up')">▲</button><br>
                <button class="btn-secondary" onclick="movePos('left')">◀</button>
                <button class="btn-secondary" onclick="movePos('right')">▶</button><br>
                <button class="btn-secondary" onclick="movePos('down')">▼</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="p-modal-cari-item" class="modal">
      <div class="modal-content">
        <div class="modal-header"><span>Cari Item</span><span class="close-modal" onclick="tutupModal('p-modal-cari-item')">×</span></div>
        <p>Daftar item akan muncul di sini...</p>
      </div>
    </div>

    <script src="js_global.js"></script>
    <script src="js_plafon.js"></script>
    <script src="js_lis.js"></script>
  </body>
</html>
