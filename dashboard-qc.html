<!DOCTYPE html>
<html>
  <head>
    <base target="_top">

    <title>Aplikasi Label Pabrik - Sunpevece</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <div id="template-plafon" style="display:none;">
        </div>
    <div id="template-lis" style="display:none;">
