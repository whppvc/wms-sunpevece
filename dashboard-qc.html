<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard QC (Label Pabrik)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
      /* --- KODE ASLI DARI CSS.TXT (Tanpa Beautify) --- */
      body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
      .center-screen { display: flex; justify-content: center; align-items: center; height: 100vh; }
      .btn-primary { background-color: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; text-decoration:none; display:inline-block;}
      .btn-primary:hover { background-color: #0b5ed7; }
      .center-screen .btn-large { font-size: 2.2rem; padding: 25px 45px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);}
      .btn-success { background-color: #198754; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight:bold;}
      .btn-secondary { background-color: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight:bold; transition: 0.2s;}
      .btn-secondary:hover { background-color: #5c636a; }
      .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
      .modal-content { background-color: #fff; margin: 10% auto; padding: 20px; width: 80%; max-width: 500px; border-radius: 8px; position: relative; }
      .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; font-size: 1.2rem; }
      .close-modal { cursor: pointer; color: #dc3545; font-weight:bold; font-size: 1.5rem; line-height: 1;}
      .list-popup { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; border: 1px solid #ccc; margin-top: 5px; border-radius: 4px;}
      .list-popup li { padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #eee; transition: 0.1s;}
      .list-popup li:hover { background-color: #f8f9fa; }
      .list-popup li.selected { background-color: #e2e6ea; color: #000; font-weight: bold; border-left: 4px solid #0d6efd; } 
      .modal-content button { width: 100%; padding: 12px; font-size: 1rem; margin-top: 10px; box-sizing: border-box; border-radius: 4px;}
      .click-edit { transition: outline 0.2s, background 0.2s; border-radius: 2px; }
      .click-edit:hover { outline: 1px dashed #6c757d; cursor: pointer; background: rgba(0,0,0,0.03); }
      .navbar { background-color: #343a40; padding: 10px; display: flex; gap: 10px; }
      .nav-btn { background: none; border: none; color: white; padding: 10px 20px; cursor: pointer; font-size: 1.1rem; border-radius: 4px; }
      .nav-btn:hover { background-color: #495057; }
      .nav-btn.active { background-color: #0d6efd; font-weight: bold; }
      .layout-container { display: flex; gap: 20px; padding: 20px; }
      .layout-kiri { flex: 1; min-width: 300px; }
      .layout-kanan { flex: 2; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      .panel-form { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
      .form-group { margin-bottom: 15px; }
      .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
      .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
      .input-with-search { display: flex; gap: 5px; }
      .input-with-search input { flex: 1; }
      .input-with-search button { background-color: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div style="background: #0d6efd; padding: 10px 20px; color: white; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:bold;">Dashboard QC - Label Pabrik</span>
        <a href="index.html" style="color:white; text-decoration:none; font-size: 14px;">[Kembali ke Menu Utama]</a>
    </div>

    <div id="start-view" class="center-screen">
      <button class="btn-primary btn-large" onclick="mulaiAplikasi()">Mulai membuat Label</button>
    </div>

    <div id="app-view" style="display: none;">
      <div class="navbar">
        <button class="nav-btn active" id="nav-plafon" onclick="pindahMenu('plafon')">Plafon</button>
        <button class="nav-btn" id="nav-lis" onclick="pindahMenu('lis')">Lis</button>
        <button class="nav-btn" id="nav-wpc" onclick="pindahMenu('wpc')">Wpc</button>
      </div>
      <div id="main-content"></div>
    </div>

    <div id="template-plafon" style="display:none;">
        <div class="layout-container">
            <div class="layout-kiri">
                <div class="panel-form">
                    <h3 style="margin-top:0; border-bottom:2px solid #0d6efd; padding-bottom:10px;">Form Plafon</h3>
                    <div class="form-group"><label>Tanggal Produksi:</label><input type="date" id="p-tgl"></div>
                    <div class="form-group"><label>Mesin:</label><select id="p-mesin"></select></div>
                    <div class="form-group"><label>Shift:</label><select id="p-shift"></select></div>
                    <div class="form-group"><label>Nama Item:</label><div class="input-with-search"><input type="text" id="p-item" readonly placeholder="Pilih Item..."><button onclick="bukaModal('p-modal-cari-item')">CARI</button></div></div>
                    <div class="form-group"><label>Panjang (M):</label><input type="number" id="p-panjang" placeholder="4"></div>
                    <div class="form-group"><label>Grade:</label><select id="p-grade"></select></div>
                    <div class="form-group"><label>Shading:</label><input type="text" id="p-shading" placeholder="WT-1" style="text-transform: uppercase;"></div>
                    <div class="form-group"><label>PO:</label><div class="input-with-search"><input type="text" id="p-po" readonly placeholder="Pilih PO..."><button onclick="bukaModal('p-modal-cari-po')">CARI</button></div></div>
                    <div class="form-group"><label>Jumlah Print:</label><input type="number" id="p-qty" value="0" oninput="cekValidasi('p')"></div>
                    <button id="p-btn-generate" class="btn-primary" style="width:100%; padding:15px; opacity:0.5; cursor:not-allowed;" disabled onclick="prosesGenerate('p')">Buat QRCode (Terkunci)</button>
                </div>
            </div>
            <div class="layout-kanan" id="p-layout-kanan">
                <div style="background:#525659; padding:20px; min-height:400px; display:flex; justify-content:center;" id="p-preview-area">
                    </div>
            </div>
        </div>
    </div>

    <div id="template-lis" style="display:none;">
        <div class="layout-container">
            <div class="layout-kiri">
                <div class="panel-form">
                    <h3 style="margin-top:0; border-bottom:2px solid #0d6efd; padding-bottom:10px;">Form Lis</h3>
                    <div class="form-group"><label>Tanggal Produksi:</label><input type="date" id="l-tgl"></div>
                    <div class="form-group"><label>Mesin:</label><select id="l-mesin"></select></div>
                    <div class="form-group"><label>Shift:</label><select id="l-shift"></select></div>
                    <div class="form-group"><label>Nama Item:</label><div class="input-with-search"><input type="text" id="l-item" readonly placeholder="Pilih Item..."><button onclick="bukaModal('l-modal-cari-item')">CARI</button></div></div>
                    <div class="form-group"><label>Panjang (M):</label><input type="number" id="l-panjang" placeholder="4"></div>
                    <div class="form-group"><label>Shading:</label><input type="text" id="l-shading" placeholder="WT-1" style="text-transform: uppercase;"></div>
                    <div class="form-group"><label>Jumlah Print:</label><input type="number" id="l-qty" value="0" oninput="cekValidasi('l')"></div>
                    <button id="l-btn-generate" class="btn-primary" style="width:100%; padding:15px; opacity:0.5; cursor:not-allowed;" disabled onclick="prosesGenerate('l')">Buat QRCode (Terkunci)</button>
                </div>
            </div>
            <div class="layout-kanan" id="l-layout-kanan">
                <div style="background:#525659; padding:20px; min-height:400px; display:flex; justify-content:center;" id="l-preview-area">
                    </div>
            </div>
        </div>
    </div>

    <div id="p-modal-cari-item" class="modal"><div class="modal-content"><div class="modal-header"><span>Cari Item Plafon</span><span class="close-modal" onclick="tutupModal('p-modal-cari-item')">✖</span></div><input type="text" id="p-input-search-item" placeholder="Ketik nama item..." style="width:100%; padding:8px;" onkeyup="filterList('p-input-search-item', 'p-item-list')"><ul id="p-item-list" class="list-popup"></ul><button class="btn-success" onclick="pilihItem('p')">✔ PILIH ITEM</button></div></div>
    <div id="p-modal-cari-po" class="modal"><div class="modal-content"><div class="modal-header"><span>Cari PO</span><span class="close-modal" onclick="tutupModal('p-modal-cari-po')">✖</span></div><ul id="p-po-list" class="list-popup"></ul><button class="btn-success" onclick="pilihPO('p')">✔ PILIH PO</button></div></div>
    <div id="l-modal-cari-item" class="modal"><div class="modal-content"><div class="modal-header"><span>Cari Item Lis</span><span class="close-modal" onclick="tutupModal('l-modal-cari-item')">✖</span></div><input type="text" id="l-input-search-item" placeholder="Ketik nama item..." style="width:100%; padding:8px;" onkeyup="filterList('l-input-search-item', 'l-item-list')"><ul id="l-item-list" class="list-popup"></ul><button class="btn-success" onclick="pilihItem('l')">✔ PILIH ITEM</button></div></div>

    <script>
      // 1. KONFIGURASI SUPABASE (GANTI INI)
      const SUPABASE_URL = 'https://mjpqzftwbyrbvbvmarol.supabase.co/rest/v1/';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcHF6ZnR3YnlyYnZidm1hcm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA0MTgsImV4cCI6MjA5NDE1NjQxOH0.0VT56HA-cGB4CP3u89PShcddt9jARh85KKMgnwCkse4';
      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      // 2. STATE GLOBAL (DARI JS_PLAFON.TXT & JS_GLOBAL.TXT)
      let isPlafonInit = false; let isLisInit = false;
      let dataPlafon = {}; let dataLis = {};
      let selectedPlafonItem = ""; let selectedPlafonPO = ""; let selectedLisItem = "";
      let currentMenu = 'p';

      function mulaiAplikasi() {
        document.getElementById('start-view').style.display = 'none';
        document.getElementById('app-view').style.display = 'block';
        pindahMenu('plafon');
      }

      function pindahMenu(menu) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('nav-' + menu).classList.add('active');

        document.getElementById('main-content').innerHTML = '';
        const clone = document.getElementById('template-' + menu).cloneNode(true);
        clone.style.display = 'block';
        document.getElementById('main-content').appendChild(clone);

        currentMenu = menu === 'plafon' ? 'p' : (menu === 'lis' ? 'l' : 'w');
        if(menu === 'plafon' && !isPlafonInit) { initPlafon(); }
        if(menu === 'lis' && !isLisInit) { initLis(); }
      }

      // 3. LOGIKA SUPABASE PENGGANTI google.script.run
      async function fetchInitialDataSupa(jenis) {
          const tableName = jenis === 'LIS' ? 'master_lis' : 'master_plafon';
          const { data, error } = await supabaseClient.from(tableName).select('*');
          if (error) return null;
          
          const getUnique = (arr, key) => [...new Set(arr.map(item => item[key]).filter(Boolean))].sort();
          return {
              mesin: getUnique(data, 'mesin'),
              shift: getUnique(data, 'shift'),
              item: getUnique(data, 'nama_item'),
              grade: getUnique(data, 'grade'),
              po: getUnique(data, 'po'),
              shading: getUnique(data, 'shading')
          };
      }

      function initPlafon() {
          fetchInitialDataSupa('PLAFON').then(data => {
              if(data) { dataPlafon = data; isiDropdown('p', data); isPlafonInit = true; }
          });
          document.getElementById('p-tgl').valueAsDate = new Date();
      }

      function initLis() {
          fetchInitialDataSupa('LIS').then(data => {
              if(data) { dataLis = data; isiDropdown('l', data); isLisInit = true; }
          });
          document.getElementById('l-tgl').valueAsDate = new Date();
      }

      function isiDropdown(prefix, data) {
          let selMesin = document.getElementById(prefix + '-mesin');
          selMesin.innerHTML = '<option value="">Pilih Mesin</option>';
          data.mesin.forEach(m => selMesin.innerHTML += `<option value="${m}">${m}</option>`);

          let selShift = document.getElementById(prefix + '-shift');
          selShift.innerHTML = '<option value="">Pilih Shift</option>';
          data.shift.forEach(s => selShift.innerHTML += `<option value="${s}">${s}</option>`);

          let ulItem = document.getElementById(prefix + '-item-list');
          ulItem.innerHTML = '';
          data.item.forEach(i => {
              let li = document.createElement('li'); li.innerText = i;
              li.onclick = function() { 
                  document.querySelectorAll(`#${prefix}-item-list li`).forEach(el=>el.classList.remove('selected'));
                  this.classList.add('selected');
                  if(prefix==='p') selectedPlafonItem = i; else selectedLisItem = i;
              };
              ulItem.appendChild(li);
          });
      }

      function bukaModal(id) { document.getElementById(id).style.display = 'block'; }
      function tutupModal(id) { document.getElementById(id).style.display = 'none'; }
      function filterList(inputId, listId) {
          let input = document.getElementById(inputId).value.toUpperCase();
          let li = document.getElementById(listId).getElementsByTagName('li');
          for (let i = 0; i < li.length; i++) {
              if (li[i].innerText.toUpperCase().indexOf(input) > -1) { li[i].style.display = ""; } else { li[i].style.display = "none"; }
          }
      }

      function cekValidasi(prefix) {
          let qty = parseInt(document.getElementById(prefix + '-qty').value) || 0;
          let btn = document.getElementById(prefix + '-btn-generate');
          if(qty > 0) {
              btn.disabled = false; btn.style.opacity = '1'; btn.style.cursor = 'pointer'; btn.innerText = 'Buat QRCode & Cetak';
          } else {
              btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'not-allowed'; btn.innerText = 'Buat QRCode (Terkunci)';
          }
      }

      function pilihItem(prefix) {
          let val = prefix === 'p' ? selectedPlafonItem : selectedLisItem;
          document.getElementById(prefix + '-item').value = val;
          tutupModal(prefix + '-modal-cari-item');
      }

      // LOGIKA BARCODE (DARI JS_PLAFON.TXT)
      function getJulianDateCode() {
          const now = new Date();
          const start = new Date(now.getFullYear(), 0, 0);
          const diff = now - start;
          const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(3, '0');
          const revYear = now.getFullYear().toString().slice(-2).split('').reverse().join('');
          return dayOfYear + revYear;
      }

      function shortName(name) {
          if(!name) return "";
          return name.toUpperCase().replace("GLOSSY", "GLSY").replace("GOLD", "GD").replace("SILVER", "SLVR").replace("WHITE", "WT").replace("BROWN", "BRWN").replace(/\s+/g, '');
      }

      async function prosesGenerate(prefix) {
          let btn = document.getElementById(prefix + '-btn-generate');
          btn.innerText = "⏳ Menyimpan..."; btn.disabled = true;

          let item = document.getElementById(prefix + '-item').value;
          let panjang = document.getElementById(prefix + '-panjang').value;
          let shading = document.getElementById(prefix + '-shading').value || "XX";
          let msp = document.getElementById(prefix + '-mesin').value + document.getElementById(prefix + '-shift').value;
          let qty = parseInt(document.getElementById(prefix + '-qty').value);

          let idKombinasi = `${shortName(item)}/${shading}/${panjang}/${getJulianDateCode()}/${msp}`;

          // Cek serial terakhir di Supabase
          let { data: unikData } = await supabaseClient.from('database_kode_unik').select('last_serial').eq('barcode_base', idKombinasi);
          let lastSerial = (unikData && unikData.length > 0) ? (parseInt(unikData[0].last_serial) || 0) : 0;
          let endSerial = lastSerial + qty;

          // Update Database
          if (unikData && unikData.length > 0) {
              await supabaseClient.from('database_kode_unik').update({ last_serial: endSerial }).eq('barcode_base', idKombinasi);
          } else {
              await supabaseClient.from('database_kode_unik').insert([{ barcode_base: idKombinasi, last_serial: endSerial }]);
          }

          alert("Berhasil dicatat! Serial: " + (lastSerial + 1) + " - " + endSerial);
          btn.innerText = "Buat QRCode & Cetak"; btn.disabled = false;
      }
    </script>
  </body>
</html>
