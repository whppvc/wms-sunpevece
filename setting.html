<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Control System - Web Setting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- WAJIB LOAD GLOBAL.JS UNTUK MENDAPATKAN APP_MENUS -->
    <script src="global.js"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col md:flex-row font-sans text-slate-800">

    <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col sticky top-0 h-auto md:h-screen shadow-xl z-20">
        <div class="p-5 bg-slate-950 flex items-center justify-between md:block">
            <div class="flex items-center gap-3">
                <img src="sunpevece.png" alt="Logo" class="h-8 object-contain" onerror="this.style.display='none'">
                <h2 class="font-black text-base tracking-wider uppercase">Creator Panel</h2>
            </div>
            <button onclick="localStorage.removeItem('user_session'); window.location.href='index.html'" class="mt-0 md:mt-4 block w-full md:w-auto text-center bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-2.5 px-3 rounded-lg transition cursor-pointer">Logout</button>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button id="menu-user" class="w-full text-left px-4 py-3 rounded-lg font-bold text-sm transition bg-blue-600 text-white cursor-pointer flex items-center gap-2"><i data-lucide="users" class="w-4 h-4"></i> User Setting</button>
            <button id="menu-akses" class="w-full text-left px-4 py-3 rounded-lg font-bold text-sm transition hover:bg-slate-800 text-slate-300 cursor-pointer flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4"></i> Atur Akses Menu</button>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        
        <!-- SECTION USER MANAGEMENT -->
        <section id="section-user" class="space-y-6">
            <h1 class="text-2xl font-black text-slate-800 border-b border-slate-200 pb-4">User Management</h1>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 h-fit">
                    <h3 class="text-lg font-black text-slate-700 mb-4 flex items-center gap-2" id="form-title"><i data-lucide="user-plus" class="w-5 h-5 text-blue-600"></i> Tambah User Baru</h3>
                    <form id="form-user" class="space-y-4">
                        <input type="hidden" id="user-id">
                        <div><label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Username</label><input type="text" id="input-username" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-bold outline-none focus:border-blue-500 bg-slate-50" required></div>
                        <div><label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Password</label><input type="text" id="input-password" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-bold outline-none focus:border-blue-500 bg-slate-50" required></div>
                        <div><label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Role</label><input type="text" id="input-role" class="w-full p-3 border border-slate-300 rounded-lg text-sm font-bold outline-none focus:border-blue-500 bg-slate-50" required></div>
                        <div class="flex gap-2 pt-2">
                            <button type="button" id="btn-batal-edit" class="hidden w-1/2 py-3 bg-slate-200 text-slate-700 font-black rounded-lg text-xs uppercase transition hover:bg-slate-300">Batal</button>
                            <button type="submit" id="btn-submit-user" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-lg text-xs uppercase transition shadow-sm flex justify-center items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Simpan User</button>
                        </div>
                    </form>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 lg:col-span-2 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                            <thead class="bg-slate-800 text-white">
                                <tr>
                                    <th class="p-4 text-xs font-bold uppercase tracking-wider">Username</th>
                                    <th class="p-4 text-xs font-bold uppercase tracking-wider">Password</th>
                                    <th class="p-4 text-xs font-bold uppercase tracking-wider">Role</th>
                                    <th class="p-4 text-xs font-bold uppercase tracking-wider text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="table-user-body" class="divide-y divide-slate-200">
                                <tr><td colspan="4" class="p-10 text-center"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto text-blue-500"></i></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION ATUR AKSES MENU -->
        <section id="section-akses" class="space-y-6 hidden">
            <div class="border-b border-slate-200 pb-4">
                <h1 class="text-2xl font-black text-slate-800 mb-2">Atur Akses Menu</h1>
                <p class="text-sm font-medium text-slate-500 leading-relaxed">Centang user yang diizinkan untuk melihat dan mengakses menu tertentu. Secara default, jika ada menu baru, semua user akan memiliki akses.</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-5xl">
                <div id="akses-menu-container" class="space-y-4"></div>
                <button id="btn-save-akses" class="mt-6 w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl transition shadow-md flex justify-center items-center gap-2 uppercase text-sm"><i data-lucide="check-circle" class="w-5 h-5"></i> Simpan Pengaturan Akses</button>
            </div>
        </section>

    </main>

    <script>
        let allUsers = [];

        // NAVIGASI
        const btnUser = document.getElementById('menu-user'), btnAkses = document.getElementById('menu-akses');
        const secUser = document.getElementById('section-user'), secAkses = document.getElementById('section-akses');
        
        function activateTab(activeBtn, activeSec) {
            [btnUser, btnAkses].forEach(b => { b.classList.remove('bg-blue-600', 'text-white'); b.classList.add('text-slate-300', 'hover:bg-slate-800'); });
            [secUser, secAkses].forEach(s => s.classList.add('hidden'));
            activeBtn.classList.add('bg-blue-600', 'text-white'); activeBtn.classList.remove('text-slate-300', 'hover:bg-slate-800');
            activeSec.classList.remove('hidden');
        }
        
        btnUser.addEventListener('click', () => activateTab(btnUser, secUser));
        btnAkses.addEventListener('click', () => { activateTab(btnAkses, secAkses); renderMenuAccess(); });

        // LOGIKA USER
        async function fetchUsers() {
            const tbody = document.getElementById('table-user-body');
            const { data, error } = await db.from('app_users').select('*').order('id', { ascending: true });
            if (error) return;
            allUsers = data || []; tbody.innerHTML = '';
            allUsers.forEach(user => {
                tbody.innerHTML += `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4 font-bold text-slate-800">${user.username}</td>
                    <td class="p-4 font-mono text-slate-500">${user.password}</td>
                    <td class="p-4"><span class="px-3 py-1 text-[10px] font-black uppercase tracking-wider bg-blue-100 text-blue-700 rounded-md border border-blue-200">${user.role}</span></td>
                    <td class="p-4 text-center flex justify-center gap-2">
                        <button onclick="editUser(${user.id}, '${user.username}', '${user.password}', '${user.role}')" class="px-3 py-1.5 bg-slate-100 hover:bg-blue-100 text-slate-600 hover:text-blue-700 font-bold text-xs rounded-md transition flex items-center gap-1"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Edit</button>
                        <button onclick="deleteUser(${user.id})" class="px-3 py-1.5 bg-slate-100 hover:bg-rose-100 text-slate-600 hover:text-rose-700 font-bold text-xs rounded-md transition flex items-center gap-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus</button>
                    </td>
                </tr>`;
            });
            lucide.createIcons();
        }

        document.getElementById('form-user').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('user-id').value;
            const username = document.getElementById('input-username').value;
            const password = document.getElementById('input-password').value;
            const role = document.getElementById('input-role').value;
            
            const btn = document.getElementById('btn-submit-user');
            const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...';
            btn.disabled = true;

            try {
                if (id) {
                    const { error } = await db.from('app_users').update({ username, password, role }).eq('id', id);
                    if(error) throw error;
                } else {
                    const { error } = await db.from('app_users').insert([{ username, password, role }]);
                    if(error) throw error;
                }
                document.getElementById('user-id').value = ''; document.getElementById('form-user').reset(); 
                document.getElementById('btn-batal-edit').click();
                fetchUsers();
            } catch(err) {
                alert("Gagal menyimpan user: " + err.message);
            } finally {
                btn.innerHTML = ori; btn.disabled = false; lucide.createIcons();
            }
        });

        window.editUser = (id, u, p, r) => { 
            document.getElementById('user-id').value = id; 
            document.getElementById('input-username').value = u; 
            document.getElementById('input-password').value = p; 
            document.getElementById('input-role').value = r; 
            document.getElementById('btn-batal-edit').classList.remove('hidden'); 
            document.getElementById('btn-submit-user').classList.add('w-1/2'); 
        };

        document.getElementById('btn-batal-edit').addEventListener('click', () => { 
            document.getElementById('user-id').value = ''; 
            document.getElementById('form-user').reset(); 
            document.getElementById('btn-batal-edit').classList.add('hidden'); 
            document.getElementById('btn-submit-user').classList.remove('w-1/2'); 
        });

        window.deleteUser = async (id) => { 
            if (confirm('Yakin ingin menghapus user ini secara permanen?')) { 
                try {
                    const { error } = await db.from('app_users').delete().eq('id', id); 
                    if(error) throw error;
                    fetchUsers(); 
                } catch(e) {
                    alert("Gagal menghapus user: " + e.message);
                }
            } 
        };

        // LOGIKA AKSES MENU DINAMIS
        async function renderMenuAccess() {
            const container = document.getElementById('akses-menu-container'); 
            container.innerHTML = '<div class="text-center p-10"><i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto text-blue-500 mb-2"></i><p class="font-bold text-slate-500">Memuat Menu...</p></div>';
            lucide.createIcons();

            try {
                const { data: users, error: errUsers } = await db.from('app_users').select('username').order('id', { ascending: true });
                if(errUsers) throw errUsers;
                const allUsernames = users.map(u => u.username);

                const { data: savedAccess, error: errAccess } = await db.from('menu_access').select('*');
                if(errAccess) throw errAccess;
                
                const accessMap = {};
                savedAccess.forEach(row => {
                    accessMap[row.menu_id] = row.allowed_users ? row.allowed_users.split(',') : [];
                });

                // Ambil menu dari global.js (Abaikan Divider)
                const actualMenus = APP_MENUS.filter(m => !m.isDivider);

                container.innerHTML = '';
                actualMenus.forEach(menu => {
                    // Default: semua user diizinkan jika belum ada di DB
                    let allowedArr = accessMap[menu.id] !== undefined ? accessMap[menu.id] : allUsernames;

                    const box = document.createElement('div');
                    box.className = "flex flex-col md:flex-row md:items-start justify-between p-5 border border-slate-200 rounded-xl bg-slate-50 shadow-sm";
                    
                    // REVISI: Tambahkan data-title untuk dikirim ke Supabase
                    box.setAttribute('data-menuid', menu.id);
                    box.setAttribute('data-title', menu.title);

                    let userCheckboxes = '';
                    allUsernames.forEach(uname => {
                        const isChecked = allowedArr.includes(uname) ? 'checked' : '';
                        userCheckboxes += `
                            <label class="flex items-center gap-2 text-sm border border-slate-300 bg-white px-3 py-2 rounded-lg cursor-pointer hover:bg-blue-50 hover:border-blue-300 transition shadow-sm">
                                <input type="checkbox" class="cb-akses w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" value="${uname}" ${isChecked}> 
                                <span class="font-bold text-slate-700">${uname}</span>
                            </label>`;
                    });

                    box.innerHTML = `
                        <div class="font-black text-slate-800 w-full md:w-1/3 flex items-center gap-3 mb-4 md:mb-0 text-base">
                            <div class="p-2 bg-blue-100 text-blue-700 rounded-lg"><i data-lucide="${menu.icon}" class="w-5 h-5"></i></div>
                            ${menu.title}
                        </div>
                        <div class="w-full md:w-2/3 flex flex-wrap gap-2">
                            ${userCheckboxes}
                        </div>`;
                    container.appendChild(box);
                });
                lucide.createIcons();
            } catch(e) {
                container.innerHTML = `<div class="text-center p-10 text-red-500 font-bold">Gagal memuat: ${e.message}</div>`;
            }
        }

        document.getElementById('btn-save-akses').addEventListener('click', async () => {
            const boxes = document.querySelectorAll('#akses-menu-container > div');
            let payload = [];
            
            boxes.forEach((box, index) => {
                const menuId = box.getAttribute('data-menuid');
                const menuTitle = box.getAttribute('data-title'); // REVISI: Ambil title
                const checked = Array.from(box.querySelectorAll('.cb-akses:checked')).map(cb => cb.value);
                
                // REVISI: Masukkan title dan sort_order ke dalam payload
                payload.push({ 
                    menu_id: menuId, 
                    title: menuTitle,
                    allowed_users: checked.join(','),
                    sort_order: index 
                });
            });

            const btn = document.getElementById('btn-save-akses');
            const ori = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> MENYIMPAN...'; 
            btn.disabled = true;

            try {
                const { error } = await db.from('menu_access').upsert(payload, { onConflict: 'menu_id' });
                if(error) throw error;
                alert("Akses Menu Berhasil Disimpan!\nPerubahan akan terlihat saat user memuat ulang halaman.");
            } catch(e) {
                alert("Gagal menyimpan: " + e.message);
            } finally {
                btn.innerHTML = ori; btn.disabled = false; lucide.createIcons();
            }
        });

        fetchUsers();
    </script>
</body>
</html>
