<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Control System - Web Setting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .dragging { opacity: 0.5; border: 2px dashed #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col md:flex-row font-sans text-gray-800">

    <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col sticky top-0 h-auto md:h-screen shadow-xl z-20">
        <div class="p-5 bg-slate-950 flex items-center justify-between md:block">
            <div class="flex items-center gap-3">
                <img src="sunpevece.png" alt="Logo" class="h-8 object-contain" onerror="this.style.display='none'">
                <h2 class="font-bold text-base tracking-wider uppercase">Creator Panel</h2>
            </div>
            <button onclick="window.location.href='index.html'" class="mt-0 md:mt-4 block w-full md:w-auto text-center bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 px-3 rounded transition cursor-pointer">
                Back to Login
            </button>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button id="menu-user" class="w-full text-left px-4 py-3 rounded-lg font-semibold text-sm transition bg-blue-600 text-white cursor-pointer flex items-center gap-2">
                👥 User Setting
            </button>
            <button id="menu-akses" class="w-full text-left px-4 py-3 rounded-lg font-semibold text-sm transition hover:bg-slate-800 text-slate-300 cursor-pointer flex items-center gap-2">
                🛡️ Atur Akses Menu
            </button>
            <button id="menu-kaidah" class="w-full text-left px-4 py-3 rounded-lg font-semibold text-sm transition hover:bg-slate-800 text-slate-300 cursor-pointer flex items-center gap-2">
                📖 Kaidah QR Code
            </button>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        
        <section id="section-user" class="space-y-6">
            <div class="border-b pb-4">
                <h1 class="text-2xl font-extrabold text-slate-800">User Management</h1>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-md border h-fit">
                    <h3 class="text-lg font-bold text-slate-700 mb-4" id="form-title">Tambah User Baru</h3>
                    <form id="form-user" class="space-y-4">
                        <input type="hidden" id="user-id">
                        <div><label class="block text-xs font-bold text-gray-600 uppercase mb-1">Username</label><input type="text" id="input-username" class="w-full p-2.5 border rounded-lg text-sm" required></div>
                        <div><label class="block text-xs font-bold text-gray-600 uppercase mb-1">Password</label><input type="text" id="input-password" class="w-full p-2.5 border rounded-lg text-sm" required></div>
                        <div><label class="block text-xs font-bold text-gray-600 uppercase mb-1">Role</label><input type="text" id="input-role" class="w-full p-2.5 border rounded-lg text-sm" required></div>
                        <div class="flex gap-2 pt-2">
                            <button type="button" id="btn-batal-edit" class="hidden w-1/2 py-2.5 bg-gray-200 font-bold rounded-lg text-xs">Batal</button>
                            <button type="submit" id="btn-submit-user" class="w-full py-2.5 bg-blue-600 text-white font-bold rounded-lg text-xs">Simpan User</button>
                        </div>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md border lg:col-span-2 overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead><tr class="bg-slate-100 text-slate-600 uppercase text-xs font-bold"><th class="p-3 border-b">Username</th><th class="p-3 border-b">Password</th><th class="p-3 border-b">Role</th><th class="p-3 border-b text-center">Aksi</th></tr></thead>
                        <tbody id="table-user-body"><tr><td colspan="4" class="p-4 text-center">Memuat...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="section-akses" class="space-y-6 hidden">
            <div class="border-b pb-4">
                <h1 class="text-2xl font-extrabold text-slate-800">Atur Akses Menu & Sorting</h1>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border max-w-4xl">
                <div id="akses-menu-container" class="space-y-3"></div>
                <button id="btn-save-akses" class="mt-6 w-full py-3 bg-green-600 text-white font-bold rounded-lg">Simpan Pengaturan Akses & Urutan</button>
            </div>
        </section>

        <section id="section-kaidah" class="space-y-6 hidden">
            <div class="border-b pb-4">
                <h1 class="text-2xl font-extrabold text-slate-800">Aturan Kamus QR Code</h1>
                <p class="text-sm text-gray-500">Tentukan bagaimana sebuah kata diubah menjadi singkatan kode. Berlaku untuk Nama Item.</p>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-md border h-fit">
                    <h3 class="text-lg font-bold text-slate-700 mb-4" id="form-rule-title">Tambah Aturan Baru</h3>
                    <form id="form-rule" class="space-y-4">
                        <input type="hidden" id="rule-id">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Kata Asli di Master</label>
                            <input type="text" id="input-kata" class="w-full p-2.5 border rounded-lg text-sm uppercase" oninput="this.value = this.value.toUpperCase()" placeholder="Cth: GLOSSY" required>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Kode QR-nya</label>
                            <input type="text" id="input-kode" class="w-full p-2.5 border rounded-lg text-sm uppercase" oninput="this.value = this.value.toUpperCase()" placeholder="Cth: GLSY" required>
                        </div>
                        <div class="flex gap-2 pt-2">
                            <button type="button" id="btn-batal-rule" class="hidden w-1/2 py-2.5 bg-gray-200 font-bold rounded-lg text-xs">Batal</button>
                            <button type="submit" id="btn-submit-rule" class="w-full py-2.5 bg-blue-600 text-white font-bold rounded-lg text-xs">Simpan Aturan</button>
                        </div>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md border lg:col-span-2 overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead><tr class="bg-slate-100 text-slate-600 uppercase text-xs font-bold"><th class="p-3 border-b">Kata Asli</th><th class="p-3 border-b">Kode QR</th><th class="p-3 border-b text-center">Aksi</th></tr></thead>
                        <tbody id="table-rule-body"><tr><td colspan="3" class="p-4 text-center">Memuat Kamus...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <script>
        const SUPABASE_URL = 'https://mjpqzftwbyrbvbvmarol.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcHF6ZnR3YnlyYnZidm1hcm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA0MTgsImV4cCI6MjA5NDE1NjQxOH0.0VT56HA-cGB4CP3u89PShcddt9jARh85KKMgnwCkse4';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allUsers = [];

        // --- NAVIGASI TAB ---
        const btnUser = document.getElementById('menu-user'), btnAkses = document.getElementById('menu-akses'), btnKaidah = document.getElementById('menu-kaidah');
        const secUser = document.getElementById('section-user'), secAkses = document.getElementById('section-akses'), secKaidah = document.getElementById('section-kaidah');
        
        function activateTab(activeBtn, activeSec) {
            [btnUser, btnAkses, btnKaidah].forEach(b => { b.classList.remove('bg-blue-600', 'text-white'); b.classList.add('text-slate-300', 'hover:bg-slate-800'); });
            [secUser, secAkses, secKaidah].forEach(s => s.classList.add('hidden'));
            activeBtn.classList.add('bg-blue-600', 'text-white'); activeBtn.classList.remove('text-slate-300', 'hover:bg-slate-800');
            activeSec.classList.remove('hidden');
        }
        
        btnUser.addEventListener('click', () => activateTab(btnUser, secUser));
        btnAkses.addEventListener('click', () => { activateTab(btnAkses, secAkses); renderMenuAccess(); });
        btnKaidah.addEventListener('click', () => { activateTab(btnKaidah, secKaidah); fetchRules(); });

        // --- LOGIKA USER MANAGEMENT ---
        async function fetchUsers() {
            const tbody = document.getElementById('table-user-body');
            const { data, error } = await db.from('app_users').select('*').order('id', { ascending: true });
            if (error) return;
            allUsers = data || []; tbody.innerHTML = '';
            allUsers.forEach(user => {
                tbody.innerHTML += `<tr class="border-b"><td class="p-3">${user.username}</td><td class="p-3 font-mono text-gray-600">${user.password}</td><td class="p-3"><span class="px-2 py-1 text-xs font-bold bg-blue-100 text-blue-700">${user.role}</span></td>
                <td class="p-3 text-center space-x-2"><button onclick="editUser(${user.id}, '${user.username}', '${user.password}', '${user.role}')" class="text-blue-600 font-bold text-xs">Edit</button>${user.username !== 'A' ? `<button onclick="deleteUser(${user.id})" class="text-red-600 font-bold text-xs">Hapus</button>` : ''}</td></tr>`;
            });
        }
        document.getElementById('form-user').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('user-id').value, username = document.getElementById('input-username').value, password = document.getElementById('input-password').value, role = document.getElementById('input-role').value;
            if (id) await db.from('app_users').update({ username, password, role }).eq('id', id); else await db.from('app_users').insert([{ username, password, role }]);
            document.getElementById('user-id').value = ''; document.getElementById('form-user').reset(); fetchUsers();
        });
        window.editUser = (id, u, p, r) => { document.getElementById('user-id').value = id; document.getElementById('input-username').value = u; document.getElementById('input-password').value = p; document.getElementById('input-role').value = r; };
        window.deleteUser = async (id) => { if (confirm('Yakin hapus?')) { await db.from('app_users').delete().eq('id', id); fetchUsers(); } };

        // --- LOGIKA KAIDAH QR (BARU) ---
        async function fetchRules() {
            const tbody = document.getElementById('table-rule-body');
            const { data, error } = await db.from('qr_rules').select('*').order('id', { ascending: true });
            if (error) { tbody.innerHTML = `<tr><td colspan="3" class="text-center text-red-500">Error memuat data</td></tr>`; return; }
            tbody.innerHTML = '';
            data.forEach(r => {
                tbody.innerHTML += `<tr class="border-b hover:bg-slate-50"><td class="p-3 font-bold text-gray-700">${r.kata_asli}</td><td class="p-3 font-mono text-blue-700 font-bold">${r.kode}</td>
                <td class="p-3 text-center space-x-2"><button onclick="editRule(${r.id}, '${r.kata_asli}', '${r.kode}')" class="text-blue-600 font-bold text-xs">Edit</button><button onclick="deleteRule(${r.id})" class="text-red-600 font-bold text-xs">Hapus</button></td></tr>`;
            });
        }
        document.getElementById('form-rule').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('rule-id').value, kata = document.getElementById('input-kata').value, kode = document.getElementById('input-kode').value;
            if (id) await db.from('qr_rules').update({ kata_asli: kata, kode: kode }).eq('id', id); else await db.from('qr_rules').insert([{ kata_asli: kata, kode: kode }]);
            document.getElementById('btn-batal-rule').click(); fetchRules();
        });
        window.editRule = (id, kata, kode) => {
            document.getElementById('rule-id').value = id; document.getElementById('input-kata').value = kata; document.getElementById('input-kode').value = kode;
            document.getElementById('form-rule-title').innerText = "Edit Aturan"; document.getElementById('btn-batal-rule').classList.remove('hidden'); document.getElementById('btn-submit-rule').classList.add('w-1/2');
        };
        document.getElementById('btn-batal-rule').addEventListener('click', () => {
            document.getElementById('rule-id').value = ''; document.getElementById('form-rule').reset(); document.getElementById('form-rule-title').innerText = "Tambah Aturan Baru";
            document.getElementById('btn-batal-rule').classList.add('hidden'); document.getElementById('btn-submit-rule').classList.remove('w-1/2');
        });
        window.deleteRule = async (id) => { if (confirm('Hapus aturan ini?')) { await db.from('qr_rules').delete().eq('id', id); fetchRules(); } };

        // --- LOGIKA AKSES & DRAG DROP ---
        async function renderMenuAccess() {
            const container = document.getElementById('akses-menu-container'); container.innerHTML = '<p class="text-gray-500">Memuat...</p>';
            const { data: menus } = await db.from('menu_access').select('*').order('sort_order', { ascending: true });
            container.innerHTML = '';
            menus.forEach((menu) => {
                const allowedArr = menu.allowed_users ? menu.allowed_users.split(',').map(s => s.trim()) : [];
                const box = document.createElement('div'); box.className = "menu-draggable flex flex-col md:flex-row md:items-center justify-between p-4 border rounded-lg bg-white cursor-move"; box.draggable = true; box.setAttribute('data-menuid', menu.menu_id);
                let userCheckboxes = '';
                allUsers.forEach(user => { const isChecked = allowedArr.includes(user.username) ? 'checked' : ''; const isDisabled = user.username === 'A' ? 'disabled checked' : ''; userCheckboxes += `<label class="flex items-center gap-1.5 text-sm border px-2 py-1 rounded cursor-pointer"><input type="checkbox" class="cb-akses" value="${user.username}" ${isChecked} ${isDisabled}> ${user.username}</label>`; });
                box.innerHTML = `<div class="font-bold text-slate-800 w-full md:w-1/3 flex gap-3 mb-3 md:mb-0"><span class="text-gray-400">☰</span> 📦 ${menu.title}</div><div class="w-full md:w-2/3 flex flex-wrap gap-2">${userCheckboxes}</div>`;
                container.appendChild(box);
                box.addEventListener('dragstart', () => box.classList.add('dragging')); box.addEventListener('dragend', () => box.classList.remove('dragging'));
            });
            container.addEventListener('dragover', e => {
                e.preventDefault(); const afterElement = getDragAfterElement(container, e.clientY); const draggable = document.querySelector('.dragging');
                if (afterElement == null) container.appendChild(draggable); else container.insertBefore(draggable, afterElement);
            });
        }
        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.menu-draggable:not(.dragging)')];
            return draggableElements.reduce((closest, child) => { const box = child.getBoundingClientRect(); const offset = y - box.top - box.height / 2; return (offset < 0 && offset > closest.offset) ? { offset: offset, element: child } : closest; }, { offset: Number.NEGATIVE_INFINITY }).element;
        }
        document.getElementById('btn-save-akses').addEventListener('click', async () => {
            const boxes = document.querySelectorAll('.menu-draggable');
            for (let i = 0; i < boxes.length; i++) {
                const menuId = boxes[i].getAttribute('data-menuid'), allowedUsers = Array.from(boxes[i].querySelectorAll('.cb-akses:checked')).map(cb => cb.value).join(',');
                await db.from('menu_access').update({ allowed_users: allowedUsers, sort_order: i }).eq('menu_id', menuId);
            }
            alert("Akses dan Urutan Disimpan.");
        });

        fetchUsers();
    </script>
</body>
</html>
