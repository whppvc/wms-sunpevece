<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Control System - Web Setting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .dragging { opacity: 0.5; border: 2px dashed #3b82f6; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col md:flex-row font-sans text-gray-800">

    <aside class="w-full md:w-64 bg-slate-900 text-white flex flex-col sticky top-0 h-auto md:h-screen shadow-xl z-20">
        <div class="p-5 bg-slate-950 flex items-center justify-between md:block">
            <div class="flex items-center gap-3">
                <img src="sunpevece.png" alt="Logo" class="h-8 object-contain" onerror="this.style.display='none'">
                <h2 class="font-bold text-base tracking-wider uppercase">Creator Panel</h2>
            </div>
            <button onclick="window.location.href='index.html'" class="mt-0 md:mt-4 block w-full md:w-auto text-center bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 px-3 rounded transition cursor-pointer">Back to Login</button>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button id="menu-user" class="w-full text-left px-4 py-3 rounded-lg font-semibold text-sm transition bg-blue-600 text-white cursor-pointer flex items-center gap-2">👥 User Setting</button>
            <button id="menu-akses" class="w-full text-left px-4 py-3 rounded-lg font-semibold text-sm transition hover:bg-slate-800 text-slate-300 cursor-pointer flex items-center gap-2">🛡️ Atur Akses Menu</button>
        </nav>
    </aside>

    <main class="flex-1 p-6 md:p-10 overflow-y-auto">
        <section id="section-user" class="space-y-6">
            <h1 class="text-2xl font-extrabold text-slate-800">User Management</h1>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-md border h-fit">
                    <h3 class="text-lg font-bold text-slate-700 mb-4" id="form-title">Tambah User</h3>
                    <form id="form-user" class="space-y-4">
                        <input type="hidden" id="user-id">
                        <input type="text" id="input-username" class="w-full p-2.5 border rounded-lg text-sm" placeholder="Username" required>
                        <input type="text" id="input-password" class="w-full p-2.5 border rounded-lg text-sm" placeholder="Password" required>
                        <input type="text" id="input-role" class="w-full p-2.5 border rounded-lg text-sm" placeholder="Role (misal: Admin)" required>
                        <button type="submit" class="w-full py-2.5 bg-blue-600 text-white font-bold rounded-lg text-sm">Simpan</button>
                    </form>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-md border lg:col-span-2 overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <tbody id="table-user-body"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="section-akses" class="space-y-6 hidden">
            <h1 class="text-2xl font-extrabold text-slate-800">Atur Akses Menu & Sorting</h1>
            <p class="text-sm text-gray-500">Centang hak akses. Tarik/geser (Drag & Drop) kotak menu di bawah untuk mengubah urutan tampilannya.</p>
            
            <div class="bg-white p-6 rounded-xl shadow-md border max-w-4xl">
                <div id="akses-menu-container" class="space-y-3"></div>
                <button id="btn-save-akses" class="mt-6 w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow transition">Simpan Akses & Urutan</button>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'ISI_URL_SUPABASE_ANDA_DISINI';
        const SUPABASE_KEY = 'ISI_ANON_KEY_SUPABASE_ANDA_DISINI';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allUsers = [];

        // Navigasi Tab
        const menuUser = document.getElementById('menu-user'), menuAkses = document.getElementById('menu-akses');
        const sectionUser = document.getElementById('section-user'), sectionAkses = document.getElementById('section-akses');
        menuUser.addEventListener('click', () => { sectionUser.classList.remove('hidden'); sectionAkses.classList.add('hidden'); menuUser.classList.add('bg-blue-600','text-white'); menuUser.classList.remove('text-slate-300'); menuAkses.classList.remove('bg-blue-600','text-white'); menuAkses.classList.add('text-slate-300'); });
        menuAkses.addEventListener('click', () => { sectionAkses.classList.remove('hidden'); sectionUser.classList.add('hidden'); menuAkses.classList.add('bg-blue-600','text-white'); menuAkses.classList.remove('text-slate-300'); menuUser.classList.remove('bg-blue-600','text-white'); menuUser.classList.add('text-slate-300'); renderMenuAccess(); });

        // User Logic Dasar
        async function fetchUsers() {
            const { data } = await db.from('app_users').select('*').order('id', { ascending: true });
            allUsers = data || [];
            const tbody = document.getElementById('table-user-body'); tbody.innerHTML = '';
            allUsers.forEach(u => tbody.innerHTML += `<tr class="border-b"><td class="p-2">${u.username}</td><td class="p-2">${u.role}</td></tr>`);
        }
        fetchUsers();

        // LOGIKA MENU & DRAG DROP
        async function renderMenuAccess() {
            const container = document.getElementById('akses-menu-container');
            container.innerHTML = '<p>Memuat...</p>';
            const { data: menus } = await db.from('menu_access').select('*').order('sort_order', { ascending: true });
            
            container.innerHTML = '';
            menus.forEach((menu) => {
                const allowedArr = menu.allowed_users ? menu.allowed_users.split(',').map(s => s.trim()) : [];
                const box = document.createElement('div');
                box.className = "menu-draggable flex flex-col md:flex-row md:items-center justify-between p-4 border rounded-lg bg-slate-50 cursor-move";
                box.draggable = true; 
                box.setAttribute('data-menuid', menu.menu_id);
                
                let userCheckboxes = '';
                allUsers.forEach(user => {
                    const isChecked = allowedArr.includes(user.username) ? 'checked' : '';
                    const isDisabled = user.username === 'A' ? 'disabled checked' : ''; 
                    userCheckboxes += `<label class="flex items-center gap-1 text-sm bg-white border px-2 py-1 rounded cursor-pointer"><input type="checkbox" class="cb-akses" data-menuid="${menu.menu_id}" value="${user.username}" ${isChecked} ${isDisabled}> ${user.username}</label>`;
                });

                box.innerHTML = `<div class="font-bold text-slate-800 w-full md:w-1/3 flex items-center gap-2"><span class="text-gray-400 text-xl">☰</span> ${menu.title}</div><div class="w-full md:w-2/3 flex flex-wrap gap-2 mt-2 md:mt-0">${userCheckboxes}</div>`;
                container.appendChild(box);

                // Drag Events
                box.addEventListener('dragstart', () => box.classList.add('dragging'));
                box.addEventListener('dragend', () => box.classList.remove('dragging'));
            });

            // Container Drag Over
            container.addEventListener('dragover', e => {
                e.preventDefault();
                const afterElement = getDragAfterElement(container, e.clientY);
                const draggable = document.querySelector('.dragging');
                if (afterElement == null) { container.appendChild(draggable); } 
                else { container.insertBefore(draggable, afterElement); }
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.menu-draggable:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
                else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // SIMPAN AKSES & URUTAN
        document.getElementById('btn-save-akses').addEventListener('click', async () => {
            const boxes = document.querySelectorAll('.menu-draggable');
            let isSuccess = true;

            for (let i = 0; i < boxes.length; i++) {
                const menuId = boxes[i].getAttribute('data-menuid');
                const checkboxes = boxes[i].querySelectorAll('.cb-akses:checked');
                const allowedUsers = Array.from(checkboxes).map(cb => cb.value).join(',');

                const { error } = await db.from('menu_access').update({ allowed_users: allowedUsers, sort_order: i }).eq('menu_id', menuId);
                if(error) isSuccess = false;
            }
            if(isSuccess) alert("Akses dan Urutan Menu Berhasil Disimpan!");
            else alert("Ada kesalahan penyimpanan.");
        });
    </script>
</body>
</html>
