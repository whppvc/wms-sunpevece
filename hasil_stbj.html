<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Laporan Hasil STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-main: #f8fafc; --bg-box: #ffffff; --text-main: #1f2937; --border-color: #e2e8f0; }
        body[data-bg="dark"] { --bg-main: #0f172a; --bg-box: #1e293b; --text-main: #f8fafc; --border-color: #334155; }
        body[data-bg="grey"] { --bg-main: #e2e8f0; --bg-box: #f1f5f9; --text-main: #0f172a; --border-color: #cbd5e1; }
        body { background-color: var(--bg-main); color: var(--text-main); transition: all 0.3s ease; }
        .card-dynamic { background-color: var(--bg-box); border-color: var(--border-color); }
        .table-container { scrollbar-width: thin; }
    </style>
</head>
<body class="min-h-screen font-sans">

    <header class="card-dynamic shadow-sm px-4 py-3 flex items-center justify-between sticky top-0 z-40 border-b">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="p-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-full transition cursor-pointer"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
            <h1 class="font-bold text-lg text-blue-600 uppercase tracking-wide">Hasil Laporan STBJ</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="salinData()" class="px-4 py-1.5 bg-emerald-100 text-emerald-700 font-bold rounded-lg border border-emerald-200 hover:bg-emerald-200 transition cursor-pointer text-sm flex items-center gap-2"><i data-lucide="copy" class="w-4 h-4"></i> SALIN DATA</button>
        </div>
    </header>

    <main class="p-4 md:p-8 max-w-[98%] mx-auto">
        <div class="card-dynamic rounded-xl shadow-md border overflow-hidden">
            <div class="table-container overflow-x-auto w-full max-h-[80vh]">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-blue-700 text-white uppercase text-[11px] sticky top-0 z-10 shadow">
                        <tr>
                            <th class="p-3 text-center"><input type="checkbox" id="check-all" onclick="toggleAll(this)" class="w-4 h-4 cursor-pointer"></th>
                            <th class="p-3 text-center">No</th>
                            <th class="p-3">Tgl Produksi</th>
                            <th class="p-3">Mesin</th>
                            <th class="p-3">Shift</th>
                            <th class="p-3 bg-blue-900">Jenis Item</th>
                            <th class="p-3 bg-blue-800">Nama Item</th>
                            <th class="p-3">Panjang</th>
                            <th class="p-3">Grade</th>
                            <th class="p-3">Dus</th>
                            <th class="p-3">Shading</th>
                            <th class="p-3">PO</th>
                            <th class="p-3">Keterangan</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="data-body">
                        <tr><td colspan="14" class="text-center p-6"><i data-lucide="loader-2" class="animate-spin w-6 h-6 mx-auto mb-2 text-blue-500"></i> Memuat Laporan...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        document.body.setAttribute('data-bg', localStorage.getItem('app_bg') || 'light');

        const SUPABASE_URL = 'https://mjpqzftwbyrbvbvmarol.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qcHF6ZnR3YnlyYnZidm1hcm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODA0MTgsImV4cCI6MjA5NDE1NjQxOH0.0VT56HA-cGB4CP3u89PShcddt9jARh85KKMgnwCkse4';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = async () => {
            const { data, error } = await db.from('hasil_stbj').select('*').order('created_at', {ascending: false});
            const tbody = document.getElementById('data-body');
            
            if(error) { tbody.innerHTML = `<tr><td colspan="14" class="text-center p-4 text-red-500">Error: ${error.message}</td></tr>`; return; }
            if(data.length === 0) { tbody.innerHTML = `<tr><td colspan="14" class="text-center p-8 opacity-50">Belum ada data STBJ yang tersimpan.</td></tr>`; return; }

            tbody.innerHTML = '';
            data.forEach((r, i) => {
                tbody.innerHTML += `
                    <tr class="border-b border-inherit hover:bg-blue-500/10 transition">
                        <td class="p-3 text-center"><input type="checkbox" class="row-check w-4 h-4 cursor-pointer"></td>
                        <td class="p-3 text-center font-bold opacity-50">${i+1}</td>
                        <td class="p-3 font-semibold">${r.tgl_produksi || '-'}</td>
                        <td class="p-3">${r.mesin || '-'}</td>
                        <td class="p-3">${r.shift || '-'}</td>
                        <td class="p-3 font-bold text-blue-600">${r.jenis_item || '-'}</td>
                        <td class="p-3 font-bold text-lg">${r.nama_item || '-'}</td>
                        <td class="p-3 font-bold">${r.panjang || '-'}</td>
                        <td class="p-3 font-semibold">${r.grade || '-'}</td>
                        <td class="p-3">${r.dus || '-'}</td>
                        <td class="p-3">${r.shading || '-'}</td>
                        <td class="p-3 font-bold">${r.po || '-'}</td>
                        <td class="p-3 text-orange-500 font-medium">${r.keterangan || '-'}</td>
                        <td class="p-3"><span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full font-bold text-[10px] uppercase border border-emerald-300">${r.status || 'STBJ'}</span></td>
                    </tr>
                `;
            });
        };

        function salinData() {
            const rows = document.querySelectorAll('.row-check:checked');
            if(rows.length === 0) return alert("Centang minimal satu baris untuk disalin.");
            let text = "Tgl Produksi\tMesin\tShift\tJenis Item\tNama Item\tPanjang\tGrade\tDus\tShading\tPO\tKeterangan\n";
            rows.forEach(cb => {
                const tds = cb.closest('tr').querySelectorAll('td');
                text += `${tds[2].innerText}\t${tds[3].innerText}\t${tds[4].innerText}\t${tds[5].innerText}\t${tds[6].innerText}\t${tds[7].innerText}\t${tds[8].innerText}\t${tds[9].innerText}\t${tds[10].innerText}\t${tds[11].innerText}\t${tds[12].innerText}\n`;
            });
            navigator.clipboard.writeText(text);
            alert(`${rows.length} data berhasil disalin. Silakan Paste (Ctrl+V) ke Excel!`);
        }
        
        function toggleAll(source) { document.querySelectorAll('.row-check').forEach(cb => cb.checked = source.checked); }
    </script>
</body>
</html>
