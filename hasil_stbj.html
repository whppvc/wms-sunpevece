<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Hasil STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="global.js"></script>

    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; will-change: transform; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
        
        tr.selected-row td { background-color: #ccfbf1 !important; color: #0f766e !important; }
        .col-hidden { display: none !important; }

        .hdr-std { 
            text-align: center !important; 
            padding: 0.5rem 0.75rem !important; 
            font-size: 0.75rem !important; 
            font-weight: 600 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.05em !important; 
            white-space: nowrap !important; 
            border-bottom: 1px solid #e2e8f0 !important; 
            background-clip: padding-box !important; 
        }
        
        tr.r-row:not(.selected-row):hover td { color: #4f46e5 !important; }
        tr.r-row:not(.selected-row):hover td button { color: #4f46e5 !important; border-color: #4f46e5 !important; }

        .resizer {
            position: absolute;
            top: 0; right: 0; width: 5px;
            cursor: col-resize; user-select: none;
            height: 100%; z-index: 50;
        }
        .resizer:hover, .resizing { background-color: rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200">
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar">
                <!-- TAB MOBILE (Hanya tampil di HP) -->
                <button onclick="setMode('mobile')" id="tab-mode-mobile" class="sm:hidden px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="smartphone" class="w-4 h-4"></i> MOBILE</button>
                <button onclick="setMode('qrcode')" id="tab-mode-qrcode" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="qr-code" class="w-4 h-4"></i> MODE QRCODE</button>
                <button onclick="setMode('item')" id="tab-mode-item" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="boxes" class="w-4 h-4"></i> MODE NAMA ITEM</button>
                <button onclick="setMode('jasper')" id="tab-mode-jasper" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="file-text" class="w-4 h-4"></i> MODE JASPER</button>
                <button onclick="setMode('manual')" id="tab-mode-manual" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="keyboard" class="w-4 h-4"></i> TABEL MANUAL</button>
            </div>

            <!-- TOOLBAR DESKTOP -->
            <div id="desktop-toolbar" class="p-3 sm:p-4 flex items-center bg-slate-50/50 border-t border-slate-100 w-full">
                <div class="flex items-center gap-3 shrink-0">
                    <label id="lbl-pilih-tabel" class="text-[11px] font-black text-slate-500 uppercase tracking-wide">Filter Status:</label>
                    <select id="select-status" onchange="switchStatusFilter(this.value)" class="p-2 sm:p-2.5 bg-white border border-slate-300 rounded-md font-black text-xs text-slate-800 outline-none cursor-pointer uppercase focus:border-blue-500 transition shadow-sm">
                        <option value="ALL">SEMUA DATA</option> 
                        <option value="STBJ">STBJ MASUK</option> 
                        <option value="HOLD STBJ">HOLD STBJ</option>
                        <option value="IN GUDANG">IN GUDANG</option>
                        <option value="HOLD LANGSIR">HOLD LANGSIR</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 ml-auto relative">
                    <button onclick="bukaDaftarKatalog()" class="hidden sm:flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-purple-800">
                        <div class="bg-purple-900 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="database" class="w-4 h-4"></i></div>
                        <div class="bg-purple-800 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide hover:bg-purple-700 transition">Katalog Jasper</div>
                    </button>
                    
                    <button onclick="aksiMassal('collect')" id="btn-massal-collect" class="hidden sm:flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-indigo-800">
                        <div class="bg-indigo-900 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="check-square" class="w-4 h-4"></i></div>
                        <div class="bg-indigo-800 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide hover:bg-indigo-700 transition">Collect</div>
                    </button>

                    <button onclick="toggleActionMenuMobile(event)" class="p-2.5 bg-white rounded-md border border-slate-300 shadow-sm active:scale-95 text-slate-600 hover:bg-slate-50 transition">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    
                    <div id="mobile-action-menu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white shadow-xl rounded-md border border-slate-200 z-50 flex flex-col overflow-hidden">
                        <button onclick="bukaDaftarKatalog(); toggleActionMenuMobile(event)" class="sm:hidden text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-purple-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="database" class="w-4 h-4"></i> Katalog Jasper</button>
                        <button onclick="aksiMassal('collect'); toggleActionMenuMobile(event)" id="btn-massal-collect-mob" class="hidden sm:hidden text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-indigo-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="check-square" class="w-4 h-4"></i> Collect</button>
                        
                        <button onclick="aksiMassal('hapus'); toggleActionMenuMobile(event)" id="btn-hapus-mob" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-rose-600 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="trash-2" class="w-4 h-4"></i> Hapus Item</button>
                        <button onclick="aksiMassal('hold'); toggleActionMenuMobile(event)" id="btn-hold-mob" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-amber-600 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="settings-2" class="w-4 h-4"></i> Ubah Status</button>
                        <button onclick="salinData(); toggleActionMenuMobile(event)" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="copy" class="w-4 h-4 text-slate-500"></i> Salin Data</button>
                        <button onclick="downloadXLS(); toggleActionMenuMobile(event)" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i> Export Excel</button>
                        <button onclick="toggleSidebarKolom(); toggleActionMenuMobile(event)" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-blue-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="columns" class="w-4 h-4 text-blue-600"></i> Atur Kolom</button>
                        <button onclick="bukaModalTableDesign(); toggleActionMenuMobile(event)" class="text-left px-4 py-3 text-xs font-bold text-purple-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="palette" class="w-4 h-4 text-purple-600"></i> Table Design</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- AREA KONTEN -->
        <div class="flex-1 min-h-0 bg-slate-100 p-4 overflow-hidden flex flex-col relative z-0">
            
            <!-- VIEW TABEL (Mode Desktop) -->
            <div id="view-table" class="hidden flex-1 min-h-0 overflow-y-auto custom-scroll table-container bg-white rounded-t-xl shadow-sm border border-slate-300">
                <table class="w-full text-left whitespace-nowrap" id="table-stbj-main">
                    <thead class="sticky top-0 z-50 shadow-sm" id="thead-stbj"></thead>
                    <tbody id="tbody-stbj" class="text-slate-800"></tbody>
                </table>
            </div>

            <!-- VIEW MOBILE (Folder / Drill-Down View) -->
            <div id="view-mobile" class="flex-1 min-h-0 overflow-y-auto custom-scroll flex flex-col gap-3 pb-32">
                <!-- Konten Mobile di-render oleh JS -->
            </div>

        </div>

        <!-- FOOTER PAGINASI (Desktop) -->
        <div id="footer-pagination" class="hidden shrink-0 w-full bg-white p-2 sm:p-3 flex flex-col md:flex-row justify-between items-center gap-4 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300">
            <div class="flex items-center gap-2 flex-wrap justify-center">
                <span class="bg-blue-50 border border-blue-200 px-2.5 py-1 rounded text-blue-800 text-[11px] font-bold shadow-sm">Tampil Filter: <span id="lbl-tampil-baris" class="text-blue-900 font-medium ml-1">0</span></span>
                <span class="bg-amber-50 border border-amber-200 px-2.5 py-1 rounded text-amber-800 text-[11px] font-bold shadow-sm">Total Qty (Dus): <span id="lbl-total-qty" class="text-amber-900 font-medium ml-1">0</span></span>
                <span class="bg-emerald-50 border border-emerald-300 px-2.5 py-1 rounded text-emerald-800 text-[11px] font-bold shadow-sm">Dipilih: <span id="lbl-pilih-baris" class="text-emerald-900 font-medium ml-1">0</span></span>
            </div>
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1 bg-white border border-slate-300 p-1 rounded shadow-sm">
                    <span class="text-[10px] font-bold text-slate-500 uppercase px-1">Baris:</span>
                    <select id="select-rows-per-page" onchange="changeRowsPerPage(this.value)" class="text-xs font-black text-blue-700 bg-blue-50 border border-blue-200 rounded outline-none cursor-pointer px-1 py-0.5 transition">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="ALL">Semua</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 bg-white border border-slate-300 p-1 rounded shadow-sm">
                    <button onclick="prevPage()" class="p-1 px-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 active:scale-95 transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <span class="px-2 font-black text-xs text-slate-600 tracking-wide uppercase">Hal <span id="lbl-halaman" class="text-blue-600">1</span> / <span id="lbl-total-halaman">1</span></span>
                    <button onclick="nextPage()" class="p-1 px-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 active:scale-95 transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>

        <!-- FOOTER FREEZE LEVEL 6 MOBILE (PILIH SEMUA & TOMBOL AKSI BERDASARKAN MODE) -->
        <div id="mobile-lvl6-footer" class="hidden shrink-0 w-full bg-white px-4 py-3.5 z-40 shadow-[0_-8px_25px_rgba(0,0,0,0.15)] border-t border-slate-300 flex justify-between items-center">
            <label class="flex items-center gap-3 cursor-pointer select-none">
                <input type="checkbox" id="cb-all-lvl6" onchange="toggleSelectAllLvl6(this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer border-slate-400">
                <span class="text-xs font-black text-slate-800 uppercase tracking-wider">Pilih Semua</span>
            </label>

            <!-- TOMBOL MODE NORMAL (SCAN/MANUAL/ALL) -->
            <button id="btn-cancel-stbj-lvl6" onclick="cancelSTBJMobile()" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-black text-xs uppercase rounded-xl shadow-lg flex items-center gap-2 transition border-b-4 border-rose-900 cursor-pointer">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                <span>Cancel STBJ</span>
            </button>

            <!-- TOMBOL KHUSUS MODE TABEL HOLD (CANCEL HOLD & HAPUS ITEM) -->
            <div id="group-btn-hold-lvl6" class="hidden flex items-center gap-2">
                <button id="btn-cancel-hold-lvl6" onclick="cancelHoldMobile()" class="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-black text-xs uppercase rounded-xl shadow-md flex items-center gap-1.5 transition border-b-4 border-amber-700 cursor-pointer">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    <span>Cancel Hold</span>
                </button>
                <button id="btn-hapus-hold-lvl6" onclick="hapusItemHoldMobile()" class="px-4 py-2.5 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white font-black text-xs uppercase rounded-xl shadow-md flex items-center gap-1.5 transition border-b-4 border-rose-900 cursor-pointer">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span>Hapus Item</span>
                </button>
            </div>
        </div>

    </div>

    <!-- SIDEBAR FILTER LENGKAP DENGAN DROPDOWN -->
    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4 text-blue-600"></i> Filter Data STBJ</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 flex flex-col gap-3 overflow-y-auto custom-scroll flex-1">
            <div class="grid grid-cols-2 gap-2">
                <div class="col-span-2">
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status STBJ</label>
                    <select id="fs-status" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div class="col-span-2">
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label>
                    <input type="text" id="fs-qr" oninput="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none bg-slate-50 font-mono" placeholder="Ketik QR Code...">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli</label>
                    <select id="fs-troli" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label>
                    <select id="fs-mesin" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label>
                    <select id="fs-shift" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label>
                    <select id="fs-jenis" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div class="col-span-2">
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label>
                    <select id="fs-nama" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label>
                    <select id="fs-pjg" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label>
                    <select id="fs-grade" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label>
                    <select id="fs-dus" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label>
                    <select id="fs-shading" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div class="col-span-2">
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Customer Bawaan</label>
                    <select id="fs-customer" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
                <div class="col-span-2">
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PIC Input</label>
                    <select id="fs-pic" onchange="saringTabelSTBJ()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none cursor-pointer bg-slate-50 uppercase"><option value="">-- Semua --</option></select>
                </div>
            </div>
            <button onclick="resetFilterSTBJ()" class="mt-2 py-3 w-full bg-slate-800 hover:bg-slate-900 text-white font-black rounded-lg text-xs uppercase transition shrink-0">RESET FILTER</button>
        </div>
    </div>

    <!-- MODAL FILTER EXCEL (DESKTOP) -->
    <div id="excel-filter-menu" class="hidden fixed bg-white shadow-2xl border border-slate-300 rounded-lg w-64 z-[100] flex flex-col font-sans text-sm overflow-hidden">
        <div class="p-3 border-b border-slate-100 flex justify-between items-center rounded-t-lg">
            <span class="font-black text-slate-700 text-xs uppercase tracking-wider" id="filter-col-name">Filter</span>
            <button onclick="closeFilterMenu()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1 rounded transition shadow-sm"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>
        <div class="p-2 border-b border-slate-200 bg-white">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
                <input type="text" id="filter-search-input" oninput="searchFilterList(this.value)" class="w-full pl-8 p-1.5 text-xs font-bold border border-slate-300 bg-slate-50 rounded focus:border-blue-500 outline-none transition" placeholder="Cari Spesifik...">
            </div>
        </div>
        <div class="p-2 max-h-48 overflow-y-auto flex flex-col gap-1 text-xs bg-white custom-scroll" id="filter-values-list"></div>
        <div class="p-2 border-t border-slate-200 bg-slate-50 flex justify-between gap-2">
            <button onclick="clearFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded hover:bg-slate-100 transition shadow-sm">Reset</button>
            <button onclick="applyFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-white bg-blue-600 rounded hover:bg-blue-700 transition shadow-sm">Terapkan</button>
        </div>
    </div>

    <!-- SIDEBAR ATUR KOLOM -->
    <div id="sidebar-kolom" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="columns" class="w-4 h-4 text-blue-600"></i> Atur Urutan Kolom</h3>
            <button onclick="toggleSidebarKolom()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 bg-blue-50 border-b border-blue-100 text-xs text-blue-800 font-medium leading-relaxed">
            Tahan dan geser (Drag & Drop) kotak di bawah ini untuk mengatur urutan kolom.
        </div>
        <div class="p-3 flex flex-col gap-2 overflow-y-auto custom-scroll flex-1" id="kolom-drag-container"></div>
        <div class="p-4 border-t border-slate-200 bg-slate-50 flex gap-2">
            <button onclick="resetUrutanKolom()" class="w-1/3 py-2.5 bg-white border border-slate-300 text-slate-600 font-bold rounded-md text-xs uppercase transition hover:bg-slate-100 shadow-sm">Reset</button>
            <button onclick="simpanUrutanKolom()" class="w-2/3 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-md text-xs uppercase transition shadow-sm flex justify-center items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Simpan</button>
        </div>
    </div>

    <!-- MODAL KATALOG JASPER -->
    <div id="modal-list-katalog" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="database" class="w-4 h-4 text-purple-600"></i> KATALOG JASPER</h3>
                <div class="flex gap-2">
                    <button onclick="bukaModalKatalogForm()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md text-xs transition flex items-center gap-1 shadow-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i> TAMBAH</button>
                    <button onclick="document.getElementById('modal-list-katalog').classList.add('hidden')" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-red-500 hover:text-white hover:border-red-500 text-slate-600 font-bold rounded-md text-xs transition shadow-sm"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                </div>
            </div>
            <div class="p-3 border-b border-slate-100 bg-white relative z-30">
                <input type="text" id="f-kat-search" oninput="saringKatalogList()" class="w-full p-2.5 text-sm border border-slate-300 rounded-md outline-none focus:border-blue-500 font-bold shadow-inner" placeholder="Pencarian Cepat (Nama Item / Hasil Jasper)...">
            </div>
            <div class="overflow-y-auto px-4 pb-4 pt-0 flex-1 hide-scrollbar table-container">
                <table class="w-full text-left border-separate border-spacing-0 text-sm whitespace-nowrap mt-3" id="table-katalog">
                    <thead class="sticky top-0 z-50 shadow-sm">
                        <tr>
                            <th class="hdr-std w-10">EDIT</th>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std">Nama Item</th>
                            <th class="hdr-std">Panjang</th>
                            <th class="hdr-std border-r border-slate-500">Grade</th>
                            <th class="hdr-std bg-slate-900 text-blue-300">NAMA JASPER</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-katalog-list" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL FORM JASPER -->
    <div id="modal-katalog" class="hidden fixed inset-0 flex items-center justify-center z-[90] bg-slate-900/60 px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 id="title-modal-jasper" class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm">
                    <i data-lucide="edit" class="w-4 h-4 text-blue-600"></i> FORM JASPER
                </h3>
                <button onclick="tutupModalJasperForm()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-md transition shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-5 flex flex-col gap-4">
                <input type="hidden" id="j-id"> 
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label>
                    <input type="text" id="j-nama" readonly class="w-full p-2.5 text-sm border border-slate-300 rounded-md outline-none font-bold bg-slate-100 text-slate-500 cursor-not-allowed">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label>
                        <input type="text" id="j-pjg" readonly class="w-full p-2.5 text-sm border border-slate-300 rounded-md outline-none font-bold bg-slate-100 text-slate-500 cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label>
                        <input type="text" id="j-grade" readonly class="w-full p-2.5 text-sm border border-slate-300 rounded-md outline-none font-bold bg-slate-100 text-slate-500 cursor-not-allowed">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-blue-600 mb-1">Nama Jasper</label>
                    <input type="text" id="j-output" class="w-full p-2.5 text-sm border-2 border-blue-300 rounded-md focus:border-blue-600 outline-none font-black text-blue-800 bg-blue-50 shadow-inner" placeholder="Ketik nama spesifik Jasper...">
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-2 bg-slate-50">
                <button onclick="tutupModalJasperForm()" class="px-4 py-2 font-bold text-slate-500 hover:text-slate-700 transition text-sm">BATAL</button>
                <button onclick="simpanDataJasper()" id="btn-save-jasper" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-md shadow-sm text-sm transition flex items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> SIMPAN</button>
            </div>
        </div>
    </div>

    <!-- OVERLAY -->
    <div id="overlay-klik-luar" onclick="tutupPopups()" class="hidden fixed inset-0 z-[50] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="hasil_stbj_logic.js"></script>
</body>
</html>
