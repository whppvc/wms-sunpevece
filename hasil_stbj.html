<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Hasil STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .table-container { scrollbar-width: thin; position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* DESAIN HEADER OPTIMAL: Sangat gelap, teks sangat padat rata tengah sempurna */
        .hdr-std { 
            background-color: #0f172a !important; 
            color: #f1f5f9 !important; 
            text-align: center !important; /* MEMASTIKAN SEMUA HEADER CENTER */
            border: 1px solid #334155; 
            padding: 0.5rem 0.75rem; 
            text-transform: uppercase; 
            font-family: inherit; 
            font-size: 10px; 
            font-weight: 800; 
            white-space: nowrap; 
            position: sticky;
            top: 0;
            z-index: 20;
            background-clip: padding-box; 
        }
        
        /* DESAIN TAB BARU: Garis bawah biru tua, flat, menyatu */
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #ffffff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; background-color: #ffffff; }
    </style>
</head>
<body class="font-sans bg-white overflow-x-hidden text-slate-800 pb-20">

    <div class="w-full flex flex-col h-screen">
        
        <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar sticky top-0 z-30 shrink-0">
            <button onclick="setMode('qrcode')" id="tab-mode-qrcode" class="px-5 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-[11px] uppercase"><i data-lucide="qr-code" class="w-4 h-4"></i> MODE QRCODE</button>
            <button onclick="setMode('item')" id="tab-mode-item" class="px-5 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-[11px] uppercase"><i data-lucide="boxes" class="w-4 h-4"></i> NAMA ITEM & QTY</button>
            <button onclick="setMode('jasper')" id="tab-mode-jasper" class="px-5 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-[11px] uppercase"><i data-lucide="file-text" class="w-4 h-4"></i> NAMA JASPER & QTY</button>
        </div>

        <div class="bg-white p-2 border-b border-slate-200 flex flex-col gap-2 shrink-0 z-20 sticky top-14 mb-3">
            
            <div class="flex items-center gap-3 px-1 pb-1">
                <label id="lbl-pilih-tabel" class="text-[10px] font-black text-slate-500 uppercase tracking-wide">Tabel:</label>
                <select id="select-tabel" onchange="switchTable(this.value)" class="p-2 w-auto bg-slate-50 border border-slate-300 rounded font-black text-xs text-slate-800 outline-none cursor-pointer uppercase focus:border-blue-600 transition">
                    <option value="hasil_stbj">STBJ MASUK</option> 
                    <option value="hold_stbj">STBJ HOLD</option>
                </select>
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto px-1 pb-1 hide-scrollbar whitespace-nowrap scroll-smooth select-none" style="-webkit-overflow-scrolling: touch;">
                
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider mr-1 hidden sm:inline">Aksi:</span>
                
                <button onclick="bukaDaftarKatalog()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95 uppercase">
                    <i data-lucide="database" class="w-3.5 h-3.5"></i> KATALOG JASPER
                </button>
                <button onclick="aksiMassal('collect')" id="btn-massal-collect" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95 uppercase">
                    <i data-lucide="check-square" class="w-3.5 h-3.5"></i> COLLECT
                </button>
                
                <div class="w-px h-5 bg-slate-300 mx-0.5 self-center shrink-0"></div> 
                
                <button onclick="toggleSidebarFilter()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95 uppercase">
                    <i data-lucide="filter" class="w-3.5 h-3.5"></i> FILTER
                </button>
                <button onclick="aksiMassal('salin')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95 uppercase">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i> SALIN
                </button>
                <button onclick="aksiMassal('xlsx')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95 uppercase">
                    <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> EXCEL
                </button>
                <button onclick="aksiMassal('hold')" id="btn-hold" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95 uppercase">
                    <i data-lucide="pause-circle" class="w-3.5 h-3.5"></i> HOLD
                </button>
                
            </div>
            
            <div class="text-[9px] text-slate-400 text-center font-black uppercase tracking-wider mt-1 pointer-events-none flex items-center justify-center gap-1">
                <i data-lucide="arrow-left-right" class="w-3 h-3"></i> Geser menu tombol ke kanan-kiri
            </div>
        </div>

        <div class="bg-white flex-1 overflow-hidden relative overflow-x-hidden">
            <div class="table-container overflow-x-auto w-full h-full max-h-full hide-scrollbar">
                <table class="w-full text-center border-collapse whitespace-nowrap" id="table-stbj-main">
                    <thead class="sticky top-0 z-20 shadow-sm" id="thead-stbj"></thead>
                    <tbody id="tbody-stbj" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4 text-blue-600"></i> Filter Hasil STBJ</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-4 overflow-y-auto">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status Item</label><input type="text" id="f-sgudang" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status Data</label><input type="text" id="f-sdata" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Waktu</label><input type="text" id="f-waktu" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli</label><input type="text" id="f-troli" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="f-qr" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="text" id="f-tgl" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label><input type="text" id="f-mesin" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label><input type="text" id="f-shift" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><input type="text" id="f-jenis" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama / Jasper</label><input type="text" id="f-nama" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><input type="text" id="f-pjg" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><input type="text" id="f-grade" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><input type="text" id="f-dus" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="f-shading" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PO</label><input type="text" id="f-po" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="f-ket" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PIC Input</label><input type="text" id="f-pic" oninput="jalankanSaring()" class="w-full p-2 text-xs border border-slate-300 rounded focus:border-blue-500 outline-none"></div>
            </div>
            <button onclick="bersihkanFilter()" class="mt-4 py-3 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-lg text-xs uppercase transition border border-slate-300">RESET FILTER</button>
        </div>
    </div>

    <div id="modal-list-katalog" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] px-2 sm:px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="database" class="w-4 h-4 text-blue-600"></i> KATALOG JASPER</h3>
                <div class="flex gap-2">
                    <button onclick="bukaModalKatalogForm()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded text-xs transition flex items-center gap-1 shadow-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i> TAMBAH</button>
                    <button onclick="document.getElementById('modal-list-katalog').classList.add('hidden')" class="px-3 py-1.5 bg-slate-200 hover:bg-red-500 hover:text-white text-slate-600 font-bold rounded text-xs transition"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                </div>
            </div>
            <div class="p-3 border-b border-slate-100 bg-white relative z-30">
                <input type="text" id="f-kat-search" oninput="saringKatalogList()" class="w-full p-2.5 text-sm border-2 border-slate-200 rounded-lg outline-none focus:border-blue-500 font-bold" placeholder="Pencarian Cepat (Nama Item / Hasil Jasper)...">
            </div>

            <div class="overflow-y-auto px-0 pb-0 pt-0 flex-1 hide-scrollbar">
                <table class="w-full text-center border-collapse text-sm whitespace-nowrap">
                    <thead class="sticky top-0 z-20 shadow-sm bg-slate-900 text-white">
                        <tr>
                            <th class="hdr-std w-10 border-r border-slate-700">EDIT</th>
                            <th class="hdr-std w-12 border-r border-slate-700">No</th>
                            <th class="hdr-std border-r border-slate-700">Nama Item</th>
                            <th class="hdr-std border-r border-slate-700">Panjang</th>
                            <th class="hdr-std border-r border-slate-700">Grade</th>
                            <th class="hdr-std text-blue-300">NAMA JASPER</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-katalog-list" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-katalog" class="hidden fixed inset-0 flex items-center justify-center z-[90] bg-slate-900/60 px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 id="title-modal-jasper" class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm">
                    <i data-lucide="edit" class="w-4 h-4 text-blue-600"></i> FORM JASPER
                </h3>
                <button onclick="tutupModalJasperForm()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-4 flex flex-col gap-3">
                <input type="hidden" id="j-id"> 
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label>
                    <input type="text" id="j-nama" class="w-full p-2.5 text-sm border-2 border-slate-200 rounded-lg focus:border-blue-500 outline-none font-bold" placeholder="Contoh: PLAFON 103 SILVER">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label>
                        <input type="text" id="j-pjg" class="w-full p-2.5 text-sm border-2 border-slate-200 rounded-lg focus:border-blue-500 outline-none font-bold" placeholder="Contoh: 4M / 5M">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label>
                        <input type="text" id="j-grade" class="w-full p-2.5 text-sm border-2 border-slate-200 rounded-lg focus:border-blue-500 outline-none font-bold" placeholder="Contoh: A / BAGUS">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-blue-600 mb-1">Nama Jasper</label>
                    <input type="text" id="j-output" class="w-full p-2.5 text-sm border-2 border-blue-200 rounded-lg focus:border-blue-600 outline-none font-black text-blue-800 bg-blue-50" placeholder="Ketik nama spesifik Jasper...">
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-2 bg-slate-50">
                <button onclick="tutupModalJasperForm()" class="px-4 py-2 font-bold text-slate-500 hover:text-slate-700 transition text-sm uppercase">BATAL</button>
                <button onclick="simpanDataJasper()" id="btn-save-jasper" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-lg shadow-sm text-sm transition flex items-center gap-2 uppercase"><i data-lucide="save" class="w-4 h-4"></i> SIMPAN</button>
            </div>
        </div>
    </div>

    <div id="overlay-klik-luar-k" onclick="tutupPopups()" class="hidden fixed inset-0 z-30 bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="global.js"></script>
    <script src="hasil_stbj_logic.js"></script>
</body>
</html>
