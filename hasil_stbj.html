<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Hasil STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; }
        .custom-scroll::-webkit-scrollbar { width: 12px; height: 12px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-left: 1px solid #cbd5e1; border-top: 1px solid #cbd5e1; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border: 3px solid #f1f5f9; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .table-container { position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; padding: 0.85rem 0.5rem !important; font-size: 11px !important; font-weight: 700 !important; text-transform: uppercase !important; letter-spacing: 0.05em !important; white-space: nowrap !important; position: sticky !important; top: 0 !important; z-index: 20 !important; border: 1px solid #94a3b8 !important; resize: horizontal !important; overflow: hidden !important; }
        #table-stbj-main td { border: 1px solid #cbd5e1 !important; }
        #table-stbj-main { border-collapse: collapse; width: 100%; }
        tr.selected-row td { background-color: #dbeafe !important; }
        
        /* REVISI 6: CSS untuk Tab Navigation */
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
    </style>
</head>
<body class="font-sans bg-[#ecf0f1] text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <div class="shrink-0 bg-slate-50 flex flex-col z-20 shadow-[0_4px_10px_-3px_rgba(0,0,0,0.05)] border-b border-slate-300">
            
            <!-- REVISI 6: Desain Tab disamakan dengan Scan STBJ -->
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar">
                <button onclick="setMode('qrcode')" id="tab-mode-qrcode" class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="qr-code" class="w-4 h-4"></i> MODE QRCODE</button>
                <button onclick="setMode('item')" id="tab-mode-item" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="boxes" class="w-4 h-4"></i> MODE NAMA ITEM</button>
                <button onclick="setMode('jasper')" id="tab-mode-jasper" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="file-text" class="w-4 h-4"></i> MODE JASPER</button>
            </div>

            <!-- REVISI 9: Merapikan susunan menu agar tidak ketimpa -->
            <div class="p-2 sm:p-3 bg-white flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-200">
                <div class="flex items-center gap-3 shrink-0">
                    <label id="lbl-pilih-tabel" class="text-[11px] font-black text-slate-500 uppercase tracking-wide">Tabel:</label>
                    <!-- REVISI 7: Mengganti teks dropdown -->
                    <select id="select-tabel" onchange="switchTable(this.value)" class="p-2 sm:p-2.5 bg-slate-50 border border-slate-300 rounded font-black text-xs text-slate-800 outline-none cursor-pointer uppercase focus:border-blue-500 transition shadow-inner">
                        <option value="stok_global">STBJ MASUK</option> 
                        <option value="hold_stbj">STBJ HOLD</option>
                    </select>
                </div>

                <div class="flex gap-2 items-center overflow-x-auto hide-scrollbar whitespace-nowrap scroll-smooth select-none w-full sm:w-auto">
                    <button onclick="bukaDaftarKatalog()" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded overflow-hidden">
                        <div class="bg-purple-700 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="database" class="w-4 h-4"></i></div>
                        <div class="bg-purple-600 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-purple-500 transition">Katalog Jasper</div>
                    </button>
                    <button onclick="aksiMassal('collect')" id="btn-massal-collect" class="hidden group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded overflow-hidden">
                        <div class="bg-indigo-700 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="check-square" class="w-4 h-4"></i></div>
                        <div class="bg-indigo-600 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-indigo-500 transition">Collect</div>
                    </button>
                    <button onclick="aksiMassal('hold')" id="btn-hold" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded overflow-hidden">
                        <div class="bg-amber-700 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="pause-circle" class="w-4 h-4"></i></div>
                        <div class="bg-amber-600 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-amber-500 transition">Hold</div>
                    </button>
                    <div class="w-px h-8 bg-slate-300 mx-1 shrink-0"></div>
                    <button onclick="aksiMassal('xlsx')" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded overflow-hidden">
                        <div class="bg-emerald-700 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i></div>
                        <div class="bg-emerald-600 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-emerald-500 transition">Excel</div>
                    </button>
                    <button onclick="aksiMassal('salin')" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded overflow-hidden border border-slate-800">
                        <div class="bg-black text-white flex items-center justify-center px-3 py-2.5 border-r border-slate-700"><i data-lucide="copy" class="w-4 h-4"></i></div>
                        <div class="bg-slate-800 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-slate-700 transition">Salin</div>
                    </button>
                </div>
            </div>
            
            <div class="text-[9px] text-slate-400 text-center font-black uppercase tracking-widest pb-1 pt-1 pointer-events-none flex items-center justify-center gap-1 animate-pulse">
                <i data-lucide="arrow-left-right" class="w-3 h-3"></i> Geser menu tombol ke kanan-kiri
            </div>
        </div>

        <div class="flex-1 min-h-0 bg-slate-200 p-2 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 bg-white border border-slate-300 shadow-inner overflow-y-auto custom-scroll table-container">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-stbj-main">
                    <thead class="sticky top-0 z-10 shadow-sm" id="thead-stbj"></thead>
                    <tbody id="tbody-stbj" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>

        <div class="shrink-0 w-full bg-slate-50 p-2 sm:p-3 flex flex-col md:flex-row justify-between items-center gap-2 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300">
            <div class="flex items-center gap-2 flex-wrap justify-center">
                <span class="bg-blue-100 border border-blue-200 px-2.5 py-1 rounded text-blue-800 text-[11px] font-bold shadow-sm">Tampil Filter: <span id="lbl-tampil-baris" class="text-blue-900 font-black">0</span></span>
                <span class="bg-amber-100 border border-amber-200 px-2.5 py-1 rounded text-amber-800 text-[11px] font-bold shadow-sm">Total Qty (Dus): <span id="lbl-total-qty" class="text-amber-900 font-black">0</span></span>
                <span class="bg-emerald-100 border border-emerald-300 px-2.5 py-1 rounded text-emerald-800 text-[11px] font-bold shadow-sm">Dipilih: <span id="lbl-pilih-baris" class="text-emerald-900 font-black">0</span></span>
            </div>
            <div class="flex items-center gap-2 bg-white border border-slate-300 p-1 rounded shadow-sm">
                <button onclick="prevPage()" class="p-1 px-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 active:scale-95 transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                <span class="px-2 font-black text-xs text-slate-600 tracking-wide uppercase">Hal <span id="lbl-halaman" class="text-blue-600">1</span> / <span id="lbl-total-halaman">1</span></span>
                <button onclick="nextPage()" class="p-1 px-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 active:scale-95 transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>
        </div>

    </div>

    <!-- MODAL FILTER EXCEL -->
    <div id="excel-filter-menu" class="hidden absolute bg-white shadow-2xl border border-slate-300 rounded-lg w-64 z-[100] flex flex-col font-sans text-sm">
        <div class="p-3 border-b border-slate-200 bg-slate-100 flex justify-between items-center rounded-t-lg">
            <span class="font-black text-slate-700 text-xs uppercase tracking-wider" id="filter-col-name">Filter</span>
            <button onclick="closeFilterMenu()" class="text-slate-400 hover:text-rose-500 bg-white p-1 rounded transition shadow-sm"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>
        <div class="p-2 border-b border-slate-200 bg-white">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
                <input type="text" id="filter-search-input" oninput="searchFilterList(this.value)" class="w-full pl-8 p-1.5 text-xs font-bold border border-slate-300 bg-slate-50 rounded focus:border-blue-500 focus:bg-white outline-none transition" placeholder="Cari Spesifik...">
            </div>
        </div>
        <div class="p-2 max-h-48 overflow-y-auto flex flex-col gap-1 text-xs bg-white" id="filter-values-list"></div>
        <div class="p-2 border-t border-slate-200 bg-slate-50 flex justify-between gap-2 rounded-b-lg">
            <button onclick="clearFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded hover:bg-slate-100 transition shadow-sm">Reset</button>
            <button onclick="applyFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-white bg-blue-600 rounded hover:bg-blue-700 transition shadow-sm">Terapkan</button>
        </div>
    </div>

    <!-- MODAL KATALOG -->
    <div id="modal-list-katalog" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] px-4 backdrop-blur-sm">
        <div class="bg-white rounded shadow-2xl w-full max-w-4xl border border-slate-300 overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-100">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="database" class="w-4 h-4 text-purple-600"></i> KATALOG JASPER</h3>
                <div class="flex gap-2">
                    <button onclick="bukaModalKatalogForm()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded text-xs transition flex items-center gap-1 shadow-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i> TAMBAH</button>
                    <button onclick="document.getElementById('modal-list-katalog').classList.add('hidden')" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-red-500 hover:text-white hover:border-red-500 text-slate-600 font-bold rounded text-xs transition shadow-sm"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                </div>
            </div>
            <div class="p-3 border-b border-slate-100 bg-white relative z-30">
                <input type="text" id="f-kat-search" oninput="saringKatalogList()" class="w-full p-2.5 text-sm border border-slate-300 rounded outline-none focus:border-blue-500 font-bold shadow-inner" placeholder="Pencarian Cepat (Nama Item / Hasil Jasper)...">
            </div>
            <div class="overflow-y-auto px-4 pb-4 pt-0 flex-1 hide-scrollbar">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap mt-3 border border-slate-200 shadow-sm" id="table-katalog">
                    <thead class="sticky top-0 z-20 shadow-sm">
                        <tr>
                            <th class="hdr-std w-10">EDIT</th>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std">Nama Item</th>
                            <th class="hdr-std">Panjang</th>
                            <th class="hdr-std border-r border-slate-500">Grade</th>
                            <th class="hdr-std bg-slate-900 text-blue-300">NAMA JASPER</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-katalog-list" class="text-center text-slate-700 border-b border-slate-200"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-katalog" class="hidden fixed inset-0 flex items-center justify-center z-[90] bg-slate-900/60 px-4 backdrop-blur-sm">
        <div class="bg-white rounded shadow-2xl w-full max-w-md border border-slate-300 overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-100">
                <h3 id="title-modal-jasper" class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm">
                    <i data-lucide="edit" class="w-4 h-4 text-blue-600"></i> FORM JASPER
                </h3>
                <button onclick="tutupModalJasperForm()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-300 p-1.5 rounded transition shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-5 flex flex-col gap-4">
                <input type="hidden" id="j-id"> 
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label>
                    <input type="text" id="j-nama" class="w-full p-2.5 text-sm border border-slate-300 rounded focus:border-blue-500 outline-none font-bold shadow-inner" placeholder="Contoh: PLAFON 103 SILVER">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label>
                        <input type="text" id="j-pjg" class="w-full p-2.5 text-sm border border-slate-300 rounded focus:border-blue-500 outline-none font-bold shadow-inner" placeholder="Contoh: 4M / 5M">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label>
                        <input type="text" id="j-grade" class="w-full p-2.5 text-sm border border-slate-300 rounded focus:border-blue-500 outline-none font-bold shadow-inner" placeholder="Contoh: A / BAGUS">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-blue-600 mb-1">Nama Jasper</label>
                    <input type="text" id="j-output" class="w-full p-2.5 text-sm border-2 border-blue-300 rounded focus:border-blue-600 outline-none font-black text-blue-800 bg-blue-50 shadow-inner" placeholder="Ketik nama spesifik Jasper...">
                </div>
            </div>
            <div class="p-4 border-t border-slate-200 flex justify-end gap-2 bg-slate-50">
                <button onclick="tutupModalJasperForm()" class="px-4 py-2 font-bold text-slate-500 hover:text-slate-700 transition text-sm">BATAL</button>
                <button onclick="simpanDataJasper()" id="btn-save-jasper" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-black rounded shadow-sm text-sm transition flex items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> SIMPAN</button>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script src="hasil_stbj_logic.js"></script>
</body>
</html>
