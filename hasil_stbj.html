<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Hasil STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; border: 1px solid #334155; padding: 0.75rem; text-transform: uppercase; font-size: 11px; font-weight: 900; white-space: nowrap; }
    </style>
    <style id="dynamic-col-styles"></style>
</head>
<body class="font-sans overflow-x-hidden">
    <div class="w-full relative">
        
        <div class="flex border-b border-slate-200 mb-4 bg-white px-2 rounded-t-xl shadow-sm overflow-x-auto hide-scrollbar">
            <button onclick="setMode('qrcode')" id="tab-mode-qrcode" class="px-5 py-3.5 border-b-4 border-blue-800 text-blue-800 font-black text-xs whitespace-nowrap flex items-center gap-2 transition"><i data-lucide="qr-code"></i> MODE QRCODE</button>
            <button onclick="setMode('item')" id="tab-mode-item" class="px-5 py-3.5 border-b-4 border-transparent text-slate-500 font-bold text-xs whitespace-nowrap flex items-center gap-2 hover:text-slate-800 transition"><i data-lucide="boxes"></i> MODE NAMA ITEM & QTY</button>
            <button onclick="setMode('jasper')" id="tab-mode-jasper" class="px-5 py-3.5 border-b-4 border-transparent text-slate-500 font-bold text-xs whitespace-nowrap flex items-center gap-2 hover:text-slate-800 transition"><i data-lucide="file-text"></i> MODE NAMA JASPER & QTY</button>
        </div>

        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3" id="panel-atas">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <label id="lbl-pilih-tabel" class="text-xs font-black text-slate-600 uppercase">Tampilkan Data:</label>
                    <select id="select-tabel" onchange="switchTable(this.value)" class="p-2 border-2 border-slate-200 rounded-lg font-bold text-xs text-slate-800 outline-none focus:border-slate-800 bg-slate-50 cursor-pointer">
                        <option value="hasil_stbj">TABEL HASIL STBJ (UNIQUE)</option>
                        <option value="hold_stbj">TABEL HOLD STBJ (DUPLIKAT/HOLD)</option>
                    </select>
                </div>
                <div class="flex gap-2 w-full sm:w-auto justify-end">
                    <button onclick="toggleSidebarFilter()" id="btn-toggle-filter" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded flex items-center gap-1 transition uppercase"><i data-lucide="filter" class="w-3.5 h-3.5"></i> FILTER</button>
                    <div class="relative">
                        <button onclick="document.getElementById('dropdown-kolom').classList.toggle('hidden')" class="px-3 py-1.5 bg-white text-slate-700 hover:text-slate-900 font-bold rounded shadow-sm border-2 border-slate-200 text-xs flex items-center gap-1 active:scale-95 transition uppercase"><i data-lucide="eye-off" class="w-3.5 h-3.5"></i> KOLOM</button>
                        <div id="dropdown-kolom" class="hidden absolute top-full right-0 mt-2 w-56 bg-white border border-slate-200 shadow-xl rounded-xl p-3 z-40">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-2">
                                <span class="text-xs font-black text-slate-500 uppercase">Sembunyikan</span>
                                <button onclick="resetKolom()" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200">RESET</button>
                            </div>
                            <div class="flex flex-col gap-2 max-h-64 overflow-y-auto" id="list-kolom-toggles"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 pt-2">
                <button onclick="aksiMassal('salin')" id="btn-massal-salin" class="flex-1 sm:flex-none px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm uppercase"><i data-lucide="copy" class="w-4 h-4"></i> SALIN</button>
                <button onclick="aksiMassal('hapus')" id="btn-massal-hapus" class="flex-1 sm:flex-none px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm uppercase"><i data-lucide="trash-2" class="w-4 h-4"></i> HAPUS</button>
                <button onclick="aksiMassal('hold')" id="btn-massal-hold" class="flex-1 sm:flex-none px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm uppercase"><i data-lucide="pause-circle" class="w-4 h-4"></i> HOLD/UNHOLD</button>
                <button onclick="aksiMassal('xlsx')" id="btn-massal-xls" class="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm uppercase"><i data-lucide="download" class="w-4 h-4"></i> UNDUH EXCEL</button>
                
                <button onclick="bukaDaftarKatalog()" id="btn-tambah-katalog" class="flex-1 sm:flex-none px-5 py-2 bg-blue-700 hover:bg-blue-800 text-white font-black text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-md border-b-4 border-blue-900 ml-auto uppercase"><i data-lucide="database" class="w-4 h-4"></i> KATALOG JASPER</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative mb-10">
            <div class="overflow-x-auto w-full max-h-[60vh] hide-scrollbar">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-stbj-main">
                    <thead class="sticky top-0 z-10 shadow-sm" id="thead-stbj"></thead>
                    <tbody id="tbody-stbj" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide"><i data-lucide="filter" class="w-5 h-5"></i> Filter Hasil STBJ</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-4 overflow-y-auto">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Waktu</label><input type="text" id="f-waktu" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli</label><input type="text" id="f-troli" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="f-qr" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="text" id="f-tgl" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label><input type="text" id="f-mesin" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label><input type="text" id="f-shift" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><input type="text" id="f-jenis" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item / Jasper</label><input type="text" id="f-nama" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><input type="text" id="f-pjg" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><input type="text" id="f-grade" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><input type="text" id="f-dus" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="f-shading" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PO</label><input type="text" id="f-po" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="f-ket" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PIC Input</label><input type="text" id="f-pic" oninput="jalankanSaring()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            </div>
            <button onclick="bersihkanFilter()" class="mt-4 py-3 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-lg text-xs uppercase transition border border-slate-300">RESET FILTER</button>
        </div>
    </div>

    <div id="modal-list-katalog" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide"><i data-lucide="database" class="w-5 h-5 text-blue-600"></i> DATABASE KATALOG JASPER</h3>
                <div class="flex gap-2">
                    <button onclick="bukaModalKatalogForm()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg text-xs transition flex items-center gap-1 shadow-sm"><i data-lucide="plus" class="w-4 h-4"></i> TAMBAH DATA</button>
                    <button onclick="document.getElementById('modal-list-katalog').classList.add('hidden')" class="px-4 py-2 bg-slate-200 hover:bg-red-500 hover:text-white text-slate-600 font-bold rounded-lg text-xs transition"><i data-lucide="x" class="w-4 h-4"></i></button>
                </div>
            </div>
            <div class="p-4 border-b border-slate-100">
                <input type="text" id="f-kat-search" oninput="saringKatalogList()" class="w-full p-3 text-sm border-2 border-slate-200 rounded-lg outline-none focus:border-blue-500 font-bold" placeholder="Pencarian Cepat Katalog (Nama Item / Hasil Jasper)...">
            </div>
            <div class="overflow-y-auto p-4 flex-1 hide-scrollbar">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std text-left pl-4">Nama Item Master</th>
                            <th class="hdr-std">Panjang</th>
                            <th class="hdr-std border-r border-slate-500">Grade</th>
                            <th class="hdr-std bg-slate-900 text-blue-300">NAMA OUTPUT JASPER</th>
                            <th class="hdr-std w-20">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-katalog-list" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-katalog" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[90] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200">
            <h3 class="text-xl font-black mb-6 flex items-center gap-2 text-slate-800"><i data-lucide="edit" class="text-blue-600"></i> Form Katalog Jasper</h3>
            <input type="hidden" id="kat-id">
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-[11px] font-black uppercase tracking-wide mb-1 text-slate-500">Nama Item Master</label>
                    <input type="text" id="kat-nama" class="w-full p-3 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-600 font-bold uppercase text-slate-800" placeholder="Cth: LIS PLINT">
                </div>
                <div class="flex gap-3">
                    <div class="w-1/2">
                        <label class="block text-[11px] font-black uppercase tracking-wide mb-1 text-slate-500">Panjang</label>
                        <input type="text" id="kat-pjg" class="w-full p-3 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-600 font-bold uppercase text-slate-800 text-center" placeholder="Cth: 4M">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-[11px] font-black uppercase tracking-wide mb-1 text-slate-500">Grade</label>
                        <input type="text" id="kat-grade" class="w-full p-3 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-600 font-bold uppercase text-slate-800 text-center" placeholder="Cth: BAGUS">
                    </div>
                </div>
                <div class="pt-3 border-t border-slate-100">
                    <label class="block text-xs font-black uppercase tracking-wide mb-1 text-blue-700">Hasil / Nama Output Jasper</label>
                    <input type="text" id="kat-jasper" class="w-full p-3 border-2 border-blue-200 bg-blue-50 rounded-lg outline-none focus:border-blue-700 font-black uppercase text-blue-900" placeholder="Ketik nama output Jasper di sini...">
                </div>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="document.getElementById('modal-katalog').classList.add('hidden')" class="w-1/3 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition uppercase text-xs">BATAL</button>
                <button type="button" onclick="simpanKatalog()" id="btn-simpan-kat" class="w-2/3 py-3 bg-blue-700 text-white font-black rounded-xl hover:bg-blue-800 shadow-md flex justify-center items-center gap-2 transition active:scale-95 border-b-4 border-blue-900 uppercase text-xs"><i data-lucide="save" class="w-4 h-4"></i> SIMPAN</button>
            </div>
        </div>
    </div>
    
    <div id="overlay-klik-luar-k" onclick="tutupPopups()" class="hidden fixed inset-0 z-30"></div>

    <script src="global.js"></script>
    <script>
        let modeSekarang = 'qrcode'; 
        let tabelSekarang = 'hasil_stbj'; 
        let rawDataRaw = [];
        let kamusData = [];
        let jasperData = [];
        let hiddenCols = [];
        const currentUser = JSON.parse(localStorage.getItem('user_session')) || {username: 'Admin'};

        const colDefinitions = [
            { id: 'col-cb', label: 'Checkbox', default: true },
            { id: 'col-no', label: 'Nomor Urut', default: true },
            { id: 'col-status', label: 'Status Hold', default: true },
            { id: 'col-waktu', label: 'Waktu Input', default: true },
            { id: 'col-troli', label: 'Troli', default: true },
            { id: 'col-qr', label: 'QRCode', default: true },
            { id: 'col-tgl', label: 'Tgl Produksi', default: true },
            { id: 'col-mesin', label: 'Mesin', default: true },
            { id: 'col-shift', label: 'Shift', default: true },
            { id: 'col-jenis', label: 'Jenis Item', default: true },
            { id: 'col-nama', label: 'Nama Item / Jasper', default: true },
            { id: 'col-pjg', label: 'Pjg', default: true },
            { id: 'col-grade', label: 'Grade', default: true },
            { id: 'col-dus', label: 'Dus', default: true },
            { id: 'col-shading', label: 'Shading', default: true },
            { id: 'col-po', label: 'PO', default: true },
            { id: 'col-qty', label: 'QTY Total', default: true },
            { id: 'col-ket', label: 'Keterangan', default: true },
            { id: 'col-pic', label: 'PIC Input', default: true }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            initModernLayout({ id: 'hasil_stbj', title: 'HASIL STBJ', url: 'hasil_stbj.html' });
            setTimeout(async () => {
                buatDropdownKolom();
                await loadKamusDanJasper();
                await muatDataDariSupabase();
            }, 200);
        });

        function buatDropdownKolom() {
            const container = document.getElementById('list-kolom-toggles');
            let html = '';
            colDefinitions.forEach(col => {
                html += `
                    <label class="flex items-center gap-2 cursor-pointer p-1.5 hover:bg-slate-50 rounded">
                        <input type="checkbox" checked onchange="toggleKolom('${col.id}', this.checked)" class="w-4 h-4 cursor-pointer text-blue-600 rounded border-slate-300 focus:ring-blue-500">
                        <span class="text-xs font-bold text-slate-700">${col.label}</span>
                    </label>
                `;
            });
            container.innerHTML = html;
        }

        function toggleKolom(colId, isVisible) {
            if(isVisible) { hiddenCols = hiddenCols.filter(id => id !== colId); } 
            else { if(!hiddenCols.includes(colId)) hiddenCols.push(colId); }
            terapkanStyleKolom();
        }

        function resetKolom() {
            hiddenCols = [];
            document.querySelectorAll('#list-kolom-toggles input[type="checkbox"]').forEach(cb => cb.checked = true);
            terapkanStyleKolom();
        }

        function terapkanStyleKolom() {
            const cssString = hiddenCols.map(id => `.${id} { display: none !important; }`).join('\n');
            document.getElementById('dynamic-col-styles').innerHTML = cssString;
        }

        function toggleSidebarFilter() {
            document.getElementById('sidebar-filter').classList.toggle('translate-x-full');
            document.getElementById('overlay-klik-luar-k').classList.toggle('hidden');
        }

        function tutupPopups() {
            document.getElementById('sidebar-filter').classList.add('translate-x-full');
            document.getElementById('dropdown-kolom').classList.add('hidden');
            document.getElementById('overlay-klik-luar-k').classList.add('hidden');
        }

        async function loadKamusDanJasper() {
            const { data: d2 } = await db.from('master_2').select('*'); if(d2) kamusData = d2;
            try {
                const { data: dj } = await db.from('nama_jasper').select('*').order('created_at', {ascending: false});
                if(dj) jasperData = dj;
            } catch(e) { console.log("Tabel nama_jasper belum siap."); }
        }

        async function muatDataDariSupabase() {
            const tbody = document.getElementById('tbody-stbj');
            tbody.innerHTML = `<tr><td colspan="20" class="p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-2 text-slate-500"></i><p class="font-bold text-slate-500">Menarik Data ${tabelSekarang}...</p></td></tr>`;
            lucide.createIcons();
            try {
                const { data, error } = await db.from(tabelSekarang).select('*').order('created_at', {ascending: false});
                if(error) throw error;
                rawDataRaw = data || [];
                renderHeaderDanTabel();
            } catch(err) { tbody.innerHTML = `<tr><td colspan="20" class="p-10 text-red-500 font-bold">Gagal memuat: ${err.message}</td></tr>`; }
        }

        function translateBarcode(barcode) {
            let td = { tglProduksi: '-', mesin: '-', shift: '-', jenisItem: '-', namaItem: '-', panjang: '-', grade: '-', dus: '-', shading: '-', po: '-', jasper: '-' };
            if(!barcode) return td;
            const parts = barcode.split('/'); if (parts.length < 1) return td;
            
            const hurufDepan = barcode.charAt(0).toUpperCase();
            if (hurufDepan === 'P') td.jenisItem = 'Plafon'; else if (hurufDepan === 'L') td.jenisItem = 'List'; else if (hurufDepan === 'W') td.jenisItem = 'WPC'; else td.jenisItem = hurufDepan;

            let rawItem = parts[0]; let cariItem = kamusData.find(m => m.kode_nama_item === rawItem); 
            td.namaItem = cariItem && cariItem.nama_item ? cariItem.nama_item : rawItem; td.shading = parts[1] || '-';
            
            const p2 = parts[2];
            if (p2 && p2.length >= 4) {
                let dP = (p2.length === 5) ? 2 : 1; let rP = p2.substring(0, dP); td.panjang = (dP === 1) ? rP + "M" : rP[0] + "." + rP[1] + "M"; 
                let rG = p2.substring(dP, dP + 1); td.grade = rG === '1' ? 'BAGUS' : (rG === '2' ? 'A' : rG);
                let rD = p2.substring(p2.length - 2); let cD = kamusData.find(m => m.kode_dus === rD); td.dus = cD && cD.dus ? cD.dus : rD;
            }
            const p3 = parts[3];
            if (p3 && p3.length >= 5) {
                const dayOfYear = parseInt(p3.substring(0, 3)); const realYear = parseInt('20' + p3.substring(3, 5).split('').reverse().join(''));
                if (!isNaN(dayOfYear) && !isNaN(realYear)) {
                    const dateObj = new Date(realYear, 0); dateObj.setDate(dayOfYear);
                    td.tglProduksi = `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
                }
                let s = p3.substring(5); let m = s.match(/(C.*?)(S.*?)(P.*)/);
                if (m) {
                    let cM = kamusData.find(x => x.kode_mesin === m[1]); td.mesin = cM && cM.mesin ? cM.mesin : m[1];
                    let cS = kamusData.find(x => x.kode_shift === m[2]); td.shift = cS && cS.shift ? cS.shift : m[2];
                    let cPO = kamusData.find(x => x.kode_po === m[3]); td.po = cPO && cPO.po ? cPO.po : m[3];
                }
            }

            if(jasperData.length > 0) {
                const cJasper = jasperData.find(j => j.nama_item === td.namaItem && j.panjang === td.panjang && j.grade === td.grade);
                td.jasper = cJasper ? cJasper.nama_jasper : `JAS-${td.namaItem}`;
            } else { td.jasper = `JAS-${td.namaItem}`; }

            return td;
        }

        function setMode(m) {
            modeSekarang = m;
            ['qrcode', 'item', 'jasper'].forEach(tab => {
                const el = document.getElementById('tab-mode-' + tab);
                if(el) {
                    if(m === tab) el.className = 'px-5 py-3.5 border-b-4 border-blue-800 text-blue-800 font-black text-xs whitespace-nowrap flex items-center gap-2 transition';
                    else el.className = 'px-5 py-3.5 border-b-4 border-transparent text-slate-500 font-bold text-xs whitespace-nowrap flex items-center gap-2 hover:text-slate-800 transition';
                }
            });
            renderHeaderDanTabel();
        }

        function switchTable(val) { tabelSekarang = val; muatDataDariSupabase(); }

        function bukaDaftarKatalog() {
            renderKatalogList();
            document.getElementById('modal-list-katalog').classList.remove('hidden');
        }

        function renderKatalogList() {
            const tbody = document.getElementById('tbody-katalog-list');
            if(jasperData.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="p-6 font-bold text-slate-400">Katalog Jasper belum ada / Kosong.</td></tr>'; return; }
            
            let h = '';
            jasperData.forEach((r, i) => {
                const safeR = JSON.stringify(r).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                h += `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 transition text-center katalog-row">
                        <td class="p-3 font-bold text-slate-400">${i+1}</td>
                        <td class="p-3 font-bold text-slate-800 text-left s-nama">${r.nama_item || '-'}</td>
                        <td class="p-3 font-bold text-slate-600 s-pjg">${r.panjang || '-'}</td>
                        <td class="p-3 font-bold text-slate-800 border-r border-slate-200 s-grade">${r.grade || '-'}</td>
                        <td class="p-3 font-black text-blue-700 bg-blue-50/50 text-left s-jasper">${r.nama_jasper || '-'}</td>
                        <td class="p-2">
                            <div class="flex gap-1 justify-center">
                                <button onclick="bukaModalKatalogForm('${safeR}')" class="p-2 bg-blue-100 text-blue-700 hover:bg-blue-200 rounded cursor-pointer transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                <button onclick="hapusKatalog('${r.id}')" class="p-2 bg-red-100 text-red-700 hover:bg-red-200 rounded cursor-pointer transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = h; lucide.createIcons();
        }

        function saringKatalogList() {
            const q = document.getElementById('f-kat-search').value.toLowerCase();
            document.querySelectorAll('.katalog-row').forEach(row => {
                const txt = row.innerText.toLowerCase();
                row.style.display = txt.includes(q) ? '' : 'none';
            });
        }

        function bukaModalKatalogForm(jsonStr) {
            if(jsonStr) {
                const d = JSON.parse(jsonStr);
                document.getElementById('kat-id').value = d.id;
                document.getElementById('kat-nama').value = d.nama_item || '';
                document.getElementById('kat-pjg').value = d.panjang || '';
                document.getElementById('kat-grade').value = d.grade || '';
                document.getElementById('kat-jasper').value = d.nama_jasper || '';
            } else {
                document.getElementById('kat-id').value = ''; document.getElementById('kat-nama').value = '';
                document.getElementById('kat-pjg').value = ''; document.getElementById('kat-grade').value = '';
                document.getElementById('kat-jasper').value = '';
            }
            document.getElementById('modal-katalog').classList.remove('hidden');
        }

        async function simpanKatalog() {
            const id = document.getElementById('kat-id').value;
            const nama = document.getElementById('kat-nama').value.trim().toUpperCase();
            const pjg = document.getElementById('kat-pjg').value.trim().toUpperCase();
            const grade = document.getElementById('kat-grade').value.trim().toUpperCase();
            const jasper = document.getElementById('kat-jasper').value.trim().toUpperCase();
            
            if(!nama || !pjg || !grade || !jasper) return alert("Pastikan semua kolom diisi!");
            const btn = document.getElementById('btn-simpan-kat'); btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> MENYIMPAN...';
            
            const payload = { nama_item: nama, panjang: pjg, grade: grade, nama_jasper: jasper };
            let res;
            if(id) res = await db.from('nama_jasper').update(payload).eq('id', id);
            else res = await db.from('nama_jasper').insert(payload);
            
            if(res.error) alert("Gagal: " + res.error.message);
            else { alert("Katalog berhasil disimpan!"); document.getElementById('modal-katalog').classList.add('hidden'); await loadKamusDanJasper(); renderKatalogList(); }
            btn.disabled=false; btn.innerHTML='<i data-lucide="save" class="w-4 h-4"></i> SIMPAN'; lucide.createIcons();
        }

        async function hapusKatalog(id) {
            if(!confirm("Yakin ingin menghapus item katalog ini?")) return;
            const {error} = await db.from('nama_jasper').delete().eq('id', id);
            if(error) alert("Gagal Hapus: " + error.message); else { await loadKamusDanJasper(); renderKatalogList(); }
        }

                            <td class="p-3 text-slate-600 font-semibold text-center col-waktu">${tgl}</td>
                            <td class="p-3 font-bold text-slate-700 text-center col-troli">${r.troli || '-'}</td>

                            <td class="p-3 font-bold text-slate-600 text-center col-mesin">${td.mesin}</td>
                            <td class="p-3 font-bold text-slate-600 text-center border-r border-slate-200 col-shift">${td.shift}</td>
                            <td class="p-3 font-black text-blue-700 s-jenis text-center col-jenis">${td.jenisItem}</td>
                            <td class="p-3 font-bold text-slate-800 text-left s-nama col-nama">${td.namaItem}</td>
                            <td class="p-3 font-bold text-slate-600 text-center col-pjg">${td.panjang}</td>
                            <td class="p-3 font-bold text-slate-800 text-center col-grade">${td.grade}</td>
                            <td class="p-3 font-bold text-slate-800 text-center col-dus">${td.dus}</td>
                            <td class="p-3 font-bold text-slate-600 text-center border-r border-slate-200 col-shading">${td.shading}</td>
                            <td class="p-3 font-black text-orange-600 bg-orange-50/50 s-po text-center col-po">${td.po}</td>
                            <td class="p-3 hidden col-qty">1</td>

                });

            else if(modeSekarang === 'item' || modeSekarang === 'jasper') {
                const isJasper = modeSekarang === 'jasper';
                thead.innerHTML = `
                    <tr>
                        <th class="hdr-std w-10 col-cb"><input type="checkbox" onchange="toggleSemuaCentang(this.checked)" class="cursor-pointer"></th>
                        <th class="hdr-std w-12 col-no">No</th>

                        <th class="hdr-std hidden col-waktu">Waktu Scan</th>

                        <th class="hdr-std col-tgl">Tgl Produksi</th>
                        <th class="hdr-std col-mesin">Mesin</th>

                    if(!groups[key]) groups[key] = { ...t, displayNama: n, qty: 0, qrcodes: [], trolis: new Set() };
                    groups[key].qty++; 
                    groups[key].qrcodes.push(r.qrcode);
                    if(r.troli) groups[key].trolis.add(r.troli);
                });

                let arr = Object.values(groups);
                if(arr.length === 0) { tbody.innerHTML = '<tr><td colspan="19" class="p-6 font-bold text-slate-400">Kosong.</td></tr>'; return; }

        function toggleSemuaCentang(checked) { document.querySelectorAll('.row-cb').forEach(cb => cb.checked = checked); }
        function bersihkanFilter() { 
            const ids = ['f-waktu','f-troli','f-qr','f-tgl','f-mesin','f-shift','f-jenis','f-nama','f-pjg','f-grade','f-dus','f-shading','f-po','f-ket','f-pic'];
            ids.forEach(id => document.getElementById(id).value = ''); 
            jalankanSaring(); toggleSidebarFilter();
        }

        function jalankanSaring() {
            const f = {
                waktu: document.getElementById('f-waktu').value.toLowerCase(),
                troli: document.getElementById('f-troli').value.toLowerCase(),
                qr: document.getElementById('f-qr').value.toLowerCase(),
                tgl: document.getElementById('f-tgl').value.toLowerCase(),
                mesin: document.getElementById('f-mesin').value.toLowerCase(),
                shift: document.getElementById('f-shift').value.toLowerCase(),
                jenis: document.getElementById('f-jenis').value.toLowerCase(),
                nama: document.getElementById('f-nama').value.toLowerCase(),
                pjg: document.getElementById('f-pjg').value.toLowerCase(),
                grade: document.getElementById('f-grade').value.toLowerCase(),
                dus: document.getElementById('f-dus').value.toLowerCase(),
                shading: document.getElementById('f-shading').value.toLowerCase(),
                po: document.getElementById('f-po').value.toLowerCase(),
                ket: document.getElementById('f-ket').value.toLowerCase(),
                pic: document.getElementById('f-pic').value.toLowerCase()
            };

            document.querySelectorAll('.text-row').forEach(row => {
                let show = true;
                for(let key in f) {
                    if(f[key]) {
                        const cell = row.querySelector('.col-' + key);
                        if(cell && !cell.innerText.toLowerCase().includes(f[key])) { show = false; break; }
                    }
                }
                row.style.display = show ? '' : 'none';
            });
        }

        async function aksiMassal(tipe) {
            let checkedValues = [];
            document.querySelectorAll('.row-cb:checked').forEach(cb => { cb.value.split(',').forEach(v => { if(v) checkedValues.push(v); }); });
            if(checkedValues.length === 0) return alert("Centang baris tabel terlebih dahulu!");

            if(tipe === 'salin') {
                let textSalin = "";
                const headers = Array.from(document.querySelectorAll('#thead-stbj th'))
                    .filter(th => window.getComputedStyle(th).display !== 'none' && !th.classList.contains('col-cb'))
                    .map(th => th.innerText.trim().replace(/\n/g, ' '));
                textSalin += headers.join('\t') + '\n';

                document.querySelectorAll('.row-cb:checked').forEach(cb => {
                    const tr = cb.closest('tr');
                    const rowData = [];
                    Array.from(tr.children).forEach(td => {
                        if(td.classList.contains('col-cb')) return;
                        if(window.getComputedStyle(td).display !== 'none') {
                            rowData.push(td.innerText.trim().replace(/\n/g, ' '));
                        }
                    });
                    textSalin += rowData.join('\t') + '\n';
                });
                navigator.clipboard.writeText(textSalin);
                alert(`Tersalin baris! Buka Excel dan Paste (Ctrl+V).`);
            } 
            else if(tipe === 'hapus') {
                if(!confirm(`Hapus permanen ${checkedValues.length} QRCode dari database?`)) return;
                const { error } = await db.from(tabelSekarang).delete().in('qrcode', checkedValues);
                if(error) alert("Gagal hapus: " + error.message); else { alert("Data Dihapus!"); muatDataDariSupabase(); }
            } 
            else if(tipe === 'hold') {
                if(tabelSekarang === 'hasil_stbj') {
                    if(!confirm(`Pindahkan ${checkedValues.length} data HASIL -> tabel HOLD (Duplikat)?`)) return;
                    const dataPindah = rawDataRaw.filter(r => checkedValues.includes(r.qrcode)).map(r => ({ qrcode: r.qrcode, troli: r.troli, pic_input: r.pic_input, keterangan: r.keterangan, status: 'HOLD' }));
                    const { error: errAdd } = await db.from('hold_stbj').upsert(dataPindah);
                    if(!errAdd) { await db.from('hasil_stbj').delete().in('qrcode', checkedValues); alert("Dipindahkan ke HOLD!"); muatDataDariSupabase(); }
                } else {
                    if(!confirm(`Unhold ${checkedValues.length} data HOLD -> tabel HASIL (Unique)?`)) return;
                    const dataPindah = rawDataRaw.filter(r => checkedValues.includes(r.qrcode)).map(r => ({ qrcode: r.qrcode, troli: r.troli, pic_input: r.pic_input, keterangan: r.keterangan }));
                    const { error: errAdd } = await db.from('hasil_stbj').upsert(dataPindah);
                    if(!errAdd) { await db.from('hold_stbj').delete().in('qrcode', checkedValues); alert("Di-unhold ke HASIL!"); muatDataDariSupabase(); }
                }
            } 
            else if(tipe === 'xlsx') {
                let csvContent = "data:text/csv;charset=utf-8,NO,TROLI,QRCODE,TGL_PRODUKSI,MESIN,SHIFT,JENIS,NAMA,PANJANG,GRADE,DUS,SHADING,PO\n";
                checkedValues.forEach((qr, idx) => {
                    let t = translateBarcode(qr);
                    let dbRow = rawDataRaw.find(x => x.qrcode === qr);
                    let n = modeSekarang === 'jasper' ? t.jasper : t.namaItem;
                    csvContent += `${idx+1},${dbRow?dbRow.troli:''},${qr},${t.tglProduksi},${t.mesin},${t.shift},${t.jenisItem},${n},${t.panjang},${t.grade},${t.dus},${t.shading},${t.po}\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri); 
                link.setAttribute("download", `STBJ_${tabelSekarang}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            }
        }
    </script>
