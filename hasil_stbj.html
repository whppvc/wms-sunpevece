<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Hasil STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; will-change: transform; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* DESAIN HEADER ALA OMNIFUL (DARK NAVY) */
        .hdr-std { 
            background-color: #0f172a !important; 
            color: #ffffff !important; 
            text-align: left !important; 
            padding: 1rem 1rem !important; 
            font-size: 0.85rem !important; 
            font-weight: 500 !important; 
            text-transform: capitalize !important; 
            letter-spacing: 0.025em !important; 
            white-space: nowrap !important; 
            position: sticky !important; 
            top: 0 !important; 
            z-index: 20 !important; 
            border: none !important; 
        }
        
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }

        /* DESAIN TABEL BODY (ZEBRA & VERTICAL LINES) */
        #table-stbj-main { border-collapse: collapse; }
        #table-stbj-main td { 
            border-right: 1px solid #cbd5e1; 
            border-bottom: none !important; 
        }
        #table-stbj-main td:last-child { border-right: none; } 

        /* Zebra Striping Tegas */
        tr.text-row { background-color: #f8fafc !important; } 
        tr.text-row:nth-child(even) { background-color: #e2e8f0 !important; } 

        /* Highlight Baris Terpilih */
        tr.selected-row td { background-color: #ccfbf1 !important; color: #0f766e !important; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200">
            
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar">
                <button onclick="setMode('qrcode')" id="tab-mode-qrcode" class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="qr-code" class="w-4 h-4"></i> MODE QRCODE</button>
                <button onclick="setMode('item')" id="tab-mode-item" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="boxes" class="w-4 h-4"></i> MODE NAMA ITEM</button>
                <button onclick="setMode('jasper')" id="tab-mode-jasper" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="file-text" class="w-4 h-4"></i> MODE JASPER</button>
            </div>

            <!-- Toolbar Layout PC & Mobile -->
            <div class="p-3 sm:p-4 flex items-center bg-slate-50/50 border-t border-slate-100 w-full">
                
                <!-- KIRI: Pilih Tabel -->
                <div class="flex items-center gap-3 shrink-0">
                    <label id="lbl-pilih-tabel" class="text-[11px] font-black text-slate-500 uppercase tracking-wide">Tabel:</label>
                    <select id="select-tabel" onchange="switchTable(this.value)" class="p-2 sm:p-2.5 bg-white border border-slate-300 rounded-md font-black text-xs text-slate-800 outline-none cursor-pointer uppercase focus:border-blue-500 transition shadow-sm">
                        <option value="stok_global">STBJ MASUK</option> 
                        <option value="hold_stbj">STBJ HOLD</option>
                    </select>
                </div>

                <!-- KANAN (PC MODE): Tombol Aksi -->
                <div class="hidden sm:flex items-center gap-2 ml-auto">
                    <button onclick="bukaDaftarKatalog()" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-purple-800">
                        <div class="bg-purple-900 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="database" class="w-4 h-4"></i></div>
                        <div class="bg-purple-800 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-purple-700 transition">Katalog Jasper</div>
                    </button>
                    
                    <button onclick="aksiMassal('collect')" id="btn-massal-collect" class="hidden group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-indigo-800">
                        <div class="bg-indigo-900 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="check-square" class="w-4 h-4"></i></div>
                        <div class="bg-indigo-800 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-indigo-700 transition">Collect</div>
                    </button>

                    <!-- TOMBOL HAPUS MASSAL -->
                    <button onclick="aksiMassal('hapus')" id="btn-hapus" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-rose-700">
                        <div class="bg-rose-800 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="trash-2" class="w-4 h-4"></i></div>
                        <div class="bg-rose-700 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-rose-600 transition">Hapus</div>
                    </button>
                    
                    <button onclick="aksiMassal('hold')" id="btn-hold" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-amber-600">
                        <div class="bg-amber-700 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="pause-circle" class="w-4 h-4"></i></div>
                        <div class="bg-amber-500 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-amber-400 transition">Hold</div>
                    </button>
                    
                    <button onclick="aksiMassal('salin')" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-slate-300 bg-white hover:bg-slate-50">
                        <div class="text-slate-600 flex items-center justify-center px-3 py-2.5 border-r border-slate-300"><i data-lucide="copy" class="w-4 h-4"></i></div>
                        <div class="text-slate-700 font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide transition">Salin</div>
                    </button>

                    <button onclick="aksiMassal('xlsx')" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-slate-300 bg-white hover:bg-slate-50">
                        <div class="text-emerald-600 flex items-center justify-center px-3 py-2.5 border-r border-slate-300"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i></div>
                        <div class="text-slate-700 font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide transition">Excel</div>
                    </button>
                </div>

                <!-- KANAN (MOBILE MODE): Dropdown Menu -->
                <div class="sm:hidden relative ml-auto">
                    <button onclick="toggleActionMenu(event)" class="p-2.5 bg-white rounded-md border border-slate-300 shadow-sm active:scale-95 text-slate-600 hover:bg-slate-50 transition">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <div id="mobile-action-menu" class="hidden absolute right-0 mt-2 w-48 bg-white shadow-xl rounded-md border border-slate-200 z-50 flex flex-col overflow-hidden">
                        <button onclick="bukaDaftarKatalog(); toggleActionMenu(event)" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-purple-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="database" class="w-4 h-4"></i> Katalog Jasper</button>
                        <button onclick="aksiMassal('collect'); toggleActionMenu(event)" id="btn-massal-collect-mob" class="hidden text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-indigo-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="check-square" class="w-4 h-4"></i> Collect</button>
                        <button onclick="aksiMassal('hapus'); toggleActionMenu(event)" id="btn-hapus-mob" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-rose-600 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="trash-2" class="w-4 h-4"></i> Hapus Item</button>
                        <button onclick="aksiMassal('hold'); toggleActionMenu(event)" id="btn-hold-mob" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-amber-600 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="pause-circle" class="w-4 h-4"></i> Hold Item</button>
                        <button onclick="aksiMassal('salin'); toggleActionMenu(event)" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="copy" class="w-4 h-4 text-slate-500"></i> Salin Data</button>
                        <button onclick="aksiMassal('xlsx'); toggleActionMenu(event)" class="text-left px-4 py-3 text-xs font-bold text-slate-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i> Export Excel</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION -->
        <div class="flex-1 min-h-0 bg-slate-100 p-4 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 overflow-y-auto custom-scroll table-container bg-white rounded-t-xl shadow-sm border border-slate-300">
                <table class="w-full text-left border-collapse whitespace-nowrap" id="table-stbj-main">
                    <thead class="sticky top-0 z-10" id="thead-stbj"></thead>
                    <tbody id="tbody-stbj" class="text-slate-800"></tbody>
                </table>
            </div>
        </div>

        <!-- FOOTER PAGINATION -->
        <div class="shrink-0 w-full bg-white p-2 sm:p-3 flex flex-col md:flex-row justify-between items-center gap-4 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300">
            
            <div class="flex items-center gap-2 flex-wrap justify-center">
                <span class="bg-blue-50 border border-blue-200 px-2.5 py-1 rounded text-blue-800 text-[11px] font-bold shadow-sm">Tampil Filter: <span id="lbl-tampil-baris" class="text-blue-900 font-medium ml-1">0</span></span>
                <span class="bg-amber-50 border border-amber-200 px-2.5 py-1 rounded text-amber-800 text-[11px] font-bold shadow-sm">Total Qty (Dus): <span id="lbl-total-qty" class="text-amber-900 font-medium ml-1">0</span></span>
                <span class="bg-emerald-50 border border-emerald-300 px-2.5 py-1 rounded text-emerald-800 text-[11px] font-bold shadow-sm">Dipilih: <span id="lbl-pilih-baris" class="text-emerald-900 font-medium ml-1">0</span></span>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1 bg-white border border-slate-300 p-1 rounded shadow-sm">
                    <span class="text-[10px] font-bold text-slate-500 uppercase px-1">Baris:</span>
                    <select id="select-rows-per-page" onchange="changeRowsPerPage(this.value)" class="text-xs font-black text-blue-700 bg-blue-50 border border-blue-200 rounded outline-none cursor-pointer px-1 py-0.5 transition">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="ALL">Semua</option>
                        <option value="CUSTOM">Isi Sendiri...</option>
                    </select>
                    <input type="number" id="input-custom-rows" oninput="setCustomRowsPerPage(this.value)" class="hidden w-16 text-xs font-black text-blue-700 bg-blue-50 border border-blue-200 rounded outline-none px-1 py-0.5 text-center transition" placeholder="Jml...">
                </div>
                
                <div class="flex items-center gap-2 bg-white border border-slate-300 p-1 rounded shadow-sm">
                    <button onclick="prevPage()" class="p-1 px-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 active:scale-95 transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <span class="px-2 font-black text-xs text-slate-600 tracking-wide uppercase">Hal <span id="lbl-halaman" class="text-blue-600">1</span> / <span id="lbl-total-halaman">1</span></span>
                    <button onclick="nextPage()" class="p-1 px-2 bg-slate-100 text-slate-700 rounded hover:bg-slate-200 active:scale-95 transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL FILTER EXCEL -->
    <div id="excel-filter-menu" class="hidden absolute bg-white shadow-xl border border-slate-200 rounded-lg w-64 z-[100] flex flex-col font-sans text-sm">
        <div class="p-3 border-b border-slate-100 flex justify-between items-center rounded-t-lg">
            <span class="font-black text-slate-700 text-xs uppercase tracking-wider" id="filter-col-name">Filter</span>
            <button onclick="closeFilterMenu()" class="text-slate-400 hover:text-rose-500 bg-white p-1 rounded transition shadow-sm"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>
        <div class="p-2 border-b border-slate-200 bg-white">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
                <input type="text" id="filter-search-input" oninput="searchFilterList(this.value)" class="w-full pl-8 p-1.5 text-xs font-bold border border-slate-300 bg-slate-50 rounded focus:border-blue-500 focus:bg-white outline-none transition" placeholder="Cari Spesifik...">
            </div>
        </div>
        <div class="p-2 max-h-48 overflow-y-auto flex flex-col gap-1 text-xs bg-white" id="filter-values-list"></div>
        <div class="p-2 border-t border-slate-200 bg-slate-50 flex justify-between gap-2 rounded-b-lg">
            <button onclick="clearFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded hover:bg-slate-100 transition shadow-sm">Reset</button>
            <button onclick="applyFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-white bg-blue-600 rounded hover:bg-blue-700 transition shadow-sm">Terapkan</button>
        </div>
    </div>

    <!-- MODAL KATALOG -->
    <div id="modal-list-katalog" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="database" class="w-4 h-4 text-purple-600"></i> KATALOG JASPER</h3>
                <div class="flex gap-2">
                    <button onclick="bukaModalKatalogForm()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-md text-xs transition flex items-center gap-1 shadow-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i> TAMBAH</button>
                    <button onclick="document.getElementById('modal-list-katalog').classList.add('hidden')" class="px-3 py-1.5 bg-white border border-slate-300 hover:bg-red-500 hover:text-white hover:border-red-500 text-slate-600 font-bold rounded-md text-xs transition shadow-sm"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                </div>
            </div>
            <div class="p-3 border-b border-slate-100 bg-white relative z-30">
                <input type="text" id="f-kat-search" oninput="saringKatalogList()" class="w-full p-2.5 text-sm border border-slate-300 rounded-md outline-none focus:border-blue-500 font-bold shadow-inner" placeholder="Pencarian Cepat (Nama Item / Hasil Jasper)...">
            </div>
            <div class="overflow-y-auto px-4 pb-4 pt-0 flex-1 hide-scrollbar table-container">
                <table class="w-full text-left border-separate border-spacing-0 text-sm whitespace-nowrap mt-3" id="table-katalog">
                    <thead class="sticky top-0 z-20 shadow-sm">
                        <tr>
                            <th class="hdr-std w-10">EDIT</th>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std">Nama Item</th>
                            <th class="hdr-std">Panjang</th>
                            <th class="hdr-std border-r border-slate-500">Grade</th>
                            <th class="hdr-std bg-slate-900 text-blue-300">NAMA JASPER</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-katalog-list" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL FORM JASPER -->
    <div id="modal-katalog" class="hidden fixed inset-0 flex items-center justify-center z-[90] bg-slate-900/60 px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 id="title-modal-jasper" class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm">
                    <i data-lucide="edit" class="w-4 h-4 text-blue-600"></i> FORM JASPER
                </h3>
                <button onclick="tutupModalJasperForm()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-md transition shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-5 flex flex-col gap-4">
                <input type="hidden" id="j-id"> 
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label>
                    <input type="text" id="j-nama" class="w-full p-2.5 text-sm border border-slate-300 rounded-md focus:border-blue-500 outline-none font-bold shadow-inner" placeholder="Contoh: PLAFON 103 SILVER">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label>
                        <input type="text" id="j-pjg" class="w-full p-2.5 text-sm border border-slate-300 rounded-md focus:border-blue-500 outline-none font-bold shadow-inner" placeholder="Contoh: 4M / 5M">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label>
                        <input type="text" id="j-grade" class="w-full p-2.5 text-sm border border-slate-300 rounded-md focus:border-blue-500 outline-none font-bold shadow-inner" placeholder="Contoh: A / BAGUS">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-blue-600 mb-1">Nama Jasper</label>
                    <input type="text" id="j-output" class="w-full p-2.5 text-sm border-2 border-blue-300 rounded-md focus:border-blue-600 outline-none font-black text-blue-800 bg-blue-50 shadow-inner" placeholder="Ketik nama spesifik Jasper...">
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-2 bg-slate-50">
                <button onclick="tutupModalJasperForm()" class="px-4 py-2 font-bold text-slate-500 hover:text-slate-700 transition text-sm">BATAL</button>
                <button onclick="simpanDataJasper()" id="btn-save-jasper" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-md shadow-sm text-sm transition flex items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> SIMPAN</button>
            </div>
        </div>
    </div>

    <script src="hasil_stbj_logic.js"></script>
</body>
</html>
