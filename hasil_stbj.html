<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Hasil STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        
        /* Scrollbar Minimalis Modern */
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .table-container { position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Header Tabel Modern (Bersih, tanpa border vertikal) */
        .hdr-std { 
            background-color: #f8fafc !important; 
            color: #64748b !important; 
            text-align: left !important; 
            padding: 0.75rem 1rem !important; 
            font-size: 0.75rem !important; 
            font-weight: 600 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.05em !important; 
            white-space: nowrap !important; 
            position: sticky !important; 
            top: 0 !important; 
            z-index: 20 !important; 
            border-bottom: 1px solid #e2e8f0 !important; 
        }
        
        /* Highlight Row Terpilih Lembut */
        tr.selected-row { background-color: #f0f9ff !important; }
        
        /* Tab Modern */
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; border-bottom: 2px solid transparent; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200">
            
            <!-- Tabs -->
            <div class="flex px-6 pt-2 gap-6 overflow-x-auto hide-scrollbar">
                <button onclick="setMode('qrcode')" id="tab-mode-qrcode" class="pb-3 tab-active transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="qr-code" class="w-4 h-4"></i> Mode QRCode</button>
                <button onclick="setMode('item')" id="tab-mode-item" class="pb-3 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="boxes" class="w-4 h-4"></i> Mode Nama Item</button>
                <button onclick="setMode('jasper')" id="tab-mode-jasper" class="pb-3 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="file-text" class="w-4 h-4"></i> Mode Jasper</button>
            </div>

            <!-- Toolbar -->
            <div class="p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-50/50 border-t border-slate-100">
                <div class="flex items-center gap-3 shrink-0">
                    <label class="text-xs font-semibold text-slate-500">Tabel Data:</label>
                    <select id="select-tabel" onchange="switchTable(this.value)" class="py-1.5 px-3 bg-white border border-slate-300 rounded-md font-medium text-sm text-slate-700 outline-none cursor-pointer focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition shadow-sm">
                        <option value="stok_global">STBJ Masuk</option> 
                        <option value="hold_stbj">STBJ Hold</option>
                    </select>
                </div>

                <div class="flex gap-2 items-center overflow-x-auto hide-scrollbar whitespace-nowrap w-full sm:w-auto">
                    <button onclick="bukaDaftarKatalog()" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="database" class="w-4 h-4 text-purple-600"></i> Katalog Jasper
                    </button>
                    <button onclick="aksiMassal('collect')" id="btn-massal-collect" class="hidden flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="check-square" class="w-4 h-4 text-indigo-600"></i> Collect
                    </button>
                    <button onclick="aksiMassal('hold')" id="btn-hold" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="pause-circle" class="w-4 h-4 text-amber-600"></i> Hold
                    </button>
                    <div class="w-px h-5 bg-slate-300 mx-1 shrink-0"></div>
                    <button onclick="aksiMassal('xlsx')" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i> Excel
                    </button>
                    <button onclick="aksiMassal('salin')" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="copy" class="w-4 h-4 text-slate-600"></i> Salin
                    </button>
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION -->
        <div class="flex-1 min-h-0 bg-white overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 overflow-y-auto custom-scroll table-container">
                <table class="w-full text-left border-collapse whitespace-nowrap" id="table-stbj-main">
                    <thead class="sticky top-0 z-10" id="thead-stbj"></thead>
                    <tbody id="tbody-stbj" class="text-slate-700"></tbody>
                </table>
            </div>
        </div>

        <!-- FOOTER PAGINATION -->
        <div class="shrink-0 w-full bg-white p-3 flex flex-col md:flex-row justify-between items-center gap-4 z-20 border-t border-slate-200">
            <div class="flex items-center gap-4 text-sm text-slate-500">
                <span>Total: <strong class="text-slate-800" id="lbl-tampil-baris">0</strong> baris</span>
                <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                <span>Qty: <strong class="text-slate-800" id="lbl-total-qty">0</strong> dus</span>
                <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                <span>Dipilih: <strong class="text-blue-600" id="lbl-pilih-baris">0</strong></span>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-500">Baris per halaman:</span>
                    <select id="select-rows-per-page" onchange="changeRowsPerPage(this.value)" class="text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md outline-none cursor-pointer px-2 py-1 focus:border-blue-500 transition">
                        <option value="8">8</option>
                        <option value="15">15</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="ALL">Semua</option>
                        <option value="CUSTOM">Custom...</option>
                    </select>
                    <input type="number" id="input-custom-rows" oninput="setCustomRowsPerPage(this.value)" class="hidden w-16 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md outline-none px-2 py-1 text-center focus:border-blue-500 transition" placeholder="Jml">
                </div>
                
                <div class="flex items-center gap-1">
                    <button onclick="prevPage()" class="p-1.5 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-md transition disabled:opacity-50"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <span class="text-sm font-medium text-slate-700 px-2">Hal <span id="lbl-halaman">1</span> dari <span id="lbl-total-halaman">1</span></span>
                    <button onclick="nextPage()" class="p-1.5 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-md transition disabled:opacity-50"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL FILTER EXCEL -->
    <div id="excel-filter-menu" class="hidden absolute bg-white shadow-xl border border-slate-200 rounded-lg w-64 z-[100] flex flex-col font-sans text-sm">
        <div class="p-3 border-b border-slate-100 flex justify-between items-center">
            <span class="font-semibold text-slate-700 text-xs uppercase tracking-wider" id="filter-col-name">Filter</span>
            <button onclick="closeFilterMenu()" class="text-slate-400 hover:text-slate-700 transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-2 border-b border-slate-100">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
                <input type="text" id="filter-search-input" oninput="searchFilterList(this.value)" class="w-full pl-8 p-1.5 text-sm border border-slate-200 rounded-md focus:border-blue-500 outline-none transition" placeholder="Cari...">
            </div>
        </div>
        <div class="p-2 max-h-48 overflow-y-auto flex flex-col gap-1 text-sm custom-scroll" id="filter-values-list"></div>
        <div class="p-2 border-t border-slate-100 flex justify-between gap-2 bg-slate-50 rounded-b-lg">
            <button onclick="clearFilterForCurrentCol()" class="w-1/2 py-1.5 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition">Reset</button>
            <button onclick="applyFilterForCurrentCol()" class="w-1/2 py-1.5 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition">Terapkan</button>
        </div>
    </div>

    <!-- MODAL KATALOG -->
    <div id="modal-list-katalog" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/40 z-[60] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-semibold text-slate-800 flex items-center gap-2 text-base"><i data-lucide="database" class="w-5 h-5 text-purple-600"></i> Katalog Jasper</h3>
                <div class="flex gap-2">
                    <button onclick="bukaModalKatalogForm()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md text-sm transition flex items-center gap-1"><i data-lucide="plus" class="w-4 h-4"></i> Tambah</button>
                    <button onclick="document.getElementById('modal-list-katalog').classList.add('hidden')" class="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-md transition"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
            </div>
            <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                <input type="text" id="f-kat-search" oninput="saringKatalogList()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500 transition" placeholder="Cari Nama Item atau Jasper...">
            </div>
            <div class="overflow-y-auto flex-1 custom-scroll">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-katalog">
                    <thead class="sticky top-0 z-10">
                        <tr>
                            <th class="hdr-std w-10 text-center">Aksi</th>
                            <th class="hdr-std w-12 text-center">No</th>
                            <th class="hdr-std">Nama Item</th>
                            <th class="hdr-std">Panjang</th>
                            <th class="hdr-std">Grade</th>
                            <th class="hdr-std text-blue-600">Nama Jasper</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-katalog-list" class="text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-katalog" class="hidden fixed inset-0 flex items-center justify-center z-[90] bg-slate-900/40 px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 id="title-modal-jasper" class="font-semibold text-slate-800 flex items-center gap-2 text-base">
                    <i data-lucide="edit" class="w-5 h-5 text-blue-600"></i> Form Jasper
                </h3>
                <button onclick="tutupModalJasperForm()" class="text-slate-400 hover:text-slate-700 hover:bg-slate-100 p-1.5 rounded-md transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-5 flex flex-col gap-4">
                <input type="hidden" id="j-id"> 
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Item Master</label>
                    <input type="text" id="j-nama" class="w-full p-2 text-sm border border-slate-200 rounded-md focus:border-blue-500 outline-none transition" placeholder="Contoh: PLAFON 103 SILVER">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Panjang</label>
                        <input type="text" id="j-pjg" class="w-full p-2 text-sm border border-slate-200 rounded-md focus:border-blue-500 outline-none transition" placeholder="Contoh: 4M">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Grade</label>
                        <input type="text" id="j-grade" class="w-full p-2 text-sm border border-slate-200 rounded-md focus:border-blue-500 outline-none transition" placeholder="Contoh: BAGUS">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-blue-600 mb-1">Output Nama Jasper</label>
                    <input type="text" id="j-output" class="w-full p-2 text-sm border border-blue-300 rounded-md focus:border-blue-600 outline-none bg-blue-50 transition" placeholder="Ketik nama spesifik Jasper...">
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-2 bg-slate-50">
                <button onclick="tutupModalJasperForm()" class="px-4 py-2 font-medium text-slate-600 hover:bg-slate-200 rounded-md transition text-sm">Batal</button>
                <button onclick="simpanDataJasper()" id="btn-save-jasper" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-md shadow-sm text-sm transition flex items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Simpan</button>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script src="hasil_stbj_logic.js"></script>
</body>
</html>
