<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Hasil STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans">
    <div class="w-full">
        <div class="bg-white p-5 rounded-xl shadow-sm mb-4 border border-slate-200">
            <input type="text" id="flt-qr" oninput="saringTabel()" class="w-full p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="Pencarian QR Code...">
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="overflow-x-auto w-full max-h-[70vh] hide-scrollbar">
                <table class="w-full border-collapse text-sm whitespace-nowrap">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std">Tgl Masuk STBJ</th>
                            <th class="hdr-std border-r border-slate-500">QRCode</th>
                            <th class="hdr-std">User / PIC</th>
                        </tr>
                    </thead>
                    <tbody id="data-body" class="text-center text-slate-700"><tr><td colspan="4" class="p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-3 text-slate-500"></i><p class="font-bold text-slate-500">Memuat Data...</p></td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initModernLayout({ id: 'hasil_stbj', title: 'HASIL STBJ', url: 'hasil_stbj.html' });
            // setTimeout(() => loadData(), 200);
        });
        // Logika loadData untuk hasil STBJ di sini.
    </script>
</body>
</html>
