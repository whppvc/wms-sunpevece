<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Hasil STBJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; border: 1px solid #334155; padding: 0.75rem; text-transform: uppercase; font-size: 11px; font-weight: 900; white-space: nowrap; }
    </style>
</head>
<body class="font-sans">
    <div class="w-full">
        
        <div class="flex border-b border-slate-200 mb-4 bg-white px-2 rounded-t-xl shadow-sm overflow-x-auto hide-scrollbar">
            <button onclick="setMode('qrcode')" id="tab-mode-qrcode" class="px-5 py-3.5 border-b-4 border-blue-800 text-blue-800 font-black text-xs whitespace-nowrap flex items-center gap-2 transition"><i data-lucide="qr-code"></i> MODE QRCODE</button>
            <button onclick="setMode('item')" id="tab-mode-item" class="px-5 py-3.5 border-b-4 border-transparent text-slate-500 font-bold text-xs whitespace-nowrap flex items-center gap-2 hover:text-slate-800 transition"><i data-lucide="boxes"></i> MODE NAMA ITEM & QTY</button>
            <button onclick="setMode('jasper')" id="tab-mode-jasper" class="px-5 py-3.5 border-b-4 border-transparent text-slate-500 font-bold text-xs whitespace-nowrap flex items-center gap-2 hover:text-slate-800 transition"><i data-lucide="file-text"></i> MODE NAMA JASPER & QTY</button>
            <button onclick="setMode('katalog')" id="tab-mode-katalog" class="px-5 py-3.5 border-b-4 border-transparent text-slate-500 font-bold text-xs whitespace-nowrap flex items-center gap-2 hover:text-slate-800 transition ml-auto border-l border-slate-200"><i data-lucide="database"></i> KATALOG ITEM</button>
        </div>

        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-3" id="panel-atas">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <label id="lbl-pilih-tabel" class="text-xs font-black text-slate-600 uppercase">Tampilkan Data:</label>
                    <select id="select-tabel" onchange="switchTable(this.value)" class="p-2 border-2 border-slate-200 rounded-lg font-bold text-xs text-slate-800 outline-none focus:border-slate-800 bg-slate-50 cursor-pointer">
                        <option value="hasil_stbj">TABEL HASIL STBJ (UNIQUE)</option>
                        <option value="hold_stbj">TABEL HOLD STBJ (DUPLIKAT/HOLD)</option>
                    </select>
                </div>
                <div class="flex gap-2 w-full sm:w-auto justify-end">
                    <button onclick="togglePanel('panel-filter')" id="btn-toggle-filter" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded flex items-center gap-1 transition"><i data-lucide="filter" class="w-3.5 h-3.5"></i> FILTER</button>
                    <button onclick="togglePanel('panel-kolom')" id="btn-toggle-kolom" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded flex items-center gap-1 transition"><i data-lucide="eye" class="w-3.5 h-3.5"></i> KOLOM</button>
                </div>
            </div>

            <div id="panel-filter" class="hidden grid grid-cols-1 md:grid-cols-4 lg:grid-cols-5 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200">
                <input type="text" id="flt-qr" oninput="jalankanSaring()" class="p-2 text-xs border border-slate-300 font-bold rounded outline-none dynamic-filter" placeholder="Cari QRCode...">
                <input type="text" id="flt-jenis" oninput="jalankanSaring()" class="p-2 text-xs border border-slate-300 font-bold rounded outline-none dynamic-filter" placeholder="Jenis Item...">
                <input type="text" id="flt-nama" oninput="jalankanSaring()" class="p-2 text-xs border border-slate-300 font-bold rounded outline-none" placeholder="Nama Item / Jasper...">
                <input type="text" id="flt-po" oninput="jalankanSaring()" class="p-2 text-xs border border-slate-300 font-bold rounded outline-none dynamic-filter" placeholder="PO...">
                <button onclick="bersihkanFilter()" class="p-2 bg-slate-200 text-slate-700 font-bold text-xs rounded hover:bg-slate-300 transition">Reset Filter</button>
            </div>

            <div id="panel-kolom" class="hidden flex flex-wrap gap-4 bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs font-bold text-slate-600">
                <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked onchange="toggleKolomRaw('c-waktu', this.checked)"> Waktu</label>
                <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked onchange="toggleKolomRaw('c-prod', this.checked)"> Produksi (Mesin/Shift/Tgl)</label>
                <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked onchange="toggleKolomRaw('c-pic', this.checked)"> PIC Input</label>
                <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" checked onchange="toggleKolomRaw('c-ket', this.checked)"> Keterangan</label>
            </div>

            <div class="flex flex-wrap items-center gap-2 pt-2">
                <button onclick="aksiMassal('salin')" id="btn-massal-salin" class="flex-1 sm:flex-none px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm"><i data-lucide="copy" class="w-4 h-4"></i> SALIN CEL</button>
                <button onclick="aksiMassal('hapus')" id="btn-massal-hapus" class="flex-1 sm:flex-none px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm"><i data-lucide="trash-2" class="w-4 h-4"></i> HAPUS</button>
                <button onclick="aksiMassal('hold')" id="btn-massal-hold" class="flex-1 sm:flex-none px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm"><i data-lucide="pause-circle" class="w-4 h-4"></i> PINDAHKAN (HOLD/UNHOLD)</button>
                <button onclick="aksiMassal('xlsx')" id="btn-massal-xls" class="flex-1 sm:flex-none px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm"><i data-lucide="download" class="w-4 h-4"></i> DOWNLOAD XLS</button>
                
                <button onclick="bukaModalKatalog()" id="btn-tambah-katalog" class="hidden flex-1 sm:flex-none px-5 py-2 bg-blue-700 hover:bg-blue-800 text-white font-black text-xs rounded-lg flex items-center justify-center gap-1.5 active:scale-95 transition shadow-md border-b-4 border-blue-900 ml-auto"><i data-lucide="plus-circle" class="w-4 h-4"></i> TAMBAH KATALOG</button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative mb-10">
            <div class="overflow-x-auto w-full max-h-[60vh] hide-scrollbar">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-stbj-main">
                    <thead class="sticky top-0 z-10 shadow-sm" id="thead-stbj"></thead>
                    <tbody id="tbody-stbj" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-katalog" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[90] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md border border-slate-200">
            <h3 class="text-xl font-black mb-6 flex items-center gap-2 text-slate-800"><i data-lucide="database" class="text-blue-600"></i> Form Katalog Jasper</h3>
            <input type="hidden" id="kat-id">
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-[11px] font-black uppercase tracking-wide mb-1 text-slate-500">Nama Item Master (Acuan Barcode)</label>
                    <input type="text" id="kat-nama" class="w-full p-3 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-600 font-bold uppercase text-slate-800" placeholder="Cth: BATA RINGAN">
                </div>
                <div class="flex gap-3">
                    <div class="w-1/2">
                        <label class="block text-[11px] font-black uppercase tracking-wide mb-1 text-slate-500">Panjang</label>
                        <input type="text" id="kat-pjg" class="w-full p-3 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-600 font-bold uppercase text-slate-800 text-center" placeholder="Cth: 4M">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-[11px] font-black uppercase tracking-wide mb-1 text-slate-500">Grade</label>
                        <input type="text" id="kat-grade" class="w-full p-3 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-600 font-bold uppercase text-slate-800 text-center" placeholder="Cth: BAGUS">
                    </div>
                </div>
                <div class="pt-3 border-t border-slate-100">
                    <label class="block text-xs font-black uppercase tracking-wide mb-1 text-blue-700">Hasil / Nama Output Jasper</label>
                    <input type="text" id="kat-jasper" class="w-full p-3 border-2 border-blue-200 bg-blue-50 rounded-lg outline-none focus:border-blue-700 font-black uppercase text-blue-900" placeholder="Ketik nama output Jasper di sini...">
                </div>
            </div>

            <div class="flex gap-2">
                <button type="button" onclick="document.getElementById('modal-katalog').classList.add('hidden')" class="w-1/3 py-3 bg-slate-200 text-slate-700 font-bold rounded-xl hover:bg-slate-300 transition cursor-pointer">Batal</button>
                <button type="button" onclick="simpanKatalog()" id="btn-simpan-kat" class="w-2/3 py-3 bg-blue-700 text-white font-black rounded-xl hover:bg-blue-800 shadow-md flex justify-center items-center gap-2 transition active:scale-95 border-b-4 border-blue-900 cursor-pointer"><i data-lucide="save" class="w-4 h-4"></i> SIMPAN</button>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        let modeSekarang = 'qrcode'; // qrcode, item, jasper, katalog
        let tabelSekarang = 'hasil_stbj'; 
        let rawDataRaw = [];
        let kamusData = [];
        let jasperData = [];
        const currentUser = JSON.parse(localStorage.getItem('user_session')) || {username: 'Admin'};

        document.addEventListener('DOMContentLoaded', () => {
            initModernLayout({ id: 'hasil_stbj', title: 'HASIL STBJ', url: 'hasil_stbj.html' });
            setTimeout(async () => {
                await loadKamusDanJasper();
                await muatDataDariSupabase();
            }, 200);
        });

        function togglePanel(id) { document.getElementById(id).classList.toggle('hidden'); }

        async function loadKamusDanJasper() {
            const { data: d2 } = await db.from('master_2').select('*'); if(d2) kamusData = d2;
            try {
                const { data: dj } = await db.from('nama_jasper').select('*').order('created_at', {ascending: false});
                if(dj) jasperData = dj;
            } catch(e) { console.log("Tabel nama_jasper belum siap."); }
        }

        async function muatDataDariSupabase() {
            if(modeSekarang === 'katalog') { renderHeaderDanTabel(); return; } 
            const tbody = document.getElementById('tbody-stbj');
            tbody.innerHTML = `<tr><td colspan="20" class="p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-2 text-slate-500"></i><p class="font-bold text-slate-500">Menarik Data ${tabelSekarang}...</p></td></tr>`;
            lucide.createIcons();
            try {
                const { data, error } = await db.from(tabelSekarang).select('*').order('created_at', {ascending: false});
                if(error) throw error;
                rawDataRaw = data || [];
                renderHeaderDanTabel();
            } catch(err) { tbody.innerHTML = `<tr><td colspan="20" class="p-10 text-red-500 font-bold">Gagal memuat: ${err.message}</td></tr>`; }
        }

        // PERBAIKAN LOGIKA TRANSLATE AGAR TGL/MESIN/SHIFT TERBACA KEMBALI
        function translateBarcode(barcode) {
            let td = { tglProduksi: '-', mesin: '-', shift: '-', jenisItem: '-', namaItem: '-', panjang: '-', grade: '-', dus: '-', shading: '-', po: '-', jasper: '-' };
            const parts = barcode.split('/'); if (parts.length < 1) return td;
            
            const hurufDepan = barcode.charAt(0).toUpperCase();
            if (hurufDepan === 'P') td.jenisItem = 'Plafon'; else if (hurufDepan === 'L') td.jenisItem = 'List'; else if (hurufDepan === 'W') td.jenisItem = 'WPC'; else td.jenisItem = hurufDepan;

            let rawItem = parts[0]; let cariItem = kamusData.find(m => m.kode_nama_item === rawItem); 
            td.namaItem = cariItem && cariItem.nama_item ? cariItem.nama_item : rawItem; td.shading = parts[1] || '-';
            
            const p2 = parts[2];
            if (p2 && p2.length >= 4) {
                let dP = (p2.length === 5) ? 2 : 1; let rP = p2.substring(0, dP); td.panjang = (dP === 1) ? rP + "M" : rP[0] + "." + rP[1] + "M"; 
                let rG = p2.substring(dP, dP + 1); td.grade = rG === '1' ? 'BAGUS' : (rG === '2' ? 'A' : rG);
                let rD = p2.substring(p2.length - 2); let cD = kamusData.find(m => m.kode_dus === rD); td.dus = cD && cD.dus ? cD.dus : rD;
            }
            const p3 = parts[3];
            if (p3 && p3.length >= 5) {
                const dayOfYear = parseInt(p3.substring(0, 3)); const realYear = parseInt('20' + p3.substring(3, 5).split('').reverse().join(''));
                if (!isNaN(dayOfYear) && !isNaN(realYear)) {
                    const dateObj = new Date(realYear, 0); dateObj.setDate(dayOfYear);
                    td.tglProduksi = `${String(dateObj.getDate()).padStart(2,'0')}/${String(dateObj.getMonth()+1).padStart(2,'0')}/${dateObj.getFullYear()}`;
                }
                let s = p3.substring(5); let m = s.match(/(C.*?)(S.*?)(P.*)/);
                if (m) {
                    let cM = kamusData.find(x => x.kode_mesin === m[1]); td.mesin = cM && cM.mesin ? cM.mesin : m[1];
                    let cS = kamusData.find(x => x.kode_shift === m[2]); td.shift = cS && cS.shift ? cS.shift : m[2];
                    let cPO = kamusData.find(x => x.kode_po === m[3]); td.po = cPO && cPO.po ? cPO.po : m[3];
                }
            }

            if(jasperData.length > 0) {
                const cJasper = jasperData.find(j => 
                    j.nama_item === td.namaItem && j.panjang === td.panjang && j.grade === td.grade
                );
                td.jasper = cJasper ? cJasper.nama_jasper : `JAS-${td.namaItem}`;
            } else { td.jasper = `JAS-${td.namaItem}`; }

            return td;
        }

        function setMode(m) {
            modeSekarang = m;
            ['qrcode', 'item', 'jasper', 'katalog'].forEach(tab => {
                const el = document.getElementById('tab-mode-' + tab);
                if(m === tab) el.className = 'px-5 py-3.5 border-b-4 border-blue-800 text-blue-800 font-black text-xs whitespace-nowrap flex items-center gap-2 transition';
                else el.className = 'px-5 py-3.5 border-b-4 border-transparent text-slate-500 font-bold text-xs whitespace-nowrap flex items-center gap-2 hover:text-slate-800 transition';
            });
            
            const isKatalog = m === 'katalog';
            const isQr = m === 'qrcode';

            document.getElementById('lbl-pilih-tabel').style.display = isQr ? '' : 'none';
            document.getElementById('select-tabel').style.display = isQr ? '' : 'none';
            document.getElementById('btn-toggle-kolom').style.display = isQr ? '' : 'none';
            document.getElementById('panel-kolom').classList.add('hidden');
            
            document.getElementById('btn-massal-salin').style.display = isKatalog ? 'none' : '';
            document.getElementById('btn-massal-hapus').style.display = isKatalog ? 'none' : '';
            document.getElementById('btn-massal-xls').style.display = isKatalog ? 'none' : '';
            document.getElementById('btn-massal-hold').style.display = isQr ? '' : 'none';

            document.getElementById('btn-tambah-katalog').style.display = isKatalog ? '' : 'none';
            
            // PERBAIKAN FILTER UNTUK KATALOG ITEM
            document.querySelectorAll('.dynamic-filter').forEach(el => el.style.display = isKatalog ? 'none' : '');
            document.getElementById('flt-nama').placeholder = isKatalog ? "Cari Nama Item / Nama Jasper..." : "Nama Item / Jasper...";
            
            if(isKatalog) renderHeaderDanTabel(); else muatDataDariSupabase();
        }

        function switchTable(val) { tabelSekarang = val; muatDataDariSupabase(); }

        function bukaModalKatalog(jsonStr) {
            if(jsonStr) {
                const d = JSON.parse(jsonStr);
                document.getElementById('kat-id').value = d.id;
                document.getElementById('kat-nama').value = d.nama_item || '';
                document.getElementById('kat-pjg').value = d.panjang || '';
                document.getElementById('kat-grade').value = d.grade || '';
                document.getElementById('kat-jasper').value = d.nama_jasper || '';
            } else {
                document.getElementById('kat-id').value = ''; document.getElementById('kat-nama').value = '';
                document.getElementById('kat-pjg').value = ''; document.getElementById('kat-grade').value = '';
                document.getElementById('kat-jasper').value = '';
            }
            document.getElementById('modal-katalog').classList.remove('hidden');
        }

        // PERBAIKAN SIMPAN KATALOG (HAPUS PAYLOAD PIC AGAR TIDAK ERROR DATABASE)
        async function simpanKatalog() {
            const id = document.getElementById('kat-id').value;
            const nama = document.getElementById('kat-nama').value.trim().toUpperCase();
            const pjg = document.getElementById('kat-pjg').value.trim().toUpperCase();
            const grade = document.getElementById('kat-grade').value.trim().toUpperCase();
            const jasper = document.getElementById('kat-jasper').value.trim().toUpperCase();
            
            if(!nama || !pjg || !grade || !jasper) return alert("Pastikan semua kolom diisi!");
            
            const btn = document.getElementById('btn-simpan-kat'); btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i> MENYIMPAN...';
            // INFO: Kolom 'pic' sengaja tidak dikirimkan ke Supabase karena belum dibuat di tabel Anda
            const payload = { nama_item: nama, panjang: pjg, grade: grade, nama_jasper: jasper };
            
            let res;
            if(id) res = await db.from('nama_jasper').update(payload).eq('id', id);
            else res = await db.from('nama_jasper').insert(payload);
            
            if(res.error) alert("Gagal: " + res.error.message);
            else { alert("Katalog berhasil disimpan!"); document.getElementById('modal-katalog').classList.add('hidden'); await loadKamusDanJasper(); renderHeaderDanTabel(); }
            
            btn.disabled=false; btn.innerHTML='<i data-lucide="save" class="w-4 h-4"></i> SIMPAN'; lucide.createIcons();
        }

        async function hapusKatalog(id) {
            if(!confirm("Yakin ingin menghapus item katalog ini?")) return;
            const {error} = await db.from('nama_jasper').delete().eq('id', id);
            if(error) alert("Gagal Hapus: " + error.message); else { await loadKamusDanJasper(); renderHeaderDanTabel(); }
        }

        function renderHeaderDanTabel() {
            const thead = document.getElementById('thead-stbj');
            const tbody = document.getElementById('tbody-stbj');

            // MODE KATALOG JASPER
            if(modeSekarang === 'katalog') {
                thead.innerHTML = `
                    <tr>
                        <th class="hdr-std w-12">No</th>
                        <th class="hdr-std">Nama Item Master</th>
                        <th class="hdr-std">Panjang</th>
                        <th class="hdr-std border-r border-slate-500">Grade</th>
                        <th class="hdr-std bg-slate-900 text-blue-300">NAMA OUTPUT JASPER</th>
                        <th class="hdr-std w-20">Aksi</th>
                    </tr>`;
                
                if(jasperData.length === 0) { tbody.innerHTML = '<tr><td colspan="6" class="p-6 font-bold text-slate-400">Katalog Jasper belum ada / Kosong.</td></tr>'; return; }
                
                let h = '';
                jasperData.forEach((r, i) => {
                    const safeR = JSON.stringify(r).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
                    h += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50 transition text-row text-center katalog-row">
                            <td class="p-3 font-bold text-slate-400">${i+1}</td>
                            <td class="p-3 font-bold text-slate-800 text-left s-nama">${r.nama_item || '-'}</td>
                            <td class="p-3 font-bold text-slate-600">${r.panjang || '-'}</td>
                            <td class="p-3 font-bold text-slate-800 border-r border-slate-200">${r.grade || '-'}</td>
                            <td class="p-3 font-black text-blue-700 bg-blue-50/50 text-left s-jasper">${r.nama_jasper || '-'}</td>
                            <td class="p-2">
                                <div class="flex gap-1 justify-center">
                                    <button onclick="bukaModalKatalog('${safeR}')" class="p-2 bg-blue-100 text-blue-700 hover:bg-blue-200 rounded cursor-pointer transition"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                    <button onclick="hapusKatalog('${r.id}')" class="p-2 bg-red-100 text-red-700 hover:bg-red-200 rounded cursor-pointer transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </td>
                        </tr>`;
                });
                tbody.innerHTML = h; lucide.createIcons(); jalankanSaring(); return;
            }

            // MODE QRCODE
            if(modeSekarang === 'qrcode') {
                thead.innerHTML = `
                    <tr>
                        <th class="hdr-std w-10"><input type="checkbox" id="master-cb" onchange="toggleSemuaCentang(this.checked)" class="cursor-pointer"></th>
                        <th class="hdr-std w-12">No</th>
                        <th class="hdr-std c-waktu">Waktu Scan</th>
                        <th class="hdr-std border-r border-slate-500">QRCode</th>
                        <th class="hdr-std c-prod">Tgl Produksi</th>
                        <th class="hdr-std c-prod">Mesin</th>
                        <th class="hdr-std c-prod border-r border-slate-500">Shift</th>
                        <th class="hdr-std text-blue-300">Jenis Item</th>
                        <th class="hdr-std">Nama Item</th>
                        <th class="hdr-std">Pjg</th>
                        <th class="hdr-std">Grade</th>
                        <th class="hdr-std">Dus</th>
                        <th class="hdr-std border-r border-slate-500">Shading</th>
                        <th class="hdr-std">PO Awal</th>
                        <th class="hdr-std c-pic border-l border-slate-500">PIC Input</th>
                        <th class="hdr-std c-ket">Keterangan</th>
                        ${tabelSekarang === 'hold_stbj' ? '<th class="hdr-std text-amber-400">Status Hold</th>' : ''}
                    </tr>`;
                
                if(rawDataRaw.length === 0) { tbody.innerHTML = '<tr><td colspan="17" class="p-6 font-bold text-slate-400">Tabel Kosong.</td></tr>'; return; }
                
                let h = '';
                rawDataRaw.forEach((r, i) => {
                    const tgl = new Date(r.created_at).toLocaleString('id-ID', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
                    const td = translateBarcode(r.qrcode);
                    h += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50 text-row">
                            <td class="p-3 text-center"><input type="checkbox" value="${r.qrcode}" class="row-cb cursor-pointer"></td>
                            <td class="p-3 font-bold text-slate-400 text-center">${i+1}</td>
                            <td class="p-3 text-slate-600 c-waktu text-center">${tgl}</td>
                            <td class="p-3 font-mono font-bold text-slate-900 text-left s-qr bg-slate-50 tracking-wider border-r border-slate-200">${r.qrcode}</td>
                            <td class="p-3 font-bold text-slate-600 c-prod text-center">${td.tglProduksi}</td>
                            <td class="p-3 font-bold text-slate-600 c-prod text-center">${td.mesin}</td>
                            <td class="p-3 font-bold text-slate-600 c-prod text-center border-r border-slate-200">${td.shift}</td>
                            <td class="p-3 font-black text-blue-700 s-jenis text-center">${td.jenisItem}</td>
                            <td class="p-3 font-bold text-slate-800 text-left s-nama">${td.namaItem}</td>
                            <td class="p-3 font-bold text-slate-600 text-center">${td.panjang}</td>
                            <td class="p-3 font-bold text-slate-800 text-center">${td.grade}</td>
                            <td class="p-3 font-bold text-slate-800 text-center">${td.dus}</td>
                            <td class="p-3 font-bold text-slate-600 text-center border-r border-slate-200">${td.shading}</td>
                            <td class="p-3 font-black text-orange-600 bg-orange-50/50 s-po text-center">${td.po}</td>
                            <td class="p-3 font-bold uppercase text-[11px] text-slate-500 c-pic text-center border-l border-slate-200">${r.pic_input || '-'}</td>
                            <td class="p-3 text-slate-600 text-left c-ket">${r.keterangan || '-'}</td>
                            ${tabelSekarang === 'hold_stbj' ? `<td class="p-3 font-black text-[10px] text-amber-600 bg-amber-50 text-center">${r.status || 'HOLD'}</td>` : ''}
                        </tr>`;
                });
                tbody.innerHTML = h;
            } 
            // PERBAIKAN: MODE ITEM - MENAMPILKAN SEMUA KOLOM FISIK LENGKAP + QTY
            else if(modeSekarang === 'item') {
                thead.innerHTML = `
                    <tr>
                        <th class="hdr-std w-10"><input type="checkbox" id="master-cb" onchange="toggleSemuaCentang(this.checked)" class="cursor-pointer"></th>
                        <th class="hdr-std w-12">No</th>
                        <th class="hdr-std">Tgl Produksi</th>
                        <th class="hdr-std">Mesin</th>
                        <th class="hdr-std border-r border-slate-500">Shift</th>
                        <th class="hdr-std">Jenis Item</th>
                        <th class="hdr-std text-left pl-4">Nama Item</th>
                        <th class="hdr-std">Pjg</th>
                        <th class="hdr-std">Grade</th>
                        <th class="hdr-std">Dus</th>
                        <th class="hdr-std border-r border-slate-500">Shading</th>
                        <th class="hdr-std">PO Aktual</th>
                        <th class="hdr-std bg-slate-900 text-blue-300">QTY (DUS)</th>
                    </tr>`;
                
                let groups = {};
                rawDataRaw.forEach(r => {
                    let t = translateBarcode(r.qrcode); 
                    // Pengelompokan spesifik mencakup semua atribut batch
                    let key = `${t.jenisItem}_${t.namaItem}_${t.panjang}_${t.grade}_${t.dus}_${t.shading}_${t.po}_${t.tglProduksi}_${t.mesin}_${t.shift}`;
                    if(!groups[key]) groups[key] = { ...t, qty: 0, qrcodes: [] };
                    groups[key].qty++; groups[key].qrcodes.push(r.qrcode);
                });

                let arr = Object.values(groups);
                if(arr.length === 0) { tbody.innerHTML = '<tr><td colspan="13" class="p-6 font-bold text-slate-400">Kosong.</td></tr>'; return; }

                let h = '';
                arr.forEach((r, i) => {
                    h += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50 text-row text-center">
                            <td class="p-3"><input type="checkbox" value="${r.qrcodes.join(',')}" class="row-cb cursor-pointer"></td>
                            <td class="p-3 font-bold text-slate-400">${i+1}</td>
                            <td class="p-3 font-bold text-slate-600">${r.tglProduksi}</td>
                            <td class="p-3 font-bold text-slate-600">${r.mesin}</td>
                            <td class="p-3 font-bold text-slate-600 border-r border-slate-200">${r.shift}</td>
                            <td class="p-3 font-black text-blue-700 s-jenis">${r.jenisItem}</td>
                            <td class="p-3 font-bold text-slate-800 text-left s-nama">${r.namaItem}</td>
                            <td class="p-3 font-bold text-slate-500">${r.panjang}</td>
                            <td class="p-3 font-semibold text-slate-800">${r.grade}</td>
                            <td class="p-3 font-bold text-slate-800">${r.dus}</td>
                            <td class="p-3 font-bold text-slate-600 border-r border-slate-200">${r.shading}</td>
                            <td class="p-3 font-black text-orange-600 bg-orange-50/40 s-po">${r.po}</td>
                            <td class="p-3 font-black text-base text-slate-900 bg-slate-100">${r.qty}</td>
                        </tr>`;
                });
                tbody.innerHTML = h;
            } 
            // PERBAIKAN: MODE JASPER - MENAMPILKAN SEMUA KOLOM FISIK LENGKAP + QTY
            else if(modeSekarang === 'jasper') {
                thead.innerHTML = `
                    <tr>
                        <th class="hdr-std w-10"><input type="checkbox" id="master-cb" onchange="toggleSemuaCentang(this.checked)" class="cursor-pointer"></th>
                        <th class="hdr-std w-12">No</th>
                        <th class="hdr-std">Tgl Produksi</th>
                        <th class="hdr-std">Mesin</th>
                        <th class="hdr-std border-r border-slate-500">Shift</th>
                        <th class="hdr-std">Jenis Item</th>
                        <th class="hdr-std text-left pl-4">Nama Barang Jasper</th>
                        <th class="hdr-std">Pjg</th>
                        <th class="hdr-std">Grade</th>
                        <th class="hdr-std">Dus</th>
                        <th class="hdr-std border-r border-slate-500">Shading</th>
                        <th class="hdr-std">PO Aktual</th>
                        <th class="hdr-std bg-slate-900 text-blue-300">QTY (DUS)</th>
                    </tr>`;
                
                let groups = {};
                rawDataRaw.forEach(r => {
                    let t = translateBarcode(r.qrcode); 
                    // Pengelompokan spesifik mencakup jasper name & batch
                    let key = `${t.jenisItem}_${t.jasper}_${t.panjang}_${t.grade}_${t.dus}_${t.shading}_${t.po}_${t.tglProduksi}_${t.mesin}_${t.shift}`;
                    if(!groups[key]) groups[key] = { ...t, qty: 0, qrcodes: [] };
                    groups[key].qty++; groups[key].qrcodes.push(r.qrcode);
                });

                let arr = Object.values(groups);
                if(arr.length === 0) { tbody.innerHTML = '<tr><td colspan="13" class="p-6 font-bold text-slate-400">Kosong.</td></tr>'; return; }

                let h = '';
                arr.forEach((r, i) => {
                    h += `
                        <tr class="border-b border-slate-200 hover:bg-slate-50 text-row text-center">
                            <td class="p-3"><input type="checkbox" value="${r.qrcodes.join(',')}" class="row-cb cursor-pointer"></td>
                            <td class="p-3 font-bold text-slate-400">${i+1}</td>
                            <td class="p-3 font-bold text-slate-600">${r.tglProduksi}</td>
                            <td class="p-3 font-bold text-slate-600">${r.mesin}</td>
                            <td class="p-3 font-bold text-slate-600 border-r border-slate-200">${r.shift}</td>
                            <td class="p-3 font-black text-blue-700 s-jenis">${r.jenisItem}</td>
                            <td class="p-3 font-bold text-slate-800 text-left s-nama">${r.jasper}</td>
                            <td class="p-3 font-bold text-slate-500">${r.panjang}</td>
                            <td class="p-3 font-semibold text-slate-800">${r.grade}</td>
                            <td class="p-3 font-bold text-slate-800">${r.dus}</td>
                            <td class="p-3 font-bold text-slate-600 border-r border-slate-200">${r.shading}</td>
                            <td class="p-3 font-black text-orange-600 bg-orange-50/40 s-po">${r.po}</td>
                            <td class="p-3 font-black text-base text-slate-900 bg-slate-100">${r.qty}</td>
                        </tr>`;
                });
                tbody.innerHTML = h;
            }
            lucide.createIcons(); jalankanSaring();
        }

        function toggleSemuaCentang(checked) { document.querySelectorAll('.row-cb').forEach(cb => cb.checked = checked); }
        function toggleKolomRaw(cls, show) { document.querySelectorAll('.' + cls).forEach(el => el.style.display = show ? '' : 'none'); }
        function bersihkanFilter() { document.getElementById('flt-qr').value = ''; document.querySelectorAll('.dynamic-filter').forEach(el => el.value = ''); document.getElementById('flt-nama').value = ''; jalankanSaring(); }

        // PERBAIKAN LOGIKA FILTER (MEMISAHKAN PERILAKU UNTUK KATALOG VS QR)
        function jalankanSaring() {
            const fQr = document.getElementById('flt-qr').value.toLowerCase();
            const fJenis = document.getElementById('flt-jenis').value.toLowerCase();
            const fNama = document.getElementById('flt-nama').value.toLowerCase();
            const fPo = document.getElementById('flt-po').value.toLowerCase();

            if (modeSekarang === 'katalog') {
                document.querySelectorAll('.katalog-row').forEach(row => {
                    const txt = row.innerText.toLowerCase();
                    row.style.display = txt.includes(fNama) ? '' : 'none';
                });
                return;
            }

            document.querySelectorAll('.text-row').forEach(row => {
                let show = true;
                const cQr = row.querySelector('.s-qr'); const cJenis = row.querySelector('.s-jenis');
                const cNama = row.querySelector('.s-nama'); const cPo = row.querySelector('.s-po');

                if(fQr && cQr && !cQr.innerText.toLowerCase().includes(fQr)) show = false;
                if(fJenis && cJenis && !cJenis.innerText.toLowerCase().includes(fJenis)) show = false;
                if(fNama && cNama && !cNama.innerText.toLowerCase().includes(fNama)) show = false;
                if(fPo && cPo && !cPo.innerText.toLowerCase().includes(fPo)) show = false;

                row.style.display = show ? '' : 'none';
            });
        }

        async function aksiMassal(tipe) {
            let checkedValues = [];
            document.querySelectorAll('.row-cb:checked').forEach(cb => { cb.value.split(',').forEach(v => { if(v) checkedValues.push(v); }); });
            if(checkedValues.length === 0) return alert("Centang baris tabel terlebih dahulu!");

            if(tipe === 'salin') {
                // EXCEL EXPORT LENGKAP SEMUA KOLOM
                let textSalin = "NO\tQRCODE\tTGL PRODUKSI\tMESIN\tSHIFT\tJENIS\tNAMA ITEM/JASPER\tPANJANG\tGRADE\tDUS\tSHADING\tPO\n";
                checkedValues.forEach((qr, idx) => {
                    let t = translateBarcode(qr);
                    let n = modeSekarang === 'jasper' ? t.jasper : t.namaItem;
                    textSalin += `${idx+1}\t${qr}\t${t.tglProduksi}\t${t.mesin}\t${t.shift}\t${t.jenisItem}\t${n}\t${t.panjang}\t${t.grade}\t${t.dus}\t${t.shading}\t${t.po}\n`;
                });
                navigator.clipboard.writeText(textSalin);
                alert(`Tersalin ${checkedValues.length} baris. Buka Excel dan Paste (Ctrl+V).`);
            } 
            else if(tipe === 'hapus') {
                if(!confirm(`Hapus permanen ${checkedValues.length} QRCode dari database?`)) return;
                const { error } = await db.from(tabelSekarang).delete().in('qrcode', checkedValues);
                if(error) alert("Gagal hapus: " + error.message); else { alert("Dihapus!"); muatDataDariSupabase(); }
            } 
            else if(tipe === 'hold') {
                if(tabelSekarang === 'hasil_stbj') {
                    if(!confirm(`Pindahkan ${checkedValues.length} data HASIL -> tabel HOLD (Duplikat)?`)) return;
                    const dataPindah = rawDataRaw.filter(r => checkedValues.includes(r.qrcode)).map(r => ({ qrcode: r.qrcode, pic_input: r.pic_input, keterangan: r.keterangan, status: 'HOLD' }));
                    const { error: errAdd } = await db.from('hold_stbj').upsert(dataPindah);
                    if(!errAdd) { await db.from('hasil_stbj').delete().in('qrcode', checkedValues); alert("Dipindahkan ke HOLD!"); muatDataDariSupabase(); }
                } else {
                    if(!confirm(`Unhold ${checkedValues.length} data HOLD -> tabel HASIL (Unique)?`)) return;
                    const dataPindah = rawDataRaw.filter(r => checkedValues.includes(r.qrcode)).map(r => ({ qrcode: r.qrcode, pic_input: r.pic_input, keterangan: r.keterangan }));
                    const { error: errAdd } = await db.from('hasil_stbj').upsert(dataPindah);
                    if(!errAdd) { await db.from('hold_stbj').delete().in('qrcode', checkedValues); alert("Di-unhold ke HASIL!"); muatDataDariSupabase(); }
                }
            } 
            else if(tipe === 'xlsx') {
                let csvContent = "data:text/csv;charset=utf-8,NO,QRCODE,TGL_PRODUKSI,MESIN,SHIFT,JENIS,NAMA,PANJANG,GRADE,DUS,SHADING,PO\n";
                checkedValues.forEach((qr, idx) => {
                    let t = translateBarcode(qr);
                    let n = modeSekarang === 'jasper' ? t.jasper : t.namaItem;
                    csvContent += `${idx+1},${qr},${t.tglProduksi},${t.mesin},${t.shift},${t.jenisItem},${n},${t.panjang},${t.grade},${t.dus},${t.shading},${t.po}\n`;
                });
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri); link.setAttribute("download", `STBJ_${tabelSekarang}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            }
        }
    </script>
