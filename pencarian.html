<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Pencarian Item</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .hdr-std { 
            text-align: center !important; 
            padding: 0.5rem 0.75rem !important; 
            font-size: 0.75rem !important; 
            font-weight: 600 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.05em !important; 
            white-space: nowrap !important; 
            border-bottom: 1px solid #e2e8f0 !important; 
            background-clip: padding-box !important; 
        }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- VIEW PENCARIAN KHUSUS PC (DESKTOP) -->
        <div id="view-pencarian-desktop" class="hidden flex-1 min-h-0 flex flex-col gap-3 h-full overflow-hidden p-4"></div>

        <!-- VIEW PENCARIAN KHUSUS HP (MOBILE) -->
        <div id="view-pencarian-mobile" class="hidden flex-1 min-h-0 overflow-y-auto custom-scroll flex flex-col gap-3 pb-36 h-full p-4"></div>

    </div>

    <!-- DATALISTS AUTO-COMPLETE -->
    <datalist id="dl-nama-item"></datalist>
    <datalist id="dl-panjang"></datalist>
    <datalist id="dl-grade"></datalist>
    <datalist id="dl-dus"></datalist>
    <datalist id="dl-shading"></datalist>
    <datalist id="dl-area"></datalist>
    <datalist id="dl-cust-aktual"></datalist>
    <datalist id="dl-cust-estimasi"></datalist>

    <!-- MODAL RINCIAN QR CODE HASIL CARI GLOBAL -->
    <div id="modal-detail-qr-global" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/70 z-[110] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl border border-slate-200 flex flex-col max-h-[85vh] overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-start bg-slate-50">
                <div>
                    <h3 class="font-black text-slate-800 text-sm uppercase flex items-center gap-2">
                        <i data-lucide="qr-code" class="w-5 h-5 text-indigo-600"></i>
                        <span id="qr-global-title-item">Detail Item</span>
                    </h3>
                    <p class="text-xs font-bold text-slate-400 mt-0.5" id="qr-global-subtitle-item"></p>
                </div>
                <button onclick="document.getElementById('modal-detail-qr-global').classList.add('hidden')" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition shadow-sm"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-3 bg-indigo-50/50 border-b border-indigo-100 flex justify-between items-center px-4">
                <span class="text-xs font-black text-indigo-900" id="qr-global-count-badge">Total: 0 Dus</span>
                <button onclick="salinSemuaQRDetail()" class="px-3 py-1.5 bg-white border border-indigo-200 text-indigo-700 font-bold text-xs rounded-lg hover:bg-indigo-50 shadow-sm flex items-center gap-1.5 transition active:scale-95"><i data-lucide="copy" class="w-3.5 h-3.5"></i> Salin Semua QR</button>
            </div>
            <div class="overflow-y-auto flex-1 p-4 custom-scroll space-y-2.5 bg-slate-50" id="qr-global-list-container"></div>
        </div>
    </div>

    <!-- MODAL SCAN CARI QR -->
    <div id="modal-scan-cari-qr" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[100] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                <h3 class="font-black text-slate-800 text-sm uppercase flex items-center gap-2"><i data-lucide="scan-line" class="w-5 h-5 text-indigo-600"></i> Scan Item QRCode</h3>
                <button onclick="document.getElementById('modal-scan-cari-qr').classList.add('hidden')" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase text-slate-500 mb-1.5">Scan / Tempel Barcode (Bisa Banyak)</label>
                    <textarea id="input-search-qrcodes" rows="6" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-indigo-600 font-mono font-bold text-xs bg-slate-50 custom-scroll" placeholder="Scan barcode di sini..."></textarea>
                </div>
                <button onclick="eksekusiCariQR()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-black text-xs uppercase rounded-xl shadow-md transition flex justify-center items-center gap-2 border-b-4 border-indigo-900"><i data-lucide="search" class="w-4 h-4"></i> CARI DATA ITEM</button>
            </div>
        </div>
    </div>

    <script src="pencarian_logic.js"></script>
</body>
</html>
