<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Stock Opname</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans">
    <div class="w-full">
        
        <div class="bg-white p-5 rounded-xl shadow-sm mb-4 border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="flex-1 w-full">
                <h3 class="text-xs font-black opacity-60 uppercase mb-3 flex items-center gap-2 text-slate-600"><i data-lucide="filter" class="w-4 h-4"></i> Filter Area & Item</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                    <input type="text" id="flt-area" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="Cari Area...">
                    <input type="text" id="flt-jenis" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="Jenis Item...">
                    <input type="text" id="flt-nama" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="Nama Item...">
                    <input type="text" id="flt-pjg" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="Panjang...">
                    <input type="text" id="flt-grade" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="Grade...">
                    <input type="text" id="flt-po" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="PO Aktual...">
                </div>
            </div>
            <button onclick="loadData()" class="px-5 py-3 bg-slate-800 text-white font-black rounded-lg hover:bg-slate-900 transition shadow-sm text-xs flex items-center gap-2 whitespace-nowrap uppercase tracking-wider w-full md:w-auto justify-center active:scale-95"><i data-lucide="refresh-cw" class="w-4 h-4"></i> REFRESH DATA</button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="overflow-x-auto w-full max-h-[60vh] hide-scrollbar">
                <table class="w-full border-collapse text-sm whitespace-nowrap" id="main-table">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std border-r border-slate-500">Area</th>
                            <th class="hdr-std">Jenis Item</th>
                            <th class="hdr-std">Nama Item</th>
                            <th class="hdr-std">Pjg</th>
                            <th class="hdr-std">Grade</th>
                            <th class="hdr-std">Dus</th>
                            <th class="hdr-std border-r border-slate-500">Shading</th>
                            <th class="hdr-std border-r border-slate-500">PO Aktual</th>
                            <th class="hdr-std text-blue-300 border-r border-slate-500 bg-slate-900">QTY SISTEM</th>
                            <th class="hdr-std">QTY FISIK</th>
                            <th class="hdr-std">KET. SELISIH</th>
                            <th class="hdr-std"><i data-lucide="settings" class="w-4 h-4 mx-auto"></i></th>
                        </tr>
                    </thead>
                    <tbody id="data-body" class="text-center text-slate-700"><tr><td colspan="13" class="p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-3 text-slate-500"></i><p class="font-bold text-slate-500">Memuat Stok...</p></td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        let globalData = [];
        const currentUser = JSON.parse(localStorage.getItem('user_session')) || {username: 'Admin'};

        document.addEventListener('DOMContentLoaded', () => {
            initModernLayout({ id: 'opname', title: 'STOCK OPNAME', url: 'opname.html' });
            setTimeout(() => { loadData(); }, 200);
        });

        async function loadData() {
            try {
                const { data, error } = await db.from('stok_global').select('*').order('area', {ascending: true});
                if(error) throw error; globalData = data || []; renderTable();
            } catch (err) { document.getElementById('data-body').innerHTML = `<tr><td colspan="13" class="p-10 text-center text-red-500 font-bold">Error: ${err.message}</td></tr>`; }
        }

        function renderTable() {
            const tbody = document.getElementById('data-body');
            if(globalData.length === 0) { tbody.innerHTML = `<tr><td colspan="13" class="text-center p-10 text-slate-500 font-bold">Gudang Kosong.</td></tr>`; lucide.createIcons(); return; }
            let htmlContent = ''; 
            globalData.forEach((r, i) => {
                htmlContent += `
                    <tr class="border-b border-slate-200 hover:bg-slate-50 transition data-row" id="row-${i}">
                        <td class="p-3 font-bold text-slate-400">${i+1}</td>
                        <td class="p-3 font-black text-emerald-700 bg-emerald-50/30 col-area border-r border-slate-200">${r.area}</td>
                        <td class="p-3 font-bold text-blue-700 col-jenis">${r.jenis_item}</td>
                        <td class="p-3 font-bold text-slate-800 col-nama text-left">${r.nama_item}</td>
                        <td class="p-3 font-bold text-slate-500 col-pjg">${r.panjang}</td>
                        <td class="p-3 font-semibold text-slate-800 col-grade">${r.grade}</td>
                        <td class="p-3 text-slate-800 col-dus">${r.dus}</td>
                        <td class="p-3 font-medium text-slate-600 col-shading border-r border-slate-200">${r.shading}</td>
                        <td class="p-3 font-black text-orange-600 bg-orange-50/30 col-po border-r border-slate-200">${r.po_aktual}</td>
                        <td class="p-3 font-black text-lg bg-slate-100 text-slate-800 border-r border-slate-200" id="sys-${i}">${r.qty}</td>
                        <td class="p-2 bg-slate-50">
                            <input type="number" id="fisik-${i}" value="${r.qty}" min="0" class="w-20 p-2 border border-slate-300 rounded font-black text-slate-900 outline-none focus:border-slate-800 text-center bg-white mx-auto">
                        </td>
                        <td class="p-2 bg-slate-50">
                            <input type="text" id="ket-${i}" placeholder="Alasan selisih..." class="w-full min-w-[150px] p-2 border border-slate-300 rounded text-xs outline-none focus:border-slate-800 bg-white">
                        </td>
                        <td class="p-2 bg-slate-50">
                            <button onclick="eksekusiOpname(${i}, '${r.id_sku}')" id="btn-${i}" class="px-4 py-2 bg-slate-800 text-white font-bold rounded shadow-sm hover:bg-slate-900 transition active:scale-95 text-[10px] uppercase flex items-center justify-center gap-1 mx-auto cursor-pointer"><i data-lucide="save" class="w-3 h-3"></i> SIMPAN</button>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = htmlContent; lucide.createIcons(); saringTabel();
        }

        function saringTabel() {
            const filters = { area: document.getElementById('flt-area').value.toLowerCase(), jenis: document.getElementById('flt-jenis').value.toLowerCase(), nama: document.getElementById('flt-nama').value.toLowerCase(), pjg: document.getElementById('flt-pjg').value.toLowerCase(), grade: document.getElementById('flt-grade').value.toLowerCase(), po: document.getElementById('flt-po').value.toLowerCase() };
            document.querySelectorAll('.data-row').forEach(row => {
                let show = true; for(let key in filters) { if(filters[key] !== '') { const cell = row.querySelector('.col-' + key); if(cell && !cell.innerText.toLowerCase().includes(filters[key])) { show = false; break; } } }
                row.style.display = show ? '' : 'none';
            });
        }

        async function eksekusiOpname(index, sku) {
            const qtyFisik = parseInt(document.getElementById(`fisik-${index}`).value); const ket = document.getElementById(`ket-${index}`).value.trim(); const btn = document.getElementById(`btn-${index}`); const sysQty = parseInt(document.getElementById(`sys-${index}`).innerText);
            if (isNaN(qtyFisik) || qtyFisik < 0) return alert("Kuantiti fisik tidak valid!"); if (qtyFisik === sysQty) return alert("Tidak ada selisih."); if (qtyFisik !== sysQty && !ket) return alert("Wajib isi Keterangan jika selisih!");
            if(!confirm(`Yakin merubah saldo?\nSistem: ${sysQty} -> Fisik: ${qtyFisik}`)) return;

            const originalHTML = btn.innerHTML; btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-3 h-3"></i>'; btn.disabled = true;
            const payload = { sku: sku, qty_fisik: qtyFisik, ket: ket, pic: currentUser.username };
            const { data, error } = await db.rpc('eksekusi_opname_aman', { payload: payload });

            if(error) { alert("Gagal: " + error.message); btn.innerHTML = originalHTML; btn.disabled = false; } 
            else if (data === 'SUKSES_TANPA_UBAH') { alert("Angka sama."); btn.innerHTML = originalHTML; btn.disabled = false; } 
            else if (data === 'SUKSES') {
                document.getElementById(`sys-${index}`).innerText = qtyFisik; document.getElementById(`row-${index}`).classList.add('bg-green-100');
                btn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i> DONE'; btn.classList.replace('bg-slate-800', 'bg-emerald-600'); btn.classList.replace('hover:bg-slate-900', 'hover:bg-emerald-700');
            } else { alert(data); btn.innerHTML = originalHTML; btn.disabled = false; }
            lucide.createIcons();
        }
    </script>
</body>
</html>
