<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Stock Opname</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-main: #f8fafc; --bg-box: #ffffff; --text-main: #1f2937; --border-color: #e2e8f0; }
        body[data-bg="dark"] { --bg-main: #0f172a; --bg-box: #1e293b; --text-main: #f8fafc; --border-color: #334155; }
        body { background-color: var(--bg-main); color: var(--text-main); transition: all 0.3s ease; min-height: 100vh; }
        .card-dynamic { background-color: var(--bg-box); border-color: var(--border-color); }
        .input-dynamic { background-color: var(--bg-main); color: var(--text-main); border-color: var(--border-color); }
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-black { background-color: #1e293b !important; color: white !important; }
        .hdr-purple { background-color: #6b21a8 !important; color: white !important; }
        .hdr-light-purple { background-color: #d8b4fe !important; color: black !important; }
    </style>
</head>
<body id="app-body" class="font-sans">

    <div class="sticky top-0 z-40 w-full flex flex-col shadow-md">
        <nav class="card-dynamic px-4 py-3 flex items-center justify-between border-b">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='menu.html'" class="p-2 bg-purple-100 hover:bg-purple-200 text-purple-900 rounded-full transition cursor-pointer active:scale-95 shadow-inner"><i data-lucide="home" class="w-5 h-5"></i></button>
                <div class="flex flex-col ml-1"><span class="font-extrabold text-lg tracking-wide leading-tight text-purple-900">PORTAL WMS</span></div>
            </div>
        </nav>
        <div id="tab-bar" class="w-full bg-[#0f172a] text-gray-400 flex overflow-x-auto text-[11px] font-black hide-scrollbar tracking-wider"></div>
    </div>

    <main class="p-4 md:p-6 w-full max-w-[98%] mx-auto flex-grow pt-6">
        <header class="mb-4 flex flex-col md:flex-row md:justify-between md:items-end gap-4 border-b border-gray-200/50 pb-4">
            <div class="flex items-center gap-3">
                <div class="bg-purple-100 p-2.5 rounded-xl"><i data-lucide="clipboard-check" class="w-7 h-7 text-purple-700"></i></div>
                <div>
                    <h2 class="text-2xl font-black text-purple-900">Stock Opname (Audit)</h2>
                    <p class="text-xs font-bold opacity-60 text-purple-700">Penyesuaian Saldo Sistem vs Fisik Gudang</p>
                </div>
            </div>
            <button onclick="loadData()" class="px-5 py-2.5 bg-purple-100 text-purple-800 font-black rounded-lg border border-purple-300 hover:bg-purple-200 transition cursor-pointer text-sm flex items-center gap-2 shadow-sm active:scale-95"><i data-lucide="refresh-cw" class="w-5 h-5"></i> REFRESH DATA STOK</button>
        </header>

        <div class="card-dynamic p-4 rounded-xl shadow-sm mb-4 border border-purple-200 bg-purple-50/30">
            <h3 class="text-xs font-bold opacity-80 uppercase mb-3 flex items-center gap-2 text-purple-900"><i data-lucide="filter" class="w-4 h-4"></i> Filter Area & Item</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <input type="text" id="flt-area" oninput="saringTabel()" class="input-dynamic p-2 text-xs border border-purple-300 rounded outline-none font-bold text-purple-900" placeholder="Ketik Area (Cth: D1)...">
                <input type="text" id="flt-jenis" oninput="saringTabel()" class="input-dynamic p-2 text-xs border border-purple-300 rounded outline-none" placeholder="Jenis Item...">
                <input type="text" id="flt-nama" oninput="saringTabel()" class="input-dynamic p-2 text-xs border border-purple-300 rounded outline-none" placeholder="Nama Item...">
                <input type="text" id="flt-pjg" oninput="saringTabel()" class="input-dynamic p-2 text-xs border border-purple-300 rounded outline-none" placeholder="Panjang...">
                <input type="text" id="flt-grade" oninput="saringTabel()" class="input-dynamic p-2 text-xs border border-purple-300 rounded outline-none" placeholder="Grade...">
                <input type="text" id="flt-po" oninput="saringTabel()" class="input-dynamic p-2 text-xs border border-purple-300 rounded outline-none" placeholder="PO Aktual...">
            </div>
        </div>

        <div class="card-dynamic rounded-xl shadow-md border overflow-hidden relative">
            <div class="table-container overflow-x-auto w-full max-h-[60vh]">
                <table class="w-full text-left text-sm whitespace-nowrap" id="main-table">
                    <thead class="uppercase text-[11px] sticky top-0 z-10 shadow-sm tracking-wider">
                        <tr>
                            <th class="p-3 hdr-black text-center w-12">No</th>
                            <th class="p-3 hdr-purple border-r border-purple-800">Area</th>
                            <th class="p-3 hdr-black">Jenis Item</th>
                            <th class="p-3 hdr-black">Nama Item</th>
                            <th class="p-3 hdr-black">Pjg</th>
                            <th class="p-3 hdr-black">Grade</th>
                            <th class="p-3 hdr-black">Dus</th>
                            <th class="p-3 hdr-black border-r border-gray-600">Shading</th>
                            <th class="p-3 bg-gray-200 text-black text-center border-r border-gray-400">PO Aktual</th>
                            <th class="p-3 bg-blue-100 text-blue-900 text-center font-black text-sm border-r border-blue-300">QTY SISTEM</th>
                            <th class="p-3 hdr-purple text-center">QTY FISIK</th>
                            <th class="p-3 hdr-purple text-center">KETERANGAN OPNAME</th>
                            <th class="p-3 hdr-black text-center"><i data-lucide="settings" class="w-4 h-4 mx-auto"></i></th>
                        </tr>
                    </thead>
                    <tbody id="data-body"><tr><td colspan="13" class="text-center p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-3 text-purple-600"></i><p class="font-bold text-gray-500">Memuat Kartu Stok...</p></td></tr></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="global.js"></script>

    <script>
        const PAGE_META = { id: 'opname', title: 'STOCK OPNAME', url: 'opname.html' };
        let globalData = [];
        const currentUser = JSON.parse(localStorage.getItem('user_session')) || {username: 'Admin'};

        window.onload = async () => {
            initGlobalTabs(PAGE_META);
            await loadData();
        };

        async function loadData() {
            try {
                // Tarik semua stok_global, termasuk yang qty = 0 (karena mungkin fisiknya ada)
                const { data, error } = await db.from('stok_global').select('*').order('area', {ascending: true});
                if(error) throw error;
                globalData = data || []; renderTable();
            } catch (err) {
                document.getElementById('data-body').innerHTML = `<tr><td colspan="13" class="p-10 text-center text-red-500 font-bold">Error: ${err.message}</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('data-body');
            if(globalData.length === 0) { 
                tbody.innerHTML = `<tr><td colspan="13" class="text-center p-10 opacity-50"><i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2"></i> Gudang Kosong.</td></tr>`; 
                lucide.createIcons(); return; 
            }

            let htmlContent = ''; 
            globalData.forEach((r, i) => {
                htmlContent += `
                    <tr class="border-b border-inherit hover:bg-purple-50 transition data-row" id="row-${i}">
                        <td class="p-3 text-center font-bold opacity-50">${i+1}</td>
                        <td class="p-3 font-bold text-purple-700 bg-purple-50/50 col-area border-r border-purple-100">${r.area}</td>
                        <td class="p-3 font-bold text-gray-700 col-jenis">${r.jenis_item}</td>
                        <td class="p-3 font-bold col-nama">${r.nama_item}</td>
                        <td class="p-3 font-bold opacity-70 col-pjg">${r.panjang}</td>
                        <td class="p-3 font-semibold col-grade">${r.grade}</td>
                        <td class="p-3 col-dus">${r.dus}</td>
                        <td class="p-3 font-medium col-shading border-r border-gray-200">${r.shading}</td>
                        <td class="p-3 font-bold text-center text-black bg-gray-100 col-po border-r border-gray-300">${r.po_aktual}</td>
                        
                        <td class="p-3 text-center font-black text-lg bg-blue-50 text-blue-800 border-r border-blue-200" id="sys-${i}">${r.qty}</td>
                        
                        <td class="p-2 text-center bg-purple-50">
                            <input type="number" id="fisik-${i}" value="${r.qty}" min="0" class="input-dynamic w-20 p-2 border-2 border-purple-300 rounded text-center font-black text-purple-900 outline-none focus:border-purple-600">
                        </td>
                        <td class="p-2 bg-purple-50">
                            <input type="text" id="ket-${i}" placeholder="Alasan selisih..." class="input-dynamic w-full p-2 border border-purple-200 rounded text-xs outline-none">
                        </td>
                        <td class="p-2 text-center bg-purple-50">
                            <button onclick="eksekusiOpname(${i}, '${r.id_sku}')" id="btn-${i}" class="px-4 py-2 bg-purple-700 text-white font-bold rounded shadow-md hover:bg-purple-800 transition active:scale-95 text-xs flex items-center justify-center gap-1 mx-auto cursor-pointer">
                                <i data-lucide="save" class="w-3 h-3"></i> SESUAIKAN
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = htmlContent;
            lucide.createIcons(); saringTabel();
        }

        function saringTabel() {
            const filters = {
                area: document.getElementById('flt-area').value.toLowerCase(), jenis: document.getElementById('flt-jenis').value.toLowerCase(),
                nama: document.getElementById('flt-nama').value.toLowerCase(), pjg: document.getElementById('flt-pjg').value.toLowerCase(),
                grade: document.getElementById('flt-grade').value.toLowerCase(), po: document.getElementById('flt-po').value.toLowerCase()
            };
            document.querySelectorAll('.data-row').forEach(row => {
                let show = true;
                for(let key in filters) {
                    if(filters[key] !== '') {
                        const cell = row.querySelector('.col-' + key);
                        if(cell && !cell.innerText.toLowerCase().includes(filters[key])) { show = false; break; }
                    }
                }
                row.style.display = show ? '' : 'none';
            });
        }

        async function eksekusiOpname(index, sku) {
            const qtyFisik = parseInt(document.getElementById(`fisik-${index}`).value);
            const ket = document.getElementById(`ket-${index}`).value.trim();
            const btn = document.getElementById(`btn-${index}`);
            const sysQty = parseInt(document.getElementById(`sys-${index}`).innerText);
            
            if (isNaN(qtyFisik) || qtyFisik < 0) return alert("Kuantiti fisik tidak valid!");
            if (qtyFisik === sysQty) return alert("Tidak ada selisih. Angka fisik sama dengan sistem.");
            if (qtyFisik !== sysQty && !ket) return alert("Wajib mengisi Keterangan Opname jika terdapat selisih saldo!");

            const confirmMsg = `PERINGATAN!\nAnda akan merubah saldo sistem secara permanen.\nSistem: ${sysQty} -> Fisik: ${qtyFisik}\nLanjutkan?`;
            if(!confirm(confirmMsg)) return;

            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin w-4 h-4"></i>'; btn.disabled = true;

            const payload = { sku: sku, qty_fisik: qtyFisik, ket: ket, pic: currentUser.username };

            // Tembak RPC Supabase
            const { data, error } = await db.rpc('eksekusi_opname_aman', { payload: payload });

            if(error) {
                alert("Gagal memproses Opname: " + error.message);
                btn.innerHTML = originalHTML; btn.disabled = false;
            } else if (data === 'SUKSES_TANPA_UBAH') {
                alert("Sistem mendeteksi angka sama, tidak ada perubahan yang disimpan.");
                btn.innerHTML = originalHTML; btn.disabled = false;
            } else if (data === 'SUKSES') {
                // Update tampilan UI langsung tanpa perlu refresh halaman penuh
                document.getElementById(`sys-${index}`).innerText = qtyFisik;
                document.getElementById(`row-${index}`).classList.add('bg-green-100');
                btn.innerHTML = '<i data-lucide="check" class="w-3 h-3"></i> DONE';
                btn.classList.replace('bg-purple-700', 'bg-green-600');
                btn.classList.replace('hover:bg-purple-800', 'hover:bg-green-700');
            } else {
                alert(data); // Memunculkan pesan error custom dari RPC
                btn.innerHTML = originalHTML; btn.disabled = false;
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
