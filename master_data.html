<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Master Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Library SheetJS untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; will-change: transform; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* TAB STYLING */
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }

        /* HEADER TABEL */
        .hdr-std { 
            background-color: #1e293b !important; 
            color: #ffffff !important; 
            text-align: center !important; 
            padding: 0.75rem 1rem !important; 
            font-size: 0.75rem !important; 
            font-weight: 600 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.05em !important; 
            white-space: nowrap !important; 
            position: sticky !important; 
            top: 0 !important; 
            z-index: 40 !important; 
            border-bottom: 2px solid #cbd5e1 !important; 
            background-clip: padding-box !important; 
        }
        
        /* INPUT EXCEL-LIKE (Sangat Ringan) */
        .excel-input {
            width: 100%;
            min-width: 100px;
            padding: 0.5rem;
            background-color: transparent;
            border: none;
            outline: none;
            text-align: center;
            font-weight: 600;
            color: #334155;
            position: relative;
            z-index: 10;
        }
        .excel-input:focus {
            background-color: #eff6ff;
            box-shadow: inset 0 0 0 2px #3b82f6;
            color: #0f172a;
            z-index: 20;
        }

        /* RESIZABLE COLUMN HANDLE */
        .resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            cursor: col-resize;
            user-select: none;
            height: 100%;
            z-index: 50;
        }
        .resizer:hover, .resizing {
            background-color: rgba(59, 130, 246, 0.5); /* Warna biru transparan saat di-hover/drag */
        }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION (TABS) -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200 shadow-[0_4px_10px_-3px_rgba(0,0,0,0.05)]">
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar">
                <button onclick="bukaTabel('variabel')" id="tab-variabel" class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="book-open" class="w-4 h-4"></i> Variabel & Kode</button>
                <button onclick="bukaTabel('jasper')" id="tab-jasper" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="file-text" class="w-4 h-4"></i> Nama Jasper</button>
                <button onclick="bukaTabel('area')" id="tab-area" class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="map" class="w-4 h-4"></i> Master Area</button>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION -->
        <div class="flex-1 min-h-0 bg-slate-50 overflow-hidden flex flex-col relative z-0">
            
            <!-- VIEW TABLE -->
            <div id="view-table" class="flex-1 min-h-0 bg-white flex flex-col">
                
                <!-- TOOLBAR PENCARIAN & EXCEL -->
                <div class="p-3 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3 shrink-0">
                    <div class="relative w-full sm:w-1/3">
                        <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                        <input type="text" id="input-search" oninput="searchData(this.value)" class="w-full pl-9 p-2 border border-slate-300 rounded-md text-sm outline-none focus:border-blue-500 font-semibold" placeholder="Cari data...">
                    </div>
                    <button onclick="downloadExcelMaster()" class="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-md text-xs uppercase transition flex items-center justify-center gap-2 shadow-sm active:scale-95">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Export Excel
                    </button>
                </div>

                <div class="flex-1 min-h-0 overflow-y-auto custom-scroll table-container">
                    <table class="w-full text-center border-separate border-spacing-0 whitespace-nowrap" id="main-table">
                        <thead class="sticky top-0 z-40 shadow-md bg-slate-800" id="thead-master"></thead>
                        <tbody id="tbody-master" class="text-slate-700"></tbody>
                    </table>
                </div>
            </div>

        </div>

        <!-- FOOTER ACTION -->
        <div id="footer-action" class="shrink-0 w-full bg-white p-3 flex flex-col md:flex-row justify-between items-center gap-4 z-20 border-t border-slate-200 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)]">
            <div class="flex items-center gap-2">
                <button onclick="tambahBarisKosong()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-md text-xs uppercase transition flex items-center gap-2 border border-slate-300 shadow-sm active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4"></i> Tambah Baris Baru
                </button>
                <span class="text-xs font-bold text-slate-400 ml-2">Tampil: <span id="lbl-total-baris" class="text-slate-700">0</span> Baris</span>
            </div>
            
            <button onclick="simpanKeSupabase()" id="btn-save" class="w-full md:w-auto px-8 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-md shadow-sm flex items-center justify-center gap-2 text-sm transition active:scale-95 uppercase border-b-4 border-blue-800">
                <i data-lucide="save" class="w-4 h-4"></i> Simpan Perubahan
            </button>
        </div>

    </div>

    <script src="global.js"></script>
    <script src="master_data_logic.js"></script>
</body>
</html>
