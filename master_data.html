<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Master Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* REVISI: Penambahan z-index tinggi dan background-clip agar tidak tembus scroll */
        .hdr-std { 
            background-color: #1e293b !important; 
            color: #ffffff !important; 
            text-align: center !important; 
            padding: 0.75rem 1rem !important; 
            font-size: 0.75rem !important; 
            font-weight: 600 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.05em !important; 
            white-space: nowrap !important; 
            position: sticky !important; 
            top: 0 !important; 
            z-index: 40 !important; 
            border-bottom: 2px solid #cbd5e1 !important; 
            background-clip: padding-box !important; 
        }
        
        /* Input ala Excel di dalam tabel */
        .excel-input {
            width: 100%;
            min-width: 120px;
            padding: 0.5rem;
            background-color: transparent;
            border: 1px solid transparent;
            outline: none;
            text-align: center;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s;
            position: relative;
            z-index: 10;
        }
        .excel-input:focus {
            background-color: #ffffff;
            border: 1px solid #3b82f6;
            box-shadow: inset 0 0 0 1px #3b82f6;
            color: #0f172a;
            z-index: 20;
        }
        .excel-input:hover:not(:focus) {
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200">
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar px-4 pt-2">
                <button onclick="kembaliKeMenu()" id="btn-back" class="hidden pb-3 mr-4 text-slate-500 hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-sm font-bold"><i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali</button>
                <div id="title-bar" class="pb-3 text-blue-700 font-black whitespace-nowrap flex items-center gap-2 text-sm uppercase tracking-wide border-b-2 border-blue-700">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i> MENU MASTER DATA
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION -->
        <div class="flex-1 min-h-0 bg-slate-50 overflow-hidden flex flex-col relative z-0">
            
            <!-- VIEW 1: DASHBOARD KOTAK MENU -->
            <div id="view-dashboard" class="flex-1 overflow-y-auto custom-scroll p-4 sm:p-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-5xl mx-auto">
                    
                    <div onclick="bukaTabel('variabel')" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:border-blue-500 hover:shadow-md transition cursor-pointer group flex flex-col items-center text-center">
                        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mb-4 group-hover:bg-blue-600 group-hover:text-white transition">
                            <i data-lucide="book-open" class="w-8 h-8"></i>
                        </div>
                        <h3 class="font-black text-slate-800 text-lg mb-1">Variabel & Kode</h3>
                        <p class="text-xs font-semibold text-slate-500">Master Item, Dus, Mesin, Shift, PO</p>
                    </div>

                    <div onclick="bukaTabel('jasper')" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:border-purple-500 hover:shadow-md transition cursor-pointer group flex flex-col items-center text-center">
                        <div class="w-16 h-16 bg-purple-50 text-purple-600 rounded-full flex items-center justify-center mb-4 group-hover:bg-purple-600 group-hover:text-white transition">
                            <i data-lucide="file-text" class="w-8 h-8"></i>
                        </div>
                        <h3 class="font-black text-slate-800 text-lg mb-1">Nama Jasper</h3>
                        <p class="text-xs font-semibold text-slate-500">Kamus konversi nama output Jasper</p>
                    </div>

                    <div onclick="bukaTabel('area')" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:border-emerald-500 hover:shadow-md transition cursor-pointer group flex flex-col items-center text-center">
                        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-4 group-hover:bg-emerald-600 group-hover:text-white transition">
                            <i data-lucide="map" class="w-8 h-8"></i>
                        </div>
                        <h3 class="font-black text-slate-800 text-lg mb-1">Master Area</h3>
                        <p class="text-xs font-semibold text-slate-500">Daftar lokasi penyimpanan gudang</p>
                    </div>

                </div>
            </div>

            <!-- VIEW 2: TABEL EXCEL-LIKE -->
            <div id="view-table" class="hidden flex-1 min-h-0 bg-white flex flex-col">
                <div class="flex-1 min-h-0 overflow-y-auto custom-scroll table-container">
                    <!-- REVISI: Menggunakan border-separate border-spacing-0 agar border tidak ikut ke-scroll -->
                    <table class="w-full text-center border-separate border-spacing-0 whitespace-nowrap" id="main-table">
                        <thead class="sticky top-0 z-40 shadow-md bg-slate-800" id="thead-master"></thead>
                        <tbody id="tbody-master" class="text-slate-700"></tbody>
                    </table>
                </div>
            </div>

        </div>

        <!-- FOOTER ACTION (Hanya muncul di View Table) -->
        <div id="footer-action" class="hidden shrink-0 w-full bg-white p-3 flex flex-col md:flex-row justify-between items-center gap-4 z-20 border-t border-slate-200 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)]">
            <div class="flex items-center gap-2">
                <button onclick="tambahBarisKosong()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-md text-xs uppercase transition flex items-center gap-2 border border-slate-300 shadow-sm">
                    <i data-lucide="plus" class="w-4 h-4"></i> Tambah Baris Baru
                </button>
                <span class="text-xs font-bold text-slate-400 ml-2">Total: <span id="lbl-total-baris" class="text-slate-700">0</span> Baris</span>
            </div>
            
            <button onclick="simpanKeSupabase()" id="btn-save" class="w-full md:w-auto px-8 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-md shadow-sm flex items-center justify-center gap-2 text-sm transition active:scale-95 uppercase border-b-4 border-blue-800">
                <i data-lucide="save" class="w-4 h-4"></i> Simpan Perubahan
            </button>
        </div>

    </div>

    <script src="global.js"></script>
    <script src="master_data_logic.js"></script>
</body>
</html>
