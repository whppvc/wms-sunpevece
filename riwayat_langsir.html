<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Riwayat Langsir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* DESAIN HEADER BARU: Lebih gelap, lebih padat (seperti mockup gambar) */
        .hdr-std { 
            background-color: #0f172a !important; /* bg-slate-900 */
            color: #f1f5f9 !important; /* text-slate-100 */
            text-align: center !important; 
            border: 1px solid #334155; 
            padding: 0.5rem 0.75rem; 
            text-transform: uppercase; 
            font-family: inherit; 
            font-size: 10px; 
            font-weight: 800; 
            white-space: nowrap; 
            position: sticky;
            top: 0;
            z-index: 20;
            background-clip: padding-box; 
        }
        
        /* DESAIN TAB BARU: Garis bawah, background putih bersih */
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 900; background-color: #ffffff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; background-color: #ffffff; }
    </style>
</head>
<!-- Background Body putih bersih agar menyatu dengan elemen -->
<body class="font-sans bg-white overflow-x-hidden text-slate-800 pb-20">

    <!-- Kontainer Edge-to-Edge (Tanpa padding pinggir px-4 & rounded) -->
    <div class="w-full flex flex-col h-screen">
        
        <!-- NAVIGASI TAB MENU (FLAT) -->
        <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar sticky top-0 z-30 shrink-0">
            <button onclick="gantiModeRiwayat('qr')" id="tab-r-qr" class="px-5 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-[11px] uppercase"><i data-lucide="list" class="w-4 h-4"></i> DETAIL QRCODE</button>
            <button onclick="gantiModeRiwayat('agregasi')" id="tab-r-agregasi" class="px-5 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-[11px] uppercase"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> RANGKUMAN NAMA ITEM & QTY</button>
            <button onclick="gantiModeRiwayat('hold')" id="tab-r-hold" class="px-5 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-[11px] uppercase"><i data-lucide="pause-circle" class="w-4 h-4"></i> TABEL HOLD</button>
        </div>

        <!-- TOOLBAR RINGKAS (DESAIN MOCKUP) -->
        <div class="bg-white p-2 border-b border-slate-200 flex flex-col gap-1.5 shrink-0">
            <div class="flex items-center gap-2 overflow-x-auto px-1 pb-1 hide-scrollbar whitespace-nowrap scroll-smooth select-none" style="-webkit-overflow-scrolling: touch;">
                
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider mr-1 hidden sm:inline">Aksi:</span>
                
                <!-- Tombol-tombol dibuat ringkas (pills) dengan warna solid seperti gambar -->
                <button onclick="bukaModalGantiArea()" id="btn-ganti-area" class="bg-orange-500 hover:bg-orange-600 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95">
                    <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Ganti Area
                </button>
                <button onclick="bukaModalSTBJ()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95">
                    <i data-lucide="table" class="w-3.5 h-3.5"></i> Data STBJ
                </button>
                
                <div class="w-px h-5 bg-slate-300 mx-0.5 self-center shrink-0"></div> 
                
                <button onclick="cancelLangsir()" id="btn-cancel-langsir" class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95">
                    <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Cancel Langsir
                </button>
                <button onclick="hapusBarisHold()" id="btn-hapus-hold" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus
                </button>

                <div class="w-px h-5 bg-slate-300 mx-0.5 self-center shrink-0"></div> 
                
                <button onclick="toggleSidebarFilter()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95">
                    <i data-lucide="filter" class="w-3.5 h-3.5"></i> Filter
                </button>
                <button onclick="salinDataTabel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 shadow-sm shrink-0 transition active:scale-95">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i> Salin
                </button>
                
            </div>
            <!-- REVISI PENULISAN: Menggunakan "Geser menu tombol ke kanan-kiri" -->
            <div class="text-[9px] text-slate-400 text-center font-black uppercase tracking-wider pointer-events-none flex items-center justify-center gap-1">
                <i data-lucide="arrow-left-right" class="w-3 h-3"></i> Geser menu tombol ke kanan-kiri
            </div>
        </div>

        <!-- TABEL DATA EDGE-TO-EDGE -->
        <div class="bg-white flex-1 overflow-hidden relative">
            <div class="table-container overflow-x-auto w-full h-full max-h-full hide-scrollbar">
                <table class="w-full border-collapse whitespace-nowrap" id="main-table">
                    <!-- Header sangat gelap (slate-900) dengan z-20 -->
                    <thead class="sticky top-0 z-20 shadow-sm" id="thead-riwayat"></thead>
                    <tbody id="tbody-riwayat" class="text-center text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SIDEBAR FILTER -->
    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4 text-blue-600"></i> Filter Tabel Lengkap</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-4 overflow-y-auto">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Waktu</label><input type="text" id="f-waktu" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli (Hold)</label><input type="text" id="f-troli" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Area</label><input type="text" id="f-area" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="f-qr" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="text" id="f-tgl" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label><input type="text" id="f-mesin" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label><input type="text" id="f-shift" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><input type="text" id="f-jenis" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label><input type="text" id="f-nama" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><input type="text" id="f-pjg" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><input type="text" id="f-grade" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><input type="text" id="f-dus" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="f-shading" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PO Awal</label><input type="text" id="f-po" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="f-ket" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PIC Input</label><input type="text" id="f-pic" oninput="saringTabelRiwayat()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            </div>
            <button onclick="resetFilter()" class="mt-4 py-3 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-lg text-xs uppercase transition border border-slate-300">RESET FILTER</button>
        </div>
    </div>

    <!-- MODAL GANTI AREA -->
    <div id="modal-ganti-area" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[80] px-4 backdrop-blur-sm">
        <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-200">
            <h3 class="text-lg font-black mb-1 flex items-center gap-2 text-slate-800"><i data-lucide="map-pin" class="text-emerald-600"></i> Ganti Area Penyimpanan</h3>
            <p class="text-[11px] font-bold text-slate-500 mb-6 border-b border-slate-100 pb-3" id="teks-info-area">Memilih X kardus untuk dipindah.</p>
            <div class="mb-6">
                <label class="block text-[10px] font-black uppercase tracking-wide mb-2 text-slate-600">Pindah Ke Area Baru</label>
                <select id="select-new-area" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-emerald-600 font-bold text-slate-800 uppercase cursor-pointer bg-slate-50">
                    <option value="">-- PILIH AREA --</option>
                </select>
            </div>
            <div class="flex gap-2">
                <button type="button" onclick="tutupModalArea()" class="w-1/2 py-2.5 bg-slate-200 text-slate-700 font-black rounded-xl hover:bg-slate-300 transition cursor-pointer text-xs uppercase">BATAL</button>
                <button type="button" onclick="eksekusiGantiArea()" id="btn-eks-area" class="w-1/2 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-md transition flex justify-center items-center gap-2 cursor-pointer active:scale-95 text-xs uppercase border-b-4 border-emerald-800"><i data-lucide="save" class="w-4 h-4"></i> SIMPAN</button>
            </div>
        </div>
    </div>

    <!-- MODAL DATA STBJ -->
    <div id="modal-stbj-langsir" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-6xl border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="table" class="w-4 h-4 text-purple-600"></i> DATA HASIL STBJ GUDANG</h3>
                <button onclick="tutupModalSTBJ()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-3 bg-white border-b border-slate-100 flex gap-2">
                <input type="text" id="f-stbj-modal" oninput="saringTabelModalSTBJ()" class="w-full p-2.5 text-sm border-2 border-slate-200 rounded-lg focus:border-purple-500 outline-none font-bold bg-slate-50" placeholder="Cari QRCode, Troli, Item, PO, dll...">
            </div>
            <div class="overflow-y-auto flex-1 hide-scrollbar p-0 bg-slate-50">
                <table class="w-full border-collapse text-sm whitespace-nowrap bg-white text-center">
                    <thead class="sticky top-0 shadow-sm z-10 bg-slate-800">
                        <tr>
                            <th class="hdr-std w-10">No</th>
                            <th class="hdr-std">Waktu</th>
                            <th class="hdr-std text-amber-300">Troli</th>
                            <th class="hdr-std border-r border-slate-500">QRCode</th>
                            <th class="hdr-std text-blue-300">Item</th>
                            <th class="hdr-std">Pjg</th>
                            <th class="hdr-std border-r border-slate-500">PO</th>
                            <th class="hdr-std text-indigo-300">Status Item</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-stbj-modal" class="text-slate-700"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="overlay-klik-luar" onclick="tutupPopups()" class="hidden fixed inset-0 z-30 bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="global.js"></script>
    <script src="riwayat_langsir_logic.js"></script>
</body>
</html>
