<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Riwayat Langsir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }

        tr.selected-row td { background-color: #ccfbf1 !important; color: #0f766e !important; }
        .col-hidden { display: none !important; }
        .hdr-filtered { background-color: #312e81 !important; color: #fbbf24 !important; }
        
        .resizer {
            position: absolute;
            top: 0; right: 0; width: 5px;
            cursor: col-resize; user-select: none;
            height: 100%; z-index: 50;
        }
        .resizer:hover, .resizing { background-color: rgba(59, 130, 246, 0.5); }

        /* TEKS VERTIKAL TOMBOL EDGE PANEL HP */
        .vertical-text-up {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-orientation: mixed;
        }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200 shadow-sm relative">
            <!-- KOMPONEN DINAMIS: SUBMENU TABS -->
            <div id="container-submenu"></div>

            <!-- TOOLBAR ATAS (KHUSUS PC/DESKTOP: DERETAN TOMBOL BIASA) -->
            <div id="desktop-toolbar" class="hidden sm:flex items-center justify-between p-3 sm:p-4 bg-slate-50/50 border-t border-slate-100 w-full">
                <div class="flex gap-2 items-center overflow-x-auto hide-scrollbar">
                    <button onclick="bukaModalGantiArea()" id="btn-ganti-area" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-orange-600">
                        <div class="bg-orange-700 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="map-pin" class="w-4 h-4"></i></div>
                        <div class="bg-orange-600 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-orange-500 transition">Ganti Area</div>
                    </button>

                    <button onclick="bukaModalSTBJ()" id="btn-data-stbj" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-purple-700">
                        <div class="bg-purple-800 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="table" class="w-4 h-4"></i></div>
                        <div class="bg-purple-600 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-purple-500 transition">Data STBJ</div>
                    </button>
                    
                    <button onclick="bukaModalHold('hold_stbj')" id="btn-tabel-hold" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-amber-600">
                        <div class="bg-amber-700 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="pause-circle" class="w-4 h-4"></i></div>
                        <div class="bg-amber-500 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-amber-400 transition">Tabel Hold</div>
                    </button>

                    <button onclick="cancelLangsir()" id="btn-cancel-langsir" class="group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-rose-700">
                        <div class="bg-rose-800 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></div>
                        <div class="bg-rose-600 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-rose-500 transition">Cancel Langsir</div>
                    </button>

                    <button onclick="hapusBarisHold()" id="btn-hapus-hold" class="hidden group flex items-stretch shrink-0 cursor-pointer shadow-sm active:scale-95 transition rounded-md overflow-hidden border border-red-800">
                        <div class="bg-red-900 text-white flex items-center justify-center px-3 py-2.5"><i data-lucide="trash-2" class="w-4 h-4"></i></div>
                        <div class="bg-red-700 text-white font-bold text-[11px] px-4 py-2.5 flex items-center uppercase tracking-wide group-hover:bg-red-600 transition">Hapus Hold</div>
                    </button>
                </div>

                <div class="relative ml-auto">
                    <button onclick="toggleActionMenuPC(event)" class="p-2.5 bg-white rounded-md border border-slate-300 shadow-sm active:scale-95 text-slate-600 hover:bg-slate-50 transition" title="Menu Tombol">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <div id="pc-action-menu" class="hidden absolute right-0 top-full mt-2 w-48 bg-white shadow-xl rounded-md border border-slate-200 z-50 flex flex-col overflow-hidden">
                        <button onclick="salinDataTabel(); toggleActionMenuPC(event)" id="btn-salin-data" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="copy" class="w-4 h-4 text-slate-500"></i> Salin Data</button>
                        <button onclick="downloadXLS(); toggleActionMenuPC(event)" id="btn-download-xls" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-slate-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-600"></i> Export Excel</button>
                        <button onclick="toggleSidebarKolom(); toggleActionMenuPC(event)" id="btn-sidebar-kolom" class="text-left px-4 py-3 border-b border-slate-100 text-xs font-bold text-blue-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="columns" class="w-4 h-4 text-blue-600"></i> Atur Kolom</button>
                        <button onclick="bukaModalTableDesign(); toggleActionMenuPC(event)" id="btn-table-design" class="text-left px-4 py-3 text-xs font-bold text-purple-700 flex items-center gap-2 hover:bg-slate-50 transition"><i data-lucide="palette" class="w-4 h-4 text-purple-600"></i> Table Design</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION (TABEL 3D DATA) -->
        <div class="flex-1 min-h-0 bg-slate-100 p-3 sm:p-4 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 overflow-y-auto custom-scroll table-container bg-white rounded-xl shadow-sm border border-slate-300">
                <table class="w-full text-left border-separate border-spacing-0 whitespace-nowrap" id="main-table">
                    <thead class="sticky top-0 z-50 shadow-sm" id="thead-riwayat"></thead>
                    <tbody id="tbody-riwayat" class="text-slate-800"></tbody>
                </table>
            </div>
        </div>

        <!-- KOMPONEN DINAMIS: FOOTER PAGINATION -->
        <div id="container-footer" class="shrink-0 w-full bg-white p-3 sm:p-4 flex flex-col md:flex-row justify-between items-center gap-4 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300"></div>

    </div>

    <!-- TOMBOL INDUK ALA SAMSUNG EDGE PANEL (KHUSUS HP: sm:hidden, PUTIH, VERTIKAL, BISA DI-DRAG KE ATAS-BAWAH) -->
    <div id="edge-panel-handle" style="top: 45%;" class="sm:hidden fixed right-0 z-40 select-none touch-none transition-shadow">
        <div id="edge-panel-btn" class="bg-white hover:bg-slate-50 text-slate-800 border-2 border-r-0 border-slate-300 rounded-l-2xl shadow-2xl py-3 px-1.5 flex flex-col items-center justify-center gap-2 cursor-pointer active:scale-95 group">
            <div class="p-1 rounded-lg bg-indigo-50 text-indigo-700 group-hover:bg-indigo-600 group-hover:text-white transition">
                <i data-lucide="menu" class="w-4 h-4"></i>
            </div>
            <span class="vertical-text-up text-[10px] font-black tracking-widest text-slate-600 group-hover:text-indigo-700 uppercase leading-none py-1">
                MENU TOMBOL
            </span>
            <div class="flex flex-col gap-0.5 opacity-40">
                <div class="w-1 h-1 rounded-full bg-slate-400"></div>
                <div class="w-1 h-1 rounded-full bg-slate-400"></div>
                <div class="w-1 h-1 rounded-full bg-slate-400"></div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR DRAWER MENU TOMBOL KHUSUS HP (SLIDE-IN KANAN DENGAN TILE MEMANJANG KE BAWAH BERWARNA) -->
    <div id="sidebar-menu-drawer" class="fixed inset-y-0 right-0 w-72 sm:w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[110] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-900 text-white">
            <h3 class="font-black text-sm uppercase flex items-center gap-2">
                <i data-lucide="layout-grid" class="w-4 h-4 text-indigo-400"></i> Menu Tombol
            </h3>
            <button onclick="toggleMenuDrawer()" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="p-4 flex-1 overflow-y-auto custom-scroll">
            <!-- TILE MEMANJANG KE BAWAH DENGAN BACKGROUND BERWARNA CERAH -->
            <div class="flex flex-col gap-2.5">
                <!-- 1. Ganti Area -->
                <button onclick="bukaModalGantiArea(); toggleMenuDrawer()" id="btn-ganti-area-mob" class="w-full p-3 bg-orange-600 hover:bg-orange-700 text-white font-black text-xs uppercase rounded-xl shadow-md border-b-4 border-orange-800 flex items-center gap-3 transition active:scale-95 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-orange-700/60 flex items-center justify-center shrink-0"><i data-lucide="map-pin" class="w-4 h-4"></i></div>
                    <span class="tracking-wide">Ganti Area</span>
                </button>

                <!-- 2. Data STBJ -->
                <button onclick="bukaModalSTBJ(); toggleMenuDrawer()" id="btn-data-stbj-mob" class="w-full p-3 bg-purple-600 hover:bg-purple-700 text-white font-black text-xs uppercase rounded-xl shadow-md border-b-4 border-purple-800 flex items-center gap-3 transition active:scale-95 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-purple-700/60 flex items-center justify-center shrink-0"><i data-lucide="table" class="w-4 h-4"></i></div>
                    <span class="tracking-wide">Data STBJ</span>
                </button>

                <!-- 3. Tabel Hold -->
                <button onclick="bukaModalHold('hold_stbj'); toggleMenuDrawer()" id="btn-tabel-hold-mob" class="w-full p-3 bg-amber-500 hover:bg-amber-600 text-white font-black text-xs uppercase rounded-xl shadow-md border-b-4 border-amber-700 flex items-center gap-3 transition active:scale-95 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-amber-600/60 flex items-center justify-center shrink-0"><i data-lucide="pause-circle" class="w-4 h-4"></i></div>
                    <span class="tracking-wide">Tabel Hold</span>
                </button>

                <!-- 4. Cancel Langsir -->
                <button onclick="cancelLangsir(); toggleMenuDrawer()" id="btn-cancel-langsir-mob" class="w-full p-3 bg-rose-600 hover:bg-rose-700 text-white font-black text-xs uppercase rounded-xl shadow-md border-b-4 border-rose-800 flex items-center gap-3 transition active:scale-95 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-rose-700/60 flex items-center justify-center shrink-0"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></div>
                    <span class="tracking-wide">Cancel Langsir</span>
                </button>

                <!-- 5. Hapus Permanen Hold -->
                <button onclick="hapusBarisHold(); toggleMenuDrawer()" id="btn-hapus-hold-mob" class="w-full p-3 bg-red-700 hover:bg-red-800 text-white font-black text-xs uppercase rounded-xl shadow-md border-b-4 border-red-900 flex items-center gap-3 transition active:scale-95 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-red-800/60 flex items-center justify-center shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></div>
                    <span class="tracking-wide">Hapus Hold</span>
                </button>

                <!-- 6. Salin Data -->
                <button onclick="salinDataTabel(); toggleMenuDrawer()" id="btn-salin-data-mob" class="w-full p-3 bg-slate-700 hover:bg-slate-800 text-white font-black text-xs uppercase rounded-xl shadow-md border-b-4 border-slate-900 flex items-center gap-3 transition active:scale-95 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-slate-800/60 flex items-center justify-center shrink-0"><i data-lucide="copy" class="w-4 h-4"></i></div>
                    <span class="tracking-wide">Salin Data</span>
                </button>

                <!-- 7. Export Excel -->
                <button onclick="downloadXLS(); toggleMenuDrawer()" id="btn-download-xls-mob" class="w-full p-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs uppercase rounded-xl shadow-md border-b-4 border-emerald-800 flex items-center gap-3 transition active:scale-95 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-emerald-700/60 flex items-center justify-center shrink-0"><i data-lucide="file-spreadsheet" class="w-4 h-4"></i></div>
                    <span class="tracking-wide">Export Excel</span>
                </button>

                <!-- 8. Atur Kolom -->
                <button onclick="toggleSidebarKolom(); toggleMenuDrawer()" id="btn-sidebar-kolom-mob" class="w-full p-3 bg-blue-600 hover:bg-blue-700 text-white font-black text-xs uppercase rounded-xl shadow-md border-b-4 border-blue-800 flex items-center gap-3 transition active:scale-95 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-blue-700/60 flex items-center justify-center shrink-0"><i data-lucide="columns" class="w-4 h-4"></i></div>
                    <span class="tracking-wide">Atur Kolom</span>
                </button>

                <!-- 9. Table Design -->
                <button onclick="bukaModalTableDesign(); toggleMenuDrawer()" id="btn-table-design-mob" class="w-full p-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-xs uppercase rounded-xl shadow-md border-b-4 border-indigo-800 flex items-center gap-3 transition active:scale-95 cursor-pointer">
                    <div class="w-8 h-8 rounded-lg bg-indigo-700/60 flex items-center justify-center shrink-0"><i data-lucide="palette" class="w-4 h-4"></i></div>
                    <span class="tracking-wide">Table Design</span>
                </button>
            </div>
        </div>
    </div>

    <!-- BACKDROP OVERLAY KHUSUS MENU DRAWER HP -->
    <div id="overlay-menu-drawer" onclick="toggleMenuDrawer()" class="hidden fixed inset-0 bg-slate-900/40 z-[105] backdrop-blur-sm transition-opacity"></div>

    <!-- MODAL CUSTOM ALERT -->
    <div id="modal-custom-alert" class="hidden fixed inset-0 items-center justify-center bg-slate-900/70 z-[200] px-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-200 text-center flex flex-col items-center">
            <div id="alert-icon-container" class="w-16 h-16 rounded-full flex items-center justify-center mb-4">
                <i id="alert-icon" data-lucide="info" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-black mb-2 text-slate-800" id="alert-title">Perhatian</h3>
            <p class="text-sm font-semibold text-slate-500 mb-6 leading-relaxed" id="alert-message">Pesan alert di sini.</p>
            <button onclick="document.getElementById('modal-custom-alert').classList.add('hidden'); document.getElementById('modal-custom-alert').classList.remove('flex');" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-black rounded-xl shadow-md text-xs uppercase transition active:scale-95 cursor-pointer">Tutup</button>
        </div>
    </div>

    <!-- MODAL FILTER EXCEL SPREADSHEET -->
    <div id="excel-filter-menu" class="hidden fixed bg-white shadow-2xl border border-slate-300 rounded-2xl w-64 z-[120] flex flex-col font-sans text-sm overflow-hidden">
        <div class="p-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <span class="font-black text-slate-700 text-xs uppercase tracking-wider" id="filter-col-name">Filter</span>
            <button onclick="closeFilterMenu()" class="text-slate-400 hover:text-rose-500 bg-white border border-slate-200 p-1 rounded transition shadow-sm cursor-pointer"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        </div>
        
        <div class="p-2 border-b border-slate-200 flex flex-col gap-1 bg-white">
            <button onclick="sortFromMenu('asc')" class="text-left px-3 py-2 hover:bg-slate-100 rounded-lg text-xs font-bold text-slate-700 flex items-center gap-2 transition cursor-pointer"><i data-lucide="arrow-down-a-z" class="w-4 h-4 text-blue-600"></i> Urutkan A ke Z</button>
            <button onclick="sortFromMenu('desc')" class="text-left px-3 py-2 hover:bg-slate-100 rounded-lg text-xs font-bold text-slate-700 flex items-center gap-2 transition cursor-pointer"><i data-lucide="arrow-up-z-a" class="w-4 h-4 text-blue-600"></i> Urutkan Z ke A</button>
        </div>

        <div class="p-2 border-b border-slate-100 bg-slate-50">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
                <input type="text" id="filter-search-input" oninput="searchFilterList(this.value)" autocomplete="off" class="w-full pl-8 p-1.5 text-xs font-bold border border-slate-300 bg-white rounded-lg focus:border-blue-500 outline-none transition shadow-inner" placeholder="Cari Spesifik...">
            </div>
        </div>
        <div class="p-2 max-h-48 overflow-y-auto flex flex-col gap-1 text-xs bg-white custom-scroll" id="filter-values-list"></div>
        <div class="p-3 border-t border-slate-200 bg-slate-50 flex justify-between gap-2">
            <button onclick="clearFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-100 transition shadow-sm cursor-pointer">Reset</button>
            <button onclick="applyFilterForCurrentCol()" class="w-1/2 py-2 text-xs font-bold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition shadow-sm cursor-pointer">Terapkan</button>
        </div>
    </div>

    <!-- MODAL GANTI AREA -->
    <div id="modal-ganti-area" class="hidden fixed inset-0 items-center justify-center bg-slate-900/60 z-[80] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-200">
            <h3 class="text-base font-black mb-1 flex items-center gap-2 text-slate-800"><i data-lucide="map-pin" class="text-orange-600 w-5 h-5"></i> Ganti Area Penyimpanan</h3>
            <p class="text-xs text-slate-500 mb-5 border-b border-slate-100 pb-3 font-bold" id="teks-info-area">Memilih dus untuk dipindah.</p>
            <div class="mb-6">
                <label class="block text-xs font-black uppercase tracking-wide text-slate-600 mb-2">Pilih Area Baru</label>
                <select id="select-new-area" class="w-full p-3 border-2 border-slate-200 rounded-xl outline-none focus:border-orange-500 text-slate-800 uppercase cursor-pointer bg-slate-50 text-sm font-bold transition">
                    <option value="">-- PILIH AREA --</option>
                </select>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="tutupModalArea()" class="w-1/3 py-2.5 text-slate-600 font-bold hover:bg-slate-100 rounded-xl transition text-xs uppercase cursor-pointer">Batal</button>
                <button type="button" onclick="eksekusiGantiArea()" id="btn-eks-area" class="w-2/3 py-2.5 bg-orange-600 hover:bg-orange-700 text-white font-black rounded-xl shadow-md transition flex items-center justify-center gap-2 text-xs uppercase border-b-4 border-orange-800 cursor-pointer"><i data-lucide="save" class="w-4 h-4"></i> Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL STBJ GUDANG -->
    <div id="modal-stbj-langsir" class="hidden fixed inset-0 items-center justify-center bg-slate-900/60 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white shadow-2xl w-full max-w-5xl border border-slate-200 flex flex-col max-h-[85vh] rounded-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-black text-slate-800 flex items-center gap-2 text-sm uppercase"><i data-lucide="table" class="w-5 h-5 text-purple-600"></i> Data Hasil STBJ Gudang</h3>
                <button onclick="tutupModalSTBJ()" class="text-slate-400 hover:text-slate-700 hover:bg-slate-100 p-1.5 transition rounded-lg cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-3 border-b border-slate-100 bg-white">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                    <input type="text" id="f-stbj-modal" oninput="saringTabelModalSTBJ()" class="w-full pl-9 p-2.5 text-xs font-bold border border-slate-200 rounded-xl outline-none focus:border-purple-500 transition bg-slate-50" placeholder="Ketik QR Code, Troli, Item, Customer...">
                </div>
            </div>
            <div class="overflow-y-auto flex-1 hide-scrollbar p-3 bg-slate-100">
                <div id="tbody-stbj-modal" class="flex flex-col gap-0"></div>
            </div>
        </div>
    </div>

    <!-- MODAL TABEL HOLD -->
    <div id="modal-hold-langsir" class="hidden fixed inset-0 items-center justify-center bg-slate-900/60 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-black text-slate-800 flex items-center gap-2 text-sm uppercase"><i data-lucide="archive" class="w-5 h-5 text-amber-600"></i> Tabel Hold</h3>
                <button onclick="tutupModalHold()" class="text-slate-400 hover:text-slate-700 hover:bg-slate-100 p-1.5 transition rounded-lg cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar px-2 pt-2">
                <button onclick="bukaModalHold('hold_stbj')" id="tab-hold-stbj" class="pb-2 px-4 tab-active transition whitespace-nowrap text-xs uppercase font-bold">Hold STBJ</button>
                <button onclick="bukaModalHold('hold_langsir')" id="tab-hold-langsir" class="pb-2 px-4 tab-inactive hover:text-slate-800 transition whitespace-nowrap text-xs uppercase font-bold">Hold Langsir</button>
            </div>
            <div class="overflow-y-auto flex-1 custom-scroll p-3 bg-slate-100">
                <div id="tbody-hold-modal" class="flex flex-col gap-0"></div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR ATUR KOLOM -->
    <div id="sidebar-kolom" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="columns" class="w-4 h-4 text-blue-600"></i> Atur Urutan Kolom</h3>
            <button onclick="toggleSidebarKolom()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded transition cursor-pointer"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 bg-blue-50 border-b border-blue-100 text-xs text-blue-800 font-medium leading-relaxed">
            Tahan dan geser (Drag & Drop) kotak di bawah ini untuk mengatur urutan kolom.
        </div>
        <div class="p-3 flex flex-col gap-2 overflow-y-auto custom-scroll flex-1" id="kolom-drag-container"></div>
        <div class="p-4 border-t border-slate-200 bg-slate-50 flex gap-2">
            <button onclick="resetUrutanKolom()" class="w-1/3 py-2.5 bg-white border border-slate-300 text-slate-600 font-bold rounded-md text-xs uppercase transition hover:bg-slate-100 shadow-sm cursor-pointer">Reset</button>
            <button onclick="simpanUrutanKolom()" class="w-2/3 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-md text-xs uppercase transition shadow-md flex justify-center items-center gap-2 border-b-4 border-blue-800 cursor-pointer"><i data-lucide="save" class="w-4 h-4"></i> Simpan</button>
        </div>
    </div>

    <div id="overlay-klik-luar" onclick="tutupSemuaPopup()" class="hidden fixed inset-0 z-[40] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="wms_parser.js"></script>
    <script src="riwayat_langsir_logic.js"></script>
</body>
</html>
