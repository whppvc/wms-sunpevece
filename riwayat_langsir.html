<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Riwayat Langsir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="font-sans">
    <div class="w-full">
        <div class="bg-white p-5 rounded-xl shadow-sm mb-4 border border-slate-200">
            <h3 class="text-xs font-black opacity-60 uppercase mb-3 flex items-center gap-2 text-slate-600"><i data-lucide="filter" class="w-4 h-4"></i> Filter Riwayat Fisik Masuk</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
                <input type="text" id="flt-qr" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800 focus:ring-1 focus:ring-slate-400" placeholder="QR Code...">
                <input type="text" id="flt-area" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="Area...">
                <input type="text" id="flt-jenis" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="Jenis Item...">
                <input type="text" id="flt-nama" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="Nama Item...">
                <input type="text" id="flt-po" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="PO Awal...">
                <input type="text" id="flt-pic" oninput="saringTabel()" class="p-2.5 text-xs border border-slate-300 font-bold rounded outline-none focus:border-slate-800" placeholder="User / PIC...">
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="overflow-x-auto w-full max-h-[60vh] hide-scrollbar">
                <table class="w-full border-collapse text-sm whitespace-nowrap">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std border-r border-slate-500">Tgl Masuk</th>
                            <th class="hdr-std">Area</th>
                            <th class="hdr-std border-r border-slate-500">QRCode</th>
                            <th class="hdr-std">Jenis</th>
                            <th class="hdr-std">Nama Item</th>
                            <th class="hdr-std">Pjg</th>
                            <th class="hdr-std">Grade</th>
                            <th class="hdr-std">Dus</th>
                            <th class="hdr-std border-r border-slate-500">Shading</th>
                            <th class="hdr-std bg-slate-900 border-r border-slate-500 text-orange-400">PO Awal</th>
                            <th class="hdr-std">User / PIC</th>
                        </tr>
                    </thead>
                    <tbody id="data-body" class="text-center text-slate-700"><tr><td colspan="12" class="p-10"><i data-lucide="loader-2" class="animate-spin w-8 h-8 mx-auto mb-3 text-slate-500"></i><p class="font-bold text-slate-500">Memuat Data...</p></td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        let globalData = [];
        let currentUser = JSON.parse(localStorage.getItem('user_session')) || {username: ''};

        document.addEventListener('DOMContentLoaded', () => {
            initModernLayout({ id: 'riwayat_langsir', title: 'RIWAYAT LANGSIR', url: 'riwayat_langsir.html' });
            setTimeout(async () => {
                document.getElementById('flt-pic').value = currentUser.username;
                await loadData();
            }, 200);
        });

        async function loadData() {
            try {
                const { data, error } = await db.from('stok_qr').select('*').order('created_at', {ascending: false}).limit(500);
                if(error) throw error; globalData = data || []; renderTable();
            } catch (err) { document.getElementById('data-body').innerHTML = `<tr><td colspan="12" class="p-10 text-center text-red-500 font-bold">Error: ${err.message}</td></tr>`; }
        }

        function formatTanggal(isoString) { if(!isoString) return '-'; return new Date(isoString).toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }

        function renderTable() {
            const tbody = document.getElementById('data-body');
            if(globalData.length === 0) { tbody.innerHTML = `<tr><td colspan="12" class="text-center p-10 text-slate-500 font-bold">Belum ada data.</td></tr>`; lucide.createIcons(); return; }
            let html = ''; 
            globalData.forEach((r, i) => {
                const parts = r.id_sku.split('_'); const jenis = parts[1] || '-'; const nama = parts[2] || '-'; const pjg = parts[3] || '-'; const grade = parts[4] || '-'; const dus = parts[5] || '-'; const shading = parts[6] || '-'; const po = parts[7] || '-';
                html += `
                    <tr class="border-b border-slate-200 hover:bg-slate-100 transition data-row">
                        <td class="p-3 font-bold text-slate-400">${i+1}</td>
                        <td class="p-3 font-black text-slate-800 border-r border-slate-200">${formatTanggal(r.created_at)}</td>
                        <td class="p-3 font-black text-emerald-600 col-area">${r.area}</td>
                        <td class="p-3 font-mono font-bold text-slate-900 border-r border-slate-200 col-qr bg-slate-50">${r.qrcode}</td>
                        <td class="p-3 font-bold text-blue-700 col-jenis">${jenis}</td>
                        <td class="p-3 font-bold text-slate-800 text-left col-nama">${nama}</td>
                        <td class="p-3 font-bold text-slate-500 col-pjg">${pjg}</td>
                        <td class="p-3 font-semibold text-slate-800 col-grade">${grade}</td>
                        <td class="p-3 text-slate-800 col-dus">${dus}</td>
                        <td class="p-3 font-medium text-slate-600 col-shading border-r border-slate-200">${shading}</td>
                        <td class="p-3 font-black text-orange-600 bg-orange-50/50 col-po border-r border-slate-200">${po}</td>
                        <td class="p-3 font-bold text-[10px] uppercase col-pic">${r.pic_input}</td>
                    </tr>`;
            });
            tbody.innerHTML = html; lucide.createIcons(); saringTabel();
        }

        function saringTabel() {
            const filters = { qr: document.getElementById('flt-qr').value.toLowerCase(), area: document.getElementById('flt-area').value.toLowerCase(), jenis: document.getElementById('flt-jenis').value.toLowerCase(), nama: document.getElementById('flt-nama').value.toLowerCase(), po: document.getElementById('flt-po').value.toLowerCase(), pic: document.getElementById('flt-pic').value.toLowerCase() };
            document.querySelectorAll('.data-row').forEach(row => {
                let show = true; for(let key in filters) { if(filters[key] !== '') { const cell = row.querySelector('.col-' + key); if(cell && !cell.innerText.toLowerCase().includes(filters[key])) { show = false; break; } } }
                row.style.display = show ? '' : 'none';
            });
        }
    </script>
</body>
</html>
