<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Riwayat Langsir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- PINDAHKAN GLOBAL.JS KE SINI -->
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-container { position: relative; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .hdr-std { 
            background-color: #f8fafc !important; 
            color: #64748b !important; 
            text-align: center !important; 
            padding: 0.75rem 1rem !important; 
            font-size: 0.75rem !important; 
            font-weight: 600 !important; 
            text-transform: uppercase !important; 
            letter-spacing: 0.05em !important; 
            white-space: nowrap !important; 
            position: sticky !important; 
            top: 0 !important; 
            z-index: 20 !important; 
            border-bottom: 1px solid #e2e8f0 !important; 
        }
        
        tr.selected-row { background-color: #f0f9ff !important; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; border-bottom: 2px solid transparent; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10">
        
        <!-- HEADER SECTION -->
        <div class="shrink-0 bg-white flex flex-col z-20 border-b border-slate-200">
            
            <!-- Tabs -->
            <div class="flex px-6 pt-2 gap-6 overflow-x-auto hide-scrollbar">
                <button onclick="gantiModeRiwayat('qr')" id="tab-r-qr" class="pb-3 tab-active transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="list" class="w-4 h-4"></i> Detail QRCode</button>
                <button onclick="gantiModeRiwayat('agregasi')" id="tab-r-agregasi" class="pb-3 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> Rangkuman Item & Qty</button>
                <button onclick="gantiModeRiwayat('hold')" id="tab-r-hold" class="pb-3 tab-inactive hover:text-slate-800 transition whitespace-nowrap flex items-center gap-2 text-sm"><i data-lucide="pause-circle" class="w-4 h-4"></i> Tabel Hold</button>
            </div>

            <!-- Toolbar -->
            <div class="p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-50/50 border-t border-slate-100">
                <div class="flex gap-2 items-center overflow-x-auto hide-scrollbar whitespace-nowrap w-full">
                    
                    <button onclick="bukaModalGantiArea()" id="btn-ganti-area" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="map-pin" class="w-4 h-4 text-orange-600"></i> Ganti Area
                    </button>

                    <button onclick="bukaModalSTBJ()" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="table" class="w-4 h-4 text-purple-600"></i> Data STBJ
                    </button>
                    
                    <div class="w-px h-5 bg-slate-300 mx-1 shrink-0"></div> 
                    
                    <button onclick="cancelLangsir()" id="btn-cancel-langsir" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="rotate-ccw" class="w-4 h-4 text-rose-600"></i> Cancel Langsir
                    </button>

                    <button onclick="hapusBarisHold()" id="btn-hapus-hold" class="hidden flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="trash-2" class="w-4 h-4 text-red-600"></i> Hapus Permanen
                    </button>

                    <div class="w-px h-5 bg-slate-300 mx-1 shrink-0"></div> 
                    
                    <button onclick="salinDataTabel()" class="flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="copy" class="w-4 h-4 text-slate-600"></i> Salin
                    </button>
                    
                    <button onclick="toggleSidebarFilter()" class="ml-auto flex items-center gap-2 px-3 py-1.5 bg-blue-600 text-white hover:bg-blue-700 rounded-md text-sm font-medium transition shadow-sm">
                        <i data-lucide="filter" class="w-4 h-4"></i> Filter
                    </button>
                </div>
            </div>
        </div>

        <!-- MIDDLE SCROLL SECTION -->
        <div class="flex-1 min-h-0 bg-white overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 overflow-y-auto custom-scroll table-container">
                <table class="w-full text-center border-collapse whitespace-nowrap" id="main-table">
                    <thead class="sticky top-0 z-10" id="thead-riwayat"></thead>
                    <tbody id="tbody-riwayat" class="text-slate-700"></tbody>
                </table>
            </div>
        </div>

        <!-- FOOTER PAGINATION -->
        <div class="shrink-0 w-full bg-white p-3 flex flex-col md:flex-row justify-between items-center gap-4 z-20 border-t border-slate-200">
            <div class="flex items-center gap-4 text-sm text-slate-500">
                <span>Total: <strong class="text-slate-800" id="lbl-tampil-baris">0</strong> baris</span>
                <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                <span>Qty: <strong class="text-slate-800" id="lbl-total-qty">0</strong> dus</span>
                <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                <span>Dipilih: <strong class="text-blue-600" id="lbl-pilih-baris">0</strong></span>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-500">Baris per halaman:</span>
                    <select id="select-rows-per-page" onchange="changeRowsPerPage(this.value)" class="text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md outline-none cursor-pointer px-2 py-1 focus:border-blue-500 transition">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="ALL">Semua</option>
                        <option value="CUSTOM">Isi Sendiri...</option>
                    </select>
                    <input type="number" id="input-custom-rows" oninput="setCustomRowsPerPage(this.value)" class="hidden w-16 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-md outline-none px-2 py-1 text-center focus:border-blue-500 transition" placeholder="Jml">
                </div>
                
                <div class="flex items-center gap-1">
                    <button onclick="prevPage()" class="p-1.5 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-md transition disabled:opacity-50"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                    <span class="text-sm font-medium text-slate-700 px-2">Hal <span id="lbl-halaman">1</span> dari <span id="lbl-total-halaman">1</span></span>
                    <button onclick="nextPage()" class="p-1.5 text-slate-500 hover:bg-slate-100 hover:text-slate-800 rounded-md transition disabled:opacity-50"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL FILTER EXCEL -->
    <div id="excel-filter-menu" class="hidden absolute bg-white shadow-xl border border-slate-200 rounded-lg w-64 z-[100] flex flex-col font-sans text-sm">
        <div class="p-3 border-b border-slate-100 flex justify-between items-center">
            <span class="font-semibold text-slate-700 text-xs uppercase tracking-wider" id="filter-col-name">Filter</span>
            <button onclick="closeFilterMenu()" class="text-slate-400 hover:text-slate-700 transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-2 border-b border-slate-100">
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
                <input type="text" id="filter-search-input" oninput="searchFilterList(this.value)" class="w-full pl-8 p-1.5 text-sm border border-slate-200 rounded-md focus:border-blue-500 outline-none transition" placeholder="Cari...">
            </div>
        </div>
        <div class="p-2 max-h-48 overflow-y-auto flex flex-col gap-1 text-sm custom-scroll" id="filter-values-list"></div>
        <div class="p-2 border-t border-slate-100 flex justify-between gap-2 bg-slate-50 rounded-b-lg">
            <button onclick="clearFilterForCurrentCol()" class="w-1/2 py-1.5 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-md hover:bg-slate-50 transition">Reset</button>
            <button onclick="applyFilterForCurrentCol()" class="w-1/2 py-1.5 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition">Terapkan</button>
        </div>
    </div>

    <!-- MODAL GANTI AREA -->
    <div id="modal-ganti-area" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/40 z-[80] px-4 backdrop-blur-sm">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm border border-slate-200">
            <h3 class="text-base font-semibold mb-1 flex items-center gap-2 text-slate-800"><i data-lucide="map-pin" class="text-orange-600 w-5 h-5"></i> Ganti Area Penyimpanan</h3>
            <p class="text-xs text-slate-500 mb-6 border-b border-slate-100 pb-3" id="teks-info-area">Memilih X kardus untuk dipindah.</p>
            <div class="mb-6">
                <label class="block text-xs font-semibold text-slate-600 mb-2">Pindah Ke Area Baru</label>
                <select id="select-new-area" class="w-full p-2.5 border border-slate-300 rounded-md outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 text-slate-800 uppercase cursor-pointer bg-white text-sm transition">
                    <option value="">-- PILIH AREA --</option>
                </select>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="tutupModalArea()" class="px-4 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-md transition text-sm">Batal</button>
                <button type="button" onclick="eksekusiGantiArea()" id="btn-eks-area" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white font-medium rounded-md shadow-sm transition flex items-center gap-2 text-sm"><i data-lucide="save" class="w-4 h-4"></i> Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL STBJ GUDANG -->
    <div id="modal-stbj-langsir" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/40 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white shadow-2xl w-full max-w-6xl border border-slate-200 flex flex-col max-h-[85vh] rounded-xl overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white">
                <h3 class="font-semibold text-slate-800 flex items-center gap-2 text-base"><i data-lucide="table" class="w-5 h-5 text-purple-600"></i> Data Hasil STBJ Gudang</h3>
                <button onclick="tutupModalSTBJ()" class="text-slate-400 hover:text-slate-700 hover:bg-slate-100 p-1.5 transition rounded-md"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                    <input type="text" id="f-stbj-modal" oninput="saringTabelModalSTBJ()" class="w-full pl-9 p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-purple-500 transition bg-white" placeholder="Cari QRCode, Troli, Item, PO, dll...">
                </div>
            </div>
            <div class="overflow-y-auto flex-1 hide-scrollbar p-3 bg-slate-100">
                <div id="tbody-stbj-modal" class="flex flex-col gap-0"></div>
            </div>
        </div>
    </div>

    <!-- MODAL TABEL HOLD -->
    <div id="modal-hold-langsir" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/40 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white">
                <h3 class="font-semibold text-slate-800 flex items-center gap-2 text-base"><i data-lucide="archive" class="w-5 h-5 text-amber-600"></i> Tabel Hold</h3>
                <button onclick="tutupModalHold()" class="text-slate-400 hover:text-slate-700 hover:bg-slate-100 p-1.5 transition rounded-md"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar px-2 pt-2">
                <button onclick="bukaModalHold('hold_stbj')" id="tab-hold-stbj" class="pb-2 px-4 tab-active transition whitespace-nowrap text-xs uppercase font-bold">Hold STBJ</button>
                <button onclick="bukaModalHold('hold_langsir')" id="tab-hold-langsir" class="pb-2 px-4 tab-inactive hover:text-slate-800 transition whitespace-nowrap text-xs uppercase font-bold">Hold Langsir</button>
            </div>
            <div class="overflow-y-auto flex-1 custom-scroll p-3 bg-slate-100">
                <div id="tbody-hold-modal" class="flex flex-col gap-0"></div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR FILTER LENGKAP -->
    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-white">
            <h3 class="font-semibold text-slate-800 flex items-center gap-2 text-base"><i data-lucide="filter" class="w-5 h-5 text-blue-600"></i> Filter Data</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-slate-700 hover:bg-slate-100 p-1.5 rounded-md transition"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-3 overflow-y-auto custom-scroll flex-1 bg-slate-50/50">
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2"><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="f-qr" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Troli</label><input type="text" id="f-troli" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Area</label><input type="text" id="f-area" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="text" id="f-tgl" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Mesin</label><input type="text" id="f-mesin" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Shift</label><input type="text" id="f-shift" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Jenis Item</label><input type="text" id="f-jenis" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div class="col-span-2"><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Nama Item</label><input type="text" id="f-nama" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Panjang</label><input type="text" id="f-pjg" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Grade</label><input type="text" id="f-grade" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Dus</label><input type="text" id="f-dus" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Shading</label><input type="text" id="f-shading" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">PO Bawaan</label><input type="text" id="f-po" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
                <div class="col-span-2"><label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="f-ket" oninput="saringTabelLangsir()" class="w-full p-2 text-sm border border-slate-200 rounded-md outline-none focus:border-blue-500"></div>
            </div>
        </div>
        <div class="p-4 border-t border-slate-100 bg-white">
            <button onclick="resetFilter()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-md text-sm transition">Reset Filter</button>
        </div>
    </div>

    <div id="overlay-klik-luar" onclick="tutupSemuaPopup()" class="hidden fixed inset-0 z-[40] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="riwayat_langsir_logic.js"></script>
</body>
</html>
