<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Riwayat Langsir Gudang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; border: 1px solid #334155; padding: 0.75rem; text-transform: uppercase; font-size: 11px; font-weight: 900; white-space: nowrap; }
        .tab-active { border-bottom: 3px solid #1e40af; color: #1e40af; font-weight: 900; background-color: #eff6ff; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
    </style>
</head>
<body class="font-sans bg-slate-50 overflow-x-hidden text-slate-800 pb-20">
    <div class="w-full px-2 sm:px-4 pt-4 relative">
        
        <!-- Header Tabs -->
        <div class="flex border-b border-slate-200 mb-3 bg-white rounded-t-xl shadow-sm overflow-x-auto hide-scrollbar">
            <button class="px-5 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs"><i data-lucide="list" class="w-4 h-4"></i> DETAIL QRCODE</button>
            <button class="px-5 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> RANGKUMAN NAMA ITEM & QTY</button>
            <button class="px-5 py-3.5 tab-inactive hover:text-slate-800 hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs"><i data-lucide="pause-circle" class="w-4 h-4"></i> TABEL HOLD</button>
        </div>

        <!-- Toolbar Menu Sejajar -->
        <div class="bg-white p-3 sm:p-4 rounded-xl border border-slate-200 shadow-sm mb-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
                    
                    <!-- Kumpulan Tombol Kiri -->
                    <button class="p-2 sm:px-3 sm:py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-[11px] rounded shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition uppercase"><i data-lucide="filter" class="w-4 h-4"></i> <span class="hidden sm:inline">FILTER</span></button>
                    <button class="p-2 sm:px-3 sm:py-2 bg-white text-slate-700 hover:bg-slate-50 font-bold rounded shadow-sm border border-slate-300 text-[11px] flex items-center justify-center gap-1.5 active:scale-95 transition uppercase"><i data-lucide="eye-off" class="w-4 h-4"></i> <span class="hidden sm:inline">KOLOM</span></button>
                    
                    <button class="p-2 sm:px-3 sm:py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[11px] rounded shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition uppercase"><i data-lucide="map-pin" class="w-4 h-4"></i> <span class="hidden sm:inline">GANTI AREA</span></button>
                    <button class="p-2 sm:px-3 sm:py-2 bg-blue-100 hover:bg-blue-200 border border-blue-300 text-blue-800 font-bold text-[11px] rounded flex items-center justify-center gap-1.5 active:scale-95 transition shadow-sm uppercase"><i data-lucide="copy" class="w-4 h-4"></i> <span class="hidden sm:inline">SALIN</span></button>
                </div>
                
                <!-- Tombol Hapus Baris di Kanan -->
                <button class="p-2 sm:px-4 sm:py-2 bg-red-600 hover:bg-red-700 text-white font-black text-[10px] sm:text-[11px] rounded shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition uppercase whitespace-nowrap ml-auto"><i data-lucide="trash-2" class="w-4 h-4"></i> <span class="hidden sm:inline">HAPUS BARIS</span></button>
            </div>
        </div>

        <!-- Tabel Section (Full Width) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative mb-4">
            <div class="overflow-x-auto w-full max-h-[65vh] hide-scrollbar">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-10"><input type="checkbox" class="cursor-pointer rounded text-blue-600"></th>
                            <th class="hdr-std w-12">NO</th>
                            <th class="hdr-std border-r border-slate-500">WAKTU MASUK</th>
                            <th class="hdr-std border-r border-slate-500">AREA</th>
                            <th class="hdr-std border-r border-slate-500 text-center w-64">QRCODE</th>
                            <th class="hdr-std">TGL PRODUKSI</th>
                            <th class="hdr-std">MESIN</th>
                            <th class="hdr-std border-r border-slate-500">SHIFT</th>
                            <th class="hdr-std text-blue-300">JENIS ITEM</th>
                            <th class="hdr-std text-left pl-4">NAMA ITEM</th>
                            <th class="hdr-std">PJG</th>
                            <th class="hdr-std">GRADE</th>
                            <th class="hdr-std border-r border-slate-500">DUS</th>
                            <th class="hdr-std">SHADING</th>
                            <th class="hdr-std border-r border-slate-500">PO AWAL</th>
                            <th class="hdr-std bg-slate-900 text-slate-300">USER / PIC</th>
                        </tr>
                    </thead>
                    <tbody class="text-center text-slate-700">
                        <!-- Contoh Baris Placeholder (Hapus Saat Integrasi DB) -->
                        <tr class="border-b border-slate-200 hover:bg-slate-50 transition">
                            <td class="p-3"><input type="checkbox" class="w-4 h-4 text-blue-600 rounded"></td>
                            <td class="p-3 font-bold text-slate-400">1</td>
                            <td class="p-3 font-semibold text-slate-600 border-r border-slate-200">27 Mei, 18.20</td>
                            <td class="p-3 font-black text-emerald-700 border-r border-slate-200">B2</td>
                            <td class="p-3 font-mono font-bold text-slate-900 tracking-wider bg-slate-50/50 border-r border-slate-200">PG01/GB/42D4/14662C1S1P145/0004</td>
                            <td class="p-3 font-bold text-slate-600">26/05/2026</td>
                            <td class="p-3 font-bold text-slate-600">MPL 01</td>
                            <td class="p-3 font-bold text-slate-600 border-r border-slate-200">S1</td>
                            <td class="p-3 font-black text-blue-700">Plafon</td>
                            <td class="p-3 font-bold text-slate-800 text-left">GLOSSY</td>
                            <td class="p-3 font-bold text-slate-600">4M</td>
                            <td class="p-3 font-bold text-slate-800">A</td>
                            <td class="p-3 font-bold text-slate-800 border-r border-slate-200">GECO</td>
                            <td class="p-3 font-bold text-slate-600">GB</td>
                            <td class="p-3 font-black text-orange-600 bg-orange-50/50 border-r border-slate-200">P145</td>
                            <td class="p-3 font-bold text-slate-400 text-[10px] uppercase">INDRA</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="global.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initModernLayout({ id: 'riwayat_langsir', title: 'RIWAYAT LANGSIR GUDANG', url: 'riwayat_langsir.html' });
            lucide.createIcons();
        });
    </script>
</body>
</html>
