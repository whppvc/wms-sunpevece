<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Menu Langsir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-main: #f8fafc; --bg-box: #ffffff; --text-main: #1f2937; --border-color: #e2e8f0; }
        body[data-bg="dark"] { --bg-main: #0f172a; --bg-box: #1e293b; --text-main: #f8fafc; --border-color: #334155; }
        body { background-color: var(--bg-main); color: var(--text-main); transition: background 0.3s ease; min-height: 100vh;}
        .card-dynamic { background-color: var(--bg-box); border-color: var(--border-color); }
        .input-dynamic { background-color: var(--bg-main); color: var(--text-main); border-color: var(--border-color); }
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-black { background-color: #1e293b !important; color: white !important; }
        .hdr-green { background-color: #059669 !important; color: white !important; }
        .hdr-blue { background-color: #2563eb !important; color: white !important; }
        .hdr-orange { background-color: #f97316 !important; color: white !important; }
    </style>
</head>
<body id="app-body" class="font-sans">

    <div class="sticky top-0 z-40 w-full flex flex-col shadow-md">
        <nav class="card-dynamic px-4 py-3 flex items-center justify-between border-b">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='menu.html'" class="p-2 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-full transition cursor-pointer active:scale-95 shadow-inner"><i data-lucide="home" class="w-5 h-5"></i></button>
                <div class="flex flex-col ml-1"><span class="font-extrabold text-lg tracking-wide leading-tight text-emerald-700">PORTAL WMS</span></div>
            </div>
        </nav>
        <div id="tab-bar" class="w-full bg-[#0f172a] text-gray-400 flex overflow-x-auto text-[11px] font-black hide-scrollbar tracking-wider"></div>
    </div>

    <main class="p-4 md:p-6 w-full max-w-[98%] mx-auto flex flex-col gap-4 pt-6">
        <header class="flex flex-col md:flex-row md:justify-between md:items-end gap-4 border-b border-gray-200/50 pb-4">
            <h2 class="text-2xl font-black flex items-center gap-2 text-emerald-700"><i data-lucide="log-in" class="w-7 h-7"></i> Menu Langsir (Masuk)</h2>
        </header>

        <div id="view-scan" class="space-y-4">
            <div class="card-dynamic p-5 rounded-xl shadow-sm border space-y-4 relative bg-emerald-50/20 border-emerald-200">
                <div class="flex flex-col md:flex-row gap-4 pt-2">
                    <div class="w-full md:w-1/4">
                        <label class="block text-xs font-bold uppercase mb-1 opacity-70 text-emerald-800">Pilih Troli</label>
                        <select id="select-troli" class="input-dynamic w-full p-3 border-2 rounded-lg font-bold outline-none border-emerald-400 text-emerald-700 cursor-pointer"></select>
                    </div>
                    <div class="w-full md:w-1/4">
                        <label class="block text-xs font-bold uppercase mb-1 opacity-70 text-emerald-800">Pilih Area</label>
                        <select id="select-area" class="input-dynamic w-full p-3 border-2 rounded-lg font-bold outline-none border-emerald-400 text-emerald-700 cursor-pointer">
                            <option value="">-- Area --</option>
                        </select>
                    </div>
                    <div class="w-full md:w-2/4 relative">
                        <button onclick="undoDelete()" class="absolute -top-7 right-0 px-3 py-1 bg-orange-100 text-orange-700 font-black rounded border border-orange-200 hover:bg-orange-200 transition cursor-pointer text-xs flex items-center gap-1 shadow-sm active:scale-95 z-10"><i data-lucide="rotate-ccw" class="w-3 h-3"></i> UNDO</button>
                        <label class="block text-xs font-bold uppercase mb-1 flex justify-between opacity-70 text-emerald-800"><span>Scan Fisik Barang Masuk</span></label>
                        <form id="form-scan" class="flex gap-2">
                            <input type="text" id="input-qrcode" class="input-dynamic flex-1 p-3 border-2 border-emerald-300 rounded-lg outline-none focus:border-emerald-500 font-bold" placeholder="Scan QR Code Kardus..." autocomplete="off">
                            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 rounded-lg font-bold shadow-md cursor-pointer transition"><i data-lucide="corner-down-left"></i></button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 mt-2">
                <button onclick="crossCekSTBJ()" class="px-5 py-2.5 bg-indigo-100 text-indigo-700 font-black rounded-lg border border-indigo-300 hover:bg-indigo-200 transition cursor-pointer text-sm flex items-center gap-2 shadow-sm active:scale-95"><i data-lucide="shield-check" class="w-5 h-5"></i> CEK GUDANG</button>
            </div>

            <div class="card-dynamic rounded-xl shadow-md border overflow-hidden">
                <div class="table-container overflow-x-auto w-full max-h-[50vh]">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-langsir">
                        <thead class="sticky top-0 z-10">
                            <tr class="uppercase text-[11px] font-bold tracking-wider">
                                <th class="p-3 hdr-black w-10 text-center"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                                <th class="p-3 hdr-black w-12 text-center">No</th>
                                <th class="p-3 bg-emerald-900 text-white text-center">Status Fisik</th>
                                <th class="p-3 hdr-black text-emerald-300">Troli</th>
                                <th class="p-3 hdr-black text-emerald-300">Area</th>
                                <th class="p-3 hdr-black border-r border-gray-600">Text QRCode</th>
                                <th class="p-3 hdr-green">Tgl Produksi</th>
                                <th class="p-3 hdr-green">Mesin</th>
                                <th class="p-3 hdr-green">Shift</th>
                                <th class="p-3 hdr-blue">Jenis Item</th>
                                <th class="p-3 hdr-green">Nama Item</th>
                                <th class="p-3 hdr-green">Pjg</th>
                                <th class="p-3 hdr-green">Grade</th>
                                <th class="p-3 hdr-green">Dus</th>
                                <th class="p-3 hdr-green">Shading</th>
                                <th class="p-3 bg-gray-200 text-gray-700 text-center">PO Awal</th>
                                <th class="p-3 hdr-orange">Keterangan</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-langsir"></tbody>
                    </table>
                </div>
            </div>
            <div class="pt-2"><button id="btn-save" onclick="saveToSupabase()" class="w-full py-4 bg-emerald-700 hover:bg-emerald-800 text-white font-black rounded-xl shadow-lg flex items-center justify-center gap-2 text-lg uppercase tracking-wide cursor-pointer transition active:scale-95"><i data-lucide="save" class="w-6 h-6"></i> SAVE DATA MASUK (GUDANG)</button></div>
        </div>
    </main>

    <script src="langsir_logic.js"></script>
    <script>
        const PAGE_META = { id: 'langsir', title: 'LANGSIR', url: 'langsir.html' };
        window.addEventListener('load', () => { initTabs(); });
        function initTabs() {
            let tabs = JSON.parse(localStorage.getItem('wms_tabs')) || [];
            if(!tabs.find(t => t.id === 'dashboard')) tabs.unshift({id: 'dashboard', title: 'DASHBOARD', url: 'menu.html'});
            if(!tabs.find(t => t.id === PAGE_META.id)) { tabs.push(PAGE_META); localStorage.setItem('wms_tabs', JSON.stringify(tabs)); }
            const tabBar = document.getElementById('tab-bar'); tabBar.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === PAGE_META.id;
                const bg = isActive ? 'bg-emerald-600 text-white shadow-inner' : 'hover:bg-slate-800 border-r border-slate-700';
                const closeBtn = tab.id === 'dashboard' ? '' : `<button onclick="closeTab(event, '${tab.id}')" class="ml-2 hover:text-red-400 transition"><i data-lucide="x" class="w-3 h-3"></i></button>`;
                tabBar.innerHTML += `<div onclick="window.location.href='${tab.url}'" class="flex items-center px-5 py-2.5 cursor-pointer transition whitespace-nowrap border-b-2 ${isActive ? 'border-white' : 'border-transparent hover:border-slate-500'} ${bg}"><span>${tab.title}</span>${closeBtn}</div>`;
            }); lucide.createIcons();
        }
        function closeTab(e, id) { e.stopPropagation(); let tabs = JSON.parse(localStorage.getItem('wms_tabs')) || []; tabs = tabs.filter(t => t.id !== id); localStorage.setItem('wms_tabs', JSON.stringify(tabs)); if(PAGE_META.id === id) { window.location.href = tabs[tabs.length-1].url; } else { initTabs(); } }
    </script>
</body>
</html>
