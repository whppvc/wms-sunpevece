<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Menu Langsir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-black { background-color: #1e293b !important; color: white !important; }
        .hdr-brown { background-color: #78350f !important; color: white !important; }
    </style>
</head>
<body class="font-sans antialiased text-slate-800 bg-slate-50 flex flex-col min-h-screen">

    <main class="p-4 md:p-6 w-full max-w-[98%] mx-auto flex flex-col gap-4 pt-4">

        <div id="view-scan" class="space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-amber-200">
                <div class="flex flex-col md:flex-row gap-5 relative">
                    <div class="w-full md:w-1/4">
                        <label class="block text-[11px] font-black uppercase tracking-widest mb-2 text-amber-900 opacity-80">Pilih Troli</label>
                        <select id="select-troli" class="w-full p-3.5 border-2 border-slate-200 rounded-xl font-bold outline-none focus:border-amber-800 text-slate-800 cursor-pointer transition"></select>
                    </div>
                    <div class="w-full md:w-1/4">
                        <label class="block text-[11px] font-black uppercase tracking-widest mb-2 text-amber-900 opacity-80">Pilih Area Gudang</label>
                        <select id="select-area" class="w-full p-3.5 border-2 border-slate-200 rounded-xl font-bold outline-none focus:border-amber-800 text-slate-800 cursor-pointer transition">
                            <option value="">-- Area --</option>
                        </select>
                    </div>
                    <div class="w-full md:w-2/4 relative">
                        <button onclick="undoDelete()" class="absolute -top-7 right-0 px-3 py-1.5 bg-slate-800 text-white font-bold rounded-lg border-b-2 border-black hover:bg-slate-700 transition cursor-pointer text-xs flex items-center gap-1 shadow-md active:scale-95 z-10"><i data-lucide="rotate-ccw" class="w-3 h-3"></i> UNDO HAPUS</button>
                        <label class="block text-[11px] font-black uppercase tracking-widest mb-2 text-amber-900 opacity-80">Scan Fisik Kardus</label>
                        <form id="form-scan" class="flex gap-2">
                            <input type="text" id="input-qrcode" class="flex-1 p-3.5 border-2 border-slate-200 rounded-xl outline-none focus:border-amber-800 font-black text-slate-800 transition text-lg" placeholder="Arahkan scanner..." autocomplete="off">
                            <button type="submit" class="bg-amber-900 hover:bg-amber-950 text-white px-8 rounded-xl font-black shadow-lg cursor-pointer transition active:scale-95 flex items-center gap-2 border-b-4 border-black"><i data-lucide="plus-square"></i> ADD</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-2">
                <button onclick="validasiSTBJ()" class="px-6 py-3 bg-blue-700 text-white font-black rounded-xl border-b-4 border-blue-900 hover:bg-blue-800 transition cursor-pointer text-sm flex items-center gap-2 shadow-md active:scale-95 uppercase tracking-wide"><i data-lucide="shield-check" class="w-5 h-5"></i> VALIDASI STBJ</button>
                <button onclick="cekGudang()" class="px-6 py-3 bg-amber-800 text-white font-black rounded-xl border-b-4 border-amber-950 hover:bg-amber-900 transition cursor-pointer text-sm flex items-center gap-2 shadow-md active:scale-95 uppercase tracking-wide"><i data-lucide="search" class="w-5 h-5"></i> CEK GUDANG</button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="table-container overflow-x-auto w-full max-h-[50vh]">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-langsir">
                        <thead class="sticky top-0 z-10 shadow-sm">
                            <tr class="uppercase text-[11px] font-black tracking-wider">
                                <th class="p-3 hdr-black w-10 text-center"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                                <th class="p-3 hdr-black w-12 text-center">No</th>
                                <th class="p-3 bg-slate-200 text-slate-800 text-center border-r border-slate-300">Status</th>
                                <th class="p-3 hdr-brown">Troli</th>
                                <th class="p-3 hdr-brown">Area</th>
                                <th class="p-3 hdr-black border-r border-slate-600">Text QRCode</th>
                                <th class="p-3 bg-amber-50 text-amber-900">Tgl Produksi</th>
                                <th class="p-3 bg-amber-50 text-amber-900">Mesin</th>
                                <th class="p-3 bg-amber-50 text-amber-900 border-r border-amber-200">Shift</th>
                                <th class="p-3 hdr-brown">Jenis Item</th>
                                <th class="p-3 bg-amber-50 text-amber-900">Nama Item</th>
                                <th class="p-3 bg-amber-50 text-amber-900">Pjg</th>
                                <th class="p-3 bg-amber-50 text-amber-900">Grade</th>
                                <th class="p-3 bg-amber-50 text-amber-900 border-r border-amber-200">Dus</th>
                                <th class="p-3 bg-slate-100 text-slate-800">Shading</th>
                                <th class="p-3 bg-slate-800 text-amber-400 text-center font-black">PO Awal</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-langsir"></tbody>
                    </table>
                </div>
            </div>
            
            <div class="pt-2">
                <button id="btn-save" onclick="saveToSupabase()" class="w-full py-4 bg-amber-900 hover:bg-amber-950 text-white font-black rounded-2xl shadow-lg border-b-4 border-black flex items-center justify-center gap-2 text-lg uppercase tracking-wider cursor-pointer transition active:scale-95"><i data-lucide="save" class="w-6 h-6"></i> SIMPAN KE GUDANG (SAVE)</button>
            </div>
        </div>
    </main>

    <script src="global.js"></script>
    <script src="langsir_logic.js"></script>
    <script>
        const PAGE_META = { id: 'langsir', title: 'LANGSIR', url: 'langsir.html' };
        window.addEventListener('DOMContentLoaded', () => { 
            initModernTopBar(PAGE_META); 
            // Obati bug kosong dengan jeda sejenak setelah header dirender
            setTimeout(() => { if(window.loadInitialData) window.loadInitialData(); }, 150);
        });
    </script>
</body>
</html>
