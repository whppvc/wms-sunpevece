<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Menu Langsir Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; } 
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .selected-row { border-color: #2563eb !important; background-color: #dbeafe !important; }
    </style>
</head>
<body class="font-sans bg-slate-50 overflow-x-hidden text-slate-800 pb-28">

    <div class="w-full px-2 pt-3 relative">
        
        <div class="flex gap-2 mb-3">
            <button onclick="bukaModalSTBJ()" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-black py-2.5 rounded shadow-sm flex justify-center items-center gap-2 text-xs uppercase border-b-2 border-purple-800 active:scale-95 transition">
                <i data-lucide="layout-list" class="w-4 h-4"></i> Data STBJ
            </button>
            <button onclick="VerifikasiDanCek()" id="btn-Verifikasi" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-black py-2.5 rounded shadow-sm flex justify-center items-center gap-2 text-xs uppercase border-b-2 border-blue-800 active:scale-95 transition">
                <i data-lucide="shield-check" class="w-4 h-4"></i> Verifikasi
            </button>
            
            <div class="relative">
                <button id="btn-menu-utama" onclick="toggleMenuUtama()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-black px-4 py-2.5 rounded shadow-sm flex justify-center items-center border-b-2 border-slate-400 active:scale-95 transition">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white shadow-xl rounded border border-slate-200 z-[45] flex flex-col py-1">
                    <button onclick="editKeteranganMassal(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-sky-50 hover:text-sky-700 flex items-center gap-2 border-b border-slate-100"><i data-lucide="edit-3" class="w-4 h-4"></i> Edit Keterangan</button>
                    <button onclick="toggleSidebarFilter(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="filter" class="w-4 h-4"></i> Filter Data</button>
                    <button onclick="salinDataTabel(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-blue-50 hover:text-blue-700 flex items-center gap-2 border-b border-slate-100"><i data-lucide="copy" class="w-4 h-4"></i> Salin Data</button>
                    <button onclick="undoDelete(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-rose-50 hover:text-rose-700 flex items-center gap-2 border-b border-slate-100"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Undo Hapus</button>
                    <button onclick="holdLangsir(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-amber-50 hover:text-amber-700 flex items-center gap-2"><i data-lucide="pause-circle" class="w-4 h-4"></i> Hold Bermasalah</button>
                </div>
            </div>
        </div>

        <div class="mb-2 flex items-center gap-2 px-1">
            <input type="checkbox" onchange="toggleSemuaCentang(this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer" id="cb-all">
            <label for="cb-all" class="text-xs font-bold text-slate-500 uppercase">Pilih Semua Data</label>
        </div>
        
        <div class="bg-white border border-slate-300 rounded-lg p-2 shadow-inner">
            <div id="tbody-langsir" class="flex flex-col gap-3 w-full max-h-[55vh] overflow-y-auto hide-scrollbar pb-2 px-1">
                </div>
        </div>

        <div class="py-3 flex justify-start w-full">
            <div class="bg-[#faedbe] border-2 border-[#e4cc7b] px-4 py-2 rounded text-[#8b6d13] text-xs font-black shadow-sm uppercase tracking-wider">
                Total Qty (Dus): <span id="lbl-tampil-baris" class="text-black text-sm ml-1">0</span>
            </div>
        </div>

    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 p-3 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-40 flex items-center gap-3">
        <button onclick="bukaModalAdd()" class="w-14 h-14 bg-slate-900 hover:bg-slate-800 text-white rounded-full flex justify-center items-center shadow-lg active:scale-95 shrink-0 transition border-b-4 border-black">
            <i data-lucide="plus" class="w-8 h-8"></i>
        </button>
        <button id="btn-save" onclick="saveToSupabase()" class="flex-1 h-14 bg-[#058c5e] hover:bg-[#04724d] text-white font-black rounded-lg shadow-lg flex items-center justify-center gap-2 text-sm tracking-widest cursor-pointer transition active:scale-95 uppercase border-b-4 border-[#035237]">
            <i data-lucide="save" class="w-5 h-5"></i> SIMPAN KE GUDANG
        </button>
    </div>

    <div id="modal-add-scan" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="scan-line" class="w-5 h-5 text-blue-600"></i> INPUT DATA LANGSIR</h3>
                <button type="button" onclick="tutupModalAdd()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded-full transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            
            <form id="form-scan" class="flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Pilih Area Simpan</label>
                    <select id="select-area" class="w-full p-3 border-2 border-slate-200 rounded-lg font-bold outline-none focus:border-blue-500 text-slate-800 cursor-pointer bg-slate-50 text-sm">
                        <option value="">-- Memuat Area --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Scan Fisik Kardus</label>
                    <input type="text" id="input-qrcode" class="w-full p-3 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-500 font-mono font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition" placeholder="Arahkan scanner..." autocomplete="off">
                </div>
                <button type="submit" class="mt-2 w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-lg font-black shadow-md cursor-pointer transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase border-b-4 border-black">
                    <i data-lucide="plus-square" class="w-5 h-5"></i> TAMBAHKAN KODE
                </button>
            </form>
        </div>
    </div>

    <div id="modal-stbj-langsir" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="table" class="w-4 h-4 text-purple-600"></i> DATA STBJ GUDANG</h3>
                <button onclick="tutupModalSTBJ()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-3 bg-white border-b border-slate-100 flex flex-col gap-2">
                <label class="block text-[10px] font-black uppercase tracking-wide text-slate-500">Filter Data STBJ</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="search" class="w-4 h-4 text-slate-400"></i></div>
                    <input type="text" id="f-stbj-modal" oninput="saringTabelModalSTBJ()" class="w-full pl-9 p-2.5 text-sm border-2 border-slate-200 rounded-lg focus:border-purple-500 outline-none font-bold placeholder-slate-300" placeholder="Ketik Troli, QR, Item, dll...">
                </div>
            </div>
            <div class="overflow-y-auto flex-1 hide-scrollbar p-3 bg-slate-100">
                <div id="tbody-stbj-modal" class="flex flex-col gap-3">
                    </div>
            </div>
        </div>
    </div>

    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4"></i> Filter Data Langsir</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 flex flex-col gap-3 overflow-y-auto">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status STBJ</label><input type="text" id="f-stbj" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status Kode</label><input type="text" id="f-kode" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli</label><input type="text" id="f-troli" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Area</label><input type="text" id="f-area" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="f-qr" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="text" id="f-tgl" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label><input type="text" id="f-mesin" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label><input type="text" id="f-shift" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><input type="text" id="f-jenis" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label><input type="text" id="f-nama" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><input type="text" id="f-pjg" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><input type="text" id="f-grade" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><input type="text" id="f-dus" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="f-shading" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">PO Awal</label><input type="text" id="f-po" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="f-ket" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            </div>
            <button onclick="resetFilter()" class="mt-2 py-3 w-full bg-slate-800 hover:bg-slate-900 text-white font-black rounded-lg text-xs uppercase transition border-b-4 border-slate-950">RESET FILTER</button>
        </div>
    </div>

    <div id="overlay-klik-luar" onclick="tutupSemuaPopup()" class="hidden fixed inset-0 z-[40] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="global.js"></script>
    <script src="langsir_logic.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { initModernLayout({ id: 'langsir', title: 'LANGSIR', url: 'langsir.html' }); });
        
        function toggleMenuUtama() { document.getElementById('dropdown-menu').classList.toggle('hidden'); }
        function bukaModalAdd() { document.getElementById('modal-add-scan').classList.remove('hidden'); setTimeout(() => { document.getElementById('input-qrcode').focus(); }, 100); }
        function tutupModalAdd() { document.getElementById('modal-add-scan').classList.add('hidden'); }
        
        function toggleSidebarFilter() { document.getElementById('sidebar-filter').classList.toggle('translate-x-full'); document.getElementById('overlay-klik-luar').classList.toggle('hidden'); }
        function tutupSemuaPopup() { document.getElementById('sidebar-filter').classList.add('translate-x-full'); document.getElementById('overlay-klik-luar').classList.add('hidden'); tutupModalSTBJ(); document.getElementById('dropdown-menu').classList.add('hidden'); }
        function resetFilter() { const ids = ['f-stbj','f-kode','f-troli','f-area','f-qr','f-tgl','f-mesin','f-shift','f-jenis','f-nama','f-pjg','f-grade','f-dus','f-shading','f-po','f-ket']; ids.forEach(id => document.getElementById(id).value = ''); saringTabelLangsir(); toggleSidebarFilter(); }
        
        // Menutup Dropdown Menu jika user klik sembarang tempat di luar menu
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('dropdown-menu');
            const btn = document.getElementById('btn-menu-utama');
            if(menu && !menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
