<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Menu Langsir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-main: #f8fafc; --bg-box: #ffffff; --text-main: #000000; --border-color: #e2e8f0; }
        body[data-bg="dark"] { --bg-main: #0f172a; --bg-box: #1e293b; --text-main: #f8fafc; --border-color: #334155; }
        body { background-color: var(--bg-main); color: var(--text-main); transition: background 0.3s ease; min-height: 100vh;}
        .card-dynamic { background-color: var(--bg-box); border-color: var(--border-color); }
        .input-dynamic { background-color: var(--bg-main); color: var(--text-main); border-color: var(--border-color); }
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-black { background-color: #1e293b !important; color: white !important; }
        /* Mengubah warna header bawaan menjadi tone coklat/amber dengan teks hitam */
        .hdr-amber { background-color: #f59e0b !important; color: black !important; }
        .hdr-light-amber { background-color: #fde68a !important; color: black !important; }
    </style>
</head>
<body id="app-body" class="font-sans">

    <div class="sticky top-0 z-40 w-full flex flex-col shadow-md">
        <nav class="card-dynamic px-4 py-3 flex items-center justify-between border-b">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='menu.html'" class="p-2 bg-amber-100 hover:bg-amber-200 text-black rounded-full transition cursor-pointer active:scale-95 shadow-inner"><i data-lucide="home" class="w-5 h-5"></i></button>
                <div class="flex flex-col ml-1"><span class="font-extrabold text-lg tracking-wide leading-tight text-black">PORTAL WMS</span></div>
            </div>
        </nav>
        <div id="tab-bar" class="w-full bg-[#0f172a] text-gray-400 flex overflow-x-auto text-[11px] font-black hide-scrollbar tracking-wider"></div>
    </div>

    <main class="p-4 md:p-6 w-full max-w-[98%] mx-auto flex flex-col gap-4 pt-6">
        <header class="flex flex-col md:flex-row md:justify-between md:items-end gap-4 border-b border-gray-200/50 pb-4">
            <h2 class="text-2xl font-black flex items-center gap-2 text-black"><i data-lucide="log-in" class="w-7 h-7 text-amber-600"></i> Menu Langsir (Masuk)</h2>
        </header>

        <div id="view-scan" class="space-y-4">
            <div class="card-dynamic p-5 rounded-xl shadow-sm border space-y-4 relative bg-amber-50/50 border-amber-200">
                <div class="flex flex-col md:flex-row gap-4 pt-2">
                    <div class="w-full md:w-1/4">
                        <label class="block text-xs font-bold uppercase mb-1 opacity-80 text-black">Pilih Troli</label>
                        <select id="select-troli" class="input-dynamic w-full p-3 border-2 rounded-lg font-bold outline-none border-amber-300 text-black cursor-pointer bg-white"></select>
                    </div>
                    <div class="w-full md:w-1/4">
                        <label class="block text-xs font-bold uppercase mb-1 opacity-80 text-black">Pilih Area</label>
                        <select id="select-area" class="input-dynamic w-full p-3 border-2 rounded-lg font-bold outline-none border-amber-300 text-black cursor-pointer bg-white">
                            <option value="">-- Area --</option>
                        </select>
                    </div>
                    <div class="w-full md:w-2/4 relative">
                        <button onclick="undoDelete()" class="absolute -top-7 right-0 px-3 py-1 bg-gray-200 text-black font-black rounded border border-gray-300 hover:bg-gray-300 transition cursor-pointer text-xs flex items-center gap-1 shadow-sm active:scale-95 z-10"><i data-lucide="rotate-ccw" class="w-3 h-3"></i> UNDO</button>
                        <label class="block text-xs font-bold uppercase mb-1 flex justify-between opacity-80 text-black"><span>Scan Fisik Barang Masuk</span></label>
                        <form id="form-scan" class="flex gap-2">
                            <input type="text" id="input-qrcode" class="input-dynamic flex-1 p-3 border-2 border-amber-300 rounded-lg outline-none focus:border-amber-600 font-bold text-black bg-white" placeholder="Scan QR Code Kardus..." autocomplete="off">
                            <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-8 rounded-lg font-bold shadow-md cursor-pointer transition"><i data-lucide="corner-down-left"></i></button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-2">
                <button onclick="validasiSTBJ()" class="px-5 py-2.5 bg-blue-100 text-black font-black rounded-lg border border-blue-300 hover:bg-blue-200 transition cursor-pointer text-sm flex items-center gap-2 shadow-sm active:scale-95"><i data-lucide="shield-check" class="w-5 h-5 text-blue-600"></i> VALIDASI STBJ</button>
                <button onclick="cekGudang()" class="px-5 py-2.5 bg-amber-200 text-black font-black rounded-lg border border-amber-400 hover:bg-amber-300 transition cursor-pointer text-sm flex items-center gap-2 shadow-sm active:scale-95"><i data-lucide="search" class="w-5 h-5 text-amber-700"></i> CEK GUDANG</button>
            </div>

            <div class="card-dynamic rounded-xl shadow-md border overflow-hidden">
                <div class="table-container overflow-x-auto w-full max-h-[50vh]">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-langsir">
                        <thead class="sticky top-0 z-10">
                            <tr class="uppercase text-[11px] font-bold tracking-wider">
                                <th class="p-3 hdr-black w-10 text-center"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                                <th class="p-3 hdr-black w-12 text-center">No</th>
                                <th class="p-3 bg-amber-200 text-black text-center border-r border-amber-300">Status Fisik</th>
                                <th class="p-3 hdr-black text-amber-300">Troli</th>
                                <th class="p-3 hdr-black text-amber-300">Area</th>
                                <th class="p-3 hdr-black border-r border-gray-600">Text QRCode</th>
                                <th class="p-3 hdr-light-amber">Tgl Produksi</th>
                                <th class="p-3 hdr-light-amber">Mesin</th>
                                <th class="p-3 hdr-light-amber border-r border-amber-300">Shift</th>
                                <th class="p-3 hdr-amber">Jenis Item</th>
                                <th class="p-3 hdr-light-amber">Nama Item</th>
                                <th class="p-3 hdr-light-amber">Pjg</th>
                                <th class="p-3 hdr-light-amber">Grade</th>
                                <th class="p-3 hdr-light-amber">Dus</th>
                                <th class="p-3 hdr-light-amber border-r border-amber-300">Shading</th>
                                <th class="p-3 bg-gray-200 text-black text-center">PO Awal</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-langsir"></tbody>
                    </table>
                </div>
            </div>
            <div class="pt-2"><button id="btn-save" onclick="saveToSupabase()" class="w-full py-4 bg-amber-600 hover:bg-amber-700 text-white font-black rounded-xl shadow-lg flex items-center justify-center gap-2 text-lg uppercase tracking-wide cursor-pointer transition active:scale-95"><i data-lucide="save" class="w-6 h-6"></i> SAVE DATA MASUK (GUDANG)</button></div>
        </div>
    </main>

   <script src="global.js"></script>
    <script src="langsir_logic.js"></script>
    <script>
        const PAGE_META = { id: 'langsir', title: 'LANGSIR', url: 'langsir.html' };
        window.addEventListener('load', () => { initGlobalTabs(PAGE_META); });
    </script>
</body>
</html>
