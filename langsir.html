<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Menu Langsir Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .selected-row { border-color: #2563eb !important; background-color: #dbeafe !important; }
    </style>
</head>
<body class="font-sans bg-slate-100 text-slate-800 h-[100dvh] w-screen overflow-hidden flex flex-col relative">

    <!-- BAGIAN 1: HEADER APP (FIXED / TETAP DIAM DI ATAS) -->
    <div class="shrink-0 px-2 pt-3 pb-2 flex flex-col gap-2.5 z-10 bg-white border-b border-slate-300 shadow-sm">
        
        <!-- Baris 1: Tombol Aksi Khas ERP Two-Tone -->
        <div class="flex gap-2">
            <button onclick="bukaModalSTBJ()" class="flex-1 flex items-stretch rounded overflow-hidden shadow-sm active:scale-95 transition h-10">
                <div class="bg-purple-800 text-white flex items-center justify-center px-3"><i data-lucide="layout-list" class="w-4 h-4"></i></div>
                <div class="bg-purple-600 text-white font-black text-xs uppercase flex items-center justify-center flex-1">Data STBJ</div>
            </button>
            <button onclick="VerifikasiDanCek()" id="btn-Verifikasi" class="flex-1 flex items-stretch rounded overflow-hidden shadow-sm active:scale-95 transition h-10">
                <div class="bg-blue-800 text-white flex items-center justify-center px-3"><i data-lucide="shield-check" class="w-4 h-4"></i></div>
                <div class="bg-blue-600 text-white font-black text-xs uppercase flex items-center justify-center flex-1">Verifikasi</div>
            </button>
            
            <div class="relative">
                <button id="btn-menu-utama" onclick="toggleMenuUtama()" class="flex items-stretch rounded overflow-hidden shadow-sm active:scale-95 transition h-10 border border-slate-300">
                    <div class="bg-slate-200 text-slate-700 flex items-center justify-center px-3"><i data-lucide="menu" class="w-5 h-5"></i></div>
                </button>
                <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white shadow-xl rounded border border-slate-200 z-[45] flex flex-col py-1">
                    <button onclick="editKeteranganMassal(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="edit-3" class="w-4 h-4"></i> Edit Keterangan</button>
                    <button onclick="toggleSidebarFilter(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="filter" class="w-4 h-4"></i> Filter Data</button>
                    <button onclick="salinDataTabel(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="copy" class="w-4 h-4"></i> Salin Data</button>
                    <button onclick="undoDelete(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Undo Hapus</button>
                    <button onclick="holdLangsir(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="pause-circle" class="w-4 h-4"></i> Hold Bermasalah</button>
                    <button onclick="bukaModalHold(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2"><i data-lucide="archive" class="w-4 h-4"></i> Tabel Hold</button>
                </div>
            </div>
        </div>

        <!-- Baris 2: Pilih Semua & Total Qty Sejajar -->
        <div class="flex justify-between items-center px-1">
            <div class="flex items-center gap-2">
                <input type="checkbox" onchange="toggleSemuaCentang(this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer border-slate-400" id="cb-all">
                <label for="cb-all" class="text-xs font-bold text-slate-500 uppercase tracking-wide cursor-pointer">Pilih Semua Data</label>
            </div>
            <div class="bg-cyan-50 border border-cyan-300 px-3 py-1.5 rounded text-cyan-800 text-[11px] font-black shadow-sm uppercase tracking-wider">
                Total Qty: <span id="lbl-tampil-baris" class="text-slate-900 text-sm ml-1">0</span> Dus
            </div>
        </div>
    </div>

    <!-- BAGIAN 2: SCROLLABLE MAIN REGION (HANYA AREA INI YANG BERGERAK) -->
    <div class="flex-1 min-h-0 overflow-y-auto custom-scroll px-2 pt-2 pb-24" id="scroll-container">
        <div id="tbody-langsir" class="flex flex-col gap-3 w-full">
            <!-- Data Card HTML akan digenerate ke dalam sini secara dinamis -->
        </div>
    </div>

    <!-- BAGIAN 3: FOOTER BAR (TETAP DIAM DI BAWAH) -->
    <div class="shrink-0 w-full bg-white border-t border-slate-300 p-3 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-40 flex items-center gap-3">
        <!-- Tombol Bulat Add (Hitam) -->
        <button onclick="bukaModalAdd()" class="w-14 h-14 bg-slate-900 hover:bg-slate-800 text-white rounded-full flex justify-center items-center shadow-lg active:scale-95 shrink-0 transition border-b-4 border-black">
            <i data-lucide="plus" class="w-8 h-8"></i>
        </button>
        <!-- Tombol Simpan -->
        <button id="btn-save" onclick="saveToSupabase()" class="flex-1 h-14 bg-[#058c5e] hover:bg-[#04724d] text-white font-black rounded-lg shadow-lg flex items-center justify-center gap-2 text-sm tracking-widest cursor-pointer transition active:scale-95 uppercase border-b-4 border-[#035237]">
            <i data-lucide="save" class="w-5 h-5"></i> SIMPAN KE GUDANG
        </button>
    </div>

    <!-- MODAL ADD SCAN -->
    <div id="modal-add-scan" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="scan-line" class="w-5 h-5 text-blue-600"></i> INPUT DATA LANGSIR</h3>
                <button type="button" onclick="tutupModalAdd()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded-full transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="form-scan" class="flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Pilih Area Simpan</label>
                    <select id="select-area" class="w-full p-3 border-2 border-slate-200 rounded-lg font-bold outline-none focus:border-blue-500 text-slate-800 cursor-pointer bg-slate-50 text-sm">
                        <option value="">-- Memuat Area --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Scan Fisik Kardus</label>
                    <!-- Keyboard TIDAK otomatis membuka karena tidak dipicu .focus() saat buka modal -->
                    <input type="text" id="input-qrcode" class="w-full p-3 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-500 font-mono font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition" placeholder="Arahkan scanner..." autocomplete="off">
                </div>
                <button type="submit" class="mt-2 w-full bg-slate-900 hover:bg-slate-800 text-white py-3.5 rounded-lg font-black shadow-md cursor-pointer transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase border-b-4 border-black">
                    <i data-lucide="plus-square" class="w-5 h-5"></i> TAMBAHKAN KODE
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL DATA STBJ -->
    <div id="modal-stbj-langsir" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="table" class="w-4 h-4 text-purple-600"></i> DATA STBJ GUDANG</h3>
                <button onclick="tutupModalSTBJ()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-3 bg-white border-b border-slate-100 flex flex-col gap-2 shrink-0">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="search" class="w-4 h-4 text-slate-400"></i></div>
                    <input type="text" id="f-stbj-modal" oninput="saringTabelModalSTBJ()" class="w-full pl-9 p-2.5 text-sm border-2 border-slate-200 rounded-lg focus:border-purple-500 outline-none font-bold placeholder-slate-300" placeholder="Ketik Troli, QR, Item, dll...">
                </div>
            </div>
            <div class="overflow-y-auto flex-1 custom-scroll p-3 bg-slate-100">
                <div id="tbody-stbj-modal" class="flex flex-col gap-3"></div>
            </div>
        </div>
    </div>

    <!-- MODAL TABEL HOLD -->
    <div id="modal-hold-langsir" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="archive" class="w-4 h-4 text-orange-600"></i> TABEL HOLD</h3>
                <button onclick="tutupModalHold()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="overflow-y-auto flex-1 custom-scroll p-3 bg-slate-100">
                <div id="tbody-hold-modal" class="flex flex-col gap-3"></div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR FILTER -->
    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4"></i> Filter Data Langsir</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 flex flex-col gap-3 overflow-y-auto custom-scroll flex-1">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status STBJ</label><input type="text" id="f-stbj" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status Kode</label><input type="text" id="f-kode" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli</label><input type="text" id="f-troli" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Area</label><input type="text" id="f-area" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
                <div class="col-span-2"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="f-qr" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            </div>
            <button onclick="resetFilter()" class="mt-2 py-3 w-full bg-slate-800 hover:bg-slate-900 text-white font-black rounded-lg text-xs uppercase transition border-b-4 border-slate-950 shrink-0">RESET FILTER</button>
        </div>
    </div>

    <!-- OVERLAY KLIK LUAR -->
    <div id="overlay-klik-luar" onclick="tutupSemuaPopup()" class="hidden fixed inset-0 z-[40] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="global.js"></script>
    <script src="wms_parser.js"></script>
    <script src="langsir_modals.js"></script>
    <script src="langsir_logic.js"></script>
</body>
</html>
