<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Menu Langsir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-black { background-color: #1e293b !important; color: white !important; }
        .hdr-amber { background-color: #f59e0b !important; color: black !important; }
        .hdr-light-amber { background-color: #fde68a !important; color: black !important; }
    </style>
</head>
<body class="font-sans antialiased text-slate-800 bg-slate-50 flex flex-col min-h-screen">

    <main class="p-4 md:p-6 w-full max-w-[98%] mx-auto flex flex-col gap-4 pt-6">
        <header class="flex flex-col md:flex-row md:justify-between md:items-end gap-2 border-b border-slate-200 pb-4">
            <h2 class="text-2xl font-black flex items-center gap-2 text-slate-800"><i data-lucide="log-in" class="w-7 h-7 text-amber-500"></i> Langsir (Barang Masuk)</h2>
            <p class="text-sm font-semibold text-slate-500">Scan QR untuk memasukkan fisik ke gudang.</p>
        </header>

        <div id="view-scan" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex flex-col md:flex-row gap-5 relative">
                    <div class="w-full md:w-1/4">
                        <label class="block text-xs font-black uppercase tracking-wider mb-2 text-slate-500">Pilih Troli</label>
                        <select id="select-troli" class="w-full p-3 border border-slate-300 rounded-xl font-bold outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200 text-slate-700 cursor-pointer bg-slate-50 transition"></select>
                    </div>
                    <div class="w-full md:w-1/4">
                        <label class="block text-xs font-black uppercase tracking-wider mb-2 text-slate-500">Pilih Area Gudang</label>
                        <select id="select-area" class="w-full p-3 border border-slate-300 rounded-xl font-bold outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200 text-slate-700 cursor-pointer bg-slate-50 transition">
                            <option value="">-- Pilih Area --</option>
                        </select>
                    </div>
                    <div class="w-full md:w-2/4 relative">
                        <button onclick="undoDelete()" class="absolute -top-6 right-0 px-3 py-1 bg-white text-slate-600 font-bold rounded-lg border border-slate-300 hover:bg-slate-100 transition cursor-pointer text-xs flex items-center gap-1 shadow-sm active:scale-95 z-10"><i data-lucide="rotate-ccw" class="w-3 h-3"></i> UNDO HAPUS</button>
                        <label class="block text-xs font-black uppercase tracking-wider mb-2 text-slate-500">Scan Fisik Kardus</label>
                        <form id="form-scan" class="flex gap-2">
                            <input type="text" id="input-qrcode" class="flex-1 p-3 border border-slate-300 rounded-xl outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-200 font-black text-slate-800 transition" placeholder="Arahkan scanner ke sini..." autocomplete="off">
                            <button type="submit" class="bg-amber-500 hover:bg-amber-600 text-white px-6 rounded-xl font-black shadow-md cursor-pointer transition active:scale-95 flex items-center gap-2"><i data-lucide="plus-square"></i> ADD</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-2">
                <button onclick="validasiSTBJ()" class="px-5 py-2.5 bg-white text-blue-700 font-black rounded-xl border border-slate-200 hover:border-blue-300 hover:bg-blue-50 transition cursor-pointer text-sm flex items-center gap-2 shadow-sm active:scale-95"><i data-lucide="shield-check" class="w-5 h-5 text-blue-500"></i> VALIDASI STBJ</button>
                <button onclick="cekGudang()" class="px-5 py-2.5 bg-white text-amber-700 font-black rounded-xl border border-slate-200 hover:border-amber-300 hover:bg-amber-50 transition cursor-pointer text-sm flex items-center gap-2 shadow-sm active:scale-95"><i data-lucide="search" class="w-5 h-5 text-amber-500"></i> CEK GUDANG</button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="table-container overflow-x-auto w-full max-h-[50vh]">
                    <table class="w-full text-left border-collapse text-sm whitespace-nowrap" id="table-langsir">
                        <thead class="sticky top-0 z-10 shadow-sm">
                            <tr class="uppercase text-[11px] font-black tracking-wider">
                                <th class="p-3 hdr-black w-10 text-center"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></th>
                                <th class="p-3 hdr-black w-12 text-center">No</th>
                                <th class="p-3 bg-amber-100 text-amber-900 text-center border-r border-amber-200">Status</th>
                                <th class="p-3 hdr-black text-amber-300">Troli</th>
                                <th class="p-3 hdr-black text-amber-300">Area</th>
                                <th class="p-3 hdr-black border-r border-slate-600">Text QRCode</th>
                                <th class="p-3 hdr-light-amber">Tgl Produksi</th>
                                <th class="p-3 hdr-light-amber">Mesin</th>
                                <th class="p-3 hdr-light-amber border-r border-amber-300">Shift</th>
                                <th class="p-3 hdr-amber">Jenis Item</th>
                                <th class="p-3 hdr-light-amber">Nama Item</th>
                                <th class="p-3 hdr-light-amber">Pjg</th>
                                <th class="p-3 hdr-light-amber">Grade</th>
                                <th class="p-3 hdr-light-amber border-r border-amber-300">Dus</th>
                                <th class="p-3 bg-slate-100 text-slate-800">Shading</th>
                                <th class="p-3 bg-slate-200 text-slate-900 text-center font-black">PO Awal</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-langsir"></tbody>
                    </table>
                </div>
            </div>
            
            <div class="pt-2">
                <button id="btn-save" onclick="saveToSupabase()" class="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-2xl shadow-md flex items-center justify-center gap-2 text-lg uppercase tracking-wider cursor-pointer transition active:scale-95"><i data-lucide="save" class="w-6 h-6"></i> SIMPAN KE GUDANG (SAVE)</button>
            </div>
        </div>
    </main>

    <script src="global.js"></script>
    <script src="langsir_logic.js"></script>
    <script>
        const PAGE_META = { id: 'langsir', title: 'LANGSIR', url: 'langsir.html' };
        window.addEventListener('DOMContentLoaded', () => { initModernTopBar(PAGE_META); });
    </script>
</body>
</html>
