<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Menu Langsir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* STANDARISASI HEADER TABEL */
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center; border: 1px solid #334155; }
    </style>
    <style id="dynamic-col-styles"></style>
</head>
<body class="font-sans">

    <div class="w-full relative">
        <div id="view-scan" class="space-y-4">
            
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex flex-col md:flex-row gap-4 relative">
                    <div class="w-full md:w-1/4">
                        <label class="block text-xs font-bold uppercase tracking-wide mb-2 text-slate-600">Pilih Troli</label>
                        <select id="select-troli" class="w-full p-3 border border-slate-300 rounded-lg font-bold outline-none focus:border-slate-800 text-slate-800 cursor-pointer bg-slate-50"></select>
                    </div>
                    <div class="w-full md:w-1/4">
                        <label class="block text-xs font-bold uppercase tracking-wide mb-2 text-slate-600">Pilih Area</label>
                        <select id="select-area" class="w-full p-3 border border-slate-300 rounded-lg font-bold outline-none focus:border-slate-800 text-slate-800 cursor-pointer bg-slate-50">
                            <option value="">-- Memuat Area --</option>
                        </select>
                    </div>
                    <div class="w-full md:w-2/4 relative">
                        <button onclick="undoDelete()" class="absolute -top-7 right-0 px-3 py-1 bg-slate-200 text-slate-700 font-bold rounded border border-slate-300 hover:bg-slate-300 transition cursor-pointer text-xs flex items-center gap-1 active:scale-95"><i data-lucide="rotate-ccw" class="w-3 h-3"></i> UNDO HAPUS</button>
                        <label class="block text-xs font-bold uppercase tracking-wide mb-2 text-slate-600">Scan Fisik Kardus</label>
                        <form id="form-scan" class="flex gap-2">
                            <input type="text" id="input-qrcode" class="flex-1 p-3 border border-slate-300 rounded-lg outline-none focus:border-slate-800 font-black text-slate-800 text-lg bg-slate-50" placeholder="Arahkan scanner..." autocomplete="off">
                            <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-8 rounded-lg font-bold shadow-md cursor-pointer transition active:scale-95 flex items-center gap-2"><i data-lucide="plus-square"></i> ADD</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-between gap-3 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex flex-wrap gap-2">
                    <div class="relative">
                        <button onclick="document.getElementById('dropdown-kolom').classList.toggle('hidden')" class="px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 font-black rounded-lg shadow-sm border border-slate-300 text-xs flex items-center gap-2 active:scale-95 transition uppercase"><i data-lucide="eye-off" class="w-4 h-4"></i> KOLOM</button>
                        <div id="dropdown-kolom" class="hidden absolute top-full left-0 mt-2 w-56 bg-white border border-slate-200 shadow-xl rounded-xl p-3 z-40">
                            <div class="flex justify-between items-center border-b border-slate-100 pb-2 mb-2">
                                <span class="text-xs font-black text-slate-500 uppercase">Tampil / Sembunyi</span>
                                <button onclick="resetKolom()" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded font-bold hover:bg-blue-200">DEFAULT</button>
                            </div>
                            <div class="flex flex-col gap-2 max-h-64 overflow-y-auto" id="list-kolom-toggles">
                                </div>
                        </div>
                    </div>
                    <button onclick="salinDataTabel()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-lg shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-blue-800"><i data-lucide="copy" class="w-4 h-4"></i> SALIN</button>
                    <button onclick="holdLangsir()" id="btn-hold" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-lg shadow-sm text-xs flex items-center gap-2 active:scale-95 transition uppercase border-b-2 border-amber-700"><i data-lucide="pause-circle" class="w-4 h-4"></i> HOLD LANGSIR</button>
                </div>

                <button onclick="validasiDanCek()" id="btn-validasi" class="px-6 py-2.5 bg-slate-800 text-white font-black rounded-xl shadow-md hover:bg-slate-900 transition cursor-pointer text-sm flex items-center justify-center gap-2 active:scale-95 uppercase tracking-wide border-b-4 border-slate-950"><i data-lucide="shield-check" class="w-5 h-5"></i> VALIDASI STBJ & CEK GUDANG</button>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="table-container overflow-x-auto w-full max-h-[50vh]">
                    <table class="w-full border-collapse text-sm whitespace-nowrap" id="table-langsir">
                        <thead class="sticky top-0 z-10 shadow-sm" id="thead-langsir">
                            <tr class="uppercase text-[11px] font-bold tracking-wider">
                                <th class="p-3 hdr-std w-10"><input type="checkbox" onchange="toggleSemuaCentang(this.checked)" class="cursor-pointer w-4 h-4 text-blue-600 rounded"></th>
                                <th class="p-3 hdr-std w-10 col-btn"><i data-lucide="trash-2" class="w-4 h-4 mx-auto text-slate-400"></i></th>
                                <th class="p-3 hdr-std w-10">No</th>
                                <th class="p-3 hdr-std border-r border-slate-500 col-stbj">Status STBJ</th>
                                <th class="p-3 hdr-std col-kode border-r border-slate-500">Status Kode</th>
                                <th class="p-3 hdr-std col-troli">Troli</th>
                                <th class="p-3 hdr-std border-r border-slate-500 col-area">Area</th>
                                <th class="p-3 hdr-std border-r border-slate-500 col-qr">Text QRCode</th>
                                <th class="p-3 hdr-std col-tgl">Tgl Produksi</th>
                                <th class="p-3 hdr-std col-mesin">Mesin</th>
                                <th class="p-3 hdr-std border-r border-slate-500 col-shift">Shift</th>
                                <th class="p-3 hdr-std text-blue-300 col-jenis">Jenis Item</th>
                                <th class="p-3 hdr-std col-nama">Nama Item</th>
                                <th class="p-3 hdr-std col-pjg">Pjg</th>
                                <th class="p-3 hdr-std col-grade">Grade</th>
                                <th class="p-3 hdr-std col-dus">Dus</th>
                                <th class="p-3 hdr-std border-r border-slate-500 col-shading">Shading</th>
                                <th class="p-3 hdr-std text-orange-400 col-po">PO Awal</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-langsir" class="text-center text-slate-700"></tbody>
                    </table>
                </div>
            </div>
            
            <div class="pt-2">
                <button id="btn-save" onclick="saveToSupabase()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl shadow-md flex items-center justify-center gap-2 text-base tracking-widest cursor-pointer transition active:scale-95 uppercase border-b-4 border-emerald-800"><i data-lucide="save" class="w-5 h-5"></i> SIMPAN DATA KE GUDANG</button>
            </div>
        </div>
    </div>
    
    <div id="overlay-klik-luar" onclick="document.getElementById('dropdown-kolom').classList.add('hidden'); this.classList.add('hidden');" class="hidden fixed inset-0 z-30"></div>

    <script src="global.js"></script>
    <script src="langsir_logic.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => { 
            initModernLayout({ id: 'langsir', title: 'LANGSIR', url: 'langsir.html' }); 
            // Pastikan overlay di klik juga
            document.querySelector('[onclick*="dropdown-kolom"]').addEventListener('click', () => {
                document.getElementById('overlay-klik-luar').classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
