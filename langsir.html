<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Menu Langsir Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="global.js"></script>
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden !important; touch-action: pan-y; background-color: #f8fafc; }
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .selected-row { border-color: #2563eb !important; background-color: #dbeafe !important; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; border-bottom: 2px solid transparent; }
    </style>
</head>
<body class="font-sans text-slate-800">

    <div class="flex flex-col h-full w-full absolute inset-0 pt-[104px] z-10"> 
        
        <div class="shrink-0 bg-white border-b border-slate-200 px-3 py-3 flex flex-col gap-3 shadow-sm z-20">
            
            <div class="flex gap-2 items-center w-full pb-1">
                
                <div class="flex-1 flex gap-2 overflow-x-auto hide-scrollbar">
                    <button onclick="VerifikasiDanCek()" id="btn-Verifikasi" class="shrink-0 flex items-stretch rounded-md overflow-hidden shadow-sm active:scale-95 transition h-9 border border-slate-800">
                        <div class="w-9 bg-slate-900 text-white flex items-center justify-center shrink-0"><i data-lucide="shield-check" class="w-4 h-4"></i></div>
                        <div class="flex-1 bg-slate-800 text-white font-black text-[11px] uppercase flex items-center justify-center px-3 tracking-wider">Verifikasi</div>
                    </button>

                    <button onclick="bukaModalSTBJ()" class="shrink-0 flex items-stretch rounded-md overflow-hidden shadow-sm active:scale-95 transition h-9 border border-purple-700">
                        <div class="w-9 bg-purple-800 text-white flex items-center justify-center shrink-0"><i data-lucide="layout-list" class="w-4 h-4"></i></div>
                        <div class="flex-1 bg-purple-600 text-white font-black text-[11px] uppercase flex items-center justify-center px-3 tracking-wider">Data STBJ</div>
                    </button>

                    <button onclick="bukaModalHold('hold_stbj')" class="shrink-0 flex items-stretch rounded-md overflow-hidden shadow-sm active:scale-95 transition h-9 border border-amber-600">
                        <div class="w-9 bg-amber-700 text-white flex items-center justify-center shrink-0"><i data-lucide="pause-circle" class="w-4 h-4"></i></div>
                        <div class="flex-1 bg-amber-500 text-white font-black text-[11px] uppercase flex items-center justify-center px-3 tracking-wider">Tabel Hold</div>
                    </button>
                </div>
                
                <div class="relative shrink-0">
                    <button id="btn-menu-utama" onclick="toggleMenuUtama(event)" class="flex items-stretch rounded-md overflow-hidden shadow-sm active:scale-95 transition h-9 border border-slate-300">
                        <div class="bg-slate-200 text-slate-700 flex items-center justify-center px-3 hover:bg-slate-300 h-full"><i data-lucide="menu" class="w-5 h-5"></i></div>
                    </button>
                    
                    <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white shadow-2xl rounded border border-slate-200 z-[60] flex flex-col py-1">
                        <button onclick="editKeteranganMassal(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="edit-3" class="w-4 h-4"></i> Edit Keterangan</button>
                        <button onclick="toggleSidebarFilter(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="filter" class="w-4 h-4"></i> Filter Data</button>
                        <button onclick="salinDataTabel(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="copy" class="w-4 h-4"></i> Salin Data</button>
                        <button onclick="undoDelete(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> Undo Hapus</button>
                        <button onclick="holdLangsir(); toggleMenuUtama()" class="px-4 py-3 text-left text-xs font-bold text-slate-700 hover:bg-slate-100 flex items-center gap-2"><i data-lucide="pause-circle" class="w-4 h-4"></i> Hold Bermasalah</button>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center px-1">
                <div class="flex items-center gap-2">
                    <input type="checkbox" onchange="toggleSemuaCentang(this.checked)" class="w-5 h-5 accent-blue-600 rounded cursor-pointer border-slate-400" id="cb-all">
                    <label for="cb-all" class="text-[11px] font-black text-slate-500 uppercase tracking-wide cursor-pointer">Pilih Semua Data</label>
                </div>
                <div class="bg-cyan-50 border border-cyan-300 px-3 py-1 rounded text-cyan-800 text-[11px] font-black shadow-sm uppercase tracking-wider">
                    Total Qty: <span id="lbl-tampil-baris" class="text-slate-900 text-[13px] ml-1">0</span> Dus
                </div>
            </div>
        </div>

        <div class="flex-1 min-h-0 bg-slate-200 p-2 overflow-hidden flex flex-col relative z-0">
            <div class="flex-1 min-h-0 bg-white border border-slate-300 shadow-inner overflow-y-auto custom-scroll" id="scroll-container">
                <div id="tbody-langsir" class="flex flex-col gap-0 w-full"></div>
            </div>
        </div>

        <div class="shrink-0 w-full bg-slate-50 p-2 flex items-center gap-2 z-20 shadow-[0_-5px_15px_-3px_rgba(0,0,0,0.1)] border-t border-slate-300 pb-4">
            <!-- REVISI: Icon diubah menjadi Plus -->
            <button onclick="bukaModalAdd()" class="w-[50px] h-[50px] bg-[#0f172a] hover:bg-black text-white flex justify-center items-center shadow-md active:scale-95 shrink-0 transition rounded border-b-4 border-slate-900" title="Scan Item Baru">
                <i data-lucide="plus" class="w-6 h-6"></i>
            </button>
            <button onclick="bukaModalScanArea()" class="w-[50px] h-[50px] bg-blue-600 hover:bg-blue-700 text-white flex justify-center items-center shadow-md active:scale-95 shrink-0 transition rounded border-b-4 border-blue-800" title="Scan ke Area">
                <i data-lucide="map-pin" class="w-6 h-6"></i>
            </button>
            <button id="btn-save" onclick="saveToSupabase()" class="flex-1 h-[50px] bg-[#058c5e] hover:bg-[#04724d] text-white font-black shadow-md flex items-center justify-center gap-2 text-[13px] tracking-widest cursor-pointer transition active:scale-95 uppercase rounded border-b-4 border-[#035237]">
                <i data-lucide="save" class="w-5 h-5"></i> SIMPAN KE GUDANG
            </button>
        </div>

    </div>

    <!-- MODAL 1: ADD SCAN ITEM (Tanpa Area & Troli) -->
    <div id="modal-add-scan" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <!-- REVISI: Judul dan Icon diubah -->
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="plus-circle" class="w-5 h-5 text-slate-800"></i> SCAN ITEM BARU</h3>
                <button type="button" onclick="tutupModalAdd()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="form-scan" class="flex flex-col gap-4">
                <!-- REVISI: Dropdown Troli Dihapus -->
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Scan Fisik Kardus</label>
                    <input type="text" id="input-qrcode" class="w-full p-2.5 border border-slate-300 rounded outline-none focus:border-slate-800 font-mono font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition" placeholder="Arahkan scanner..." autocomplete="off">
                </div>
                <button type="submit" class="mt-2 w-full bg-slate-900 hover:bg-slate-800 text-white py-3 rounded font-black shadow transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase border-b-4 border-black">
                    <i data-lucide="plus-square" class="w-4 h-4"></i> TAMBAHKAN KE LAYAR
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL 2: SCAN KE AREA (Putaway) -->
    <div id="modal-scan-area" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[60] p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200 p-5">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 class="font-black text-blue-700 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="map-pin" class="w-5 h-5 text-blue-600"></i> SCAN ITEM KE RAK/AREA</h3>
                <button type="button" onclick="tutupModalScanArea()" class="text-slate-400 hover:text-red-500 bg-slate-100 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form id="form-scan-area" class="flex flex-col gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Pilih Area Rak</label>
                    <select id="select-area-putaway" class="w-full p-2.5 border-2 border-blue-200 rounded font-bold outline-none focus:border-blue-600 text-blue-800 cursor-pointer bg-blue-50 text-sm" required>
                        <option value="">-- Memuat Area --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-wide mb-1.5 text-slate-500">Scan Fisik Kardus</label>
                    <input type="text" id="input-qrcode-area" class="w-full p-2.5 border border-slate-300 rounded outline-none focus:border-blue-600 font-mono font-bold text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition" placeholder="Arahkan scanner..." autocomplete="off" required>
                </div>
                <button type="submit" class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded font-black shadow transition active:scale-95 flex items-center justify-center gap-2 text-sm uppercase border-b-4 border-blue-800">
                    <i data-lucide="check-square" class="w-4 h-4"></i> SET AREA ITEM
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL STBJ GUDANG -->
    <div id="modal-stbj-langsir" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="table" class="w-4 h-4 text-purple-600"></i> DATA STBJ GUDANG</h3>
                <button onclick="tutupModalSTBJ()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-3 bg-white border-b border-slate-100 flex flex-col gap-2 shrink-0">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i data-lucide="search" class="w-4 h-4 text-slate-400"></i></div>
                    <input type="text" id="f-stbj-modal" oninput="saringTabelModalSTBJ()" class="w-full pl-9 p-2.5 text-sm border border-slate-300 rounded focus:border-purple-500 outline-none font-bold placeholder-slate-300" placeholder="Ketik Troli, QR, Item...">
                </div>
            </div>
            <div class="overflow-y-auto flex-1 custom-scroll p-3 bg-slate-100">
                <div id="tbody-stbj-modal" class="flex flex-col gap-0"></div>
            </div>
        </div>
    </div>

    <!-- MODAL TABEL HOLD -->
    <div id="modal-hold-langsir" class="hidden fixed inset-0 flex items-center justify-center bg-slate-900/60 z-[70] px-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="archive" class="w-4 h-4 text-amber-600"></i> TABEL HOLD</h3>
                <button onclick="tutupModalHold()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            
            <div class="flex border-b border-slate-200 bg-white overflow-x-auto hide-scrollbar px-2 pt-2">
                <button onclick="bukaModalHold('hold_stbj')" id="tab-hold-stbj" class="pb-2 px-4 tab-active transition whitespace-nowrap text-xs uppercase font-bold">Hold STBJ</button>
                <button onclick="bukaModalHold('hold_langsir')" id="tab-hold-langsir" class="pb-2 px-4 tab-inactive hover:text-slate-800 transition whitespace-nowrap text-xs uppercase font-bold">Hold Langsir</button>
            </div>

            <div class="overflow-y-auto flex-1 custom-scroll p-3 bg-slate-100">
                <div id="tbody-hold-modal" class="flex flex-col gap-0"></div>
            </div>
        </div>
    </div>

    <!-- SIDEBAR FILTER LENGKAP -->
    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-[80] flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4"></i> Filter Data</h3>
            <button onclick="toggleSidebarFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-3 flex flex-col gap-3 overflow-y-auto custom-scroll flex-1">
            <div class="grid grid-cols-2 gap-2">
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status STBJ</label><input type="text" id="f-stbj" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status Kode</label><input type="text" id="f-kode" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Troli</label><input type="text" id="f-troli" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Area</label><input type="text" id="f-area" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div class="col-span-2"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">QRCode</label><input type="text" id="f-qr" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Tgl Produksi</label><input type="text" id="f-tgl" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Mesin</label><input type="text" id="f-mesin" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shift</label><input type="text" id="f-shift" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Jenis Item</label><input type="text" id="f-jenis" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div class="col-span-2"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label><input type="text" id="f-nama" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Panjang</label><input type="text" id="f-pjg" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Grade</label><input type="text" id="f-grade" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Dus</label><input type="text" id="f-dus" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Shading</label><input type="text" id="f-shading" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Customer</label><input type="text" id="f-customer" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
                <div class="col-span-2"><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Keterangan</label><input type="text" id="f-ket" oninput="saringTabelLangsir()" class="w-full p-1.5 text-xs border border-slate-300 rounded outline-none"></div>
            </div>
            <button onclick="resetFilter()" class="mt-2 py-3 w-full bg-slate-800 hover:bg-slate-900 text-white font-black rounded text-xs uppercase transition shrink-0">RESET FILTER</button>
        </div>
    </div>

    <div id="overlay-klik-luar" onclick="tutupSemuaPopup()" class="hidden fixed inset-0 z-[40] bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="wms_parser.js"></script>
    <script src="langsir_logic.js"></script>
</body>
</html>
