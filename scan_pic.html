<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WMS - Scan PIC Area</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { scrollbar-width: thin; }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hdr-std { background-color: #1e293b !important; color: #ffffff !important; text-align: center !important; border: 1px solid #334155; padding: 0.75rem; text-transform: uppercase; font-size: 11px; font-weight: 900; white-space: nowrap; }
        .tab-active { border-bottom: 3px solid #e11d48; color: #e11d48; font-weight: 900; background-color: #fff1f2; }
        .tab-inactive { color: #64748b; font-weight: 700; border-bottom: 3px solid transparent; }
    </style>
</head>
<body class="font-sans bg-slate-50 overflow-x-hidden text-slate-800 pb-28">

    <div class="w-full px-2 sm:px-4 pt-4 relative">
        
        <div class="flex border-b border-slate-200 mb-3 bg-white rounded-xl shadow-sm overflow-x-auto hide-scrollbar">
            <button class="px-6 py-3.5 tab-active transition whitespace-nowrap flex items-center gap-2 text-xs uppercase"><i data-lucide="log-out" class="w-4 h-4"></i> KONVERSI OUT</button>
            <button class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase opacity-50"><i data-lucide="log-in" class="w-4 h-4"></i> KONVERSI IN</button>
            <button class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase opacity-50"><i data-lucide="arrow-left-right" class="w-4 h-4"></i> PINDAH AREA</button>
            <button class="px-6 py-3.5 tab-inactive hover:bg-slate-50 transition whitespace-nowrap flex items-center gap-2 text-xs uppercase opacity-50"><i data-lucide="alert-triangle" class="w-4 h-4"></i> CASE KHUSUS</button>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-3 overflow-hidden">
            <button onclick="toggleAktifitas()" class="w-full bg-slate-100 p-3 flex justify-between items-center border-b border-slate-200 hover:bg-slate-200 transition active:bg-slate-300">
                <span class="font-black text-[11px] uppercase tracking-wide text-slate-700 flex items-center gap-2">
                    <i data-lucide="activity" class="w-4 h-4 text-blue-600"></i> INPUT AKTIFITAS
                </span>
                <i data-lucide="chevron-up" id="icon-toggle-aktifitas" class="w-4 h-4 text-slate-500 transition-transform duration-300"></i>
            </button>
            
            <div id="body-aktifitas" class="p-3 sm:p-4 transition-all duration-300 origin-top">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Pilih Aktifitas</label>
                        <select id="select-aktifitas" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold outline-none focus:border-rose-500 text-slate-800 cursor-pointer bg-slate-50 text-xs">
                            <option value="">-- Pilih Jenis Aktifitas --</option>
                            <option value="Ganti nama item">Ganti nama item</option>
                            <option value="Potong panjang">Potong panjang</option>
                            <option value="Ganti grade">Ganti grade</option>
                            <option value="Ganti dus">Ganti dus</option>
                            <option value="Ganti shading">Ganti shading</option>
                            <option value="Ganti label/qrcode">Ganti label/qrcode</option>
                            <option value="Sampel">Sampel</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-wide mb-1 text-slate-500">Keterangan / Alasan</label>
                        <input type="text" id="input-keterangan" class="w-full p-2 border-2 border-slate-200 rounded-lg font-bold outline-none focus:border-rose-500 text-slate-800 bg-slate-50 text-xs" placeholder="Ketik keterangan...">
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200 mb-3">
            <h3 class="font-black text-[11px] uppercase tracking-wide text-slate-700 mb-3 flex items-center gap-2 border-b border-slate-100 pb-2">
                <i data-lucide="package-minus" class="w-4 h-4 text-rose-600"></i> INPUT ITEM (SCAN FISIK)
            </h3>
            
            <form id="form-scan" class="flex gap-2 mb-4">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none"><i data-lucide="scan-line" class="w-5 h-5 text-slate-400"></i></div>
                    <input type="text" id="input-qrcode" class="w-full pl-12 p-2 sm:p-2.5 border-2 border-slate-200 rounded-lg outline-none focus:border-rose-500 font-black text-slate-800 text-sm bg-slate-50 placeholder-slate-400 transition" placeholder="Arahkan scanner..." autocomplete="off">
                </div>
                <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg font-black shadow-sm transition active:scale-95 flex items-center justify-center gap-2 border-b-2 border-slate-950 text-xs uppercase"><i data-lucide="plus-square" class="w-4 h-4"></i> ADD</button>
            </form>

            <div class="flex gap-2 overflow-x-auto pt-1 pb-4 px-1 hide-scrollbar whitespace-nowrap scroll-smooth select-none" style="-webkit-overflow-scrolling: touch;">
                <button onclick="toggleFilter()" class="p-2.5 px-4 rounded-lg font-bold text-xs flex items-center gap-1.5 shadow-sm uppercase bg-blue-600 text-white border-b-2 border-blue-800 active:scale-95 transition"><i data-lucide="filter" class="w-4 h-4"></i> Filter</button>
                
                <button onclick="verifikasiKeluar()" id="btn-verifikasi" class="p-2.5 px-4 rounded-lg font-bold text-xs flex items-center gap-1.5 shadow-sm uppercase bg-rose-600 hover:bg-rose-700 text-white border-b-2 border-rose-800 active:scale-95 transition"><i data-lucide="shield-check" class="w-4 h-4"></i> Verifikasi Gudang</button>
            </div>
            <div class="text-[9px] text-slate-400 text-center font-black uppercase tracking-wider -mt-2.5 mb-2 pointer-events-none flex items-center justify-center gap-1 animate-pulse">
                <i data-lucide="arrow-left-right" class="w-3 h-3"></i> Geser menu aksi ke kanan-kiri
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative">
            <div class="table-container overflow-x-auto w-full max-h-[50vh]">
                <table class="w-full text-left border-collapse text-sm whitespace-nowrap">
                    <thead class="sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="hdr-std w-10"><i data-lucide="trash-2" class="w-4 h-4 mx-auto text-rose-400"></i></th>
                            <th class="hdr-std w-12">No</th>
                            <th class="hdr-std border-r border-slate-500">Status</th>
                            <th class="hdr-std text-amber-300">Area</th>
                            <th class="hdr-std border-r border-slate-500">Text QRCode</th>
                            <th class="hdr-std text-blue-300">Jenis Item</th>
                            <th class="hdr-std">Nama Item</th>
                            <th class="hdr-std">Pjg</th>
                            <th class="hdr-std">Grade</th>
                            <th class="hdr-std">Dus</th>
                            <th class="hdr-std border-r border-slate-500">Shading</th>
                            <th class="hdr-std">PO Aktual</th>
                            <th class="hdr-std">Keterangan</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-pic" class="text-center text-slate-700">
                        <tr><td colspan="13" class="p-10 text-slate-400 font-bold"><i data-lucide="package-search" class="w-8 h-8 mx-auto mb-2 opacity-50"></i> Belum ada data di-scan.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">
        <div class="w-full px-2 sm:px-4 flex justify-center md:justify-end">
            <button onclick="prosesSimpanKeluar()" id="btn-save" class="w-full md:w-auto px-8 py-2.5 sm:py-3 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-xl shadow-md flex items-center justify-center gap-2 text-sm tracking-wide cursor-pointer transition active:scale-95 uppercase border-b-2 border-rose-800">
                <i data-lucide="save" class="w-5 h-5"></i> <span>SIMPAN & EKSEKUSI</span>
            </button>
        </div>
    </div>

    <div id="sidebar-filter" class="fixed inset-y-0 right-0 w-80 bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h3 class="font-black text-slate-800 flex items-center gap-2 uppercase tracking-wide text-sm"><i data-lucide="filter" class="w-4 h-4"></i> Filter Barcode</h3>
            <button onclick="toggleFilter()" class="text-slate-400 hover:text-red-500 bg-white border border-slate-200 p-1.5 rounded-lg transition active:scale-95"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-4 overflow-y-auto">
            <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Status</label><input type="text" id="f-status" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Nama Item</label><input type="text" id="f-nama" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            <div><label class="block text-[10px] font-black uppercase text-slate-500 mb-1">Kode QR</label><input type="text" id="f-qr" oninput="saringTabel()" class="w-full p-2 text-xs border-2 border-slate-200 rounded focus:border-blue-500 outline-none"></div>
            
            <button onclick="resetFilter()" class="mt-4 py-3 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-lg text-xs uppercase transition border border-slate-300 shadow-sm active:scale-95">RESET FILTER</button>
        </div>
    </div>
    
    <div id="overlay-klik-luar" onclick="toggleFilter()" class="hidden fixed inset-0 z-30 bg-slate-900/20 backdrop-blur-sm transition-opacity"></div>

    <script src="global.js"></script>
    <script src="scan_pic_logic.js"></script>
</body>
</html>
