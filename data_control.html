<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS - Data Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-main: #f8fafc; --bg-box: #ffffff; --text-main: #1f2937; --border-color: #e2e8f0; }
        body[data-bg="dark"] { --bg-main: #0f172a; --bg-box: #1e293b; --text-main: #f8fafc; --border-color: #334155; }
        body[data-bg="grey"] { --bg-main: #e2e8f0; --bg-box: #f1f5f9; --text-main: #0f172a; --border-color: #cbd5e1; }
        body { background-color: var(--bg-main); color: var(--text-main); transition: background 0.3s ease; min-height: 100vh;}
        .card-dynamic { background-color: var(--bg-box); border-color: var(--border-color); }
        .input-dynamic { background-color: var(--bg-main); color: var(--text-main); border-color: var(--border-color); }
        .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body id="app-body" class="font-sans">

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-[60] hidden backdrop-blur-sm transition-all"></div>
    <div id="sidebar-menu" class="fixed top-0 left-0 h-full w-64 card-dynamic shadow-2xl z-[70] transform -translate-x-full transition-transform duration-300 flex flex-col border-r">
        <div class="p-5 border-b flex justify-between items-center bg-blue-50/50">
            <h2 class="font-black text-blue-700 text-lg flex items-center gap-2"><i data-lucide="layers" class="w-5 h-5"></i> WMS Menu</h2>
            <button onclick="toggleSidebar()" class="p-2 text-gray-500 hover:text-red-500 rounded-full bg-white shadow-sm cursor-pointer transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="p-4 flex flex-col gap-2 overflow-y-auto flex-grow">
            <a href="menu.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
            <a href="stbj.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="scan-barcode" class="w-5 h-5"></i> Scan STBJ</a>
            <a href="hasil_stbj.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="file-spreadsheet" class="w-5 h-5"></i> Laporan STBJ</a>
            <a href="langsir.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-blue-50 font-bold text-gray-600 transition"><i data-lucide="log-in" class="w-5 h-5"></i> Langsir</a>
            <a href="data_control.html" class="flex items-center gap-3 p-3 rounded-xl bg-blue-600 text-white font-bold shadow-md"><i data-lucide="settings-2" class="w-5 h-5"></i> Data Control</a>
        </div>
    </div>

    <div class="sticky top-0 z-40 w-full flex flex-col shadow-md">
        <nav class="card-dynamic px-4 py-3 flex items-center justify-between border-b">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="p-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-full transition cursor-pointer active:scale-95 shadow-inner"><i data-lucide="menu" class="w-5 h-5"></i></button>
                <div class="flex flex-col ml-1"><span class="font-extrabold text-lg tracking-wide leading-tight text-blue-700">PORTAL WMS</span></div>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative">
                    <button id="btn-profile" class="w-10 h-10 bg-blue-600 font-bold rounded-full flex items-center justify-center text-white shadow-md border-2 border-blue-200 cursor-pointer"><span id="profile-initial">U</span></button>
                    <div id="profile-menu" class="hidden absolute right-0 mt-2 w-48 card-dynamic rounded-xl shadow-xl py-2 z-50 border">
                        <div class="px-4 py-2 border-b border-gray-200/20 text-xs font-bold mb-1 opacity-70" id="user-role-display">Role: User</div>
                        <button onclick="localStorage.clear(); window.location.href='index.html'" class="w-full text-left px-4 py-2 hover:bg-red-500/10 text-red-600 font-bold text-sm flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button>
                    </div>
                </div>
            </div>
        </nav>
        <div id="tab-bar" class="w-full bg-[#0f172a] text-gray-400 flex overflow-x-auto text-[11px] font-black hide-scrollbar tracking-wider"></div>
    </div>

    <main class="p-4 md:p-8 max-w-5xl mx-auto flex flex-col gap-6 w-full pt-6">
        <header class="flex flex-col md:flex-row md:justify-between md:items-end gap-4 border-b border-gray-200/50 pb-4">
            <h2 class="text-2xl font-black flex items-center gap-2"><i data-lucide="settings-2" class="w-7 h-7 text-blue-600"></i> Data Control (Master)</h2>
        </header>

        <div class="card-dynamic p-6 rounded-2xl shadow-sm border flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="w-full md:w-1/2">
                <label class="block text-xs font-bold uppercase mb-2 opacity-70">Pilih Kategori Tabel Master</label>
                <select id="kategori-select" onchange="loadDataKategori()" class="input-dynamic w-full p-3 border-2 border-blue-400 rounded-lg font-bold text-blue-600 outline-none cursor-pointer transition">
                    <option value="nama_troli">Tabel: Nama Troli</option>
                    <option value="mesin">Tabel: Mesin</option>
                    <option value="shift">Tabel: Shift</option>
                    <option value="nama_item_plafon">Tabel: Item Plafon</option>
                    <option value="nama_item_lis">Tabel: Item Lis</option>
                    <option value="dus">Tabel: Dus</option>
                    <option value="grade">Tabel: Grade</option>
                    <option value="po">Tabel: PO</option>
                </select>
            </div>
            <div class="w-full md:w-1/2 flex gap-2 items-end">
                <div class="flex-1">
                    <label class="block text-xs font-bold uppercase mb-2 opacity-70">Tambah Data Baru</label>
                    <input type="text" id="input-baru" class="input-dynamic w-full p-3 border-2 rounded-lg font-bold uppercase outline-none focus:border-blue-500 transition" placeholder="Ketik Data..." autocomplete="off">
                </div>
                <button id="btn-tambah" onclick="tambahData()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-bold shadow transition flex items-center justify-center gap-2 cursor-pointer active:scale-95 h-[52px]"><i data-lucide="plus" class="w-5 h-5"></i></button>
            </div>
        </div>

        <div class="card-dynamic rounded-2xl shadow-md border overflow-hidden">
            <div class="p-4 border-b border-inherit flex justify-between items-center bg-black/5">
                <h3 class="font-bold uppercase tracking-wider flex items-center gap-2"><i data-lucide="list" class="w-4 h-4"></i> <span id="tabel-judul">Daftar Data</span></h3>
                <span id="data-count" class="text-xs font-bold bg-blue-100 text-blue-700 px-3 py-1.5 rounded-full border border-blue-200 shadow-sm">0 Baris</span>
            </div>
            <div class="overflow-x-auto w-full max-h-[60vh]">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-[#1e293b] text-white uppercase text-xs sticky top-0 z-10">
                        <tr><th class="p-3 w-16 text-center">Urutan</th><th class="p-3">Nilai Data Rekam</th><th class="p-3 w-24 text-center">Aksi</th></tr>
                    </thead>
                    <tbody id="tbody-master"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="data_control_logic.js"></script>
    <script>
        const PAGE_META = { id: 'data_control', title: 'DATA CONTROL', url: 'data_control.html' };

        window.addEventListener('load', () => {
            const sessionData = JSON.parse(localStorage.getItem('user_session'));
            if(sessionData) {
                document.getElementById('profile-initial').innerText = sessionData.username.charAt(0).toUpperCase();
                document.getElementById('user-role-display').innerText = "Role: " + sessionData.role;
            }
            initTabs();
        });

        function initTabs() {
            let tabs = JSON.parse(localStorage.getItem('wms_tabs')) || [];
            if(!tabs.find(t => t.id === 'dashboard')) tabs.unshift({id: 'dashboard', title: 'DASHBOARD', url: 'menu.html'});
            if(!tabs.find(t => t.id === PAGE_META.id)) { tabs.push(PAGE_META); localStorage.setItem('wms_tabs', JSON.stringify(tabs)); }
            
            const tabBar = document.getElementById('tab-bar'); tabBar.innerHTML = '';
            tabs.forEach(tab => {
                const isActive = tab.id === PAGE_META.id;
                const bg = isActive ? 'bg-blue-600 text-white shadow-inner' : 'hover:bg-slate-800 border-r border-slate-700';
                const closeBtn = tab.id === 'dashboard' ? '' : `<button onclick="closeTab(event, '${tab.id}')" class="ml-2 hover:text-red-400 transition"><i data-lucide="x" class="w-3 h-3"></i></button>`;
                tabBar.innerHTML += `<div onclick="window.location.href='${tab.url}'" class="flex items-center px-5 py-2.5 cursor-pointer transition whitespace-nowrap border-b-2 ${isActive ? 'border-white' : 'border-transparent hover:border-slate-500'} ${bg}"><span>${tab.title}</span>${closeBtn}</div>`;
            });
            lucide.createIcons();
        }

        function closeTab(e, id) {
            e.stopPropagation(); let tabs = JSON.parse(localStorage.getItem('wms_tabs')) || [];
            tabs = tabs.filter(t => t.id !== id); localStorage.setItem('wms_tabs', JSON.stringify(tabs));
            if(PAGE_META.id === id) { window.location.href = tabs[tabs.length-1].url; } else { initTabs(); }
        }

        function toggleSidebar() { document.getElementById('sidebar-menu').classList.toggle('-translate-x-full'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }
        const btnProfile = document.getElementById('btn-profile'); const profileMenu = document.getElementById('profile-menu');
        btnProfile.addEventListener('click', (e) => { e.stopPropagation(); profileMenu.classList.toggle('hidden'); });
        window.addEventListener('click', (e) => { if (!btnProfile.contains(e.target) && !profileMenu.contains(e.target)) profileMenu.classList.add('hidden'); });
    </script>
</body>
</html>
